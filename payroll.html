<!-- 画面が黙って壊れないようにする共通部品（いちばん先に読む）→ 速さの記録 → ログインの役割の確かめ → 施設情報 → 印刷 → 給与の計算と書き出し -->

<script src="su-perf.js?v=2026-10-27"></script>

<script src="payroll-calc.js?v=2026-11-23.2"></script>

<link rel="stylesheet" href="su-theme.css?v=2026-11-03.2">

<style>
:root{--ink:#14213d;--sub:#3d4a5c;--line:#c9d2de;--bg:#f4f6f9;--card:#fff;--ok:#0b5d2a;--ok-bg:#e3f4e8;--warn:#6b4100;--warn-bg:#fff4d6;--ng:#8a1020;--ng-bg:#fde8eb;--focus:#1f4fbf;--muted:#414b5a;
  --field:#fff;--th:#eef2f7;--tag:#eef2f7;--wk:#0b3d91;--wk-bg:#e3ecfb;--skel:#e3e8ef;--toast:#14213d;--toast-tx:#fff;--pri-tx:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.hdr h1{font-size:19px;margin:0}
.hdr-btn,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--card);font:inherit;cursor:pointer}
.btn.pri{background:var(--focus);color:var(--pri-tx);border-color:var(--focus)}
.btn.ng{color:var(--ng);border-color:#e6a9b2}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[aria-invalid="true"]{border-color:#b42318;box-shadow:0 0 0 2px #b42318}
.sync{font-size:15px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.bar label{display:flex;align-items:center;gap:6px}
input,select,textarea{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--field);color:var(--ink)}
input[type=checkbox]{min-height:0;width:22px;height:22px}
.tabs{display:flex;gap:6px;padding:0 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
.tabs button{min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;color:var(--sub);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--focus);font-weight:700}
.tabs button[hidden]{display:none}
main{padding:12px 16px 40px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.cd h2{font-size:17px;margin:0 0 8px}
.gate{max-width:680px;margin:16px}
.band{border-radius:10px;padding:10px 14px;margin:0 0 10px}
.band.warn{background:var(--warn-bg);color:var(--warn)}
.band.ng{background:var(--ng-bg);color:var(--ng)}
.band.ok{background:var(--ok-bg);color:var(--ok)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--th);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nm{white-space:nowrap}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;margin:1px 2px;font-size:15px;background:var(--tag);color:var(--sub)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ng{background:var(--ng-bg);color:var(--ng);font-weight:600}
.empty{color:var(--muted);padding:12px}
.help{color:var(--muted);font-size:15px;margin:4px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row > label{display:flex;gap:6px;align-items:center}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;align-items:center}
fieldset{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:8px 12px}
legend{font-weight:600;padding:0 6px}
.sumbar{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
.sumbar div{min-width:140px}
.sumbar b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
details.it{border-top:1px solid var(--line)}
details.it > summary{display:flex;gap:12px;align-items:center;min-height:44px;padding:6px 4px;cursor:pointer;flex-wrap:wrap}
details.it > summary .nm{min-width:8em;font-weight:600}
details.it > summary .num{min-width:7em;text-align:right;font-variant-numeric:tabular-nums}
details.it[open] > summary{background:var(--th)}
.ihd{display:flex;gap:12px;font-size:15px;color:var(--muted);padding:4px;flex-wrap:wrap}
.ihd span{min-width:7em;text-align:right}.ihd span:first-child{min-width:8em;text-align:left}
/* 賞与のタブ（2026-11-23）: 1人ずつの結果と回の設定の開け閉め */
details.bit{border-top:1px solid var(--line)}
details.bit > summary,details.cd > summary{min-height:44px;padding:6px 4px;cursor:pointer}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 0}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:760px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(20,33,61,.35)}
.dlg-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.dlg-b{padding:14px 16px;max-height:65vh;overflow:auto}
.dlg-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.masked{max-width:640px}
/* 給与の暗証番号の欄（統合 0110）: パスワードの欄にせず、文字を ● で隠す（共有の PC のブラウザに番号を覚えさせない） */
.pin{-webkit-text-security:disc;font-size:20px;letter-spacing:.3em;max-width:12em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:12px;background:var(--toast);color:var(--toast-tx);box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:50;font-size:16px}
.toast[hidden]{display:none}
.skel{display:block;height:18px;margin:10px 0;border-radius:6px;background:var(--skel);animation:skel 1.2s ease-in-out infinite}
.skel.w6{width:60%}.skel.w8{width:80%}.skel.w4{width:40%}
@keyframes skel{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
/* 給与明細（画面の見本と紙）。紙は A4 縦・1人1ページ（SUPrint の root #p-print） */
.slip{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:14px;max-width:780px}
.slip h3{font-size:18px;margin:0 0 4px}
.slip .sl-meta{font-size:15px;margin:0 0 8px}
.slip table{background:#fff}
.slip th,.slip td{border-color:#999;color:#000}
.slip th{background:#f1f1f1}
.slip .sl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slip .sl-tot td{font-weight:700}
.slip .sl-draft{display:inline-block;border:2px solid #000;padding:0 8px;margin-left:8px;font-weight:700}
#p-print{display:none}
@media (max-width:700px){.split,.slip .sl-grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}th,td{padding:5px 6px}
  /* iPhone の幅: 見出しの行を出さず、氏名を1行目・金額は小見出しつきで3列にそろえる */
  .ihd{display:none}
  details.it > summary{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;align-items:end}
  details.it > summary .nm{grid-column:1 / -1;min-width:0}
  details.it > summary .num{min-width:0;display:flex;flex-direction:column;align-items:flex-end}
  details.it > summary .num::before{content:attr(data-l);font-size:15px;color:var(--muted);font-weight:400}
  details.it > summary .tag{grid-column:1 / -1;justify-self:start}}
/* 暗い表示（端末の設定に合わせる）。紙は白地のまま（screen だけ） */
@media screen and (prefers-color-scheme: dark){
  :root,:root[data-su-theme]:not([data-ds="ops"]){--ink:#e8ecf3;--sub:#b8c2d0;--muted:#aab4c3;--line:#3a4556;--bg:#10151d;--card:#1a212c;--field:#141a23;--th:#222b38;--tag:#26303e;
    --ok:#7fd69a;--ok-bg:#123222;--warn:#ffd27a;--warn-bg:#33270c;--ng:#ff9aa8;--ng-bg:#3a141a;--focus:#8fb0ff;--wk:#a9c4ff;--wk-bg:#16284a;--skel:#2a3442;--toast:#e8ecf3;--toast-tx:#10151d;--pri-tx:#10151d}
  :root[data-su-theme]:not([data-su-theme~="keep-hdr"]) .hdr{background:var(--card);color:var(--ink);border-bottom-color:var(--line);box-shadow:inset 0 -2px 0 var(--line)}
  :root[data-su-theme]:not([data-su-theme~="keep-hdr"]) .hdr-btn{background:var(--card);color:var(--ink);border-color:var(--line)}
  :root[data-su-theme]:not([data-su-theme~="keep-hdr"]) .hdr .sync{background:var(--tag);color:var(--ink);border-color:var(--line)}
  .btn.ng{border-color:#7a3a44}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .sur-dlg{color-scheme:light}
}
/* 印刷: 明細の紙は SUPrint が #p-print だけを出す。Cmd/Ctrl+P（ボタンを通らない印刷）は金額を紙に出さず案内だけ（開いている窓も出さない） */
.pr-note{display:none}
@media print{
  body{background:#fff;color:#000;font-size:11px}
  body:not(.su-printing) .hdr,body:not(.su-printing) #p-app,body:not(.su-printing) #p-gate,body:not(.su-printing) dialog{display:none!important}
  body:not(.su-printing) .pr-note{display:block;font-size:14px;padding:20mm}
  #p-print{display:block}
  #p-print .slip{border:0;border-radius:0;padding:0;max-width:none;font-size:11px;break-after:page;page-break-after:always}
  #p-print .slip:last-child{break-after:auto;page-break-after:auto}
  #p-print .slip h3{font-size:16px}
  #p-print .slip th,#p-print .slip td{padding:2px 4px;font-size:11px}
  .toast,.su-shell-role{display:none!important}
}
</style>
</head>
<body>
<header class="hdr su-shell-hdr">
  <a class="hdr-btn" href="index.html">← メニュー</a>
  <h1>給与</h1>
  <span class="sync" id="p-sync" role="status" aria-live="polite"></span>
  <span class="su-shell-role" hidden></span>
</header>
<div class="cd gate" id="p-gate" hidden></div>
<div id="p-app" hidden>
  <div class="bar">
    <label>月分 <input type="month" id="p-ym" aria-label="給与の月分"></label>
    <button type="button" class="btn" id="p-prev" aria-label="前の月分">◀ 前の月分</button>
    <button type="button" class="btn" id="p-next" aria-label="次の月分">次の月分 ▶</button>
    <span id="p-period" class="help"></span>
    <button type="button" class="btn" id="p-reload">読み直す</button>
    <button type="button" class="btn" id="p-lock" data-act="pin-lock" hidden>鍵をかける</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="画面の切り替え">
    <button type="button" role="tab" data-tab="run">今月の給与</button>
    <button type="button" role="tab" data-tab="slip">給与明細</button>
    <button type="button" role="tab" data-tab="export">振込と書き出し</button>
    <button type="button" role="tab" data-tab="bonus">賞与</button>
    <button type="button" role="tab" data-tab="profile">職員の給与設定</button>
    <button type="button" role="tab" data-tab="yearend">年末調整</button>
    <button type="button" role="tab" data-tab="settings" hidden>設定</button>
  </nav>
  <main id="p-main" role="tabpanel"></main>
</div>
<div id="p-print" aria-hidden="true"></div>
<p class="pr-note">給与の金額は、この印刷では出しません。「給与明細」のタブの印刷のボタンから印刷してください。</p>
<div class="toast" id="p-toast" role="status" aria-live="polite" hidden></div>
<dialog id="p-dlg" aria-labelledby="p-dlg-h"><div class="dlg-h" id="p-dlg-h"></div><div class="dlg-b" id="p-dlg-b"></div><div class="dlg-f" id="p-dlg-f"></div></dialog>

<script src="payroll-yearend.js?v=2026-11-23"></script>
<script src="payroll-withholding-slip.js?v=2026-11-23"></script>
<script src="payroll-yearend-ui.js?v=2026-11-23.2"></script>
<script src="payroll.js?v=2026-11-24.1"></script>
<script src="su-shell.js?v=2026-11-19"></script>
<script src="su-net.js?v=2026-11-12.2"></script>

</body>
