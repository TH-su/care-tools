<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 拡大縮小を禁止しない（弱視の職員が読めなくなるため。HIG/WCAG準拠） -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 機微情報を含むためキャッシュ無効 -->
<meta http-equiv="Cache-Control" content="no-store">
<meta name="robots" content="noindex,nofollow">
<title>フェイスシート</title>
<style>
/* 配色は「無彩色を基調に、意味のある色だけ使う」方針（HIG:明瞭性/服従性）。
   コンテンツが主役なので、色は①アクセント1色 ②危険(赤) ③注意(琥珀) の3つに限定する。
   文字色は白背景に対しコントラスト比4.5:1以上を満たす値のみ使用（--g5/--g6 を darken 済み）。 */
:root{
  /* --pri 系は入居者マスタと同時に更新（2026-08-14・白文字コントラスト6.39:1）。帳票の見た目を揃える */
  --pri:#0b57d0; --pri-l:#ecf3fe; --pri-d:#0842a0;
  --ok:#1e6b23; --ok-l:#e8f5e9; --ng:#b3261e; --ng-l:#fdecea;
  --warn-bg:#fdf3e3; --warn-tx:#8a5200;
  --g0:#f7f8f9; --g1:#f1f3f4; --g2:#e5e7ea; --g3:#d2d5d9;
  --g5:#6b7075; --g6:#5f6368; --g7:#4b4f52; --g9:#1f2124;
  --r:12px; --sh:0 1px 4px rgba(0,0,0,.10);
  --focus:#0b57d0;
}
/* キーボード操作の現在地を必ず見せる（フォーカスリングを消さない） */
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:6px}
/* 動きの少ない表示を選んでいる人の設定を尊重する */
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  background:var(--g0); color:var(--g9); font-size: 0.9375rem; line-height:1.5; padding-bottom:72px;}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit; font-size: 0.9375rem}

/* ── ヘッダー ── */
.hdr{position:sticky; top:0; z-index:50; background:var(--pri); color:#fff;
  padding:10px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--sh)}
.hdr h1{font-size: 1.0625rem; margin:0; font-weight:700; flex:1}
/* アプリ間ジャンプ（care-schedule / daycare-roster と同じ見た目。共通部品が無いため各ファイルに持つ） */
.hdr-btn{min-height:40px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35);
  color:#fff; border-radius:6px; padding:6px 12px; font-size: 0.8125rem; cursor:pointer; white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.28)}
.hdr-btn:focus-visible{outline:2px solid #fff; outline-offset:1px}
/* 入居者マスタから開いた時の本人確認バー（誰を開いているかを常に見せる＝取り違え防止）。
   ヘッダ直下に貼り付いてスクロールしても消えない。色は既定の警告トークンを使う
   （白背景でコントラスト比4.5:1以上・本ファイル冒頭の配色方針に従う）。 */
.frombar{position:sticky; top:48px; z-index:49;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 14px;
  background:var(--warn-bg); border-bottom:1px solid var(--warn-tx); font-size: 0.8125rem; color:var(--warn-tx)}
.frombar b{font-size: 0.9375rem}
.frombar button{min-height:44px; padding:6px 14px; border:1px solid var(--warn-tx); border-radius:6px;
  background:#fff; color:var(--warn-tx); font-size: 0.8125rem; cursor:pointer}
.frombar button:focus-visible{outline:2px solid var(--warn-tx); outline-offset:1px}
@media print{.frombar{display:none !important}}
/* 退去日・ご逝去日・退去先・退去後状況は紙には出さない（2026-08-09 管理者指示）。
   画面では従来どおり表示する。.cell は inline の flex 指定を持つため !important が要る */
@media print{.noprint-cell{display:none !important}}
/* ── 印刷しない欄（2026-08-17 指示）──
   入居者ごとの「この欄は紙に出さない」指定。正本は入居者マスタの編集画面で、ここは反映するだけ。
   ★画面には従来どおり全部出す。隠すのは紙だけ。
   ★CSS・関数とも resident-master.html と逐語同一にすること（食い違うと、伏せたつもりの欄が
     こちらの紙にだけ載る）。 */
@media print{
  [data-nop="1"]{display:none !important}
  [data-nop-row="1"]{display:none !important}
  .nop-tag,.nop-mark{display:none !important}
  /* 行の最後のセルを伏せた時に、紙の右端へ残る縦罫線を消す（applyPrintHide が付ける） */
  .row-cells .cell.nop-last{border-right:none !important}
  /* 事業所を伏せた時に、右隣（家族構成図）の枠の左罫線が紙の左内縁へ来るのを消す。
     ★家族構成図の枠は border-left をインラインで持つので !important が要る */
  .biz-geno-row>.nop-first{border-left:none !important}
}
.nop-tag{background:var(--warn-bg); color:var(--warn-tx); font-size:0.75rem; font-weight:700;
  padding:3px 8px; border-bottom:1px solid var(--g3)}
/* 13px＝業務ツールの下限。「印刷しない」は取り違えると事故になる印なので小さくしない */
.nop-mark{background:var(--warn-bg); color:var(--warn-tx); font-size:0.8125rem; font-weight:700;
  border-radius:999px; padding:1px 7px; margin-right:6px; white-space:nowrap}
.nop-row{opacity:.6}
.hdr .role{font-size: 0.6875rem; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:14px; white-space:nowrap}
.hdr .role.field{background:rgba(230,81,0,.92)}
.hdr .sync{font-size: 0.75rem; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:14px; white-space:nowrap}
.hdr .sync.ok{background:rgba(46,125,50,.9)} .hdr .sync.err{background:rgba(198,40,40,.95)}

/* ── 画面切替 ── */
.scr{display:none; padding:14px; max-width:980px; margin:0 auto}
.scr.on{display:block}

/* ── カード ── */
.cd{background:#fff; border-radius:var(--r); box-shadow:var(--sh); padding:14px; margin-bottom:12px}

/* ── 一覧 ── */
.search-bar{display:flex; gap:8px; margin-bottom:12px; align-items:center}
.search-bar input{flex:1; padding:10px 12px; border:1px solid var(--g3); border-radius:10px}
.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
/* タップ領域は最小44px（誤タップ防止・HIG） */
.chip{min-height:44px; padding:0 16px; border:1px solid var(--g3); border-radius:22px; background:#fff; font-size: 0.875rem; color:var(--g7)}
.chip.on{background:var(--pri); color:#fff; border-color:var(--pri)}
/* ── 一覧のビュー切替・区画（2026-08-15: 入居者マスタと同じ見た目・同じ機能に揃える）──
   ★以下は resident-master.html の一覧CSSからの移植。あちらを直したらこちらも直す。 */
.view-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; border-bottom:2px solid var(--g2)}
.vtab{min-height:44px; padding:8px 14px; border:none; border-bottom:3px solid transparent; margin-bottom:-2px;
      background:none; font-size: 0.875rem; font-weight:700; color:var(--g6); cursor:pointer}
.vtab.on{color:var(--pri); border-bottom-color:var(--pri)}
.vtab:hover{color:var(--pri)}
.vtab:focus-visible{outline:2px solid var(--pri); outline-offset:-2px; border-radius:6px}
/* 区画（1階/2階/五十音の各行）の見出しと中身 */
.rsec{margin-bottom:14px}
.rsec>h3{font-size: 0.875rem; font-weight:700; color:var(--g7); margin:0 0 6px;
         padding:4px 9px; background:var(--g1); border-left:3px solid var(--pri); border-radius:0 6px 6px 0}
.rsec>h3 .cnt{font-weight:400; color:var(--g7); font-size: 0.75rem; margin-left:6px}
.roster-count{font-size: 0.75rem; color:var(--g7); margin-bottom:8px}
/* 階が判定できない人を黙って落とさないための区画（居室未登録など）。色で他と区別する */
.rsec.nofloor>h3{border-left-color:var(--warn-tx); background:var(--warn-bg)}
/* 階別（左右）: 1階と2階を横並びに1列ずつ */
.fl-2col{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
.fl-2col .rsec{margin-bottom:0}
.fl-2col .rlist{grid-template-columns:1fr}
/* 階別（4列）: 1階を4列 → その下に2階を4列 */
.fl-4col .rlist{grid-template-columns:repeat(4,1fr)}
/* 画面が狭い時は列数を落とす（スマホで4列・2分割は実用にならない） */
@media(max-width:900px){ .fl-4col .rlist{grid-template-columns:repeat(2,1fr)} }
@media(max-width:640px){
  .fl-2col{grid-template-columns:1fr}
  .fl-2col .rsec{margin-bottom:14px}
  .fl-4col .rlist{grid-template-columns:1fr}
}
.rlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:8px}
.rcard{background:#fff; border:1px solid var(--g2); border-radius:9px; padding:8px 10px; cursor:pointer; transition:.12s}
.rcard:hover{box-shadow:var(--sh); border-color:var(--pri)}
.rcard .nm{font-size: 0.9375rem; font-weight:700}
.rcard .kn{font-size: 0.6875rem; color:var(--g6)}
.rcard .meta{margin-top:4px; display:flex; gap:5px; flex-wrap:wrap}
.tag{font-size: 0.6875rem; padding:1px 7px; border-radius:9px; background:var(--g1); color:var(--g7)}
/* 追加情報のタグ。既存の居室(room)・介護度(care)・退去(out)の色は変えない */
.tag.bd,.tag.ht,.tag.wt{background:var(--g0); color:var(--g7); border:1px solid var(--g2)}
.tag.care{background:var(--pri-l); color:var(--pri-d)} .tag.room{background:#ede7f6; color:#5e35b1}
.tag.out{background:var(--ng-l); color:var(--ng)}
.tag.hosp{background:var(--warn-bg); color:var(--warn-tx); font-weight:700}

/* ── 誕生日一覧（A4縦1枚の帳票・入居者マスタからの移植）── */
.bday-bar{display:flex; align-items:center; gap:8px; margin:8px 0; flex-wrap:wrap}
.bday-bar button{min-height:44px; min-width:44px; padding:6px 12px; border:1px solid var(--g3);
  border-radius:8px; background:#fff; color:var(--g9); font-size: 0.875rem; cursor:pointer}
.bday-bar button:focus-visible{outline:2px solid var(--pri); outline-offset:1px}
/* 年度の端。無効だと分かる見た目にする（押しても無反応、の理由が見えないのを防ぐ） */
.bday-bar button:disabled{opacity:.45; cursor:default; background:var(--g1)}
.bday-bar #bdayFY{font-size: 0.9375rem; font-weight:700; min-width:6em; text-align:center}
.bday-bar .btn-print{margin-left:auto; background:var(--pri); color:#fff; border-color:var(--pri)}
.bday-sheet{background:#fff; padding:6px 4px}
.bday-hd{text-align:center; margin-bottom:6px}
.bday-hd .bt1{font-size:var(--bhd1,26px); font-weight:700; letter-spacing:.08em; line-height:1.2}
.bday-hd .bt2{font-size:var(--bhd2,17px); font-weight:700; margin-top:2px; line-height:1.2}
/* ★表は「内容ぴったりの幅」にする。左右の列は同じ高さに伸ばして下端を揃える */
.bday-2col{display:grid; grid-template-columns:auto auto; gap:10px;
  justify-content:center; align-items:stretch}
.bcol{display:flex; flex-direction:column; align-items:center}
.bcol .btbl{flex:1 0 auto}   /* 伸ばすだけ・絶対に縮めない（紙で潰れて読めなくなる） */
/* 画面では safe center（収まる時は中央／溢れる時は左寄せ＝左端の列に到達できる） */
@media screen{
  .bday-2col{justify-content:start; justify-content:safe center; overflow-x:auto}
}
.bcol-t{font-weight:700; margin-bottom:3px; line-height:1.2; font-size:var(--btitle,20px)}
.btbl{width:auto; border-collapse:collapse; table-layout:auto}
.btbl th,.btbl td{border:1px solid #000; padding:var(--bpad,2px) 6px; text-align:center;
  line-height:1.25; white-space:nowrap}
.btbl th{background:var(--g2); font-weight:700}
.btbl .bn{text-align:start}
.btbl .bno{font-variant-numeric:tabular-nums; color:var(--g7)}
.btbl .bd{font-variant-numeric:tabular-nums}
.btbl .ba{font-variant-numeric:tabular-nums}
/* 誕生日順の表は月の変わり目を太線で区切る（先頭行はヘッダ罫と重なるので対象外） */
.bt-date tbody tr.mstart:not(:first-child)>td{border-top:2px solid #000}
.bday-ft{margin-top:6px; text-align:end; font-size: 0.625rem; color:var(--g7)}
.bday-warn{margin-bottom:6px; padding:6px 10px; border-radius:8px;
  background:var(--warn-bg); color:var(--warn-tx); font-size: 0.75rem; font-weight:700}
.bday-bad{margin-top:4px; font-size: 0.625rem; color:var(--ng)}
@media print{ .bday-warn{display:none !important} }   /* 警告は画面だけ。印刷物には出さない */
@media (max-width:640px){ .bday-2col{grid-template-columns:1fr} }   /* スマホは縦積み（印刷は常に2列） */
.visually-hidden{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.empty{text-align:center; color:var(--g5); padding:40px 10px}
.loading{text-align:center; color:var(--g5); padding:30px}

/* ── 安全ハイライト帯 ── */
/* 安全ハイライト: 色は「危険・注意・情報」の3段階のみ。
   色だけに意味を持たせず、必ずアイコン＋文言を併記する（色覚特性配慮・HIG） */
.hlband{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.hlchip{border-radius:8px; padding:6px 12px 6px 10px; font-weight:700; font-size: 0.875rem;
  background:#fff; color:var(--g9); border:1px solid var(--g2); border-left:4px solid var(--g3)}
.hl-danger{background:var(--ng-l); border-color:#f2c9c5; border-left-color:var(--ng); color:var(--ng)}
.hl-warn{background:var(--warn-bg); border-color:#ecdcbe; border-left-color:var(--warn-tx); color:var(--warn-tx)}
.hl-info{background:#fff; border-left-color:var(--pri); color:var(--g9)}

/* ── タブ ── */
.ftabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.ftab{padding:0 16px; border:1px solid var(--g3); border-radius:22px; background:#fff; font-size: 0.875rem; color:var(--g7); min-height:44px}
.ftab.on{background:var(--pri); color:#fff; border-color:var(--pri)}
.fpanel{display:none}
.fpanel.on{display:block}

/* ── フェイスシート（印刷レイアウト） ── */
.sheet{background:#fff; border:2px solid var(--g9); border-radius:6px; overflow:hidden; margin-bottom:12px}
.sheet .sec{display:flex; border-top:1px solid var(--g9)}
.sheet .sec:first-child{border-top:none}
/* 2026-08-14 コンパクト化（入居者マスタと同時・同値）。セルは上下も詰める */
.sheet .sec-lbl{writing-mode:vertical-rl; text-orientation:upright; background:var(--g1);
  border-right:1px solid var(--g9); padding:6px 3px; font-weight:700; font-size: 0.8125rem; min-width:30px;
  display:flex; align-items:center; justify-content:center; letter-spacing:1.5px}
.sheet .sec-body{flex:1; min-width:0}
.cell{border-right:1px solid var(--g3); border-bottom:1px solid var(--g3); padding:3px 7px; min-width:0}
.cell:last-child{border-right:none}
.cell .lab{font-size: 0.6875rem; color:var(--g6); display:block; margin-bottom:0; line-height:1.25}
.cell .val{font-size: 0.9375rem; word-break:break-word; white-space:pre-wrap; line-height:1.45}
.cell .val.big{font-size: 1rem; font-weight:700}
/* 紙だけさらに一段詰める（画面の文字下限15pxは守りつつ、頁数を減らす） */
@media print{ .cell .val{font-size:0.875rem} }
.cell .sub{display:block; font-size: 0.625rem; color:var(--g6); margin-top:1px}  /* 値の出所・測定日 */
/* 生年月日の和暦。値の後ろに小さく添えるだけで幅を奪わない（セルを広げると隣が折り返して紙が伸びる） */
.bd-w{font-size:0.6875rem; color:var(--g6); margin-left:2px; white-space:nowrap}
@media print{ .bd-w{color:#333} }
.row-cells{display:flex; flex-wrap:wrap}
.row-cells .cell{flex:1}
.fulltext{white-space:pre-wrap; word-break:break-word; font-size: 0.875rem; line-height:1.5}
/* 薬剤情報（定期）の2列表示（2026-08-11 追加）。入居者マスタと同じ見た目に揃える。
   ★見出しも値も左揃え。右列は固定幅で、薬剤名が折り返しても効能は1行目に留まる。 */
/* ★右列は固定幅にせず auto にする。固定にすると、その方の効能が「降圧・利尿」のように
     短くても常に幅を取り、左列が狭まって【1列の時は収まっていた薬剤名が折り返す】。
     折り返しは印刷の改ページ位置を動かすので（原則2）、右列は中身の最大幅ちょうどに留める。 */
/* ★左列は max-content。効能列を右端に飛ばさず、薬剤名のすぐ右（＝中央寄り）に置く。
     長い薬剤名がある方では minmax の下限0で縮み、はみ出さない。 */
.meds2{display:grid; grid-template-columns:minmax(0,max-content) auto; column-gap:20px}
.meds2-h{font-size:0.6875rem; color:var(--g6); text-align:left; white-space:nowrap;
  padding-bottom:2px; margin-bottom:2px; border-bottom:1px solid var(--g2)}
.meds2-d,.meds2-e{font-size:0.875rem; line-height:1.6}
.meds2-d{word-break:break-word; white-space:pre-wrap}
.meds2-e{color:var(--g7); text-align:left; align-self:start; white-space:nowrap}
.meds2-na{color:var(--g5)}
@media print{
  .meds2-h{border-bottom-color:#999}
  .meds2-e{color:#000; font-size:0.8125rem}   /* 紙では右列をさらに詰めて左列を広く保つ */
  .meds2-na{color:#666}
}
/* ── 入居者基本情報（外部様式）のチェック表示（2026-08-12 追加） ──
   resident-master.html の同名クラスからの移植（表示部分のみ。編集UIの .bfe* は持たない）。
   画面と印刷で同じ見た目にする。□＋✓で、色だけに意味を持たせない（介護現場要件4）。
   ★□は固定寸法なので、✓を入れても入れなくても幅は動かない（行の折り返し＝改ページ位置が動かない）。 */
.bfck{display:inline-flex; align-items:center; gap:4px; margin-right:12px; white-space:nowrap;
  font-size:0.875rem; line-height:1.5}
.bfck i{width:12px; height:12px; flex:0 0 12px; border:1px solid var(--g7); border-radius:2px;
  display:inline-block; text-align:center; line-height:11px; font-size:11px; font-weight:700;
  font-style:normal; color:var(--g9)}
.bfck.on{font-weight:700}
.bfwrap{display:flex; flex-wrap:wrap; padding:1px 0}
.bfadl{width:100%; border-collapse:collapse; font-size:0.875rem}
.bfadl th,.bfadl td{border:1px solid var(--g3); padding:2px 5px; vertical-align:middle}
.bfadl thead th{background:var(--g1); font-size:0.6875rem; color:var(--g7); font-weight:700; text-align:center}
.bfadl th.bfrow{width:88px; text-align:left; font-weight:700; background:var(--g0)}
.bfadl td.bfc{width:46px; text-align:center}
.bfadl .bfmark{font-style:normal; font-weight:700}
.bfdis{width:100%; border-collapse:collapse; font-size:0.875rem}
.bfdis th,.bfdis td{border:1px solid var(--g3); padding:2px 5px; word-break:break-word}
.bfdis thead th{background:var(--g1); font-size:0.6875rem; color:var(--g7); font-weight:700}
.bfdis .bfno{width:26px; color:var(--g6); text-align:center}
/* 2026-08-15: 既往歴表は「縦3×横2組」＝1行に4列×2（入居者マスタと同値） */
.bfdis .bfonset{width:84px}
.bfdis .bfhosp{width:16%}

/* 和暦（2026-08-12 追加・入居者マスタと同じ定義）。生年月日を西暦と並べて出すために使う。

function parseIsoDate(iso){
  var s=String(iso==null?'':iso).slice(0,10);
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return null;
  var y=+m[1],mo=+m[2],d=+m[3];
  var t=new Date(y,mo-1,d);

  return {y:y,m:mo,d:d};

function calcAge(birthISO){if(!birthISO)return'';var b=new Date(birthISO);if(isNaN(b))return'';var n=new Date();var a=n.getFullYear()-b.getFullYear();var m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a>=0&&a<140?a:''}
function calcBMI(h,w){h=parseFloat(h);w=parseFloat(w);if(!h||!w)return'';var b=w/Math.pow(h/100,2);return isFinite(b)?b.toFixed(1):''}
/* 入居期間（日数）。退去日があればそこまで、無ければ今日まで。不正な日付は空を返す

/* ═══════════ GAS API（読み取り専用・トークン付き） ═══════════ */
/* ★通信の待ち時間（2026-08-18 見直し）。
   従来 apiGet=12秒 / apiPost=15秒だったが、入居者マスタのGASは書き込み（保存・入院切替・
   一括編集・定期薬連携）で LockService のロックを【最大20秒】待つ設計。つまり誰かが保存中だと
   クライアント側が先に切れる＝混み合う朝ほど「取得に失敗しました: タイムアウト」が必ず出ていた。
   ロック待ち20秒＋処理時間を吸収できる長さにする。GAS の実行上限は6分なので、この程度は許容。
   ★これは症状の緩和であって、GAS の同時実行が詰まること自体は解消しない。
     読み取りだけ自動で1回やり直す（apiGetRetry）と、失敗画面に再試行ボタンを併せて置く。 */
function apiGet(params,timeoutMs){
  if(!CFG.url)return Promise.reject(new Error('NO_URL'));
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
  qs+='&token='+encodeURIComponent(CFG.token);
  return fetchWithTimeout(CFG.url+'?'+qs,{method:'GET',redirect:'follow'},timeoutMs||25000).then(parseJson);
}
function fetchWithTimeout(url,opt,ms){
  return new Promise(function(res,rej){
    var ctl=('AbortController'in window)?new AbortController():null;
    if(ctl)opt.signal=ctl.signal;
    var t=setTimeout(function(){if(ctl)ctl.abort();rej(new Error('タイムアウト'))},ms);
    fetch(url,opt).then(function(r){clearTimeout(t);res(r)}).catch(function(e){clearTimeout(t);rej(e)});
  });
}
function parseJson(r){return r.text().then(function(t){var d;try{d=JSON.parse(t)}catch(e){throw new Error('応答が不正です')}if(d&&d.error)throw new Error(d.error);return d})}

/* GASの軽量roster（非機微）を取得する。

     一覧カードの生年月日・身長・入院中タグ（入居者マスタと同じ表示）は共有名簿に無く、

   ★現場端末では呼ばない（端末に生年月日等を増やさない。boot() 側で分岐）。 */
function refreshRosterFromGas(){
  if(!CFG.url){renderRoster();return Promise.resolve(false)}

  return apiGet({action:'getRoster'}).then(function(d){
    var list=(d&&d.roster)||d||[];
    if(Array.isArray(list)){
      /* ★空上書き保護: サーバーが空 × 手元が非空なら【書き換えない】。
         通信は成功しているので catch には入らない＝ここで守らないと名簿が消える（原則4）。 */
      if(!list.length&&roster.length){

          gender:r.gender||'',careLevel:r.careLevel||'',active:r.active!==false,
          birthDate:r.birthDate||'',height:r.height||'',
          targetApps:(typeof t==='string'&&t)?t.split(',').map(function(x){return x.trim()}).filter(Boolean):(Array.isArray(t)?t:null)};
        /* ★入院中は「キーが有る時だけ」具現化する。旧GASの応答に !! を掛けると
           『全員 false の明示配信』に化け、入院タグが一律で消える（マスタ normRosterRow と同じ作法） */
        if(Object.prototype.hasOwnProperty.call(r,'hospitalized')) o.hospitalized=!!r.hospitalized;

  }).catch(function(e){setSync('オフライン','err');renderRoster();if(e.message!=='NO_URL')toast('⚠️ 一覧の取得に失敗: '+e.message);return false});

/* 誕生日順（4月始まり）と年齢順の2表をA4縦1枚に並べる。

function bdayHtml(list){

  var rows=[],noBd=0,badBd=[];

    var A=parseIsoDate(a.birthDate),B=parseIsoDate(b.birthDate);
    return A.y-B.y || A.m-B.m || A.d-B.d;

  var mrow=[],prev=null;
  byDate.forEach(function(r,i){
    var m=parseIsoDate(r.birthDate).m;
    if(m!==prev){ mrow.push({i:i,m:m,n:1}); prev=m; } else { mrow[mrow.length-1].n++; }
  });
  var spanAt={},monAt={};
  mrow.forEach(function(g){ spanAt[g.i]=g.n; monAt[g.i]=g.m; });
  var t1=byDate.map(function(r,i){

  var t2=byAge.map(function(r,i){

  }).join('');
  var today=new Date();
  var stamp=today.getFullYear()+'.'+(today.getMonth()+1)+'.'+today.getDate();
  var badLine = badBd.length
    ? '<div class="bday-bad">生年月日の書式が不正で表に載せられませんでした（要確認）：'+

  var notes=[];

  if(badBd.length) notes.push('書式が不正な'+badBd.length+'名は下記');
  var base=fyOfDate(today);
  var fyNote = (bdayFY!==base) ? '　※'+bdayFY+'年度の表示（年齢は'+(bdayFY+1)+'年3月31日時点）' : '';
  /* ★どの絞り込みで出した紙かを必ず残す（残さないと一部だけの表が完全な一覧に見える） */

      '<div class="bcol"><div class="bcol-t">誕生日順</div>'+
        '<table class="btbl bt-date"><thead><tr><th>No.</th><th>誕生月</th><th>利用者名</th><th>生年月日</th><th>年齢</th></tr></thead><tbody>'+t1+'</tbody></table></div>'+
      '<div class="bcol"><div class="bcol-t">年齢順</div>'+
        '<table class="btbl bt-age"><thead><tr><th>No.</th><th>利用者名</th><th>生年月日</th><th>年齢</th></tr></thead><tbody>'+t2+'</tbody></table></div>'+
    '</div>'+

/* 五十音の行分け（清音・大書き・ひらがなへ寄せてから分類） */
var KANA_BASE={'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ','ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
  'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と','ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
  'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ','ゔ':'う',
  'ゐ':'い','ゑ':'え','ゕ':'か','ゖ':'け',
  'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ'};
var KANA_ROWS=[['あ行','あいうえお'],['か行','かきくけこ'],['さ行','さしすせそ'],['た行','たちつてと'],
  ['な行','なにぬねの'],['は行','はひふへほ'],['ま行','まみむめも'],['や行','やゆよ'],
  ['ら行','らりるれろ'],['わ行','わをん']];
var KANA_HALF='をぁぃぅぇぉゃゅょっーあいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん';
function kanaRowOf(r){
  var s=String(r.kana||'').trim();
  if(!s) return '';                                  // ヨミが無い人は「その他」へ（落とさない）
  var c=s.charAt(0);
  var cd=c.charCodeAt(0);
  if(cd>=0x30A1&&cd<=0x30F6) c=String.fromCharCode(cd-0x60);      // 全角カタカナ→ひらがな
  else if(cd>=0xFF66&&cd<=0xFF9D) c=KANA_HALF.charAt(cd-0xFF66);  // 半角カタカナ→ひらがな
  c=KANA_BASE[c]||c;
  for(var i=0;i<KANA_ROWS.length;i++){ if(KANA_ROWS[i][1].indexOf(c)>=0) return KANA_ROWS[i][0]; }
  return '';                                         // ひらがな以外（英字等）も「その他」へ
}
var weightIdx={};
/* 1人分のカード。全ビューで同じ見た目にする。
   ★既存の居室・介護度・退去タグの並びは動かさない。生年月日・身長・体重はその後ろに足し、
     値が無い項目はタグごと出さない（現場端末では生年月日等が来ないので自然に出ない）。
   ★キーボードでも開けるようにする（role/tabindex/aria-label はフェイスシート固有の実装）。 */
function rcardHtml(r){
  /* ★現場端末では 生年月日・身長・体重・入院中 のタグを出さない（2026-08-15 レビュー指摘）。
     体重は同一オリジンの体重管理アプリ（localStorage）から作るため【サーバー側の役割制御が効かない】。
     ここで落とさないと、詳細画面は守られているのに一覧だけ素通りする
     （安全情報28項目に体重・生年月日は含まれない／介護現場要件9「一覧では最小限に」）。 */

/* A4縦1枚に収める。行数で決め打ちせず、実際の高さを測って収まるまで縮める */
var BDAY_PRINT_H_PX = 277 * 96 / 25.4;   // A4縦297mm − 上下マージン10mm
var BDAY_PRINT_W_PX = 190 * 96 / 25.4;   // A4縦210mm − 左右マージン10mm
function fitBdaySheet(){
  var sheet=$('bdaySheet'); if(!sheet) return;
  /* ★非表示のときは測らない（offsetHeight が 0 になり「収まった」と誤判定する） */
  if(!sheet.offsetParent) return;
  var tbls=sheet.querySelectorAll('.btbl');
  var cols=sheet.querySelectorAll('.bcol');
  var hd=sheet.querySelector('.bday-hd'), ft=sheet.querySelector('.bday-ft');
  if(!tbls.length||!cols.length) return;
  function measure(){
    var tall=0;
    for(var i=0;i<cols.length;i++) tall=Math.max(tall,cols[i].offsetHeight);
    /* ★書式不正の氏名行(.bday-bad)も印刷に出るので必ず数える。.bday-warn は紙に出ないので数えない */
    var bad=sheet.querySelector('.bday-bad');
    return (hd?hd.offsetHeight:0)+tall+(ft?ft.offsetHeight:0)+(bad?bad.offsetHeight+4:0)+16;
  }
  function width(){
    var w=0;
    for(var i=0;i<tbls.length;i++) w+=tbls[i].offsetWidth;
    var gapPx=0;
    try{ gapPx=parseFloat(getComputedStyle(sheet.querySelector('.bday-2col')).columnGap)||0; }catch(e){ gapPx=10; }
    return w+gapPx;
  }
  function apply(s){
    var p = s>=11 ? 3 : s>=9 ? 2 : s>=8 ? 1 : 0;
    for(var i=0;i<tbls.length;i++){ tbls[i].style.fontSize=s+'px'; }
    sheet.style.setProperty('--bpad', p+'px');
    /* 大小は必ず「☆誕生日一覧☆ ＞ 誕生日順/年齢順 ＞ 本文」の順にする */
    sheet.style.setProperty('--btitle', Math.round(s*1.7)+'px');
    sheet.style.setProperty('--bhd1',   Math.round(s*2.1)+'px');
    sheet.style.setProperty('--bhd2',   Math.round(s*1.4)+'px');
  }
  function tooTall(){ return measure()>BDAY_PRINT_H_PX; }
  function tooWide(){ return width()>BDAY_PRINT_W_PX-6; }   /* 幅は6pxの安全余裕（紙では左右が切れる） */
  function fits(){ return !tooTall() && !tooWide(); }
  var MAX=22, MIN=7, STEP=0.25;
  var lo=0, hi=Math.round((MAX-MIN)/STEP);
  var sizeOf=function(k){ return Math.round((MIN+k*STEP)*100)/100; };
  apply(sizeOf(lo));
  if(fits()){
    while(lo<hi){
      var mid=Math.ceil((lo+hi)/2);
      apply(sizeOf(mid));
      if(fits()) lo=mid; else hi=mid-1;
    }
  }
  apply(sizeOf(lo));
  /* それでも収まらない時は黙って溢れさせない。画面にだけ理由を出す（印刷物には出さない） */
  var over=!fits(), wide=tooWide();
  var warn=sheet.querySelector('.bday-warn');
  if(over&&!warn){
    warn=document.createElement('div'); warn.className='bday-warn';
    warn.textContent = wide
      ? '⚠️ お名前の長い方がいるため、A4縦1枚の幅に収まりません。この方の氏名表記をご確認ください（紙では左右が切れます）。'
      : '⚠️ 人数が多く、この文字サイズではA4縦1枚に収まりません。上の「在籍／退去」で絞り込むか、2枚に分けて印刷してください。';
    sheet.insertBefore(warn,sheet.firstChild);
  }else if(!over&&warn){ warn.parentNode.removeChild(warn); }
}

/* ═══════════ 詳細取得（都度取得・キャッシュしない） ═══════════ */
var curRec=null;
/* 要求世代カウンタ。★通信の返る順番は要求順とは限らない。遅れて返った前の方の応答で
   画面を書き換えると、いま開いている方の画面に別人の内容が出る（取り違え）。

  }).catch(function(e){
    if(seq!==openSeq)return;                    // 旧要求の失敗で、いま開いている方の画面を潰さない

       （電波が悪いだけで、次の再読み込みから復元されなくなるのを防ぐ） */

    if(fromMasterActive)setFromMasterBar('fail')});
}

/* ═══════════ 最新体重（体重管理アプリのデータを読むだけ・向こうは一切変更しない） ═══════════
   同一オリジン（th-su.github.io）なので localStorage を直接読める。書き込みは一切しない。
   ★体重の正本は体重管理アプリ。マスタ dataJson の weight は移行時の静的値で古い。
   ★rec.weight は車椅子控除済みの正味体重（weight-record.html が保存時に計算済み）。補正しない。
   ★実装は resident-master.html:521-601 の写し。名寄せ（masterId優先→氏名一致）と
     同姓同名除外の仕様をズラすと別人の体重が付くため、あちらを直したらここも直す。 */
var WTMGR_KEY='wtmgr_v1';
/* 氏名の正規化は weight-record.html の suNormName と同一仕様（空白を除去するだけ） */
function wtNormName(s){ return String(s==null?'':s).replace(/\s+/g,'').trim(); }
/* 最新判定のソートキーも weight-record.html の recDateKey と同一仕様 */
function wtRecKey(r){ return (r.measuredOn||(r.yearMonth?r.yearMonth+'-01':''))+'#'+(r.createdAt||''); }

var _wtRaw=null,_wtCache=null;
function loadWeightSource(){
  var empty={latest:{},midByUid:{},uidByName:{}};
  var db,raw;
  try{
    raw=localStorage.getItem(WTMGR_KEY);
    if(!raw){ _wtRaw=null;_wtCache=null; return empty; }
    if(raw===_wtRaw && _wtCache) return _wtCache;   // 同じ生文字列なら再parseしない
    db=JSON.parse(raw);
  }catch(e){ return empty; }
  if(!db||!Array.isArray(db.residents)||!Array.isArray(db.records)) return empty;

  var midByUid={}, nameCount={}, uidOfName={};
  db.residents.forEach(function(p){
    if(!p||p.id==null) return;
    if(p.masterId!=null&&p.masterId!=='') midByUid[String(p.id)]=String(p.masterId);
    var n=wtNormName(p.name);
    if(n){ nameCount[n]=(nameCount[n]||0)+1; uidOfName[n]=String(p.id); }
  });
  var latest={};
  db.records.forEach(function(rec){
    if(!rec||rec.residentId==null) return;
    /* 体重アプリは数値化に失敗した体重を 0 に丸めて保存する。0kg を最新値として
       拾わないよう、入力バリデーションと同じ 20〜150kg 以外は最新判定から除外する。 */
    var wv=Number(rec.weight);
    if(!isFinite(wv)||wv<20||wv>150) return;
    var uid=String(rec.residentId), k=wtRecKey(rec);
    if(!latest[uid]||k>latest[uid].k) latest[uid]={k:k,weight:wv,on:rec.measuredOn||rec.yearMonth||''};
  });
  /* ★同姓同名が複数いる氏名は名寄せに使わない（別人の体重が付くのを防ぐ） */
  var uidByName={};
  Object.keys(nameCount).forEach(function(n){ if(nameCount[n]===1) uidByName[n]=uidOfName[n]; });
  _wtRaw=raw; _wtCache={latest:latest, midByUid:midByUid, uidByName:uidByName};
  return _wtCache;
}
/* 名簿（su_residents_common の写し）に対して {masterId:{weight,on}} を作る */
function buildWeightIndex(list){
  var idx={}, src=loadWeightSource(), used={};
  // ① masterId 一致（確実な紐付けを優先）
  Object.keys(src.midByUid).forEach(function(uid){
    var w=src.latest[uid], mid=src.midByUid[uid];
    if(!w) return;
    if(!idx[mid]||w.k>idx[mid].k) idx[mid]=w;   // 同じ masterId が2件あれば新しい方
    used[uid]=true;
  });
  /* ★マスタ側の同姓同名も除外する。数えるのは必ず名簿全体（絞り込み後の list ではない） */
  var dup={};
  roster.forEach(function(r){ var n=wtNormName(r.name); if(n) dup[n]=(dup[n]||0)+1; });
  // ② 氏名の正規化一致（体重アプリ側に masterId が無い人向け）
  list.forEach(function(r){
    var mid=String(r.masterId);
    if(idx[mid]) return;
    var n=wtNormName(r.name);
    if(!n||dup[n]!==1) return;          // 名簿側に同名が複数 → 紐づけない
    var uid=src.uidByName[n];
    if(!uid||used[uid]) return;
    var w=src.latest[uid];
    if(w){ idx[mid]=w; used[uid]=true; }
  });
  return idx;
}
/* 表示中の1名分だけ取り出す。該当が無ければ null（＝マスタの静的値にフォールバック）。
   体重アプリ未使用の端末・壊れたJSON・名寄せ不能でも例外を出さず null を返す。 */
function latestWeightOf(masterId){
  if(masterId==null||masterId==='') return null;
  try{
    var idx=buildWeightIndex(roster), k=String(masterId);
    if(!Object.prototype.hasOwnProperty.call(idx,k)) return null;   // 'constructor' 等を拾わない
    var w=idx[k];
    return (w&&typeof w.weight==='number')?w:null;
  }catch(e){ return null; }
}
/* 基本情報の「体重」「BMI」セルを作る。
   体重管理アプリに記録があればそれを正として測定日を添え、BMI も最新体重で計算し直す。
   記録が無い端末・未登録の入居者は従来どおりマスタの静的値（移行時点の値）を出す。 */
function weightCells(r){
  var lw=latestWeightOf(r&&r.id);
  var wVal, wSub, bmi, bSub;
  if(lw){
    var on=lw.on?String(lw.on).slice(0,10):'';
    wVal=lw.weight+' kg';
    wSub=on?('最新 '+on+' 測定'):'体重管理アプリの最新値';
    bmi=calcBMI(r.height,lw.weight);
    bSub=bmi?'最新体重で計算':'';
  }else{
    wVal=r.weight?r.weight+' kg':'';
    wSub=r.weight?'（移行時点）':'';
    bmi=calcBMI(r.height,r.weight);
    bSub=bmi?'（移行時点）':'';
  }
  return {weightCell:cell('体重',wVal,false,wSub), bmiCell:cell('BMI',bmi,false,bSub)};
}

function fcell(lab,val){return'<div class="cell"><span class="lab">'+esc(lab)+'</span><div class="fulltext">'+esc(val==null||val===''?'　':val)+'</div></div>'}
/* ── 薬剤情報（定期）を「薬剤｜効果・効能」の2列で描く（2026-08-11 追加）──
   効能は薬効辞書（meds-effect-dict.js）から引く【参考表示】で、保存はしない。
   入居者マスタの medsRegularCell と同じ判断で、次のどれかなら従来どおり1列で出す:
     ①辞書が読み込めていない ②薬剤情報が空 ③1行も引けなかった ④行数がずれた
   ★行数がずれたまま並べると【別の薬の効能が並ぶ】ため、必ず1列へ戻す。 */
/* セルの【中身だけ】を返す（2026-08-12 分離）。呼び出し側が幅を決めた枠へ入れられるようにする。
   1列へ戻す条件に当たった時は、従来と同じ「見出し＋本文」を返す。 */
function fullMedsBody(lab,val){
  var plain = '<span class="lab">'+esc(lab)+'</span><div class="fulltext">'+esc(String(val==null?'':val)||'　')+'</div>';
  var raw = String(val == null ? '' : val);
  if(!raw.trim()) return plain;
  if(typeof MedsEffect === 'undefined' || typeof MedsEffect.effectsFor !== 'function') return plain;
  var lines, effs;
  try{
    lines = raw.replace(/\r\n/g,'\n').split('\n');
    effs  = MedsEffect.effectsFor(raw);
  }catch(e){ return plain; }
  if(!Array.isArray(effs) || effs.length !== lines.length) return plain;
  var hit = false;
  for(var k=0;k<effs.length;k++){ if(effs[k]){ hit = true; break; } }
  if(!hit) return plain;
  var h = '<div class="meds2">'+
    '<div class="meds2-h">'+esc(lab)+'</div><div class="meds2-h">効果・効能</div>';
  for(var i=0;i<lines.length;i++){
    h += '<div class="meds2-d">'+esc(lines[i]||'　')+'</div>'+
         '<div class="meds2-e">'+(effs[i] ? esc(effs[i]) : '<span class="meds2-na">—</span>')+'</div>';
  }
  return h+'</div>';
}
function fullMeds(lab,val){
  return '<div class="cell" style="border-right:none">'+fullMedsBody(lab,val)+'</div>';
}
function sec(lbl,body){return'<div class="sec"><div class="sec-lbl">'+esc(lbl)+'</div><div class="sec-body">'+body+'</div></div>'}
/* 様式に置き換えた「元の記載」。入居者マスタと同じ内容を、こちらでも画面だけに出す。
   ★出さないと、様式へ写し終えるまで治療中の病気などがこの帳票から丸ごと消える
     （フェイスシートは独立した帳票なので「マスタを開けば見られる」では埋まらない）。
   ★事務所ビュー専用。現場タブレットには元から値が来ない（安全情報に無い）。 */
var BF_LEGACY_KEYS=[['currentDiseases','治療中の病気'],['mobility','移動'],['excretion','排泄'],
  ['bath','入浴'],['medMgmt','服薬 管理方法'],['medAssist','服薬介助'],['problemBehavior','問題行動 等']];

             '<span class="lab">'+esc(o.label)+'</span>'+
             '<div class="fulltext bflegacy">'+esc(o.value)+'</div></div>';

/* ══ 印刷しない欄（2026-08-17 指示）══
   指定の正本は入居者マスタの編集画面（dataJson の printHide）。ここは読んで反映するだけで書かない。
   ★入居者マスタ resident-master.html の PRINT_SECS / printHideSet / applyPrintHide と
     逐語同一にすること（食い違うと、伏せたつもりの欄がこちらの紙にだけ載る）。
   ★現場タブレットには printHide が届かない（安全情報しか送っていない）が、そもそも
     ここで伏せたい要配慮情報は現場へ送られていないので、表示は従来どおりで問題ない。 */
var PRINT_SECS=[
  ['basic','基本情報'],['insurance','保険・制度／連絡先'],['careHist','介護度の変更履歴'],
  ['basicItems','基本事項'],['family','家族情報'],['biz','事業所'],['geno','家族構成図'],
  ['disease','既往歴・サービス'],['meal','食事'],['mind','認知・意思疎通'],
  ['medical','医療情報'],['meds','薬剤情報'],['pastMeds','過去の臨時薬'],['adl','ADL・状態'],
  ['person','嗜好・本人らしさ'],['history','生活歴'],['wishes','意向・ACP'],
  ['support','支援経過'],['medSupport','医療支援経過'],['targetApps','対象']
];
function printHideSet(r){
  var v=r&&r.printHide, out={};
  var arr=(v&&Array.isArray(v.secs))?v.secs:[];
  var known={}; PRINT_SECS.forEach(function(p){known[p[0]]=1});
  arr.forEach(function(k){ if(known[String(k)]) out[String(k)]=true });
  return out;
}
function applyPrintHide(box,r){
  if(!box)return;
  var hid=printHideSet(r), lab2key={};
  PRINT_SECS.forEach(function(p){lab2key[p[1]]=p[0]});
  Array.prototype.forEach.call(box.querySelectorAll('.sec-lbl'),function(lbl){
    var key=lab2key[(lbl.textContent||'').trim()];
    if(!key||!hid[key])return;
    var frame=lbl.parentElement; if(!frame)return;
    frame.setAttribute('data-nop','1');
    var body=frame.querySelector('.sec-body');
    if(body&&!body.querySelector('.nop-tag')){
      var tag=document.createElement('div');
      tag.className='nop-tag';
      tag.textContent='🚫 この欄は印刷しません（画面には出ます）';
      body.insertBefore(tag,body.firstChild);
    }
  });
  /* 事業所と家族構成図は1つの行（.biz-geno-row）に横並びで入っている。
     ・両方を伏せる → 中身が空のまま行の上罫線（border-top）だけが紙に1本残る（実測1px）→ 行ごと外す
     ・事業所だけ伏せる → 右隣（家族構成図）の枠の左罫線が【紙の左内縁】に来て、シート枠のすぐ内側に
       余分な縦線が1本走る（行の高さぶん・実測150px超）→ 見えている先頭の枠の左罫線を紙でだけ消す */
  Array.prototype.forEach.call(box.querySelectorAll('.biz-geno-row'),function(row){
    var lbls=row.querySelectorAll('.sec-lbl');
    if(!lbls.length)return;
    var frames=Array.prototype.map.call(lbls,function(l){return l.parentElement});
    var vis=frames.filter(function(f){return f&&f.getAttribute('data-nop')!=='1'});
    if(!vis.length){ row.setAttribute('data-nop','1'); return }
    /* ★先頭が伏せられた時だけ付ける。伏せていない時に付けると、指定ゼロの方の帳票にも
       クラスが載る（今は見た目が変わらないが、将来の CSS 変更で効きはじめる） */
    if(vis[0]!==frames[0]) vis[0].classList.add('nop-first');
  });
  /* ★再掲の始末。安全情報の帯（詳細画面の先頭）とフェイスシートの「サマリ」は、他の欄の値を
     抜き出して**もう一度**出している。元の欄を伏せてもここに残ると伏せ漏れになる
     （アレルギー・感染症・医療処置は、まさに家族向けの紙から外したい類の情報）。
     由来を data-nop-of に書いておき、その欄が伏せられていれば一緒に紙から外す。 */
  Array.prototype.forEach.call(box.querySelectorAll('[data-nop-of]'),function(el){
    if(hid[el.getAttribute('data-nop-of')]) el.setAttribute('data-nop-row','1');
  });
  /* ★中身が全部伏せられた入れ物は、入れ物ごと外す。
     残すと紙に「空の帯」「空の行」＝罫線と余白だけが出る（安全情報の帯は実測17px）。
     見出し（.sec-lbl）を持たない枠＝安全情報の帯なので、枠そのものも外す。
     見出しを持つ枠（＝欄）は外さない＝欄の存在は残す（伏せたのは中身の再掲だけ）。 */
  var conts=[];
  Array.prototype.forEach.call(box.querySelectorAll('[data-nop-row]'),function(el){
    if(el.parentElement&&conts.indexOf(el.parentElement)<0)conts.push(el.parentElement);
  });
  conts.forEach(function(p){
    if(!p.children.length)return;
    var allHid=Array.prototype.every.call(p.children,function(c){return c.hasAttribute('data-nop-row')});
    if(!allHid)return;
    p.setAttribute('data-nop-row','1');
    var sec=p.closest?p.closest('.sec'):null;
    if(sec&&!sec.querySelector('.sec-lbl'))sec.setAttribute('data-nop','1');
  });
  /* ★行の最後のセルを伏せると、その手前のセルの右罫線が【紙の右端】に縦線として残る（実測）。
     見えている最後のセルの右罫線を紙でだけ消して、従来と同じ見え方に戻す。
     クラスで付けること（style に直接書くと、伏せたセルが見えている画面側の罫線まで変わる）。 */
  /* ★紙で消えるのは printHide だけではない。退去日・ご逝去日・在籍状態・入居期間・退去先には
     元から .noprint-cell が付いている。どちらの理由で消えても同じ穴（右端に罫線が残る）なので
     両方を「紙で消える」とみなす */
  function nopHidden_(c){ return c.hasAttribute('data-nop-row')||c.classList.contains('noprint-cell') }
  Array.prototype.forEach.call(box.querySelectorAll('.row-cells'),function(row){
    var cells=row.querySelectorAll('.cell');
    if(!cells.length||!nopHidden_(cells[cells.length-1]))return;
    for(var i=cells.length-1;i>=0;i--){
      if(!nopHidden_(cells[i])){ cells[i].classList.add('nop-last'); break }
    }
  });
}
/* 再掲セルに「どの欄から来た値か」を書き込む。★ラッパーの div で包まないこと
   （.sec-body 直下の罫線構造が変わる）。
   ★cell() に列幅クラスを渡すと '<div class="cell w-sm"' になる。固定文字列で置換すると
     【何も起きず例外も出ない】＝伏せ漏れに化けるので、クラス付きも拾える正規表現で置換し、
     当たらなかった時は開発中に気づけるよう画面へ出す（値は出さない＝個人情報を残さない）。 */
function nopOf(html,key){
  var s=String(html);
  var out=s.replace(/<div class="(cell[^"]*)"/, '<div class="$1" data-nop-of="'+key+'"');
  if(out===s){ try{ toast('⚠ 印刷除外の紐づけに失敗しました（'+key+'）'); }catch(e){} }
  return out;
}
function careHistHtml(arr){

  if(!a.length)return'<div class="cell" style="border-right:none;border-bottom:none"><span style="color:var(--g5)">　</span></div>';
  return'<div class="cell" style="border-right:none;border-bottom:none">'+a.map(function(s){
    var period=(s.certStart||'')+(s.certEnd?(' 〜 '+s.certEnd):'');

  }).join('')+'</div>';
}

/* ═══════════ 入居者基本情報（外部様式）── 正規化（resident-master.html から移植） ═══════════
   2026-08-12 管理者の指示で、外部からいただく「入居者基本情報」の様式に合わせた表示に追従させた。
   ★本ファイルは【閲覧専用】。編集フォーム側の部品（bfSet / bfEdit* / bfPrune / BF_FORM_KEYS）と
     「移行前の記載」（bfLegacy）は移植していない。前者は入力欄が無いため、後者はマスタ側だけの
     移行支援表示のため（元の値はマスタの詳細画面で見られる。データはどちらも1バイトも消していない）。
   方針（マスタ側と同一）:
   ・保存済みの新項目があれば【必ずそれを優先】する。旧値からの推定と混ぜない
   ・旧値からの変換は「機械的に確実な分だけ」。曖昧なものは空のままにする
   ・変換は【表示のためだけ】。このアプリは書き込み経路を持たない */
function bfObj(v){ return (v && typeof v==='object' && !Array.isArray(v)) ? v : {}; }
function bfArr(v){ return Array.isArray(v) ? v : []; }
function bfHas(s,re){ return re.test(String(s==null?'':s)); }
function bfStr(v){ return String(v==null?'':v).trim(); }
function bfCount(o){ return Object.keys(bfObj(o)).length; }
/* 自立／見守り／一部介助／全介助 のどれかへ寄せる。判定できなければ '' を返す */
function bfLevelOf(s){
  var t=bfStr(s);
  if(!t) return '';
  if(/全介助|寝たきり/.test(t))            return 'full';
  if(/一部介助|部分介助/.test(t))          return 'part';
  if(/見守り|声かけ|手渡し/.test(t))       return 'watch';
  if(/自立|独歩|自己管理|問題なし/.test(t)) return 'self';
  return '';
}
/* 認知症自立度の表記ゆれを正す。「Ⅲa」と「IIIa」が混在すると様式の表記に揃わない。
   ★文字列【全体】が変換形と一致する時だけ直す。「Ⅲa（H30判定）」のような補足つきは1文字も触らない */
var BF_RANK_ALIAS={'I':'Ⅰ','II':'Ⅱ','III':'Ⅲ','IV':'Ⅳ','Ⅰ':'Ⅰ','Ⅱ':'Ⅱ','Ⅲ':'Ⅲ','Ⅳ':'Ⅳ'};
function bfNormRank(s){
  var t=bfStr(s);
  if(t==='' || BF_DEMENTIA_RANKS.indexOf(t)>0) return t;
  var m=/^([IVⅠⅡⅢⅣ]+)\s*([ab]?)$/i.exec(t);
  if(!m) return t;
  var head=BF_RANK_ALIAS[m[1].toUpperCase()] || BF_RANK_ALIAS[m[1]];
  if(!head) return t;
  var cand=head+(m[2]||'').toLowerCase();
  return BF_DEMENTIA_RANKS.indexOf(cand)>0 ? cand : t;
}
/* 表示用に正規化した1名分を返す（純関数・引数を書き換えない） */
function bfView(r){
  r=r||{};
  var v={};
  v.diseases  = bfArr(r.diseases).filter(function(d){ return d && (bfStr(d.name)||bfStr(d.onset)||bfStr(d.hospital)); });
  v.services  = bfObj(r.services);
  v.bpsd      = bfObj(r.bpsd);
  v.night     = bfObj(r.night);
  /* ★様式を一度でも保存したら、旧データからの推定を【全部止める】。
       止めないと「—（未選択）」に戻した項目が旧自由文から毎回復活し、選び直せない。
       未入力（まだ様式を触っていない）と、明示的に空（人が空にした）を区別する
       ＝multi-device-sync 原則4。 */
  var derive = !r.bfSaved;
  var g = bfObj(r.adlGrid);
  v.adlGrid = { move:    g.move    || (derive ? bfLevelOf(r.mobility)  : ''),
                oral:    g.oral    || '',
                meal:    g.meal    || '',
                bath:    g.bath    || '',
                excrete: g.excrete || (derive ? bfLevelOf(r.excretion) : '') };
  /* 補助チェックは「保存済みが1つでもあれば、それが人の意思」＝推定を足さない */
  v.moveAid = bfObj(r.moveAid);
  if(derive && !bfCount(v.moveAid)){
    v.moveAid={};
    if(bfHas(r.mobility,/歩行器/))        v.moveAid.walker=true;
    if(bfHas(r.mobility,/車椅子|車いす/)) v.moveAid.wheelchair=true;
  }
  v.excreteWay = bfObj(r.excreteWay);
  if(derive && !bfCount(v.excreteWay)){
    v.excreteWay={};
    if(bfHas(r.excretion,/おむつ|オムツ/))  v.excreteWay.diaper=true;
    if(bfHas(r.excretion,/ポータブル|PWC/)) v.excreteWay.pwc=true;
    if(bfHas(r.excretion,/カテーテル/))     v.excreteWay.catheter=true;
  }
  v.bathPlace = bfObj(r.bathPlace);
  if(derive && !bfCount(v.bathPlace)){
    v.bathPlace={};
    if(bfHas(r.bath,/清拭/)) v.bathPlace.wipe=true;   /* 一般浴・機械浴からは場所を決めない */
  }
  v.medLevel   = bfStr(r.medLevel)   || (derive ? (bfLevelOf(r.medAssist)||bfLevelOf(r.medMgmt)) : '');
  /* 薬の有無だけは確実に決まる（定期薬が入っていれば「有」）。ただし保存後は人の入力を尊重する */
  v.medExists  = bfStr(r.medExists)  || (derive && bfStr(r.medsRegular) ? '有' : '');
  v.medContent = bfStr(r.medContent);
  v.commLevel  = bfStr(r.commLevel);            /* 自由文からは推定しない */
  v.dementia   = bfNormRank(r.dementia);        /* 既存キーをそのまま使う（自立度） */
  v.dementiaKnown  = BF_DEMENTIA_RANKS.indexOf(v.dementia) > 0;
  v.dementiaExists = bfStr(r.dementiaExists) || (derive && (v.dementia||bfStr(r.dementiaType)) ? '有' : '');
  v.bedriddenRank      = bfStr(r.bedriddenRank);
  v.shortMemory        = bfStr(r.shortMemory);
  v.decisionAbility    = bfStr(r.decisionAbility);
  v.communicateAbility = bfStr(r.communicateAbility);
  /* ★睡眠薬の【薬剤名】は night の中に入れない。night は現場タブレットの安全情報に
       含める（夜勤の判断に要る）が、getSection はオブジェクトを丸ごと返すため、
       中に薬剤名を置くと現場端末へ実処方が渡ってしまう（安全情報は「服薬の薬剤名は含めない」契約）。
       トップレベルの別キーにして、SAFE_FIELDS に入れないことで確実に止める。 */
  v.nightSleepMed = bfStr(r.nightSleepMed);
  v.formNote    = bfStr(r.formNote);
  v.infoConsent = !!r.infoConsent;
  return v;
}
/* ── 描画部品（画面＝印刷面で共用。マスタ側と同じ見た目にする） ──
   ★□は固定寸法なので、未チェック時は✓を【出さない】。透明の✓を置くと、画面読み上げと
     コピー＆ペーストで全項目が「✓」になり、チェック済みと区別できなくなる。 */
function bfCk(on,label){
  return '<span class="bfck'+(on?' on':'')+'" role="img" aria-label="'+esc(label)+(on?'（該当）':'（該当なし）')+'">'+
         '<i aria-hidden="true">'+(on?'✓':'')+'</i>'+esc(label)+'</span>';
}
/* 4段階のセルを1行ぶん。選ばれていない段階も枠だけ出す（様式と同じ見え方にする） */
function bfLevelCells(cur){
  return BF_LEVELS.map(function(p){
    return '<td class="bfc">'+(cur===p[0]?'<i class="bfmark">✓</i>':'')+'</td>';
  }).join('');
}
function bfChkList(defs,obj){
  obj=bfObj(obj);
  return defs.map(function(p){ return bfCk(!!obj[p[0]], p[1]); }).join('');
}
/* 補足の自由文（様式の「（　　）」に相当）。空なら1文字も出さない＝行の高さを増やさない */
function bfNote(o){
  var n=bfStr(bfObj(o).note);
  return n ? '<span style="margin-left:2px;font-size:0.875rem">（'+esc(n)+'）</span>' : '';
}
/* 義歯は既存キー denture（無/有/部分義歯/総義歯）をそのまま使う。新しいキーを増やさない */
function bfDenture(v){
  var t=bfStr(v), has=(t!=='' && t!=='無');
  return '<span style="font-size:0.875rem;margin-right:6px">義歯:</span>'+bfCk(has,'有')+bfCk(t==='無','無')+
         ((t==='部分義歯'||t==='総義歯') ? '<span style="font-size:0.875rem">（'+esc(t)+'）</span>' : '');
}

/* ── 様式の表を組み立てる（事務所ビューと現場ビューで共用） ──
   マスタ側は1つの大表だが、本ファイルはカテゴリタブに分かれるため
   「4段階の列を持つ表（ADL・服薬）」と「持たない表（認知・意思疎通）」の2つに分ける。
   行の中身・並びはマスタ側と同じにしてあるので、紙の見え方は原本に揃う。 */
function bfTable(head,subHead,rows){
  return '<table class="bfadl"><thead><tr><th class="bfrow">'+esc(head)+'</th>'+
    BF_LEVELS.map(function(p){return '<th>'+esc(p[1])+'</th>'}).join('')+
    '<th>'+esc(subHead||'')+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
/* ※ 4段階の列を持たない表（bfPlainTable）は 2026-08-15 に廃止した。
   認知・意思疎通の行を入居者マスタと同じくADLの大表へ集約したため、呼び出しが無くなった。 */
/* 4段階の列を持つ表に混ぜる行は colspan=5（自立〜全介助＋補足）で1セルにする。
   持たない表では colspan を付けない（付けると罫線が1列ぶん伸びる） */
function bfWideCell(span){ return '<td class="bfsub"'+(span?' colspan="5"':'')+'>'; }
/* ADL 5行（移動・口腔清潔・食事・入浴・排泄）。補足は様式の「（　　）」に相当する部分 */
function bfAdlRows(r,bf){
  var mealTxt=[bfStr(r.mealStaple)?('主食:'+bfStr(r.mealStaple)):'',
               bfStr(r.mealSide)?('副食:'+bfStr(r.mealSide)):'',
               bfStr(r.mealForm),
               (bfStr(r.thickener)&&bfStr(r.thickener)!=='なし')?('とろみ'+bfStr(r.thickener)):''

  var sub={

function renderHlBand(r){

     現場ロール（安全項目のみ）でも見えるよう SAFE_FIELDS に hospitalized を含めている。
     受信値は !!v で正規化する（文字列 'true' 等が来ても真偽で扱う）。 */
  /* ★data-nop-of は「この値がどの欄から来たか」。その欄を『印刷しない』にした時、
     ここに再掲されたぶんも一緒に紙から外すために要る（伏せ漏れの防止・2026-08-17）。
     ★この帯は #viewBox の【外】にあるので、applyPrintHide を別途この帯にも掛けること
       （掛け忘れると、医療情報を伏せてもアレルギー・感染症・医療処置が紙に残る）。
     入院中だけは欄に属さない状態表示なので付けない＝伏せ指定では消えない。 */
  if(!!r.hospitalized)hl.push('<span class="hlchip hl-warn">🏥 入院中</span>');
  if(r.preferredName)hl.push('<span class="hlchip hl-info" data-nop-of="mind">🙂 呼称: '+esc(r.preferredName)+'</span>');
  if(r.allergy)hl.push('<span class="hlchip hl-danger" data-nop-of="medical">⚠ アレルギー: '+esc(r.allergy)+'</span>');
  if(r.infections)hl.push('<span class="hlchip hl-danger" data-nop-of="medical">⚠ 感染症: '+esc(r.infections)+'</span>');
  if(r.medicalCare)hl.push('<span class="hlchip hl-warn" data-nop-of="medical">＋ 医療処置: '+esc(r.medicalCare)+'</span>');
  if(r.mealForm||r.thickener)hl.push('<span class="hlchip hl-info" data-nop-of="meal">🍚 食事: '+esc([r.mealForm,r.thickener?('とろみ'+r.thickener):''].filter(Boolean).join(' / '))+'</span>');
  if(r.careHints)hl.push('<span class="hlchip hl-warn" data-nop-of="mind">💡 対応のコツあり</span>');
  $('hlBand').innerHTML=hl.length?'<div class="hlband" role="group" aria-label="安全上の注意">'+hl.join('')+'</div>':'';
}

/* ═══════════ フェイスシート描画 ═══════════ */
/* ★以下は resident-master.html からの【逐語コピー】。1文字も変えないこと（機械照合あり:
   gas/tests/printhide_test.js）。食い違うと、同じ方の詳細画面とフェイスシートで別の
   デイ利用日が出る。関数名の a4 接頭辞は入居者マスタのA4様式で作ったことに由来する
   （このファイルにA4様式は無いが、逐語同一を保つため名前は変えない）。 */
/* ═════════ デイ利用（週間計画 care_schedule_v2 の読み取り専用参照）2026-08-19 指示 ═════════
   A4様式の右上に「月〜土 × 利用時間帯」を出すため、入居者マスタが【統合GAS】
   （週間計画・ワースケ・シフト共通のGAS）の読み手として新しく加わる。
   ★書き込みは一切しない。localStorage にも書かない（su_sync_common は読むだけ）。
     データ契約は .claude/rules/data-contracts.md §2 に追記済み。
   ★通所（デイ）の予定の正本は care_schedule_v2 のみ（§5・§6-⑧）。マスタ側の dayUse は
     移行時の旧スプレッドシート由来の手書き値で、実測で現在値と食い違う。ここでは使わない。
   ★取得できない時は【空欄のまま刷る】。古い値で埋めない。空欄になったことは画面に出して知らせる。 */
var A4_DOW_JA=['月','火','水','木','金','土'];       // dayOfWeek 0..5（週間計画・せせらぎと同じ並び）
var A4_DAY_TTL=120000;                              // 取得結果を使い回す時間（連続印刷を速くするため）
var A4_DAY_FAIL_TTL=30000;                          // 失敗を覚えておく時間（押すたびに待たせない）
var a4DayMap=null;                                  // {at, byMid, byName, dupMid, dupName} ／ null=未取得
var a4DayPromise=null;                              // 取得中の重複起動を防ぐ
var a4DayFailAt=0, a4DayFailMsg='';                 // 直近の失敗（短時間だけ覚える）
function a4NmKey(s){ return String(s==null?'':s).replace(/\s+/g,''); }
/* 統合GASの接続先。せせらぎ・全支援俯瞰と同じ解決順（su_sync_common → ws_settings）。
   ★読む側でもURLの形を確かめる（せせらぎ等には無い上乗せ）。ワースケ・シフトが【書く時】に
     使っている門番と同じ正規表現。この関数は接続先へ合言葉を送るので、localStorage が壊れた・
     別の値が入った時に見ず知らずの URL へ合言葉を渡さないため（所有アプリの門番を迂回しない）。 */
var A4_GAS_RE=/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/;
function a4SyncTarget(){
  try{ var c=JSON.parse(localStorage.getItem('su_sync_common')||'{}');
       if(c&&A4_GAS_RE.test(String(c.endpoint||'').trim()))
         return {endpoint:String(c.endpoint).trim(), token:String(c.token||'').trim()}; }catch(e){}
  try{ var w=JSON.parse(localStorage.getItem('ws_settings')||'{}');
       if(w&&A4_GAS_RE.test(String(w.endpoint||'').trim()))
         return {endpoint:String(w.endpoint).trim(), token:String(w.token||'').trim()}; }catch(e){}
  return {endpoint:'', token:''};
}
/* 「09:00」→「9」／「13:30」→「13.5」。★端数は嘘をつかず時刻のまま出す（例 9:10）。
   .25/.5/.75 以外を無理に小数へ丸めると、紙の上で実際と違う終了時刻になる。
   ★時・分とも範囲を見る。壊れた値（'30:00' 等）をそのまま紙に出さない唯一の関所。 */
function a4HM(t){
  var p=String(t==null?'':t).split(':');
  if(p.length<2)return'';
  var h=parseInt(p[0],10), m=parseInt(p[1],10);
  if(!isFinite(h)||!isFinite(m)||h<0||h>23||m<0||m>59)return'';
  if(m===0)return String(h);
  if(m===15)return h+'.25';
  if(m===30)return h+'.5';
  if(m===45)return h+'.75';
  return h+':'+(m<10?'0'+m:m);
}
/* 週間計画のDBから「その方の月〜土の通所時間帯」を引ける形に畳む。氏名は突合にのみ使う。
   ★継承キー（toString 等）に当たらないよう素のオブジェクトにしない。 */
function a4BuildDayMap(db){
  var out={at:Date.now(), byMid:Object.create(null), byName:Object.create(null),
           dupMid:Object.create(null), dupName:Object.create(null)};
  var res=(db&&Array.isArray(db.residents))?db.residents:[];
  res.forEach(function(r){
    if(!r)return;
    var days=['','','','','',''], any=false;
    (Array.isArray(r.events)?r.events:[]).forEach(function(ev){
      if(!ev||ev.serviceType!=='daycare')return;
      var d=Number(ev.dayOfWeek);
      if(!(d>=0&&d<6))return;                       // 日曜（6）は様式に欄が無いので出さない
      var a=a4HM(ev.startTime), b=a4HM(ev.endTime);
      if(!a||!b)return;
      /* 同じ曜日に複数の通所予定がある方は【両方出す】。1枠しか持たない形にして後勝ちで
         落とすと、紙だけが実際より少ない利用日数に見える（せせらぎは件数を数えて警告している） */
      var lab=a+'-'+b;
      days[d]=days[d]?(days[d]+'／'+lab):lab;
      any=true;
    });
    if(!any)return;
    var mid=(r.masterId==null||r.masterId==='')?null:String(r.masterId);
    var rec={name:String(r.name||''), mid:mid, days:days};
    /* ★同じ利用者Noの行が2つある時は【黙って後勝ちにしない】。旧表記の重複行は
       実在しうる（data-contracts §6-⑧）。どちらが正か分からないので「未確認」に倒す */
    if(mid){ if(out.byMid[mid])out.dupMid[mid]=true; else out.byMid[mid]=rec; }
    var nk=a4NmKey(r.name);
    if(nk){ if(out.byName[nk])out.dupName[nk]=true; else out.byName[nk]=rec; }
  });
  return out;
}
/* 取得（必要な時だけ・失敗しても投げない）。返すのは画面に出す注意文（不要なら空文字）。
   ★待ち時間は 25秒＝このアプリの apiGet と同じ。統合GAS も書き込みで LockService を待つので、
     短くすると朝の混雑時に必ず切れて「未確認」の紙になる（2026-08-18 に入居者マスタ側で直した件と同型）。 */
function a4EnsureDayMap(){
  /* ★現場端末では取りに行かない・持っているものも使わない。全利用者の氏名を含む一覧を
     現場のタブレットへ降ろさないため（安全情報に載せていない項目と同じ扱い）。 */
  if(getDeviceRole()==='field')return Promise.resolve('現場端末ではデイ利用日を表示しません');
  var now=Date.now(), age;
  if(a4DayMap){ age=now-a4DayMap.at; if(age>=0&&age<A4_DAY_TTL)return Promise.resolve(''); }
  if(a4DayPromise)return a4DayPromise;
  /* 直近に失敗したばかりなら押すたびに25秒待たせない（現場を止めない）。覚えるのは30秒だけ＝
     統合GASが復旧すれば自動的に取りに行く */
  if(a4DayFailAt){ age=now-a4DayFailAt; if(age>=0&&age<A4_DAY_FAIL_TTL)return Promise.resolve(a4DayFailMsg); }
  var t=a4SyncTarget();
  if(!t.endpoint)return Promise.resolve(a4DayFail_('週間計画の接続先が未設定のため、デイ利用欄は「未確認」で印刷します'));
  a4DayPromise=fetchWithTimeout(t.endpoint,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'get', key:'care_schedule_v2', token:t.token})},25000)
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var j=JSON.parse(txt);
      /* ★空の名簿は成功として扱わない。全員ぶん空欄の紙は「誰もデイを使っていない」と読まれる
         （名簿取得の emptyGuarded と同じ作法・multi-device-sync 原則4） */
      if(!j||!j.ok||!j.data||!Array.isArray(j.data.residents)||!j.data.residents.length)
        throw new Error(String((j&&j.error)||'応答が不正です'));
      a4DayMap=a4BuildDayMap(j.data); a4DayFailAt=0; a4DayFailMsg='';
      return '';
    })
    .catch(function(){ return a4DayFail_('週間計画を取得できなかったため、デイ利用欄は「未確認」で印刷します'); })
    .then(function(msg){ a4DayPromise=null; return msg; });
  return a4DayPromise;
}
function a4DayFail_(msg){ a4DayFailAt=Date.now(); a4DayFailMsg=msg; return msg; }
/* その方の月〜土を返す。★戻り値は必ず3値の state を持つ:
     'ok'      … 通所予定が引けた（days に入る）
     'none'    … 週間計画は取れていて、その方に通所予定が無い＝【本当に利用なし】
     'unknown' … 確かめられなかった（未取得／氏名が食い違う／絞り込めない／重複行）
   ★'none' と 'unknown' を必ず分ける。どちらも空欄で刷ると、週3回通っている方の紙が
     「デイ利用なし」と読まれる。この様式は救急搬送先・処方と同じ紙で外部へ渡すので、
     printHide の「伏せたセルは空欄にせず、セルごと外す（空欄は誤った安心に変わる）」と同じ考え方。
   ★利用者Noで引いた後も氏名を突き合わせる（data-contracts §6-⑨ の不変条件2）。 */
function a4DaysFor(r){
  var UNK={state:'unknown', days:null};
  if(!a4DayMap||!r)return UNK;
  var nk=a4NmKey(r.name);
  if(r.id!=null&&r.id!==''){
    var key=String(r.id);
    if(a4DayMap.dupMid[key])return UNK;             // 同じ利用者Noの行が2つ＝どちらか分からない
    var rec=a4DayMap.byMid[key];
    if(rec)return (nk&&a4NmKey(rec.name)===nk)?{state:'ok', days:rec.days}:UNK;
  }
  if(!nk)return UNK;                                 // 氏名が無ければ確かめようがない
  if(a4DayMap.dupName[nk])return UNK;                // 同姓同名は引かない
  var byNm=a4DayMap.byName[nk];
  /* ★利用者Noを持つ記録は氏名では拾わない。その記録は【別の方】に束縛済みで、拾うと
     利用者Noの違う方の紙に他人の通所日が載る（§6-⑨ の「食い違いが確定した」状態）。 */
  if(byNm)return (byNm.mid==null)?{state:'ok', days:byNm.days}:UNK;
  return {state:'none', days:null};                  // 週間計画は取れていて、通所予定が無い方
}
/* ═══ デイ利用日の表示（詳細画面・フェイスシート・それぞれの印刷で共用）═══
   2026-08-19 の指示で【3枚の紙をすべて週間計画に揃えた】。入居者マスタの dayUse
   （移行時の旧スプレッドシート由来の手書き値）はここでは使わない。
   ★A4様式と同じ3値。「利用なし（空欄）」と「確かめられなかった（未確認）」を必ず区別する。
     空欄で出すと『デイを使っていない方』と読まれるため。
   ★この関数と patchDayUse は resident-master.html と facesheet.html で【逐語同一】にすること。
     食い違うと、同じ方の詳細画面とフェイスシートで別の利用日が出る。 */
function dayUseHtml(r){
  /* まだ取りに行っている最中。終わり次第 patchDayUse が差し替える */
  if(!a4DayMap&&!a4DayFailAt)return '<span class="du-note">取得中…</span>';
  var info=a4DaysFor(r);
  if(info.state==='unknown')
    return '<span class="du-unk">未確認</span><span class="du-note">週間計画を取得できませんでした</span>';
  if(!info.days)return '';
  return A4_DOW_JA.map(function(lb,i){
    return info.days[i]?('<span>'+esc(lb)+' <b>'+esc(info.days[i])+'</b></span>'):'';
  }).filter(Boolean).join('');
}
/* 取得が終わった後に画面のデイ利用日を差し替える。
   ★フェイスシートは同じ欄を【カテゴリタブと「全体」タブの2箇所】に出すので、必ず全部を書き換える
     （片方だけだと、そのタブから印刷した時だけ古い表示が載る）。
   ★「いま画面に出ている方」と一致するかは呼び出し側で確かめる（別人の値を出さない）。 */
function patchDayUse(r){
  if(!r)return;
  var els=document.querySelectorAll('.du-cell');
  if(!els.length)return;
  var html=dayUseHtml(r)||'　';
  Array.prototype.forEach.call(els,function(e){ e.innerHTML=html; });
}
/* 印刷の直前に、デイ利用日が「取得中…」のまま紙に載るのを防ぐ。取得を待って画面を
   差し替えてから刷る。★取れなくても必ず刷る（欄が「未確認」になるだけ）。
   ★連打で印刷ダイアログが2枚開かないようにする。
   ★「いま画面に出ている方」は呼び出し側から渡す（変数名がアプリごとに違うため）。 */
var duPrinting=false;
function printWithDayUse(rec,doPrint){
  if(duPrinting)return;
  duPrinting=true;
  if(!a4DayMap&&!a4DayFailAt)toast('デイ利用（週間計画）を取得しています…');
  a4EnsureDayMap().then(function(){
    duPrinting=false;
    if(rec)patchDayUse(rec);
    doPrint();
  });
}
function renderFaceSheet(r){
  // 二重防御: 現場端末では SAFE_FIELDS 以外を描画対象から落とす。
  // サーバ(getSection facesheet_safe)が唯一の関門だが、GASが旧バージョンのまま等で
  // 想定外の項目が返っても現場画面には出さない。3箇所契約を「動作」で担保する。
  if(isField()){
    var s={id:r.id};
    SAFE_FIELDS.forEach(function(k){if(r[k]!==undefined)s[k]=r[k]});
    r=s;
  }
  $('vName').textContent=(r.name||'')+(r.room?('（'+r.room+'）'):'');
  renderHlBand(r);
  if(isField()){renderFieldView(r);return}
  renderOfficeView(r);
}

/* ジェノグラム（同一オリジン共有・読み取り専用） */
/* 家族構成図のサムネイルを探す。masterId → 氏名 の順に見る（2026-08-12・入居者マスタと同じ実装）。
   ★氏名で探す経路が無いと、ジェノグラムアプリを直接開いて作った図が一切出ない。
   ★正規化は空白除去のみ。同姓同名は同じ図を指す。

   ★2026-08-13（実害）: masterId のキーに入っている図は、記録側の氏名(rec.name)と必ず突き合わせる。
     ジェノグラムアプリを ?resident=<この方> 付きで開いたまま【別の方の文書】を保存すると、
     その masterId のキーに別人の図が入り、この方の欄に他人の家族構成図が出ていた。
     ★入居者マスタと【逐語同一】にすること（gas/tests/genogram_key_test.js が文字列で照合する）。 */
function getGenogram(id,name){
  try{
    var raw=localStorage.getItem(SU_GENO_KEY); if(!raw)return null;
    var m=JSON.parse(raw); if(!m||typeof m!=='object')return null;
    var nm=String(name==null?'':name).replace(/\s+/g,'');
    var g=m[String(id)];
    if(g&&g.image){
      var rn=String(g.name==null?'':g.name).replace(/\s+/g,'');
      if(!nm||!rn||rn!==nm) g=null;   // 誰の図か確かめられない／別人の図 → 使わない
    }
    if(!(g&&g.image)&&nm) g=m['name:'+nm];
    return (g&&typeof g.image==='string'&&g.image)?g.image:null;
  }catch(e){return null}
}

/* 「🖨️ 全体を印刷」＝全体タブ1枚だけを刷る（2026-08-15 指示）。
   ★押した時だけ body へ印を付け、印刷が終わったら必ず外す。付けっぱなしにすると
     次に従来の「印刷」を押した時まで全体1枚しか出ず、既存の紙を壊す。
   ★外す経路は3つ（afterprint／印刷メディア終了／保険のタイマー）。1つでも動けば戻る。 */
function fsPrintAll(){
  var off=function(){document.body.classList.remove('fs-all-on')};
  document.body.classList.add('fs-all-on');
  try{ window.addEventListener('afterprint',off,{once:true}); }catch(e){ window.addEventListener('afterprint',off); }
  try{
    if(window.matchMedia){
      var mq=window.matchMedia('print');
      var h=function(ev){ if(!ev.matches){ off();
        if(mq.removeEventListener)mq.removeEventListener('change',h); else if(mq.removeListener)mq.removeListener(h); } };
      if(mq.addEventListener)mq.addEventListener('change',h); else if(mq.addListener)mq.addListener(h);
    }
  }catch(e){}
  setTimeout(off,60000);   /* 保険: afterprint が来ないブラウザでも必ず戻す */
  window.print();
}

function openSync(){

  $('mSync').classList.add('on');

/* ★接続テストの「世代」。テストと保存が同じ入力欄の同じ値を使うため、
   CFG の値比較では「テスト中に保存されたか」を判別できない。保存・テストのたびに
   進めるカウンタで判定する（care-schedule csPreGen_ と同型）。 */
var cfgTestGen_=0;
function saveSync(){
  cfgTestGen_++;   /* 飛行中のテストの巻き戻しを無効化する（保存値が正） */
  CFG.url=($('cfgUrl').value||'').trim();CFG.token=($('cfgToken').value||'').trim();
  /* ★このキーは入居者マスタと共用。丸ごと書き換えると、マスタ側が入れた項目
     （訪問診療URL vmaUrl 等）を黙って消してしまう。既存値を読み、自分が扱う
     url/token だけを差し替えて書き戻す（.claude/rules/data-contracts.md §1-2）。 */
  /* ★保存できたかは書き戻して読み直すまで分からない（プライベートモード・容量超過では
     setItem が例外にならず黙って残らない環境がある）。成功トーストだけ出して実際は
     保存されていない、という silent fail を作らないため一致を検証する
     （connection-settings.html writeSys と同方式）。 */
  var saved=false;
  try{
    var _c={};
    try{var _s=localStorage.getItem(CFG_KEY);if(_s)_c=JSON.parse(_s)}catch(e){_c={}}
    if(!_c||typeof _c!=='object'||Object.prototype.toString.call(_c)!=='[object Object]')_c={};
    _c.url=CFG.url;_c.token=CFG.token;
    localStorage.setItem(CFG_KEY,JSON.stringify(_c));
    var _b={};
    try{var _r=localStorage.getItem(CFG_KEY);if(_r)_b=JSON.parse(_r)}catch(e){_b={}}
    if(!_b||typeof _b!=='object')_b={};
    saved=(String(_b.url==null?'':_b.url)===CFG.url && String(_b.token==null?'':_b.token)===CFG.token);
  }catch(e){saved=false}
  setDeviceRole($('cfgDeviceRole').value==='field'?'field':'office');
  applyRoleBadge();closeSync();boot();
  toast(saved?'✅ 保存しました':'⚠️ 保存できませんでした（プライベートモード等）');
}
function testSync(){
  /* ★テストのために CFG を書き換えるが、保存せず閉じた場合に未保存のURLを
     そのセッション中ずっと使い続けてしまう。テスト前の値を退避し、成否によらず戻す
     （resident-master.html testSync と同パターン）。 */
  var myGen=++cfgTestGen_;
  /* 戻り先は「いまの CFG」ではなく保存済みの永続値から取る。CFG を写すと、テスト飛行中に
     もう一度テストを押した時に前回の"未保存の試行値"が戻り先になり、この関数が消そうとした
     「未保存URLをセッション中使い続ける」状態がそのまま再発する。 */
  var saved=readSavedCfg_();
  var tried={url:($('cfgUrl').value||'').trim(),token:($('cfgToken').value||'').trim()};
  CFG.url=tried.url;CFG.token=tried.token;
  if(!CFG.url){CFG.url=saved.url;CFG.token=saved.token;toast('URLを入力してください');return}
  setSync('テスト中…');
  apiGet({action:'ping'}).then(function(){setSync('接続OK','ok');toast('✅ 接続できました')})
    .catch(function(e){setSync('接続失敗','err');toast('⚠️ '+e.message)})
    /* テスト中に保存・再テストされた場合（世代が進む）は巻き戻さない */
    .then(function(){if(myGen===cfgTestGen_){CFG.url=saved.url;CFG.token=saved.token}});
}

/* ═══════════ 起動 ═══════════ */
/* ── 入居者単位リンクの受け口（入居者マスタから ?masterId=&name= で来た時） ──
   ★取り違え防止（dev-principles 原則11）: 誰を開いたのかを画面上部に必ず出し、
     一覧へ戻る導線を添える。URLの氏名は「本人確認の表示」にだけ使い、
     データの取得・保存には使わない（正本はサーバから引く masterId のレコード）。
   ★不正・未知の値は無視して通常どおり一覧を出す（壊れたURLで起動不能にしない）。 */
function readMasterIdParam(){
  var p=null; try{p=new URLSearchParams(location.search)}catch(e){return null}   // 旧ブラウザは機能無効
  if(!p)return null;
  if(!p.get('masterId'))return null;                        // 指定なし＝通常起動
  var id=String(p.get('masterId')).trim();
  if(!/^[0-9A-Za-z_-]{1,32}$/.test(id)){                    // 想定外の形式は開かない
    try{toast('⚠️ 指定された入居者を開けませんでした（一覧から選んでください）')}catch(e){}
    return null;
  }
  return {id:id};
}
/* 本人確認バー。★氏名はURLから取らず、サーバから取得した正本の氏名だけを出す。
   未検証の氏名を「本人確認」として見せると、取り違えの根拠にされてしまうため。 */
var fromMasterActive=false;
var openingFromMaster=false;   /* boot() がマスタ由来で開いている最中だけ true */
function setFromMasterBar(state,name){
  var bar=$('fromMaster'); if(!bar)return;
  if(state==='off'){ bar.style.display='none'; bar.innerHTML=''; fromMasterActive=false; return; }
  fromMasterActive=true;
  var msg = state==='ok'   ? '入居者マスタから開いています：<b>'+esc(name||'')+'</b>'
          : state==='fail' ? '入居者マスタから開こうとしましたが、<b>取得できませんでした</b>'
          :                  '入居者マスタから開いています：読み込み中…';
  bar.innerHTML='<span>'+msg+'</span><button type="button" id="fromMasterClose">一覧に戻る</button>';
  bar.style.display='flex';
  $('fromMasterClose').addEventListener('click',function(){
    clearMasterIdParam(); setFromMasterBar('off'); curRec=null; showScreen('list');
  });
}
/* 一覧へ戻ったら URL の指定も消す。残すと設定保存など boot() の再実行で勝手に開き直す。 */
function clearMasterIdParam(){
  try{ if(location.search) history.replaceState(null,'',location.pathname); }catch(e){}
}
var _fsRestored=false;   /* 画面復元は起動時の1回だけ（設定保存の再起動で勝手に開き直さない） */
function boot(){
  applyRoleBadge();
  var has=loadCommonRoster();
  paintTabs(); paintBdayBar();
  renderRoster();
  /* ★事務所端末は毎回 getRoster で取り直す（生年月日・身長・入院中のタグは共有名簿に無いため）。
     現場端末は共有名簿を優先し、それが空の時だけ getRoster を呼ぶ（一覧が真っ白になるのを防ぐ）。
     ★現場端末に余分な項目が届いた場合でも、一覧タグ側（rcardHtml）で落とすので画面には出ない。 */
  if(CFG.url&&!isField())refreshRosterFromGas();
  else if(!has&&CFG.url)refreshRosterFromGas();
  else if(roster.length)setSync('名簿OK','ok');
  else setSync('未接続');
  var from=readMasterIdParam();
  if(from){
    openingFromMaster=true;
    setFromMasterBar('loading');
    openResident(from.id);
    openingFromMaster=false;
    _fsRestored=true;   /* マスタ由来で開いた回は復元しない（指定された方が優先） */
    return;
  }
  /* 再読み込みでも同じ方の画面に留まる（原則11）。次の5つを【全部】満たす時だけ復元する:
     ①マスタ由来の指定が無い ②接続先がある ③現場端末でない ④保存された利用者Noがある
     ⑤いま手元の名簿にその番号が居る。1つでも欠ければ一覧のまま。 */
  if(!_fsRestored){
    _fsRestored=true;
    var op=readOpenId();
    if(op!=null&&CFG.url&&!isField()&&roster.some(function(r){return String(r.masterId)===String(op)})) openResident(op);
  }
}
/* 入居者マスタが別タブで共有名簿を更新したら追随する。
   ★事務所端末は getRoster で取り直す。共有名簿だけを読み直すと、生年月日・身長・入院中の
     タグが一覧から消えてしまう（次に開き直すまで戻らない）。 */
window.addEventListener('storage',function(e){
  if(e.key!==COMMON_KEY)return;
  loadCommonRoster();
  if(!isField()&&CFG.url) refreshRosterFromGas(); else renderRoster();
});
document.addEventListener('DOMContentLoaded',function(){
  $('q').addEventListener('input',renderRoster);
  /* ビュー切替。矢印キーでも移動できるようにする（role="tab" の期待に合わせる） */
  var vtabs=$('viewTabs').querySelectorAll('.vtab');
  Array.prototype.forEach.call(vtabs,function(b,i){
    b.addEventListener('click',function(){setView(this.getAttribute('data-v'))});
    b.addEventListener('keydown',function(e){
      var n=null;
      if(e.key==='ArrowRight'||e.key==='ArrowDown')n=(i+1)%vtabs.length;
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=(i-1+vtabs.length)%vtabs.length;
      if(n===null)return;
      e.preventDefault(); vtabs[n].focus(); setView(vtabs[n].getAttribute('data-v'));
    });
  });
  /* 誕生日ビューの年度送りと印刷。★年度は端末に保存しない（古い年度のまま刷らせない） */
  $('bdayPrev').addEventListener('click',function(){bdayFY--;paintBdayBar();renderRoster()});
  $('bdayNext').addEventListener('click',function(){bdayFY++;paintBdayBar();renderRoster()});
  $('bdayPrint').addEventListener('click',function(){window.print()});
  Array.prototype.forEach.call($('filterRow').querySelectorAll('.chip'),function(c){
    c.addEventListener('click',function(){
      curFilter=this.getAttribute('data-f');
      try{localStorage.setItem(FILTER_KEY,curFilter)}catch(e){}   /* 次回も同じ絞り込みで開く */
      Array.prototype.forEach.call($('filterRow').querySelectorAll('.chip'),function(x){x.classList.toggle('on',x===c)});
      renderRoster();
    });
  });
  /* 保存済みの絞り込みを点灯に反映（既定は在籍） */
  Array.prototype.forEach.call($('filterRow').querySelectorAll('.chip'),function(x){
    x.classList.toggle('on',x.getAttribute('data-f')===curFilter);
  });
  $('btnMaster').addEventListener('click',function(){window.open('resident-master.html','_blank')});
  $('backBtn').addEventListener('click',function(){curRec=null;showScreen('list')});
  $('printBtn').addEventListener('click',function(){printWithDayUse(curRec,function(){window.print()})});
  $('printAllBtn').addEventListener('click',function(){printWithDayUse(curRec,fsPrintAll)});
  Array.prototype.forEach.call(document.querySelectorAll('.bnav button'),function(b){
    b.addEventListener('click',function(){var sc=this.getAttribute('data-sc');if(sc==='sync')openSync();else showScreen(sc)});
  });
  $('syncClose').addEventListener('click',closeSync);
  $('syncSave').addEventListener('click',saveSync);
  $('syncTest').addEventListener('click',testSync);
  boot();
});
</script>
</body>
</html>
