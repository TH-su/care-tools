<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 拡大縮小を禁止しない（弱視の職員が読めなくなるため。HIG/WCAG準拠） -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 機微情報を含むためキャッシュ無効 -->
<meta http-equiv="Cache-Control" content="no-store">
<meta name="robots" content="noindex,nofollow">
<title>フェイスシート</title>
<style>
/* 配色は「無彩色を基調に、意味のある色だけ使う」方針（HIG:明瞭性/服従性）。
   コンテンツが主役なので、色は①アクセント1色 ②危険(赤) ③注意(琥珀) の3つに限定する。
   文字色は白背景に対しコントラスト比4.5:1以上を満たす値のみ使用（--g5/--g6 を darken 済み）。 */
:root{
  /* --pri 系は入居者マスタと同時に更新（2026-08-14・白文字コントラスト6.39:1）。帳票の見た目を揃える */
  --pri:#0b57d0; --pri-l:#ecf3fe; --pri-d:#0842a0;
  --ok:#1e6b23; --ok-l:#e8f5e9; --ng:#b3261e; --ng-l:#fdecea;
  --warn-bg:#fdf3e3; --warn-tx:#8a5200;
  --g0:#f7f8f9; --g1:#f1f3f4; --g2:#e5e7ea; --g3:#d2d5d9;
  --g5:#6b7075; --g6:#5f6368; --g7:#4b4f52; --g9:#1f2124;
  --r:12px; --sh:0 1px 4px rgba(0,0,0,.10);
  --focus:#0b57d0;
}
/* キーボード操作の現在地を必ず見せる（フォーカスリングを消さない） */
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:6px}
/* 動きの少ない表示を選んでいる人の設定を尊重する */
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  background:var(--g0); color:var(--g9); font-size: 0.9375rem; line-height:1.5; padding-bottom:72px;}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit; font-size: 0.9375rem}

/* ── ヘッダー ── */
.hdr{position:sticky; top:0; z-index:50; background:var(--pri); color:#fff;
  padding:10px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--sh)}
.hdr h1{font-size: 1.0625rem; margin:0; font-weight:700; flex:1}
/* アプリ間ジャンプ（care-schedule / daycare-roster と同じ見た目。共通部品が無いため各ファイルに持つ） */
.hdr-btn{min-height:40px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35);
  color:#fff; border-radius:6px; padding:6px 12px; font-size: 0.8125rem; cursor:pointer; white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.28)}
.hdr-btn:focus-visible{outline:2px solid #fff; outline-offset:1px}
/* 入居者マスタから開いた時の本人確認バー（誰を開いているかを常に見せる＝取り違え防止）。
   ヘッダ直下に貼り付いてスクロールしても消えない。色は既定の警告トークンを使う
   （白背景でコントラスト比4.5:1以上・本ファイル冒頭の配色方針に従う）。 */
.frombar{position:sticky; top:48px; z-index:49;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 14px;
  background:var(--warn-bg); border-bottom:1px solid var(--warn-tx); font-size: 0.8125rem; color:var(--warn-tx)}
.frombar b{font-size: 0.9375rem}
.frombar button{min-height:44px; padding:6px 14px; border:1px solid var(--warn-tx); border-radius:6px;
  background:#fff; color:var(--warn-tx); font-size: 0.8125rem; cursor:pointer}
.frombar button:focus-visible{outline:2px solid var(--warn-tx); outline-offset:1px}
@media print{.frombar{display:none !important}}
/* 退去日・ご逝去日・退去先・退去後状況は紙には出さない（2026-08-09 管理者指示）。
   画面では従来どおり表示する。.cell は inline の flex 指定を持つため !important が要る */
@media print{.noprint-cell{display:none !important}}
.hdr .role{font-size: 0.6875rem; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:14px; white-space:nowrap}
.hdr .role.field{background:rgba(230,81,0,.92)}
.hdr .sync{font-size: 0.75rem; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:14px; white-space:nowrap}
.hdr .sync.ok{background:rgba(46,125,50,.9)} .hdr .sync.err{background:rgba(198,40,40,.95)}

/* ── 画面切替 ── */
.scr{display:none; padding:14px; max-width:980px; margin:0 auto}
.scr.on{display:block}

/* ── カード ── */
.cd{background:#fff; border-radius:var(--r); box-shadow:var(--sh); padding:14px; margin-bottom:12px}

/* ── 一覧 ── */
.search-bar{display:flex; gap:8px; margin-bottom:12px; align-items:center}
.search-bar input{flex:1; padding:10px 12px; border:1px solid var(--g3); border-radius:10px}
.filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
/* タップ領域は最小44px（誤タップ防止・HIG） */
.chip{min-height:44px; padding:0 16px; border:1px solid var(--g3); border-radius:22px; background:#fff; font-size: 0.875rem; color:var(--g7)}
.chip.on{background:var(--pri); color:#fff; border-color:var(--pri)}
.rlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px}
.rcard{background:#fff; border:1px solid var(--g2); border-radius:10px; padding:12px; cursor:pointer; transition:.12s}
.rcard:hover{box-shadow:var(--sh); border-color:var(--pri)}
.rcard .nm{font-size: 1rem; font-weight:700}
.rcard .kn{font-size: 0.6875rem; color:var(--g6)}
.rcard .meta{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap}
.tag{font-size: 0.6875rem; padding:2px 8px; border-radius:10px; background:var(--g1); color:var(--g7)}
.tag.care{background:var(--pri-l); color:var(--pri-d)} .tag.room{background:#ede7f6; color:#5e35b1}
.tag.out{background:var(--ng-l); color:var(--ng)}
.visually-hidden{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.empty{text-align:center; color:var(--g5); padding:40px 10px}
.loading{text-align:center; color:var(--g5); padding:30px}

/* ── 安全ハイライト帯 ── */
/* 安全ハイライト: 色は「危険・注意・情報」の3段階のみ。
   色だけに意味を持たせず、必ずアイコン＋文言を併記する（色覚特性配慮・HIG） */
.hlband{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.hlchip{border-radius:8px; padding:6px 12px 6px 10px; font-weight:700; font-size: 0.875rem;
  background:#fff; color:var(--g9); border:1px solid var(--g2); border-left:4px solid var(--g3)}
.hl-danger{background:var(--ng-l); border-color:#f2c9c5; border-left-color:var(--ng); color:var(--ng)}
.hl-warn{background:var(--warn-bg); border-color:#ecdcbe; border-left-color:var(--warn-tx); color:var(--warn-tx)}
.hl-info{background:#fff; border-left-color:var(--pri); color:var(--g9)}

/* ── タブ ── */
.ftabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.ftab{padding:0 16px; border:1px solid var(--g3); border-radius:22px; background:#fff; font-size: 0.875rem; color:var(--g7); min-height:44px}
.ftab.on{background:var(--pri); color:#fff; border-color:var(--pri)}
.fpanel{display:none}
.fpanel.on{display:block}

/* ── フェイスシート（印刷レイアウト） ── */
.sheet{background:#fff; border:2px solid var(--g9); border-radius:6px; overflow:hidden; margin-bottom:12px}
.sheet .sec{display:flex; border-top:1px solid var(--g9)}
.sheet .sec:first-child{border-top:none}
/* 2026-08-14 コンパクト化（入居者マスタと同時・同値）。セルは上下も詰める */
.sheet .sec-lbl{writing-mode:vertical-rl; text-orientation:upright; background:var(--g1);
  border-right:1px solid var(--g9); padding:6px 3px; font-weight:700; font-size: 0.8125rem; min-width:30px;
  display:flex; align-items:center; justify-content:center; letter-spacing:1.5px}
.sheet .sec-body{flex:1; min-width:0}
.cell{border-right:1px solid var(--g3); border-bottom:1px solid var(--g3); padding:3px 7px; min-width:0}
.cell:last-child{border-right:none}
.cell .lab{font-size: 0.6875rem; color:var(--g6); display:block; margin-bottom:0; line-height:1.25}
.cell .val{font-size: 0.9375rem; word-break:break-word; white-space:pre-wrap; line-height:1.45}
.cell .val.big{font-size: 1rem; font-weight:700}
/* 紙だけさらに一段詰める（画面の文字下限15pxは守りつつ、頁数を減らす） */
@media print{ .cell .val{font-size:0.875rem} }
.cell .sub{display:block; font-size: 0.625rem; color:var(--g6); margin-top:1px}  /* 値の出所・測定日 */
/* 生年月日の和暦。値の後ろに小さく添えるだけで幅を奪わない（セルを広げると隣が折り返して紙が伸びる） */
.bd-w{font-size:0.6875rem; color:var(--g6); margin-left:2px; white-space:nowrap}
@media print{ .bd-w{color:#333} }
.row-cells{display:flex; flex-wrap:wrap}
.row-cells .cell{flex:1}
.fulltext{white-space:pre-wrap; word-break:break-word; font-size: 0.875rem; line-height:1.5}
/* 薬剤情報（定期）の2列表示（2026-08-11 追加）。入居者マスタと同じ見た目に揃える。
   ★見出しも値も左揃え。右列は固定幅で、薬剤名が折り返しても効能は1行目に留まる。 */
/* ★右列は固定幅にせず auto にする。固定にすると、その方の効能が「降圧・利尿」のように
     短くても常に幅を取り、左列が狭まって【1列の時は収まっていた薬剤名が折り返す】。
     折り返しは印刷の改ページ位置を動かすので（原則2）、右列は中身の最大幅ちょうどに留める。 */
/* ★左列は max-content。効能列を右端に飛ばさず、薬剤名のすぐ右（＝中央寄り）に置く。
     長い薬剤名がある方では minmax の下限0で縮み、はみ出さない。 */
.meds2{display:grid; grid-template-columns:minmax(0,max-content) auto; column-gap:20px}
.meds2-h{font-size:0.6875rem; color:var(--g6); text-align:left; white-space:nowrap;
  padding-bottom:2px; margin-bottom:2px; border-bottom:1px solid var(--g2)}
.meds2-d,.meds2-e{font-size:0.875rem; line-height:1.6}
.meds2-d{word-break:break-word; white-space:pre-wrap}
.meds2-e{color:var(--g7); text-align:left; align-self:start; white-space:nowrap}
.meds2-na{color:var(--g5)}
@media print{
  .meds2-h{border-bottom-color:#999}
  .meds2-e{color:#000; font-size:0.8125rem}   /* 紙では右列をさらに詰めて左列を広く保つ */
  .meds2-na{color:#666}
}
/* ── 入居者基本情報（外部様式）のチェック表示（2026-08-12 追加） ──
   resident-master.html の同名クラスからの移植（表示部分のみ。編集UIの .bfe* は持たない）。
   画面と印刷で同じ見た目にする。□＋✓で、色だけに意味を持たせない（介護現場要件4）。
   ★□は固定寸法なので、✓を入れても入れなくても幅は動かない（行の折り返し＝改ページ位置が動かない）。 */
.bfck{display:inline-flex; align-items:center; gap:4px; margin-right:12px; white-space:nowrap;
  font-size:0.875rem; line-height:1.5}
.bfck i{width:12px; height:12px; flex:0 0 12px; border:1px solid var(--g7); border-radius:2px;
  display:inline-block; text-align:center; line-height:11px; font-size:11px; font-weight:700;
  font-style:normal; color:var(--g9)}
.bfck.on{font-weight:700}
.bfwrap{display:flex; flex-wrap:wrap; padding:1px 0}
.bfadl{width:100%; border-collapse:collapse; font-size:0.875rem}
.bfadl th,.bfadl td{border:1px solid var(--g3); padding:2px 5px; vertical-align:middle}
.bfadl thead th{background:var(--g1); font-size:0.6875rem; color:var(--g7); font-weight:700; text-align:center}
.bfadl th.bfrow{width:88px; text-align:left; font-weight:700; background:var(--g0)}
.bfadl td.bfc{width:46px; text-align:center}
.bfadl .bfmark{font-style:normal; font-weight:700}
.bfdis{width:100%; border-collapse:collapse; font-size:0.875rem}
.bfdis th,.bfdis td{border:1px solid var(--g3); padding:2px 5px; word-break:break-word}
.bfdis thead th{background:var(--g1); font-size:0.6875rem; color:var(--g7); font-weight:700}
.bfdis .bfno{width:26px; color:var(--g6); text-align:center}
/* 2026-08-15: 既往歴表は「縦3×横2組」＝1行に4列×2（入居者マスタと同値） */
.bfdis .bfonset{width:84px}
.bfdis .bfhosp{width:16%}
.bfdis .bfmid{border-left:2px solid var(--g5)}   /* 左右の組の境目 */
.bflegacy{font-size:0.8125rem; line-height:1.7}
@media print{
  .sec-bflegacy{display:none !important}   /* 移行前の記載は画面だけ（紙の高さを変えない） */
  .bfadl,.bfdis{page-break-inside:avoid}
  .bfck{line-height:1.35; margin-right:10px}
  .bfck i{border-color:#333; color:#000}
  .bfadl th,.bfadl td,.bfdis th,.bfdis td{padding:1px 4px; border-color:#666}
  /* グレーの小さい文字はモノクロ印刷で潰れる（既存 .btbl .bno と同じ扱い） */
  .bfadl thead th,.bfdis thead th,.bfdis .bfno{color:#000}
}
.rhythm{display:flex; flex-wrap:wrap; gap:4px 14px; font-size: 0.875rem}
.rhythm span b{color:var(--pri-d)}
.logline{display:flex; gap:10px; padding:5px 0; border-bottom:1px dotted var(--g3)}
.logline .d{flex-shrink:0; font-weight:700; color:var(--pri-d); min-width:92px}
.logline .t{flex:1; white-space:pre-wrap; word-break:break-word}
.geno-box{min-height:320px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  background:var(--g0); border:1px dashed var(--g3); border-radius:8px; overflow:hidden}
.geno-box img,.geno-img{max-width:100%; max-height:100%; object-fit:contain}

.detail-actions{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center}
.btn{padding:10px 16px; border:none; border-radius:10px; font-size: 0.875rem; font-weight:700; min-height:44px}
.btn-pri{background:var(--pri); color:#fff}
.btn-sec{background:#fff; color:var(--pri); border:1px solid var(--pri)}
.btn-gray{background:var(--g2); color:var(--g7)}
.btn:disabled{opacity:.5}
.vname{font-size: 1.125rem; font-weight:700; margin-left:auto}

/* ── ボトムナビ ── */
.bnav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--g2);
  display:flex; z-index:50; box-shadow:0 -1px 6px rgba(0,0,0,.08)}
.bnav button{flex:1; border:none; background:none; padding:8px 4px; font-size: 0.6875rem; color:var(--g6);
  display:flex; flex-direction:column; align-items:center; gap:2px; min-height:56px; justify-content:center}
.bnav button.on{color:var(--pri)} .bnav button .ic{font-size: 1.25rem}

/* ── トースト・モーダル ── */
#toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--g9); color:#fff; padding:10px 18px; border-radius:22px; font-size: 0.875rem; z-index:200;
  opacity:0; transition:.25s; pointer-events:none; max-width:90%; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.modal{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:150; display:none; align-items:center; justify-content:center; padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff; border-radius:var(--r); max-width:520px; width:100%; max-height:88vh; overflow:auto; padding:18px}
.modal h2{font-size: 1rem; margin:0 0 12px}
.muted{color:var(--g6); font-size: 0.75rem}
.fld{display:flex; flex-direction:column; margin-bottom:10px}
.fld label{font-size: 0.75rem; color:var(--g7); margin-bottom:3px}
.fld input,.fld select{padding:9px 10px; border:1px solid var(--g3); border-radius:8px; width:100%}

/* ── 印刷（自己完結・A4・1人1シート） ── */
@media print{
  body{padding:0; background:#fff}
  .hdr,.bnav,.detail-actions,.ftabs,#toast,.modal{display:none !important}
  .scr{padding:0; max-width:none}
  .scr:not(.on){display:none}
  .fpanel{display:block !important}      /* 全カテゴリを印刷 */
  .sheet{border:2px solid #000; page-break-inside:avoid; margin-bottom:6mm}
  .sheet .sec{border-top:1px solid #000}
  .cell{border-color:#999}
  .geno-box{border:none !important; cursor:default !important}
  .geno-hint{display:none !important}
  /* 家族構成図は紙にも出す。<img> なので「背景のグラフィックを印刷」の設定に左右されない */
  .geno-img{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .hlband{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .hlchip{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  @page{size:A4; margin:10mm}
}
</style>
</head>
<body>

<div class="hdr">
  <h1>📄 フェイスシート</h1>
  <!-- アプリ間ジャンプ（daycare-roster.html と同形式）。h1 が flex:1 で伸びるため
       右側のバッジ群の【手前に足す】と既存の表示位置が動かない。.hdr は @media print で非表示。 -->
  <button class="hdr-btn" id="btnMaster" aria-label="入居者マスタを新しいタブで開く" title="入居者マスタを開く（入居者情報の源泉）">👤 入居者マスタ</button>
  <span class="role" id="roleBadge">事務所</span>
  <span class="sync" id="syncStatus" role="status" aria-live="polite">未接続</span>
</div>

<!-- 入居者マスタから特定の方を開いた時の本人確認バー（取り違え防止）。
     既定は非表示。?masterId= で来た時だけ boot() が表示する。印刷には出さない。 -->
<div class="frombar" id="fromMaster" role="status" aria-live="polite" style="display:none"></div>

<!-- ════════ 一覧 ════════ -->
<section class="scr on" id="sc-list">
  <div class="search-bar">
    <label for="q" class="visually-hidden">入居者を検索</label>
    <input type="search" id="q" placeholder="氏名・ふりがな・居室で検索" autocomplete="off" aria-label="氏名・ふりがな・居室で検索">
  </div>
  <div class="filter-row" id="filterRow">
    <button class="chip on" data-f="active">在籍</button>
    <button class="chip" data-f="out">退去</button>
    <button class="chip" data-f="all">すべて</button>
  </div>
  <div id="rosterBox"><div class="loading">読み込み中…</div></div>
</section>

<!-- ════════ 詳細（フェイスシート） ════════ -->
<section class="scr" id="sc-view">
  <div class="detail-actions">
    <button class="btn btn-gray" id="backBtn">← 一覧</button>
    <button class="btn btn-sec" id="printBtn">🖨️ 印刷</button>
    <span class="vname" id="vName"></span>
  </div>
  <div id="hlBand"></div>
  <div id="ftabs" class="ftabs"></div>
  <div id="viewBox"><div class="loading">読み込み中…</div></div>
</section>

<!-- ボトムナビ -->
<nav class="bnav">
  <button class="on" data-sc="list"><span class="ic">📋</span>一覧</button>
  <button data-sc="sync"><span class="ic">☁️</span>設定</button>
</nav>

<!-- 設定モーダル -->
<div class="modal" id="mSync">
  <div class="box">
    <h2>☁️ 接続・端末設定</h2>
    <div class="fld">
      <label>この端末の用途</label>
      <select id="cfgDeviceRole">
        <option value="office">事務所PC（全項目を閲覧）</option>
        <option value="field">現場タブレット（安全情報のみ閲覧）</option>
      </select>
    </div>
    <div class="fld">
      <label>GAS Web App URL（入居者マスタと共通）</label>
      <input id="cfgUrl" placeholder="https://script.google.com/macros/s/..../exec">
    </div>
    <div class="fld">
      <label>アクセストークン</label>
      <input id="cfgToken" placeholder="入居者マスタと同じトークン">

function fmtJDate(iso){if(!iso)return'';var p=String(iso).slice(0,10).split('-');if(p.length<3)return iso;return p[0]+'年'+parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日'}
/* 和暦（2026-08-12 追加・入居者マスタと同じ定義）。生年月日を西暦と並べて出すために使う。
   ★ここは閲覧専用なので、和暦から西暦へ直す処理（parseAnyDate）は持たない。入力はマスタ側だけ。 */
var ERAS=[
  {c:'R', name:'令和', y:2019, m:5,  d:1},
  {c:'H', name:'平成', y:1989, m:1,  d:8},
  {c:'S', name:'昭和', y:1926, m:12, d:25},
  {c:'T', name:'大正', y:1912, m:7,  d:30},
  {c:'M', name:'明治', y:1868, m:1,  d:25}
];
function parseIsoDate(iso){
  var s=String(iso==null?'':iso).slice(0,10);
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return null;
  var y=+m[1],mo=+m[2],d=+m[3];
  var t=new Date(y,mo-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d) return null;
  return {y:y,m:mo,d:d};
}
function fmtWarekiJp(iso){
  var p=parseIsoDate(iso);
  if(!p) return '';
  var key=p.y*10000+p.m*100+p.d;
  for(var i=0;i<ERAS.length;i++){
    var e=ERAS[i];
    if(key>=e.y*10000+e.m*100+e.d){
      var n=p.y-e.y+1;
      return e.name+(n===1?'元':n)+'年'+p.m+'月'+p.d+'日';
    }
  }
  return '';
}

function calcAge(birthISO){if(!birthISO)return'';var b=new Date(birthISO);if(isNaN(b))return'';var n=new Date();var a=n.getFullYear()-b.getFullYear();var m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a>=0&&a<140?a:''}
function calcBMI(h,w){h=parseFloat(h);w=parseFloat(w);if(!h||!w)return'';var b=w/Math.pow(h/100,2);return isFinite(b)?b.toFixed(1):''}

/* ═══════════ GAS API（読み取り専用・トークン付き） ═══════════ */
function apiGet(params,timeoutMs){
  if(!CFG.url)return Promise.reject(new Error('NO_URL'));
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
  qs+='&token='+encodeURIComponent(CFG.token);
  return fetchWithTimeout(CFG.url+'?'+qs,{method:'GET',redirect:'follow'},timeoutMs||12000).then(parseJson);
}
function fetchWithTimeout(url,opt,ms){
  return new Promise(function(res,rej){
    var ctl=('AbortController'in window)?new AbortController():null;
    if(ctl)opt.signal=ctl.signal;
    var t=setTimeout(function(){if(ctl)ctl.abort();rej(new Error('タイムアウト'))},ms);
    fetch(url,opt).then(function(r){clearTimeout(t);res(r)}).catch(function(e){clearTimeout(t);rej(e)});
  });
}
function parseJson(r){return r.text().then(function(t){var d;try{d=JSON.parse(t)}catch(e){throw new Error('応答が不正です')}if(d&&d.error)throw new Error(d.error);return d})}

var roster=[]; // [{masterId,name,kana,room,gender,careLevel,active,targetApps?}]

    var o=JSON.parse(raw);var list=(o&&o.residents)||[];
    roster=list.map(function(c){
      return{masterId:c.masterId,name:c.name||'',kana:c.kana||'',room:c.room||'',
        gender:c.gender||'',careLevel:c.careLevel||'',active:c.active!==false,
        targetApps:Array.isArray(c.targetApps)?c.targetApps.slice():null};

// 共有名簿が空のとき、GASの軽量roster（非機微）をフォールバック取得
function refreshRosterFromGas(){
  if(!CFG.url){renderRoster();return Promise.resolve(false)}
  setSync('同期中…');
  return apiGet({action:'getRoster'}).then(function(d){
    var list=(d&&d.roster)||d||[];
    if(Array.isArray(list)){
      roster=list.map(function(r){
        var t=r.targetApps;
        return{masterId:r.id!=null?r.id:r.masterId,name:r.name||'',kana:r.kana||'',room:r.room||'',
          gender:r.gender||'',careLevel:r.careLevel||'',active:r.active!==false,
          targetApps:(typeof t==='string'&&t)?t.split(',').map(function(x){return x.trim()}).filter(Boolean):(Array.isArray(t)?t:null)};
      });
    }
    setSync('同期OK','ok');renderRoster();return true;
  }).catch(function(e){setSync('オフライン','err');renderRoster();if(e.message!=='NO_URL')toast('⚠️ 一覧の取得に失敗: '+e.message);return false});
}

var curFilter='active';
function renderRoster(){
  var q=($('q').value||'').trim().toLowerCase();
  var box=$('rosterBox');
  var list=roster.filter(function(r){
    if(curFilter==='active'&&r.active===false)return false;
    if(curFilter==='out'&&r.active!==false)return false;
    if(r.room==='STAFF')return false;
    if(q){var hay=((r.name||'')+' '+(r.kana||'')+' '+(r.room||'')).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  }).sort(function(a,b){return String(a.room||'').localeCompare(String(b.room||''),'ja')||String(a.kana||'').localeCompare(String(b.kana||''),'ja')});
  if(!list.length){box.innerHTML='<div class="empty">'+(roster.length?'該当する入居者がいません':'入居者がいません。入居者マスタで登録するか「設定」で接続してください')+'</div>';return}
  var html='<div class="rlist">';
  list.forEach(function(r){
    html+='<div class="rcard" role="button" tabindex="0" aria-label="'+esc(r.name)+(r.room?('　'+r.room+'号室'):'')+' のフェイスシートを開く" data-id="'+esc(r.masterId)+'">'+
      '<div class="nm">'+esc(r.name)+'</div>'+
      (r.kana?'<div class="kn">'+esc(r.kana)+'</div>':'')+
      '<div class="meta">'+
        (r.room?'<span class="tag room">'+esc(r.room)+'号室</span>':'')+
        (r.careLevel?'<span class="tag care">'+esc(r.careLevel)+'</span>':'')+
        (r.active===false?'<span class="tag out">退去</span>':'')+
      '</div></div>';
  });
  html+='</div>';
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll('.rcard'),function(el){
    el.addEventListener('click',function(){openResident(this.getAttribute('data-id'))});
    // キーボードでも開けるようにする（Enter / Space）
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();openResident(this.getAttribute('data-id'))}
    });
  });
}

/* ═══════════ 詳細取得（都度取得・キャッシュしない） ═══════════ */
var curRec=null;
/* 要求世代カウンタ。★通信の返る順番は要求順とは限らない。遅れて返った前の方の応答で
   画面を書き換えると、いま開いている方の画面に別人の内容が出る（取り違え）。
   自分の世代が最新でなければ、応答は黙って捨てる。 */
var openSeq=0;
function openResident(id){
  var seq=++openSeq;
  showScreen('view');
  /* 一覧から別の方を選んだ時は、前の方のバーを必ず消す（バーが取り違えの元にならないように）。
     マスタから来た直後は boot() が改めて出すので、ここで消して差し支えない。 */
  if(fromMasterActive&&!openingFromMaster)setFromMasterBar('off');
  $('vName').textContent='';$('hlBand').innerHTML='';$('ftabs').innerHTML='';
  $('viewBox').innerHTML='<div class="loading">読み込み中…</div>';
  if(!CFG.url){$('viewBox').innerHTML='<div class="empty">「設定」で接続URLを入力してください</div>';return}
  // 現場タブレットは安全項目のみをサーバから取得（機微情報は端末に届かない）
  var req=isField()?apiGet({action:'getSection',id:id,section:'facesheet_safe'}):apiGet({action:'getResident',id:id});
  req.then(function(d){
    if(seq!==openSeq)return;                    // 旧要求の応答＝別人の内容なので捨てる
    var rec=isField()?((d&&d.section)||d):((d&&d.record)||d);
    if(!rec||(rec.id==null&&!rec.name))throw new Error('該当データなし');
    curRec=rec; setSync('取得OK','ok'); renderFaceSheet(rec);
    /* 本人確認バーは正本の氏名で更新する（前の方の氏名を残さない） */
    if(fromMasterActive)setFromMasterBar('ok',rec.name);
  }).catch(function(e){
    if(seq!==openSeq)return;                    // 旧要求の失敗で、いま開いている方の画面を潰さない
    setSync('取得失敗','err');$('viewBox').innerHTML='<div class="empty">取得に失敗しました: '+esc(e.message)+'</div>';
    if(fromMasterActive)setFromMasterBar('fail')});
}

/* ═══════════ 最新体重（体重管理アプリのデータを読むだけ・向こうは一切変更しない） ═══════════
   同一オリジン（th-su.github.io）なので localStorage を直接読める。書き込みは一切しない。
   ★体重の正本は体重管理アプリ。マスタ dataJson の weight は移行時の静的値で古い。
   ★rec.weight は車椅子控除済みの正味体重（weight-record.html が保存時に計算済み）。補正しない。
   ★実装は resident-master.html:521-601 の写し。名寄せ（masterId優先→氏名一致）と
     同姓同名除外の仕様をズラすと別人の体重が付くため、あちらを直したらここも直す。 */
var WTMGR_KEY='wtmgr_v1';
/* 氏名の正規化は weight-record.html の suNormName と同一仕様（空白を除去するだけ） */
function wtNormName(s){ return String(s==null?'':s).replace(/\s+/g,'').trim(); }
/* 最新判定のソートキーも weight-record.html の recDateKey と同一仕様 */
function wtRecKey(r){ return (r.measuredOn||(r.yearMonth?r.yearMonth+'-01':''))+'#'+(r.createdAt||''); }

var _wtRaw=null,_wtCache=null;
function loadWeightSource(){
  var empty={latest:{},midByUid:{},uidByName:{}};
  var db,raw;
  try{
    raw=localStorage.getItem(WTMGR_KEY);
    if(!raw){ _wtRaw=null;_wtCache=null; return empty; }
    if(raw===_wtRaw && _wtCache) return _wtCache;   // 同じ生文字列なら再parseしない
    db=JSON.parse(raw);
  }catch(e){ return empty; }
  if(!db||!Array.isArray(db.residents)||!Array.isArray(db.records)) return empty;

  var midByUid={}, nameCount={}, uidOfName={};
  db.residents.forEach(function(p){
    if(!p||p.id==null) return;
    if(p.masterId!=null&&p.masterId!=='') midByUid[String(p.id)]=String(p.masterId);
    var n=wtNormName(p.name);
    if(n){ nameCount[n]=(nameCount[n]||0)+1; uidOfName[n]=String(p.id); }
  });
  var latest={};
  db.records.forEach(function(rec){
    if(!rec||rec.residentId==null) return;
    /* 体重アプリは数値化に失敗した体重を 0 に丸めて保存する。0kg を最新値として
       拾わないよう、入力バリデーションと同じ 20〜150kg 以外は最新判定から除外する。 */
    var wv=Number(rec.weight);
    if(!isFinite(wv)||wv<20||wv>150) return;
    var uid=String(rec.residentId), k=wtRecKey(rec);
    if(!latest[uid]||k>latest[uid].k) latest[uid]={k:k,weight:wv,on:rec.measuredOn||rec.yearMonth||''};
  });
  /* ★同姓同名が複数いる氏名は名寄せに使わない（別人の体重が付くのを防ぐ） */
  var uidByName={};
  Object.keys(nameCount).forEach(function(n){ if(nameCount[n]===1) uidByName[n]=uidOfName[n]; });
  _wtRaw=raw; _wtCache={latest:latest, midByUid:midByUid, uidByName:uidByName};
  return _wtCache;
}
/* 名簿（su_residents_common の写し）に対して {masterId:{weight,on}} を作る */
function buildWeightIndex(list){
  var idx={}, src=loadWeightSource(), used={};
  // ① masterId 一致（確実な紐付けを優先）
  Object.keys(src.midByUid).forEach(function(uid){
    var w=src.latest[uid], mid=src.midByUid[uid];
    if(!w) return;
    if(!idx[mid]||w.k>idx[mid].k) idx[mid]=w;   // 同じ masterId が2件あれば新しい方
    used[uid]=true;
  });
  /* ★マスタ側の同姓同名も除外する。数えるのは必ず名簿全体（絞り込み後の list ではない） */
  var dup={};
  roster.forEach(function(r){ var n=wtNormName(r.name); if(n) dup[n]=(dup[n]||0)+1; });
  // ② 氏名の正規化一致（体重アプリ側に masterId が無い人向け）
  list.forEach(function(r){
    var mid=String(r.masterId);
    if(idx[mid]) return;
    var n=wtNormName(r.name);
    if(!n||dup[n]!==1) return;          // 名簿側に同名が複数 → 紐づけない
    var uid=src.uidByName[n];
    if(!uid||used[uid]) return;
    var w=src.latest[uid];
    if(w){ idx[mid]=w; used[uid]=true; }
  });
  return idx;
}
/* 表示中の1名分だけ取り出す。該当が無ければ null（＝マスタの静的値にフォールバック）。
   体重アプリ未使用の端末・壊れたJSON・名寄せ不能でも例外を出さず null を返す。 */
function latestWeightOf(masterId){
  if(masterId==null||masterId==='') return null;
  try{
    var idx=buildWeightIndex(roster), k=String(masterId);
    if(!Object.prototype.hasOwnProperty.call(idx,k)) return null;   // 'constructor' 等を拾わない
    var w=idx[k];
    return (w&&typeof w.weight==='number')?w:null;
  }catch(e){ return null; }
}
/* 基本情報の「体重」「BMI」セルを作る。
   体重管理アプリに記録があればそれを正として測定日を添え、BMI も最新体重で計算し直す。
   記録が無い端末・未登録の入居者は従来どおりマスタの静的値（移行時点の値）を出す。 */
function weightCells(r){
  var lw=latestWeightOf(r&&r.id);
  var wVal, wSub, bmi, bSub;
  if(lw){
    var on=lw.on?String(lw.on).slice(0,10):'';
    wVal=lw.weight+' kg';
    wSub=on?('最新 '+on+' 測定'):'体重管理アプリの最新値';
    bmi=calcBMI(r.height,lw.weight);
    bSub=bmi?'最新体重で計算':'';
  }else{
    wVal=r.weight?r.weight+' kg':'';
    wSub=r.weight?'（移行時点）':'';
    bmi=calcBMI(r.height,r.weight);
    bSub=bmi?'（移行時点）':'';
  }
  return {weightCell:cell('体重',wVal,false,wSub), bmiCell:cell('BMI',bmi,false,bSub)};
}

/* ═══════════ 表示ヘルパ ═══════════ */
/* sub は値の出所・測定日など小さな補足（省略時は従来と完全に同じ出力） */
/* cls は任意。印刷で消す欄に 'noprint-cell' を付ける（既存の呼び出しは第5引数なし＝従来どおり） */
function cell(lab,val,big,sub,cls){return'<div class="cell'+(cls?(' '+cls):'')+'"><span class="lab">'+esc(lab)+'</span><span class="val'+(big?' big':'')+'">'+esc(val==null||val===''?'　':val)+'</span>'+
  (sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div>'}
function full(lab,val){return'<div class="cell" style="border-right:none"><span class="lab">'+esc(lab)+'</span><div class="fulltext">'+esc(val==null||val===''?'　':val)+'</div></div>'}
/* ── 薬剤情報（定期）を「薬剤｜効果・効能」の2列で描く（2026-08-11 追加）──
   効能は薬効辞書（meds-effect-dict.js）から引く【参考表示】で、保存はしない。
   入居者マスタの medsRegularCell と同じ判断で、次のどれかなら従来どおり1列で出す:
     ①辞書が読み込めていない ②薬剤情報が空 ③1行も引けなかった ④行数がずれた
   ★行数がずれたまま並べると【別の薬の効能が並ぶ】ため、必ず1列へ戻す。 */
/* セルの【中身だけ】を返す（2026-08-12 分離）。呼び出し側が幅を決めた枠へ入れられるようにする。
   1列へ戻す条件に当たった時は、従来と同じ「見出し＋本文」を返す。 */
function fullMedsBody(lab,val){
  var plain = '<span class="lab">'+esc(lab)+'</span><div class="fulltext">'+esc(String(val==null?'':val)||'　')+'</div>';
  var raw = String(val == null ? '' : val);
  if(!raw.trim()) return plain;
  if(typeof MedsEffect === 'undefined' || typeof MedsEffect.effectsFor !== 'function') return plain;
  var lines, effs;
  try{
    lines = raw.replace(/\r\n/g,'\n').split('\n');
    effs  = MedsEffect.effectsFor(raw);
  }catch(e){ return plain; }
  if(!Array.isArray(effs) || effs.length !== lines.length) return plain;
  var hit = false;
  for(var k=0;k<effs.length;k++){ if(effs[k]){ hit = true; break; } }
  if(!hit) return plain;
  var h = '<div class="meds2">'+
    '<div class="meds2-h">'+esc(lab)+'</div><div class="meds2-h">効果・効能</div>';
  for(var i=0;i<lines.length;i++){
    h += '<div class="meds2-d">'+esc(lines[i]||'　')+'</div>'+
         '<div class="meds2-e">'+(effs[i] ? esc(effs[i]) : '<span class="meds2-na">—</span>')+'</div>';
  }
  return h+'</div>';
}
function fullMeds(lab,val){
  return '<div class="cell" style="border-right:none">'+fullMedsBody(lab,val)+'</div>';
}
function sec(lbl,body){return'<div class="sec"><div class="sec-lbl">'+esc(lbl)+'</div><div class="sec-body">'+body+'</div></div>'}
/* 様式に置き換えた「元の記載」。入居者マスタと同じ内容を、こちらでも画面だけに出す。
   ★出さないと、様式へ写し終えるまで治療中の病気などがこの帳票から丸ごと消える
     （フェイスシートは独立した帳票なので「マスタを開けば見られる」では埋まらない）。
   ★事務所ビュー専用。現場タブレットには元から値が来ない（安全情報に無い）。 */
var BF_LEGACY_KEYS=[['currentDiseases','治療中の病気'],['mobility','移動'],['excretion','排泄'],
  ['bath','入浴'],['medMgmt','服薬 管理方法'],['medAssist','服薬介助'],['problemBehavior','問題行動 等']];
function bfLegacy(r){
  r=r||{};
  return BF_LEGACY_KEYS.map(function(p){ return {label:p[1], value:bfStr(r[p[0]])}; })
                       .filter(function(x){ return x.value!==''; });
}
function bfLegacySec(r){
  if(isField()) return '';

  if(!list.length) return '';
  return '<div class="sec sec-bflegacy"><div class="sec-lbl">移行前の記載</div><div class="sec-body">'+
    '<div class="cell" style="border-right:none;background:var(--g0)"><span class="lab">この欄について</span>'+
    '<div class="fulltext">上の様式へ差し替える前の記載です。表示のみ（印刷には出ません）。'+
    '入力は入居者マスタで行います。</div></div>'+
    list.map(function(o,i){
      var last=(i===list.length-1);
      return '<div class="cell" style="border-right:none'+(last?';border-bottom:none':'')+'">'+
             '<span class="lab">'+esc(o.label)+'</span>'+
             '<div class="fulltext bflegacy">'+esc(o.value)+'</div></div>';

}
function sheet(inner){return'<div class="sheet">'+inner+'</div>'}
function logList(arr,withMeta){
  var a=Array.isArray(arr)?arr.slice():[];
  a.sort(function(x,y){return String((y&&y.date)||(y&&y.changedAt)||'').localeCompare(String((x&&x.date)||(x&&x.changedAt)||''))});
  if(!a.length)return'<div class="cell" style="border-right:none;border-bottom:none"><span style="color:var(--g5)">　</span></div>';

    var tag=(s.source==='vma')?' <span style="color:var(--pri-d);font-size: 0.6875rem">[訪問診療]</span>':'';
    return'<div class="logline"><span class="d">'+esc(d)+'</span><span class="t">'+esc(s.text||s.value||'')+(meta?'<br><span style="color:var(--g6);font-size: 0.75rem">'+esc(meta)+'</span>':'')+tag+'</span></div>';
  }).join('')+'</div>';

function careHistHtml(arr){
  var a=Array.isArray(arr)?arr.slice():[];
  a.sort(function(x,y){return String((y&&y.changedAt)||'').localeCompare(String((x&&x.changedAt)||''))});
  if(!a.length)return'<div class="cell" style="border-right:none;border-bottom:none"><span style="color:var(--g5)">　</span></div>';
  return'<div class="cell" style="border-right:none;border-bottom:none">'+a.map(function(s){

  }).join('')+'</div>';
}

/* ═══════════ 入居者基本情報（外部様式）── 正規化（resident-master.html から移植） ═══════════
   2026-08-12 管理者の指示で、外部からいただく「入居者基本情報」の様式に合わせた表示に追従させた。
   ★本ファイルは【閲覧専用】。編集フォーム側の部品（bfSet / bfEdit* / bfPrune / BF_FORM_KEYS）と
     「移行前の記載」（bfLegacy）は移植していない。前者は入力欄が無いため、後者はマスタ側だけの
     移行支援表示のため（元の値はマスタの詳細画面で見られる。データはどちらも1バイトも消していない）。
   方針（マスタ側と同一）:
   ・保存済みの新項目があれば【必ずそれを優先】する。旧値からの推定と混ぜない
   ・旧値からの変換は「機械的に確実な分だけ」。曖昧なものは空のままにする
   ・変換は【表示のためだけ】。このアプリは書き込み経路を持たない */
function bfObj(v){ return (v && typeof v==='object' && !Array.isArray(v)) ? v : {}; }
function bfArr(v){ return Array.isArray(v) ? v : []; }
function bfHas(s,re){ return re.test(String(s==null?'':s)); }
function bfStr(v){ return String(v==null?'':v).trim(); }
function bfCount(o){ return Object.keys(bfObj(o)).length; }
/* 自立／見守り／一部介助／全介助 のどれかへ寄せる。判定できなければ '' を返す */
function bfLevelOf(s){
  var t=bfStr(s);
  if(!t) return '';
  if(/全介助|寝たきり/.test(t))            return 'full';
  if(/一部介助|部分介助/.test(t))          return 'part';
  if(/見守り|声かけ|手渡し/.test(t))       return 'watch';
  if(/自立|独歩|自己管理|問題なし/.test(t)) return 'self';
  return '';
}
/* 認知症自立度の表記ゆれを正す。「Ⅲa」と「IIIa」が混在すると様式の表記に揃わない。
   ★文字列【全体】が変換形と一致する時だけ直す。「Ⅲa（H30判定）」のような補足つきは1文字も触らない */
var BF_RANK_ALIAS={'I':'Ⅰ','II':'Ⅱ','III':'Ⅲ','IV':'Ⅳ','Ⅰ':'Ⅰ','Ⅱ':'Ⅱ','Ⅲ':'Ⅲ','Ⅳ':'Ⅳ'};
function bfNormRank(s){
  var t=bfStr(s);
  if(t==='' || BF_DEMENTIA_RANKS.indexOf(t)>0) return t;
  var m=/^([IVⅠⅡⅢⅣ]+)\s*([ab]?)$/i.exec(t);
  if(!m) return t;
  var head=BF_RANK_ALIAS[m[1].toUpperCase()] || BF_RANK_ALIAS[m[1]];
  if(!head) return t;
  var cand=head+(m[2]||'').toLowerCase();
  return BF_DEMENTIA_RANKS.indexOf(cand)>0 ? cand : t;
}
/* 表示用に正規化した1名分を返す（純関数・引数を書き換えない） */
function bfView(r){
  r=r||{};
  var v={};
  v.diseases  = bfArr(r.diseases).filter(function(d){ return d && (bfStr(d.name)||bfStr(d.onset)||bfStr(d.hospital)); });
  v.services  = bfObj(r.services);
  v.bpsd      = bfObj(r.bpsd);
  v.night     = bfObj(r.night);
  /* ★様式を一度でも保存したら、旧データからの推定を【全部止める】。
       止めないと「—（未選択）」に戻した項目が旧自由文から毎回復活し、選び直せない。
       未入力（まだ様式を触っていない）と、明示的に空（人が空にした）を区別する
       ＝multi-device-sync 原則4。 */
  var derive = !r.bfSaved;
  var g = bfObj(r.adlGrid);
  v.adlGrid = { move:    g.move    || (derive ? bfLevelOf(r.mobility)  : ''),
                oral:    g.oral    || '',
                meal:    g.meal    || '',
                bath:    g.bath    || '',
                excrete: g.excrete || (derive ? bfLevelOf(r.excretion) : '') };
  /* 補助チェックは「保存済みが1つでもあれば、それが人の意思」＝推定を足さない */
  v.moveAid = bfObj(r.moveAid);
  if(derive && !bfCount(v.moveAid)){
    v.moveAid={};
    if(bfHas(r.mobility,/歩行器/))        v.moveAid.walker=true;
    if(bfHas(r.mobility,/車椅子|車いす/)) v.moveAid.wheelchair=true;
  }
  v.excreteWay = bfObj(r.excreteWay);
  if(derive && !bfCount(v.excreteWay)){
    v.excreteWay={};
    if(bfHas(r.excretion,/おむつ|オムツ/))  v.excreteWay.diaper=true;
    if(bfHas(r.excretion,/ポータブル|PWC/)) v.excreteWay.pwc=true;
    if(bfHas(r.excretion,/カテーテル/))     v.excreteWay.catheter=true;
  }
  v.bathPlace = bfObj(r.bathPlace);
  if(derive && !bfCount(v.bathPlace)){
    v.bathPlace={};
    if(bfHas(r.bath,/清拭/)) v.bathPlace.wipe=true;   /* 一般浴・機械浴からは場所を決めない */
  }
  v.medLevel   = bfStr(r.medLevel)   || (derive ? (bfLevelOf(r.medAssist)||bfLevelOf(r.medMgmt)) : '');
  /* 薬の有無だけは確実に決まる（定期薬が入っていれば「有」）。ただし保存後は人の入力を尊重する */
  v.medExists  = bfStr(r.medExists)  || (derive && bfStr(r.medsRegular) ? '有' : '');
  v.medContent = bfStr(r.medContent);
  v.commLevel  = bfStr(r.commLevel);            /* 自由文からは推定しない */
  v.dementia   = bfNormRank(r.dementia);        /* 既存キーをそのまま使う（自立度） */
  v.dementiaKnown  = BF_DEMENTIA_RANKS.indexOf(v.dementia) > 0;
  v.dementiaExists = bfStr(r.dementiaExists) || (derive && (v.dementia||bfStr(r.dementiaType)) ? '有' : '');
  v.bedriddenRank      = bfStr(r.bedriddenRank);
  v.shortMemory        = bfStr(r.shortMemory);
  v.decisionAbility    = bfStr(r.decisionAbility);
  v.communicateAbility = bfStr(r.communicateAbility);
  /* ★睡眠薬の【薬剤名】は night の中に入れない。night は現場タブレットの安全情報に
       含める（夜勤の判断に要る）が、getSection はオブジェクトを丸ごと返すため、
       中に薬剤名を置くと現場端末へ実処方が渡ってしまう（安全情報は「服薬の薬剤名は含めない」契約）。
       トップレベルの別キーにして、SAFE_FIELDS に入れないことで確実に止める。 */
  v.nightSleepMed = bfStr(r.nightSleepMed);
  v.formNote    = bfStr(r.formNote);
  v.infoConsent = !!r.infoConsent;
  return v;
}
/* ── 描画部品（画面＝印刷面で共用。マスタ側と同じ見た目にする） ──
   ★□は固定寸法なので、未チェック時は✓を【出さない】。透明の✓を置くと、画面読み上げと
     コピー＆ペーストで全項目が「✓」になり、チェック済みと区別できなくなる。 */
function bfCk(on,label){
  return '<span class="bfck'+(on?' on':'')+'" role="img" aria-label="'+esc(label)+(on?'（該当）':'（該当なし）')+'">'+
         '<i aria-hidden="true">'+(on?'✓':'')+'</i>'+esc(label)+'</span>';
}
/* 4段階のセルを1行ぶん。選ばれていない段階も枠だけ出す（様式と同じ見え方にする） */
function bfLevelCells(cur){
  return BF_LEVELS.map(function(p){
    return '<td class="bfc">'+(cur===p[0]?'<i class="bfmark">✓</i>':'')+'</td>';
  }).join('');
}
function bfChkList(defs,obj){
  obj=bfObj(obj);
  return defs.map(function(p){ return bfCk(!!obj[p[0]], p[1]); }).join('');
}
/* 補足の自由文（様式の「（　　）」に相当）。空なら1文字も出さない＝行の高さを増やさない */
function bfNote(o){
  var n=bfStr(bfObj(o).note);
  return n ? '<span style="margin-left:2px;font-size:0.875rem">（'+esc(n)+'）</span>' : '';
}
/* 義歯は既存キー denture（無/有/部分義歯/総義歯）をそのまま使う。新しいキーを増やさない */
function bfDenture(v){
  var t=bfStr(v), has=(t!=='' && t!=='無');
  return '<span style="font-size:0.875rem;margin-right:6px">義歯:</span>'+bfCk(has,'有')+bfCk(t==='無','無')+
         ((t==='部分義歯'||t==='総義歯') ? '<span style="font-size:0.875rem">（'+esc(t)+'）</span>' : '');
}

/* ── 様式の表を組み立てる（事務所ビューと現場ビューで共用） ──
   マスタ側は1つの大表だが、本ファイルはカテゴリタブに分かれるため
   「4段階の列を持つ表（ADL・服薬）」と「持たない表（認知・意思疎通）」の2つに分ける。
   行の中身・並びはマスタ側と同じにしてあるので、紙の見え方は原本に揃う。 */
function bfTable(head,subHead,rows){
  return '<table class="bfadl"><thead><tr><th class="bfrow">'+esc(head)+'</th>'+
    BF_LEVELS.map(function(p){return '<th>'+esc(p[1])+'</th>'}).join('')+
    '<th>'+esc(subHead||'')+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
/* 4段階の列を持たない表（見出し行なし）。認知・意思疎通の行だけを並べる */
function bfPlainTable(rows){ return '<table class="bfadl"><tbody>'+rows+'</tbody></table>'; }
/* 4段階の列を持つ表に混ぜる行は colspan=5（自立〜全介助＋補足）で1セルにする。
   持たない表では colspan を付けない（付けると罫線が1列ぶん伸びる） */
function bfWideCell(span){ return '<td class="bfsub"'+(span?' colspan="5"':'')+'>'; }
/* ADL 5行（移動・口腔清潔・食事・入浴・排泄）。補足は様式の「（　　）」に相当する部分 */
function bfAdlRows(r,bf){
  var mealTxt=[bfStr(r.mealStaple)?('主食:'+bfStr(r.mealStaple)):'',
               bfStr(r.mealSide)?('副食:'+bfStr(r.mealSide)):'',
               bfStr(r.mealForm),
               (bfStr(r.thickener)&&bfStr(r.thickener)!=='なし')?('とろみ'+bfStr(r.thickener)):''
              ].filter(Boolean).join('　');
  var sub={
    move:    bfChkList(BF_MOVE_AID,bf.moveAid)+bfNote(bf.moveAid),
    oral:    bfDenture(r.denture),
    meal:    mealTxt?('<span style="font-size:0.875rem">食事形態（'+esc(mealTxt)+'）</span>'):'',
    bath:    bfChkList(BF_BATH_PLACE,bf.bathPlace)+bfNote(bf.bathPlace),
    excrete: bfChkList(BF_EXCRETE_WAY,bf.excreteWay)+bfNote(bf.excreteWay)
  };
  return BF_ADL_ROWS.map(function(p){
    return '<tr><th class="bfrow">'+esc(p[1])+'</th>'+bfLevelCells(bf.adlGrid[p[0]])+
           '<td class="bfsub">'+(sub[p[0]]||'')+'</td></tr>';
  }).join('');
}
/* 服薬管理の1行。withContent=false（現場タブレット）では「内容」のチェックを出さない。
   medContent は SAFE_FIELDS に無く必ず空になるため、空の□が「別紙参照ではない」と誤読される。 */
function bfMedRow(bf,withContent){
  return '<tr><th class="bfrow">服薬管理</th>'+bfLevelCells(bf.medLevel)+
    '<td class="bfsub"><span style="font-size:0.875rem;margin-right:6px">薬の有無:</span>'+
      bfCk(bf.medExists==='有','有')+bfCk(bf.medExists==='無','無')+

/* 要配慮情報の塊を現場タブレットで描かないための門番（三重防御の3枚目）。
   ①サーバ（getSection facesheet_safe）②renderFaceSheet の SAFE_FIELDS フィルタ に続き、
   ③描画の入口でも落とす。病名・サービス・備考・同意は SAFE_FIELDS に無く値も来ないが、
   将来この関数を現場ビューから呼んでしまっても要配慮情報が出ないようにしておく。 */
function bfOfficeOnly(html){ return isField()?'':html; }
/* 病名表＋介護保険等サービス利用状況（要配慮情報＝事務所のみ。現場では呼ばない）。
   病名は最低3行の枠を出す（原本と同じ見え方にする） */
function bfDiseaseServiceBody(bf){
  /* 縦3×横2組＝6件（2026-08-15 指示。入居者マスタと同じ形。番号は左列 1..N・右列 N+1..2N） */
  var n=Math.max(3, Math.ceil(bf.diseases.length/2));
  var rows='';
  for(var i=0;i<n;i++){
    var dL=bf.diseases[i]||{}, dR=bf.diseases[i+n]||{};
    rows+='<tr><td class="bfno">'+(i+1)+'</td><td>'+esc(dL.name||'')+'</td>'+
          '<td class="bfonset">'+esc(dL.onset||'')+'</td><td class="bfhosp">'+esc(dL.hospital||'')+'</td>'+
          '<td class="bfno bfmid">'+(i+1+n)+'</td><td>'+esc(dR.name||'')+'</td>'+
          '<td class="bfonset">'+esc(dR.onset||'')+'</td><td class="bfhosp">'+esc(dR.hospital||'')+'</td></tr>';
  }
  return '<div class="cell" style="border-right:none">'+
      /* 見出しは「既往歴」（2026-08-15 指示。入居者マスタと表記を揃える。データのキーは diseases のまま） */
      '<table class="bfdis"><thead><tr><th class="bfno"></th><th>既往歴</th>'+
      '<th class="bfonset">発症時期</th><th class="bfhosp">医療機関</th>'+
      '<th class="bfno bfmid"></th><th>既往歴</th>'+
      '<th class="bfonset">発症時期</th><th class="bfhosp">医療機関</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table>'+
    '</div>'+
    '<div class="cell" style="border-right:none;border-bottom:none">'+
      '<span class="lab">介護保険等サービス利用状況（利用頻度等）</span>'+
      '<div class="bfwrap">'+BF_SERVICES.map(function(p){
        var s=bfObj(bf.services[p[0]]);
        return bfCk(!!s.on, p[1]+(s.on&&bfStr(s.name)?('（'+bfStr(s.name)+'）'):''));
      }).join('')+'</div>'+
    '</div>';
}

/* ═══════════ 安全ハイライト帯（共通） ═══════════ */
function renderHlBand(r){
  var hl=[];
  /* 入院中は在不在そのものが変わる（配薬・食事・記録の手配に直結）ため先頭に出す。
     現場ロール（安全項目のみ）でも見えるよう SAFE_FIELDS に hospitalized を含めている。
     受信値は !!v で正規化する（文字列 'true' 等が来ても真偽で扱う）。 */
  if(!!r.hospitalized)hl.push('<span class="hlchip hl-warn">🏥 入院中</span>');
  if(r.preferredName)hl.push('<span class="hlchip hl-info">🙂 呼称: '+esc(r.preferredName)+'</span>');
  if(r.allergy)hl.push('<span class="hlchip hl-danger">⚠ アレルギー: '+esc(r.allergy)+'</span>');
  if(r.infections)hl.push('<span class="hlchip hl-danger">⚠ 感染症: '+esc(r.infections)+'</span>');
  if(r.medicalCare)hl.push('<span class="hlchip hl-warn">＋ 医療処置: '+esc(r.medicalCare)+'</span>');
  if(r.mealForm||r.thickener)hl.push('<span class="hlchip hl-info">🍚 食事: '+esc([r.mealForm,r.thickener?('とろみ'+r.thickener):''].filter(Boolean).join(' / '))+'</span>');
  if(r.careHints)hl.push('<span class="hlchip hl-warn">💡 対応のコツあり</span>');
  $('hlBand').innerHTML=hl.length?'<div class="hlband" role="group" aria-label="安全上の注意">'+hl.join('')+'</div>':'';
}

/* ═══════════ フェイスシート描画 ═══════════ */
function renderFaceSheet(r){
  // 二重防御: 現場端末では SAFE_FIELDS 以外を描画対象から落とす。
  // サーバ(getSection facesheet_safe)が唯一の関門だが、GASが旧バージョンのまま等で
  // 想定外の項目が返っても現場画面には出さない。3箇所契約を「動作」で担保する。
  if(isField()){
    var s={id:r.id};
    SAFE_FIELDS.forEach(function(k){if(r[k]!==undefined)s[k]=r[k]});
    r=s;
  }
  $('vName').textContent=(r.name||'')+(r.room?('（'+r.room+'）'):'');
  renderHlBand(r);
  if(isField()){renderFieldView(r);return}
  renderOfficeView(r);
}

function renderOfficeView(r){

  var rhythm=(function(src){   /* 食事の時刻は施設共通の既定を重ねる（保存済みが優先） */
    src=(src&&typeof src==='object')?src:{};
    var o={};
    Object.keys(RHYTHM_DEFAULTS).forEach(function(k){ o[k]=RHYTHM_DEFAULTS[k]; });
    Object.keys(src).forEach(function(k){ var v=String(src[k]==null?'':src[k]).trim(); if(v) o[k]=v; });
    return o;
  })(r.rhythm);
  var RH=[['wake','起床'],['breakfast','朝食'],['lunch','昼食'],['snack','おやつ'],['dinner','夕食'],['sleep','就寝']];
  var rh=RH.map(function(p){return rhythm[p[0]]?('<span>'+esc(p[1])+' <b>'+esc(rhythm[p[0]])+'</b></span>'):''}).filter(Boolean).join('');
  var dayUse=r.dayUse||{};
  var du=DAYUSE_KEYS.map(function(p){return dayUse[p[0]]?('<span>'+esc(p[1])+' <b>'+esc(dayUse[p[0]])+'</b></span>'):''}).filter(Boolean).join('');
  var consents=r.consents||{};

  var fam=Array.isArray(r.family)?r.family:[];

  var famTel=fam.map(function(f,i){return f.phone?('①②③④⑤'.charAt(i)+f.phone):''}).filter(Boolean).join('\n');
  var emg=fam.filter(function(f){return f.emergency}).map(function(f,i){return '①②③④⑤'.charAt(i)+(f.name||'')+(f.relation?'（'+f.relation+'）':'')+(f.phone?(' '+f.phone):'')}).join('\n');

  var P={};

    '<div class="row-cells">'+cell('年齢',calcAge(r.birthDate)?calcAge(r.birthDate)+'歳':'')+cell('性別',r.gender)+cell('移動',r.mobility)+cell('食形態',[r.mealForm,r.thickener?('とろみ'+r.thickener):''].filter(Boolean).join('/'))+'</div>'+
    full('アレルギー / 感染症',[r.allergy,r.infections].filter(Boolean).join(' ／ '))+

  ));
  // 基本・制度
  var chist=careHistHtml(r.careLevelHistory);
  var wt=weightCells(r);   // 体重・BMI は体重管理アプリの最新値を優先（無ければマスタの静的値）
  P.basic=sheet(
    sec('基本情報',
      '<div class="row-cells">'+cell('氏名',r.name,true)+cell('性別',r.gender)+birthCell('生年月日',r.birthDate)+cell('年齢',calcAge(r.birthDate)?calcAge(r.birthDate)+'歳':'')+'</div>'+

    )+
    sec('保険・制度／連絡先',
      '<div class="row-cells">'+cell('電話（本人/居室）',r.phone)+cell('被保険者番号',r.insuredNo)+cell('保険者',r.insurer)+cell('認定日',fmtJDate(r.certDate))+'</div>'+

  // 医療・服薬

  Array.prototype.forEach.call($('ftabs').querySelectorAll('.ftab'),function(b){
    b.addEventListener('click',function(){
      var k=this.getAttribute('data-tab');
      try{localStorage.setItem(TAB_KEY,k)}catch(e){}   // 次に開いたとき同じカテゴリで開く

/* ジェノグラム（同一オリジン共有・読み取り専用） */
/* 家族構成図のサムネイルを探す。masterId → 氏名 の順に見る（2026-08-12・入居者マスタと同じ実装）。
   ★氏名で探す経路が無いと、ジェノグラムアプリを直接開いて作った図が一切出ない。
   ★正規化は空白除去のみ。同姓同名は同じ図を指す。

   ★2026-08-13（実害）: masterId のキーに入っている図は、記録側の氏名(rec.name)と必ず突き合わせる。
     ジェノグラムアプリを ?resident=<この方> 付きで開いたまま【別の方の文書】を保存すると、
     その masterId のキーに別人の図が入り、この方の欄に他人の家族構成図が出ていた。
     ★入居者マスタと【逐語同一】にすること（gas/tests/genogram_key_test.js が文字列で照合する）。 */
function getGenogram(id,name){
  try{
    var raw=localStorage.getItem(SU_GENO_KEY); if(!raw)return null;
    var m=JSON.parse(raw); if(!m||typeof m!=='object')return null;
    var nm=String(name==null?'':name).replace(/\s+/g,'');
    var g=m[String(id)];
    if(g&&g.image){
      var rn=String(g.name==null?'':g.name).replace(/\s+/g,'');
      if(!nm||!rn||rn!==nm) g=null;   // 誰の図か確かめられない／別人の図 → 使わない
    }
    if(!(g&&g.image)&&nm) g=m['name:'+nm];
    return (g&&typeof g.image==='string'&&g.image)?g.image:null;
  }catch(e){return null}
}

/* ═══════════ 画面遷移・ナビ ═══════════ */

  ['list','view'].forEach(function(s){var el=$('sc-'+s);if(el)el.classList.toggle('on',s===name)});

}

/* ═══════════ 設定モーダル ═══════════ */
function openSync(){
  $('cfgUrl').value=CFG.url;$('cfgToken').value=CFG.token;$('cfgDeviceRole').value=getDeviceRole();
  $('mSync').classList.add('on');
}
function closeSync(){$('mSync').classList.remove('on')}
/* ★接続テストの「世代」。テストと保存が同じ入力欄の同じ値を使うため、
   CFG の値比較では「テスト中に保存されたか」を判別できない。保存・テストのたびに
   進めるカウンタで判定する（care-schedule csPreGen_ と同型）。 */
var cfgTestGen_=0;
function saveSync(){
  cfgTestGen_++;   /* 飛行中のテストの巻き戻しを無効化する（保存値が正） */
  CFG.url=($('cfgUrl').value||'').trim();CFG.token=($('cfgToken').value||'').trim();
  /* ★このキーは入居者マスタと共用。丸ごと書き換えると、マスタ側が入れた項目
     （訪問診療URL vmaUrl 等）を黙って消してしまう。既存値を読み、自分が扱う
     url/token だけを差し替えて書き戻す（.claude/rules/data-contracts.md §1-2）。 */
  /* ★保存できたかは書き戻して読み直すまで分からない（プライベートモード・容量超過では
     setItem が例外にならず黙って残らない環境がある）。成功トーストだけ出して実際は
     保存されていない、という silent fail を作らないため一致を検証する
     （connection-settings.html writeSys と同方式）。 */
  var saved=false;
  try{
    var _c={};
    try{var _s=localStorage.getItem(CFG_KEY);if(_s)_c=JSON.parse(_s)}catch(e){_c={}}
    if(!_c||typeof _c!=='object'||Object.prototype.toString.call(_c)!=='[object Object]')_c={};
    _c.url=CFG.url;_c.token=CFG.token;
    localStorage.setItem(CFG_KEY,JSON.stringify(_c));
    var _b={};
    try{var _r=localStorage.getItem(CFG_KEY);if(_r)_b=JSON.parse(_r)}catch(e){_b={}}
    if(!_b||typeof _b!=='object')_b={};
    saved=(String(_b.url==null?'':_b.url)===CFG.url && String(_b.token==null?'':_b.token)===CFG.token);
  }catch(e){saved=false}
  setDeviceRole($('cfgDeviceRole').value==='field'?'field':'office');
  applyRoleBadge();closeSync();boot();
  toast(saved?'✅ 保存しました':'⚠️ 保存できませんでした（プライベートモード等）');
}
function testSync(){
  /* ★テストのために CFG を書き換えるが、保存せず閉じた場合に未保存のURLを
     そのセッション中ずっと使い続けてしまう。テスト前の値を退避し、成否によらず戻す
     （resident-master.html testSync と同パターン）。 */
  var myGen=++cfgTestGen_;
  /* 戻り先は「いまの CFG」ではなく保存済みの永続値から取る。CFG を写すと、テスト飛行中に
     もう一度テストを押した時に前回の"未保存の試行値"が戻り先になり、この関数が消そうとした
     「未保存URLをセッション中使い続ける」状態がそのまま再発する。 */
  var saved=readSavedCfg_();
  var tried={url:($('cfgUrl').value||'').trim(),token:($('cfgToken').value||'').trim()};
  CFG.url=tried.url;CFG.token=tried.token;
  if(!CFG.url){CFG.url=saved.url;CFG.token=saved.token;toast('URLを入力してください');return}
  setSync('テスト中…');
  apiGet({action:'ping'}).then(function(){setSync('接続OK','ok');toast('✅ 接続できました')})
    .catch(function(e){setSync('接続失敗','err');toast('⚠️ '+e.message)})
    /* テスト中に保存・再テストされた場合（世代が進む）は巻き戻さない */
    .then(function(){if(myGen===cfgTestGen_){CFG.url=saved.url;CFG.token=saved.token}});
}

/* ═══════════ 起動 ═══════════ */
/* ── 入居者単位リンクの受け口（入居者マスタから ?masterId=&name= で来た時） ──
   ★取り違え防止（dev-principles 原則11）: 誰を開いたのかを画面上部に必ず出し、
     一覧へ戻る導線を添える。URLの氏名は「本人確認の表示」にだけ使い、
     データの取得・保存には使わない（正本はサーバから引く masterId のレコード）。
   ★不正・未知の値は無視して通常どおり一覧を出す（壊れたURLで起動不能にしない）。 */
function readMasterIdParam(){
  var p=null; try{p=new URLSearchParams(location.search)}catch(e){return null}   // 旧ブラウザは機能無効
  if(!p)return null;
  if(!p.get('masterId'))return null;                        // 指定なし＝通常起動
  var id=String(p.get('masterId')).trim();
  if(!/^[0-9A-Za-z_-]{1,32}$/.test(id)){                    // 想定外の形式は開かない
    try{toast('⚠️ 指定された入居者を開けませんでした（一覧から選んでください）')}catch(e){}
    return null;
  }
  return {id:id};
}
/* 本人確認バー。★氏名はURLから取らず、サーバから取得した正本の氏名だけを出す。
   未検証の氏名を「本人確認」として見せると、取り違えの根拠にされてしまうため。 */
var fromMasterActive=false;
var openingFromMaster=false;   /* boot() がマスタ由来で開いている最中だけ true */
function setFromMasterBar(state,name){
  var bar=$('fromMaster'); if(!bar)return;
  if(state==='off'){ bar.style.display='none'; bar.innerHTML=''; fromMasterActive=false; return; }
  fromMasterActive=true;
  var msg = state==='ok'   ? '入居者マスタから開いています：<b>'+esc(name||'')+'</b>'
          : state==='fail' ? '入居者マスタから開こうとしましたが、<b>取得できませんでした</b>'
          :                  '入居者マスタから開いています：読み込み中…';
  bar.innerHTML='<span>'+msg+'</span><button type="button" id="fromMasterClose">一覧に戻る</button>';
  bar.style.display='flex';
  $('fromMasterClose').addEventListener('click',function(){
    clearMasterIdParam(); setFromMasterBar('off'); curRec=null; showScreen('list');
  });
}
/* 一覧へ戻ったら URL の指定も消す。残すと設定保存など boot() の再実行で勝手に開き直す。 */
function clearMasterIdParam(){
  try{ if(location.search) history.replaceState(null,'',location.pathname); }catch(e){}
}
function boot(){
  applyRoleBadge();
  var has=loadCommonRoster();
  renderRoster();
  if(!has&&CFG.url)refreshRosterFromGas();
  else if(roster.length)setSync('名簿OK','ok');
  else setSync('未接続');
  var from=readMasterIdParam();
  if(from){
    openingFromMaster=true;
    setFromMasterBar('loading');
    openResident(from.id);
    openingFromMaster=false;
  }
}
window.addEventListener('storage',function(e){if(e.key===COMMON_KEY){loadCommonRoster();renderRoster()}});
document.addEventListener('DOMContentLoaded',function(){
  $('q').addEventListener('input',renderRoster);
  Array.prototype.forEach.call($('filterRow').querySelectorAll('.chip'),function(c){
    c.addEventListener('click',function(){curFilter=this.getAttribute('data-f');Array.prototype.forEach.call($('filterRow').querySelectorAll('.chip'),function(x){x.classList.toggle('on',x===c)});renderRoster()});
  });
  $('btnMaster').addEventListener('click',function(){window.open('resident-master.html','_blank')});
  $('backBtn').addEventListener('click',function(){curRec=null;showScreen('list')});
  $('printBtn').addEventListener('click',function(){window.print()});
  Array.prototype.forEach.call(document.querySelectorAll('.bnav button'),function(b){
    b.addEventListener('click',function(){var sc=this.getAttribute('data-sc');if(sc==='sync')openSync();else showScreen(sc)});
  });
  $('syncClose').addEventListener('click',closeSync);
  $('syncSave').addEventListener('click',saveSync);
  $('syncTest').addEventListener('click',testSync);
  boot();
});
