# 公開（GitHub Pages）— main に入った中身を配る（2026-10-14 代表者の決定）
#
# ・配るのは git で管理している全ファイル（これまでの「main をそのまま配る」と同じ中身）＋本番の施設情報
# ・本番の施設情報 facility-profile.json は公開リポジトリに置かない（見本 facility-profile.sample.json だけを置く）。
#   ここで Secret FACILITY_PROFILE_JSON から置いて配る
# ・Secret が無い・壊れている・見本のままの時は配らずに止める（前に配った版がそのまま公開され続ける）
#   ＝施設情報の無い版・架空の施設名の版を公開しない
# ・配るのは main の「試験」（unit-tests.yml）が成功した後だけ（2026-10-14 監査10月版 第4版 4）。
#   以前は main に入った時点で試験の結果を待たずに配っていた。手動の配信（workflow_dispatch）は残す＝今の main をそのまま配る
# ・試験の終わる順が入れ替わった時（続けて2本取り込んだ時、前の版の試験が後に終わる）に古い版で上書きしないよう、
#   試験した版が今の main の先頭でなければ配らない（実行は成功のまま・後の版の試験の成功で配られる）。
#   その間 care-publish-pr.sh は「公開中の中身が main と違う」と出す（後の版の配信を待てば一致する）
# ・公開できなかった時は代表者へ知らせる（2026-10-25 本人指示・代表者の決定「GitHub の Issue」）。
#   main の試験が落ちた（配らずに飛ばした）時と、配る仕事が失敗した（施設情報の Secret の不備など）時に、
#   ラベル「公開の失敗」の Issue を立てる（担当＝リポジトリの持ち主＝GitHub がメールとスマホへ知らせる）。
#   続けて失敗した時は同じ Issue に書き足し、次に配れた時に閉じる。知らせには前に配った版の日時（日本時間）と版の番号を入れる。
#   ★公開リポジトリなので、書くのは版の番号・コミットの題・日時・失敗の種類・実行の記録へのリンクだけ（個人情報・Secret の中身は書かない）
name: 公開

on:
  workflow_run:
    workflows: ["試験"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 試験が main への送信（push）で成功した時だけ。PR の試験・失敗・中止では配らない
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      go: ${{ steps.head.outputs.go }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: リポジトリを取り出す（試験に合格した版）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 試験した版が今の main の先頭かを確かめる（古い版で上書きしない）
        id: head
        run: |
          now=$(git ls-remote origin refs/heads/main | cut -f1)
          got=$(git rev-parse HEAD)
          if [ -n "$now" ] && [ "$now" != "$got" ]; then
            echo "::notice::試験した版 ${got:0:7} は今の main の先頭 ${now:0:7} ではないので配りません（後の版の試験が成功した時に配られます）"
            echo "試験した版 ${got:0:7} は main の先頭 ${now:0:7} ではないので配っていません" >> "$GITHUB_STEP_SUMMARY"
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 本番の施設情報を置く（Secret FACILITY_PROFILE_JSON）
        if: steps.head.outputs.go == '1'
        env:
          FP: ${{ secrets.FACILITY_PROFILE_JSON }}
        run: |
          if [ -z "$FP" ]; then
            echo "::error::Secret FACILITY_PROFILE_JSON がありません。配信を止めます（前に配った版がそのまま公開されます）"
            exit 1
          fi
          printf '%s' "$FP" > facility-profile.json
          python3 - <<'PY'
          import json, sys
          try:
              p = json.load(open('facility-profile.json', encoding='utf-8'))
              s = json.load(open('facility-profile.sample.json', encoding='utf-8'))
          except Exception as e:
              print('::error::施設情報の JSON を読めません: ' + type(e).__name__); sys.exit(1)
          kinds = sorted(o.get('kind') for o in p.get('offices', []) if isinstance(o, dict))
          if kinds != ['施設', '訪問', '通所']:
              print('::error::施設情報の offices に 施設・訪問・通所 がそろっていません'); sys.exit(1)
          if p.get('facilityName') == s.get('facilityName') or p.get('corpName') == s.get('corpName'):
              print('::error::施設情報が見本（架空の施設）のままです'); sys.exit(1)
          print('施設情報: 形よし（事業所3つ・見本ではない）')
          PY

      - name: 配る中身をそろえる（git で管理しているファイル＋本番の施設情報）
        if: steps.head.outputs.go == '1'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git ls-files -z | xargs -0 cp --parents -t "$RUNNER_TEMP/site"
          cp facility-profile.json "$RUNNER_TEMP/site/facility-profile.json"
          echo "配るファイル: $(find "$RUNNER_TEMP/site" -type f | wc -l) 件"

      - name: Pages の設定を読む
        if: steps.head.outputs.go == '1'
        uses: actions/configure-pages@v5

      - name: 配る中身を渡す
        if: steps.head.outputs.go == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: 配る
        if: steps.head.outputs.go == '1'
        id: deploy
        uses: actions/deploy-pages@v4

  # 公開できなかった時の知らせ・配れた時の後始末（2026-10-25 本人指示）。この仕事が失敗しても公開そのものには触れない
  notify:
    needs: deploy
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: 公開できなかったら知らせる・配れたら知らせを閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          TEST_RESULT: ${{ github.event.workflow_run.conclusion || 'manual' }}
          TEST_URL: ${{ github.event.workflow_run.html_url || '' }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_GO: ${{ needs.deploy.outputs.go }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # PAGES-NOTIFY-BEGIN（check/unit/pages_notify_test.js がこの区間を切り出して偽の gh で動かす）
          LABEL='公開の失敗'
          kind=''
          case "$TEST_RESULT" in
            success|manual|cancelled|skipped|neutral) : ;;   # 成功・手動の配信・人が止めた・飛ばした
            *) kind="試験の失敗（main の「試験」が ${TEST_RESULT} で終わったので配っていません）" ;;   # failure・timed_out・startup_failure 等
          esac
          if [ -z "$kind" ]; then
            case "$DEPLOY_RESULT" in
              success|skipped) : ;;
              *) kind='配信の失敗（施設情報の Secret FACILITY_PROFILE_JSON の不備か、配る処理の失敗・時間切れ）' ;;
            esac
          fi
          # 落ちた版が今の main の先頭でなければ知らせない（後の版がもう配られているか、後の版の実行が知らせる）
          if [ -n "$kind" ] && [ "$TEST_RESULT" != "manual" ]; then
            head=$(gh api "repos/$R/commits/main" --jq '.sha' 2>/dev/null || true)
            if [ -n "$head" ] && [ "$head" != "$SHA" ]; then
              echo "落ちた版 ${SHA:0:7} は今の main の先頭 ${head:0:7} ではないので知らせません"
              exit 0
            fi
          fi
          open_no=$(gh issue list -R "$R" --label "$LABEL" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$kind" ]; then
            # 配れた時（試験した版が main の先頭で、配る仕事が成功）だけ、開いている知らせを閉じる
            if [ "$DEPLOY_RESULT" = "success" ] && [ "$DEPLOY_GO" = "1" ] && [ -n "$open_no" ]; then
              gh issue comment "$open_no" -R "$R" --body "配れました（版 ${SHA:0:7}・$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）。この知らせを閉じます。実行の記録: $RUN_URL" || true
              gh issue close "$open_no" -R "$R" || true
            fi
            echo "知らせることはありません（試験: $TEST_RESULT・配信: $DEPLOY_RESULT）"
            exit 0
          fi
          # 前に配った版＝公開の実行のうち「配る」の手順が成功したいちばん新しい実行（配らずに飛ばした実行は数えない）
          prev='（読めませんでした。公開の実行の記録で、最後に「配る」が成功した実行を確かめてください）'
          for rid in $(gh api "repos/$R/actions/workflows/pages.yml/runs?status=success&per_page=30" --jq '.workflow_runs[] | select(.id != '"$GITHUB_RUN_ID"') | .id' 2>/dev/null || true); do
            at=$(gh api "repos/$R/actions/runs/$rid/jobs" --jq '[.jobs[] | select(.name == "deploy") | .steps[] | select(.name == "配る" and .conclusion == "success")][0].completed_at // empty' 2>/dev/null || true)
            if [ -n "$at" ]; then
              psha=$(gh api "repos/$R/actions/runs/$rid" --jq '.head_sha' 2>/dev/null || true)
              prev="$(TZ=Asia/Tokyo date -d "$at" '+%Y-%m-%d %H:%M')（日本時間・版 ${psha:0:7}）"
              break
            fi
          done
          title=$(gh api "repos/$R/commits/$SHA" --jq '.commit.message | split("\n")[0]' 2>/dev/null || true)
          now=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')
          body="**公開できませんでした**（$now 日本時間）

          - 失敗の種類: $kind
          - 失敗した版: ${SHA:0:7} ${title}
          - **前に配った版: $prev**（今もこの版が公開され続けています）
          - 実行の記録: $RUN_URL"
          [ -n "$TEST_URL" ] && [ "$TEST_RESULT" != "success" ] && [ "$TEST_RESULT" != "manual" ] && body="$body
          - 試験の記録: $TEST_URL"
          body=$(printf '%s\n' "$body" | sed 's/^          //')
          gh label create "$LABEL" -R "$R" --color B60205 --description '公開（pages.yml）が失敗した時に自動で立つ' --force >/dev/null 2>&1 || true
          if [ -n "$open_no" ]; then
            gh issue comment "$open_no" -R "$R" --body "$body"
          else
            gh issue create -R "$R" --title "公開の失敗：${kind%%（*}（版 ${SHA:0:7}）" --label "$LABEL" --assignee "$OWNER" --body "$body"
          fi
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          # PAGES-NOTIFY-END
