# 業務の流れを通す試験（自動）— PR ごとと毎晩、check/flow_e2e.mjs を回す（2026-11-02 新設）
#
# ・本物の Chromium で画面を順に開き、ボタン操作で業務の流れを通す（入居者マスタ→各画面・行き来の帯・週間計画→ワークスケジュール・俯瞰・現場の端末の守り）
# ・通信は全部横取りして偽物が答える（GAS・Supabase・su-backend.json）。外へは出ない。データはすべて架空（check/fixtures/flow.mjs）
# ・毎晩の回は、画面を変えていない日でも、日付・曜日で変わる動き（今日の盤面・曜日の列）を確かめるため
# ・失敗の知らせは、実行の記録の赤い×と GitHub からの失敗のメールだけ（Issue は作らない）
name: 業務の流れの試験

on:
  pull_request:
    branches: [main]
  schedule:
    # 毎晩 日本時間 2:47（UTC 17:47）。0分・30分は混み合うので避ける
    - cron: '47 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-check-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flow:
    name: 業務の流れを通す試験
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v4

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ブラウザの道具を入れる
        working-directory: check
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: 業務の流れを通す（check/flow_e2e.mjs）
        run: node check/flow_e2e.mjs --shots check/out/flow

      - name: 薬情の取り込みのまとめて反映を通す（check/yakujo_bulk_e2e.mjs・2026-11-04）
        if: success() || failure()
        run: node check/yakujo_bulk_e2e.mjs --shots check/out/flow
      - name: 薬情の取り込みの振り分けの画面を通す（check/yakujo_assign_e2e.mjs・2026-11-12）
        if: success() || failure()
        run: node check/yakujo_assign_e2e.mjs --shots check/out/flow

      - name: 接続先の無い端末のデイ利用表と、合言葉の欄・端末の用途の守りを通す（check/daycare_live_e2e.mjs・2026-11-08）
        if: success() || failure()
        run: node check/daycare_live_e2e.mjs --shots check/out/flow

      - name: 接続先の無い端末の訪問俯瞰・全支援俯瞰をログインだけで通す（check/overview_live_e2e.mjs・2026-11-12）
        if: success() || failure()
        run: node check/overview_live_e2e.mjs --shots check/out/flow

      - name: 全支援俯瞰の入院の印と週の盤面を同時に読み、最初の盤面から斜線が付くことを通す（check/overview_hosp_e2e.mjs・2026-11-17）
        if: success() || failure()
        run: node check/overview_hosp_e2e.mjs

      - name: 給与の画面を通す（計算・確定・振込データ・職員の給与設定・取り込み・設定・check/payroll_e2e.mjs・2026-11-21）
        if: success() || failure()
        run: node check/payroll_e2e.mjs --shots check/out/flow

      - name: 給与の定時決定のタブを通す（4〜6月の確定分・算定基礎届の控え・9月分からの反映・見込み・check/payroll_santei_e2e.mjs・2026-11-26）
        if: success() || failure()
        run: node check/payroll_santei_e2e.mjs --shots check/out/flow

      - name: 給与の随時改定を通す（固定的賃金の変動・3か月・2等級・4か月目の分からの反映・check/payroll_zuiji_e2e.mjs・2026-11-28）
        if: success() || failure()
        run: node check/payroll_zuiji_e2e.mjs --shots check/out/flow

      - name: 勤怠管理の「この月を締めて、給与へ渡す」とホームの進み具合を通す（check/kintai_lockpay_e2e.mjs・2026-11-26）
        if: success() || failure()
        run: node check/kintai_lockpay_e2e.mjs --shots check/out/flow

      - name: 出勤・退勤の打刻を通す（番号の流れの名前の画面のボタン・氏名の流れ・控え・覆い・check/kintai_clock_e2e.mjs・2026-11-27）
        if: success() || failure()
        run: node check/kintai_clock_e2e.mjs --shots check/out/flow

      - name: 画面の写し（架空データ）を成果物として残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flow-shots
          path: check/out/flow/
          retention-days: 14
          if-no-files-found: ignore

  # 週間計画の計画の版（履歴・予約・切替・版の印の守り）の通し試験（2026-11-27 登録）。時間がかかるので別の仕事に分ける。
  # 予約なしの同一性（check/care_plan_nochange_e2e.mjs）は「直す前の画面」と比べる試験で、比べる元をその PR ごとに渡す必要があるため、
  # ここでは回さない（週間計画・デイ利用表を直す時に手元で回す）。
  care-plan:
    name: 計画の版の通し試験
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: リポジトリを取り出す（古い版の画面と比べるので履歴ごと）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ブラウザの道具を入れる
        working-directory: check
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: 計画の版（予約・切替・年表・版の印の送り直し）を通す（check/care_plan_e2e.mjs）
        run: node check/care_plan_e2e.mjs --shots check/out/care-plan

      - name: デイ利用表が週間計画を送る時の版の印を通す（check/care_plan_daycare_e2e.mjs）
        if: success() || failure()
        run: node check/care_plan_daycare_e2e.mjs

      - name: 古い版のタブと新しい版のタブが同じ端末にある時の守りを通す（check/care_plan_oldtab_e2e.mjs）
        if: success() || failure()
        run: node check/care_plan_oldtab_e2e.mjs

      - name: 画面の写し（架空データ）を成果物として残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-shots
          path: check/out/care-plan/
          retention-days: 14
          if-no-files-found: ignore
