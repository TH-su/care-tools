<!DOCTYPE html>
<html lang="ja" data-ds="public">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>ことわざじてん</title>
<style>
/* トークンは ~/.claude/design/tokens.css（public 系）から転記。1ファイルで持ち歩けるように外部読込はしない。 */
:root{
  --font-sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
  --fw-normal:400;--fw-bold:600;--fw-heavy:700;
  --sp-1:0.25rem;--sp-2:0.5rem;--sp-3:0.75rem;--sp-4:1rem;--sp-5:1.5rem;--sp-6:2rem;--sp-7:3rem;
  --tap-min:44px;--tap-gap:8px;--dur-fast:120ms;--dur:200ms;--ease:cubic-bezier(.2,.7,.3,1);--focus-w:3px;
  --fs-2xs:0.875rem;--fs-xs:0.9375rem;--fs-sm:1rem;--fs-base:1.0625rem;--fs-lg:1.25rem;--fs-xl:1.75rem;--fs-2xl:2.5rem;
  --lh-tight:1.35;--lh-base:1.8;--lh-loose:2;--r-sm:6px;--r-md:12px;--r-lg:20px;
  --c-bg:#FAF7F3;--c-surface:#FFFFFF;--c-surface2:#F2EDE6;--c-ink:#1C1A17;--c-ink2:#4B4741;--c-ink3:#6E685F;
  --c-border:#DDD5CA;--c-border-strong:#9F9381;--c-primary:#0B5365;--c-primary-hover:#083F4E;--c-primary-ink:#FFFFFF;
  --c-link:#0A4B5B;--c-accent:#8A4B06;--c-accent-bg:#F7EBD8;--c-accent-ink:#FFFFFF;--c-hero:#0B5365;--c-hero-ink:#FFFFFF;
  --c-ok:#14652F;--c-ok-bg:#E6F0E4;--c-warn:#7A4B00;--c-warn-bg:#F8EDD4;--c-danger:#9E1C24;--c-danger-bg:#F8E6E4;
  --c-info:#0A4B5B;--c-info-bg:#E6EDEE;--c-focus:#A85C05;
  --shadow-1:0 1px 2px rgba(16,24,32,.06),0 1px 3px rgba(16,24,32,.08);
  --shadow-2:0 2px 6px rgba(16,24,32,.08),0 8px 20px rgba(16,24,32,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --c-bg:#16130F;--c-surface:#201C17;--c-surface2:#2A251F;--c-ink:#F1ECE5;--c-ink2:#BDB5A9;--c-ink3:#918878;
    --c-border:#3B342B;--c-border-strong:#716657;--c-primary:#6DC1D6;--c-primary-hover:#93D3E3;--c-primary-ink:#062B34;
    --c-link:#7CC9DC;--c-accent:#F0B45E;--c-accent-bg:#3A2B14;--c-accent-ink:#2A1C06;--c-hero:#0C3D49;--c-hero-ink:#F2F8FA;
    --c-ok:#6FD292;--c-ok-bg:#152D1D;--c-warn:#EBB765;--c-warn-bg:#352911;--c-danger:#F5919A;--c-danger-bg:#3B1D1E;
    --c-info:#7CC9DC;--c-info-bg:#132E36;--c-focus:#F3BE6F;
    --shadow-1:0 0 0 1px var(--c-border);--shadow-2:0 0 0 1px var(--c-border),0 12px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--font-sans);font-size:var(--fs-base);line-height:var(--lh-base);font-weight:var(--fw-normal)}
:where(a,button,input,[tabindex]):focus-visible{outline:none;box-shadow:0 0 0 2px var(--c-surface),0 0 0 calc(2px + var(--focus-w)) var(--c-focus);border-radius:var(--r-sm)}
button{font:inherit;color:inherit;min-height:var(--tap-min);min-width:var(--tap-min);cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

header.top{background:var(--c-hero);color:var(--c-hero-ink);padding:calc(var(--sp-3) + env(safe-area-inset-top)) var(--sp-4) var(--sp-3);position:sticky;top:0;z-index:5;box-shadow:var(--shadow-1)}
.top-row{display:flex;align-items:center;gap:var(--sp-2);max-width:760px;margin:0 auto}
.top h1{font-size:var(--fs-xl);line-height:var(--lh-tight);margin:0;font-weight:var(--fw-heavy);flex:1;letter-spacing:.02em}
.top h1 small{display:block;font-size:var(--fs-2xs);font-weight:var(--fw-normal);opacity:.9;margin-top:2px}
.top .btn{background:transparent;color:var(--c-hero-ink);border:1.5px solid rgba(255,255,255,.7);border-radius:var(--r-md);padding:0 var(--sp-3);font-size:var(--fs-xs);font-weight:var(--fw-bold);white-space:nowrap}
.top .btn:hover{background:rgba(255,255,255,.12)}
@media (max-width:430px){.top h1{font-size:var(--fs-lg)}.top .btn{padding:0 var(--sp-2)}}

main{max-width:760px;margin:0 auto;padding:var(--sp-4) var(--sp-4) var(--sp-7)}
.panel{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:var(--shadow-1)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:var(--tap-gap);margin-bottom:var(--sp-3)}
.modes button{border:1.5px solid var(--c-border-strong);background:var(--c-surface);border-radius:var(--r-md);font-weight:var(--fw-bold);font-size:var(--fs-sm);color:var(--c-ink2);padding:var(--sp-2) var(--sp-3)}
.modes button[aria-pressed="true"]{background:var(--c-primary);color:var(--c-primary-ink);border-color:var(--c-primary)}
.modes button small{display:block;font-size:var(--fs-2xs);font-weight:var(--fw-normal)}
.search{position:relative}
.search input{width:100%;min-height:52px;font:inherit;font-size:1.25rem;padding:var(--sp-2) 52px var(--sp-2) var(--sp-4);border:2px solid var(--c-border-strong);border-radius:var(--r-md);background:var(--c-surface);color:var(--c-ink);-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--c-primary)}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--c-ink3);font-size:var(--fs-lg);border-radius:var(--r-md)}
.search .clear[hidden]{display:none}
.hint{margin:var(--sp-2) 0 0;color:var(--c-ink3);font-size:var(--fs-2xs);line-height:var(--lh-tight)}

.filters{margin-top:var(--sp-3)}
.filters h2{font-size:var(--fs-2xs);color:var(--c-ink3);margin:var(--sp-3) 0 var(--sp-1);font-weight:var(--fw-bold)}
.chips{display:flex;flex-wrap:wrap;gap:var(--tap-gap)}
.chip{border:1.5px solid var(--c-border-strong);background:var(--c-surface);color:var(--c-ink2);border-radius:999px;padding:0 var(--sp-3);font-size:var(--fs-xs);min-height:var(--tap-min)}
.chip[aria-pressed="true"]{background:var(--c-accent-bg);color:var(--c-accent);border-color:var(--c-accent);font-weight:var(--fw-bold)}
.gyo .chip{min-width:var(--tap-min);padding:0;font-weight:var(--fw-bold);font-size:var(--fs-base)}
.filters details summary{cursor:pointer;color:var(--c-link);font-size:var(--fs-xs);font-weight:var(--fw-bold);min-height:var(--tap-min);display:flex;align-items:center;list-style:none}
.filters details summary::-webkit-details-marker{display:none}
.filters details summary::before{content:"▶";font-size:.7em;margin-right:var(--sp-2);transition:transform var(--dur-fast) var(--ease)}
.filters details[open] summary::before{transform:rotate(90deg)}

.status{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin:var(--sp-4) 0 var(--sp-2);color:var(--c-ink2);font-size:var(--fs-xs);min-height:var(--sp-5)}
.status .note{color:var(--c-warn);font-weight:var(--fw-bold)}
.status .reset{border:0;background:transparent;color:var(--c-link);font-weight:var(--fw-bold);font-size:var(--fs-xs);padding:0 var(--sp-2)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-2)}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--shadow-1);overflow:hidden}
.card-head{width:100%;text-align:left;border:0;background:transparent;padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3);min-height:64px}
.card-head:hover{background:var(--c-surface2)}
.card-head .txt{flex:1;min-width:0}
.card-head .t{font-size:var(--fs-lg);font-weight:var(--fw-heavy);line-height:var(--lh-tight);color:var(--c-ink);overflow-wrap:anywhere}
.card-head .y{font-size:var(--fs-2xs);color:var(--c-ink3);margin-top:2px}
.card-head .m1{font-size:var(--fs-xs);color:var(--c-ink2);margin-top:var(--sp-1);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;line-height:var(--lh-tight)}
.card.open .card-head .m1{display:none}
.card-head .arrow{color:var(--c-ink3);font-size:var(--fs-xs);transition:transform var(--dur-fast) var(--ease);flex:none}
.card.open .card-head .arrow{transform:rotate(90deg)}
.card-body{display:none;padding:0 var(--sp-4) var(--sp-4);border-top:1px solid var(--c-border)}
.card.open .card-body{display:block}
.card-body dl{margin:var(--sp-3) 0 0;display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2) var(--sp-3);align-items:start}
.card-body dt{font-size:var(--fs-2xs);color:var(--c-primary-ink);background:var(--c-primary);border-radius:var(--r-sm);padding:1px var(--sp-2);font-weight:var(--fw-bold);white-space:nowrap;line-height:1.6;margin-top:.3em}
.card-body dd{margin:0;font-size:var(--fs-base);line-height:var(--lh-base)}
.card-body dd.ex{color:var(--c-ink2)}
.kind{display:inline-block;font-size:var(--fs-2xs);color:var(--c-accent);background:var(--c-accent-bg);border-radius:999px;padding:0 var(--sp-2);font-weight:var(--fw-bold);line-height:1.7;margin-right:var(--sp-1)}
.tagline{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:var(--sp-3);align-items:center}
.tagline .kind{margin:0}
.tagline .tg{font-size:var(--fs-2xs);color:var(--c-ink3);border:1px solid var(--c-border);border-radius:999px;padding:0 var(--sp-2);line-height:1.7}
.links{display:flex;flex-wrap:wrap;gap:var(--tap-gap)}
.links .lk{border:1.5px solid var(--c-border-strong);background:var(--c-surface);color:var(--c-link);border-radius:var(--r-md);padding:0 var(--sp-3);font-size:var(--fs-xs);font-weight:var(--fw-bold);text-align:left}
.links .lk:hover{background:var(--c-surface2)}
mark{background:var(--c-accent-bg);color:inherit;border-radius:2px;padding:0 1px}

.empty{background:var(--c-info-bg);color:var(--c-info);border-radius:var(--r-md);padding:var(--sp-4);font-size:var(--fs-base)}
.empty ul{margin:var(--sp-2) 0 0;padding-left:1.4em}
.toast{position:fixed;left:50%;bottom:calc(var(--sp-4) + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--c-danger-bg);color:var(--c-danger);border:1px solid var(--c-danger);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);box-shadow:var(--shadow-2);max-width:90vw;z-index:20;font-size:var(--fs-xs)}
.toast[hidden]{display:none}
footer.foot{max-width:760px;margin:0 auto;padding:0 var(--sp-4) var(--sp-6);color:var(--c-ink3);font-size:var(--fs-2xs);line-height:var(--lh-tight)}

/* 印刷: 「印刷」ボタンで body に print-all を付け、全件一覧を印刷する */
#printAll{display:none}
@media print{
  @page{margin:12mm}
  header.top,main,footer.foot,.toast{display:none!important}
  body{background:#fff;color:#000;font-size:10.5pt;line-height:1.5}
  body.print-all #printAll{display:block}
  #printAll h1{font-size:16pt;margin:0 0 6pt}
  #printAll .pcount{font-size:9pt;color:#444;margin:0 0 8pt}
  #printAll .pgyo{font-size:12pt;font-weight:700;border-bottom:1.5pt solid #000;margin:10pt 0 4pt;break-after:avoid}
  #printAll .pitem{break-inside:avoid;margin:0 0 4pt;padding-left:1em;text-indent:-1em}
  #printAll .pt{font-weight:700}
  #printAll .py{font-size:8.5pt;color:#444}
  #printAll .pk{font-size:8pt;border:.5pt solid #666;border-radius:3pt;padding:0 3pt;margin-left:3pt;color:#333}
  #printAll .pm{display:block;text-indent:0}
  #printAll .pcols{column-count:2;column-gap:8mm}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>ことわざじてん<small id="countAll"></small></h1>
    <button type="button" class="btn" id="btnRandom" title="ランダムに1つ表示">おまかせ</button>
    <button type="button" class="btn" id="btnPrint" title="全件の一覧を印刷">印刷</button>
  </div>
</header>

<main>
  <section class="panel" aria-label="さがす">
    <div class="modes" role="group" aria-label="さがし方">
      <button type="button" id="modeT" aria-pressed="true">ことわざから<small>ことば・よみがな</small></button>
      <button type="button" id="modeM" aria-pressed="false">いみから<small>逆引き・キーワード</small></button>
    </div>
    <div class="search">
      <label for="q" class="sr-only">けんさく</label>
      <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="ことわざ か よみがな（例：さる）">
      <button type="button" class="clear" id="btnClear" aria-label="入力を消す" hidden>✕</button>
    </div>
    <p class="hint" id="hint">ひらがなでも漢字でも、とちゅうまででも さがせます。</p>

    <div class="filters">
      <h2 id="gyoLabel">さいしょの文字</h2>
      <div class="chips gyo" id="gyoChips" role="group" aria-labelledby="gyoLabel"></div>
      <details id="tagDetails">
        <summary>テーマ・種類でしぼる</summary>
        <h2 id="tagLabel">テーマ</h2>
        <div class="chips" id="tagChips" role="group" aria-labelledby="tagLabel"></div>
        <h2 id="kindLabel">種類</h2>
        <div class="chips" id="kindChips" role="group" aria-labelledby="kindLabel"></div>
      </details>
    </div>
  </section>

  <div class="status">
    <span id="count" role="status" aria-live="polite"></span>
    <button type="button" class="reset" id="btnReset" hidden>すべて表示</button>
  </div>
  <ul class="list" id="list"></ul>
</main>

<footer class="foot">
  小学校で学ぶことわざ・故事成語・慣用句を収録。ことわざをタップすると、意味・使い方・にたことわざが開きます。
</footer>

<section id="printAll" aria-hidden="true"></section>
<div class="toast" id="toast" hidden role="alert"></div>

<script>
/* ===== データ（正本はこのファイル内。t=ことわざ y=よみ k=種類 m=意味 e=例文 tags=テーマ kw=逆引き用キーワード sim=にている opp=はんたい alt=別表記・任意） ===== */
const KOTOWAZA=[
{t:"悪事千里を走る",y:"あくじせんりをはしる",k:"ことわざ",m:"悪いおこないやうわさは、あっという間に遠くまで広まってしまうということ。",e:"悪事千里を走るというから、かくしごとはすぐにみんなに知られてしまうよ。",tags:["ことば・うわさ","注意・用心"],kw:["わるいこと","うわさ","ひろまる"],sim:["人の口に戸は立てられぬ"],opp:[]},
{t:"悪銭身につかず",y:"あくせんみにつかず",k:"ことわざ",m:"悪いことをして手に入れたお金は、むだづかいですぐになくなってしまうということ。",e:"悪銭身につかずで、ずるをしてもらったおこづかいはすぐに消えてしまった。",tags:["お金"],kw:["おかね","ずる","なくなる"],sim:[],opp:[]},
{t:"頭隠して尻隠さず",y:"あたまかくしてしりかくさず",k:"ことわざ",m:"悪いことや欠点の一部だけをかくして、全部かくしたつもりになっていること。",e:"おかしのふくろがゴミ箱から見えているよ。頭隠して尻隠さずだね。",tags:["失敗","注意・用心"],kw:["かくす","ばれる","しっぱい"],sim:[],opp:[]},
{t:"暑さ寒さも彼岸まで",y:"あつささむさもひがんまで",k:"ことわざ",m:"夏の暑さも冬の寒さも、春分・秋分のころ（お彼岸）になればやわらぐということ。",e:"暑さ寒さも彼岸までというとおり、九月の終わりになるとすずしくなった。",tags:["自然・季節"],kw:["あつい","さむい","きせつ","ひがん"],sim:[],opp:[]},
{t:"後の祭り",y:"あとのまつり",k:"ことわざ",m:"時期におくれてしまい、もう手おくれで役に立たないこと。",e:"テストが終わってから勉強しても後の祭りだよ。",tags:["時間","失敗"],kw:["ておくれ","おそい","まにあわない"],sim:["後悔先に立たず","覆水盆に返らず"],opp:[]},
{t:"雨降って地固まる",y:"あめふってじかたまる",k:"ことわざ",m:"もめごとや心配ごとのあとは、かえって前よりも物事がうまくいくようになるということ。",e:"けんかしたけれど仲直りして前より仲良くなった。雨降って地固まるだね。",tags:["人づきあい","運・チャンス"],kw:["けんか","なかなおり","よくなる"],sim:["災い転じて福となす"],opp:[]},
{t:"案ずるより産むが易し",y:"あんずるよりうむがやすし",k:"ことわざ",m:"心配していたことも、実際にやってみると意外に簡単にできるものだということ。",e:"発表は心配だったけど、案ずるより産むが易しで、始まってみれば楽しかった。",tags:["気持ち・態度","努力・がんばる"],kw:["しんぱい","やってみる","かんたん"],sim:[],opp:[]},
{t:"青菜に塩",y:"あおなにしお",k:"ことわざ",m:"元気だった人が急にしょんぼりと元気をなくしてしまうようす。",e:"試合に負けたお兄ちゃんは青菜に塩のようにしょげている。",tags:["気持ち・態度"],kw:["げんきがない","しょんぼり","がっかり"],sim:[],opp:[]},
{t:"会うは別れの始め",y:"あうはわかれのはじめ",k:"ことわざ",m:"出会った人とはいつか必ず別れるときが来るということ。",e:"会うは別れの始めというけれど、転校する友だちとはずっと仲良くしたい。",tags:["人づきあい","時間"],kw:["であい","わかれ","さよなら"],sim:[],opp:[]},
{t:"秋茄子は嫁に食わすな",y:"あきなすはよめにくわすな",k:"ことわざ",m:"秋のなすはとてもおいしいので嫁には食べさせるな、という意地悪の意味と、体を冷やすから嫁のために食べさせるな、という思いやりの意味がある。",e:"秋茄子は嫁に食わすなというほど、秋のなすはおいしい。",tags:["自然・季節","家族"],kw:["なす","あき","おいしい"],sim:[],opp:[]},
{t:"足元から鳥が立つ",y:"あしもとからとりがたつ",k:"ことわざ",m:"身近なところで思いがけないことが急に起きること。また、急に思い立って物事を始めること。",e:"足元から鳥が立つように、急に引っこしが決まった。",tags:["運・チャンス"],kw:["きゅうに","おどろく","とつぜん"],sim:["寝耳に水","藪から棒"],opp:[]},

/* ===== 検索の下ごしらえ =====
   ・正規表現にユーザー入力を渡さない（「(」「*」などでエラーにしない）
   ・カタカナ→ひらがな、全角英数→半角、空白と記号を除いて比較する
   ・0件のときだけ濁点・半濁点を無視して再検索する（「さる」で「ざる」も拾う） */
function norm(s){
  s=String(s==null?'':s).normalize('NFKC').toLowerCase();
  s=s.replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});
  return s.replace(/[\s　、。，．・「」『』（）()〔〕［］\[\]〜~ー－—\-!！?？,.:：;；'"“”‘’]/g,'');
}
function stripDaku(s){return s.normalize('NFD').replace(/[゙゚]/g,'').normalize('NFC');}
const GYO={'あ':'あいうえお','か':'かきくけこ','さ':'さしすせそ','た':'たちつてと','な':'なにぬねの','は':'はひふへほ','ま':'まみむめも','や':'やゆよ','ら':'らりるれろ','わ':'わをん'};
const SMALL={'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ'};
function gyoOf(y){
  let c=stripDaku(y.charAt(0));c=SMALL[c]||c;
  for(const g in GYO){if(GYO[g].indexOf(c)>=0)return g;}
  return 'わ';
}
const ITEMS=KOTOWAZA.map(function(d,i){
  const nt=norm(d.t),ny=norm(d.y);
  const nalt=(d.alt||[]).map(norm);
  return {i:i,d:d,nt:nt,ny:ny,nt2:stripDaku(nt),ny2:stripDaku(ny),nalt:nalt,nalt2:nalt.map(stripDaku),nm:norm(d.m),ne:norm(d.e),nkw:d.kw.map(norm),ntags:d.tags.map(norm),gyo:gyoOf(d.y)};
}).sort(function(a,b){return a.ny<b.ny?-1:a.ny>b.ny?1:a.i-b.i;});
const BY_T=new Map(ITEMS.map(function(it){return [it.d.t,it];}));
const ALL_TAGS=Array.from(new Set(KOTOWAZA.flatMap(function(d){return d.tags;})));
const ALL_KINDS=['ことわざ','故事成語','慣用句'];

/* ===== 状態（UI状態の mode だけ localStorage に保存。検索語や絞り込みは保存しない） ===== */
const LS_KEY='kj_mode';
const state={mode:'t',q:'',gyo:'',tag:'',kind:''};
try{const m=localStorage.getItem(LS_KEY);if(m==='t'||m==='m')state.mode=m;}catch(e){}

/* ===== 検索本体 ===== */
function termsOf(q){return String(q).split(/[\s　]+/).map(norm).filter(Boolean);}
function scoreForward(it,t){
  if(it.nt.indexOf(t)===0||it.ny.indexOf(t)===0||it.nalt.some(function(a){return a.indexOf(t)===0;}))return 3;
  if(it.nt.indexOf(t)>=0||it.ny.indexOf(t)>=0||it.nalt.some(function(a){return a.indexOf(t)>=0;}))return 2;
  return 0;
}
function scoreForwardLoose(it,t){
  const t2=stripDaku(t);
  if(it.nt2.indexOf(t2)===0||it.ny2.indexOf(t2)===0||it.nalt2.some(function(a){return a.indexOf(t2)===0;}))return 3;
  if(it.nt2.indexOf(t2)>=0||it.ny2.indexOf(t2)>=0||it.nalt2.some(function(a){return a.indexOf(t2)>=0;}))return 2;
  return 0;
}
function scoreMeaning(it,t){
  let s=0;
  if(it.nkw.some(function(k){return k===t;}))s=Math.max(s,5);
  else if(it.nkw.some(function(k){return k.indexOf(t)>=0||(t.length>=3&&t.indexOf(k)>=0);}))s=Math.max(s,4);
  if(it.ntags.some(function(k){return k.indexOf(t)>=0;}))s=Math.max(s,4);
  if(it.nm.indexOf(t)>=0)s=Math.max(s,3);
  if(it.nt.indexOf(t)>=0||it.ny.indexOf(t)>=0)s=Math.max(s,2);
  if(it.ne.indexOf(t)>=0)s=Math.max(s,1);
  return s;
}
function passFilters(it){
  if(state.gyo&&it.gyo!==state.gyo)return false;
  if(state.tag&&it.d.tags.indexOf(state.tag)<0)return false;
  if(state.kind&&it.d.k!==state.kind)return false;
  return true;
}
function runSearch(){
  const terms=termsOf(state.q);
  const base=ITEMS.filter(passFilters);
  if(!terms.length)return {items:base,loose:false};
  const scorer=state.mode==='m'?scoreMeaning:scoreForward;
  let hits=rank(base,terms,scorer);
  let loose=false;
  if(!hits.length&&state.mode==='t'){hits=rank(base,terms,scoreForwardLoose);loose=hits.length>0;}
  if(!hits.length&&state.mode==='m'){hits=rank(base,terms,scoreForward);loose=hits.length>0;}
  return {items:hits,loose:loose};
}
function rank(base,terms,scorer){
  const out=[];
  for(const it of base){
    let total=0,ok=true;
    for(const t of terms){const s=scorer(it,t);if(!s){ok=false;break;}total+=s;}
    if(ok)out.push({it:it,s:total});
  }
  out.sort(function(a,b){return b.s-a.s||(a.it.ny<b.it.ny?-1:a.it.ny>b.it.ny?1:0);});
  return out.map(function(o){return o.it;});
}

/* ===== 描画（DOM 生成で組み立て、innerHTML に文字列を流し込まない） ===== */
const $=function(id){return document.getElementById(id);};
const listEl=$('list'),countEl=$('count'),qEl=$('q');
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function highlightInto(parent,text,raw){
  /* 強調は「入力そのまま」「カタカナ→ひらがな」の2通りで元文字列から探せた時だけ。見つからなければ素で出す */
  const cands=[];
  const r=String(raw||'').trim();
  if(r){cands.push(r);const h=r.normalize('NFKC').replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});if(h!==r)cands.push(h);}
  for(const c of cands){
    const idx=text.indexOf(c);
    if(c&&idx>=0){
      parent.appendChild(document.createTextNode(text.slice(0,idx)));
      parent.appendChild(el('mark',null,text.slice(idx,idx+c.length)));
      parent.appendChild(document.createTextNode(text.slice(idx+c.length)));
      return;
    }
  }
  parent.appendChild(document.createTextNode(text));
}
function buildCard(it,open){
  const d=it.d;
  const li=el('li','card'+(open?' open':''));
  li.dataset.t=d.t;
  const head=el('button','card-head');head.type='button';head.setAttribute('aria-expanded',open?'true':'false');
  const txt=el('div','txt');
  const t=el('div','t');highlightInto(t,d.t,state.q);txt.appendChild(t);
  const y=el('div','y');highlightInto(y,d.y,state.q);txt.appendChild(y);
  txt.appendChild(el('div','m1',d.m));
  head.appendChild(txt);head.appendChild(el('span','arrow','▶'));
  head.addEventListener('click',function(){
    const isOpen=li.classList.toggle('open');head.setAttribute('aria-expanded',isOpen?'true':'false');
  });
  li.appendChild(head);
  const body=el('div','card-body');
  const dl=el('dl');
  dl.appendChild(el('dt',null,'いみ'));const dm=el('dd');highlightInto(dm,d.m,state.mode==='m'?state.q:'');dl.appendChild(dm);
  dl.appendChild(el('dt',null,'つかい方'));dl.appendChild(el('dd','ex',d.e));
  if(d.alt&&d.alt.length){dl.appendChild(el('dt',null,'べつの言い方'));dl.appendChild(el('dd',null,d.alt.join('／')));}
  if(d.sim.length){dl.appendChild(el('dt',null,'にている'));dl.appendChild(linkDd(d.sim));}
  if(d.opp.length){dl.appendChild(el('dt',null,'はんたい'));dl.appendChild(linkDd(d.opp));}
  body.appendChild(dl);
  const tl=el('div','tagline');tl.appendChild(el('span','kind',d.k));d.tags.forEach(function(tg){tl.appendChild(el('span','tg',tg));});
  body.appendChild(tl);
  li.appendChild(body);
  return li;
}
function linkDd(arr){
  const dd=el('dd');const wrap=el('div','links');
  arr.forEach(function(t){
    const b=el('button','lk',t);b.type='button';
    b.addEventListener('click',function(){showEntry(t);});
    wrap.appendChild(b);
  });
  dd.appendChild(wrap);return dd;
}
function render(opts){
  opts=opts||{};
  try{
    const res=runSearch();
    listEl.textContent='';
    const frag=document.createDocumentFragment();
    const openFirst=!!opts.openFirst;
    res.items.forEach(function(it,idx){frag.appendChild(buildCard(it,openFirst&&idx===0));});
    listEl.appendChild(frag);
    const hasCond=!!(termsOf(state.q).length||state.gyo||state.tag||state.kind);
    $('btnReset').hidden=!hasCond;
    countEl.textContent='';
    if(res.items.length){
      countEl.appendChild(document.createTextNode(res.items.length+'件'+(hasCond?'（全'+ITEMS.length+'件中）':'')));
      if(res.loose){countEl.appendChild(document.createTextNode(' '));countEl.appendChild(el('span','note',state.mode==='m'?'いみでは見つからなかったので、ことわざの中からさがしました':'にごり（゛゜）をのぞいてさがしました'));}
    }else{
      countEl.textContent='見つかりませんでした';
      const box=el('li','empty');
      box.appendChild(el('div',null,'「'+state.q.trim()+'」に合うものがありません。'));
      const ul=el('ul');
      ul.appendChild(el('li',null,'ことばを短くしてみる（例：「さるもきから」→「さる」）'));
      ul.appendChild(el('li',null,state.mode==='m'?'「ことわざから」に切りかえて、ことわざの一部で さがす':'「いみから」に切りかえて、意味のことば（例：がんばる）で さがす'));
      ul.appendChild(el('li',null,'ひらがなで入れてみる'));
      box.appendChild(ul);
      listEl.appendChild(box);
    }
    $('btnClear').hidden=!state.q;
  }catch(err){
    showToast('表示でエラーが起きました。入力を消してもう一度ためしてください。');
    if(window.console)console.error(err);
  }
}
function showEntry(t){
  /* 類義・対義リンク／おまかせ からの遷移: 絞り込みを外し、ことわざ検索でそのものを開く */
  if(!BY_T.has(t))return;
  state.mode='t';state.q=t;state.gyo='';state.tag='';state.kind='';
  syncControls();render({openFirst:true});
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);}
}
function showToast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(showToast._tm);showToast._tm=setTimeout(function(){t.hidden=true;},5000);}

/* ===== コントロール ===== */
function setPressed(container,value){
  Array.prototype.forEach.call(container.querySelectorAll('[data-v]'),function(b){b.setAttribute('aria-pressed',b.dataset.v===value?'true':'false');});
}
function syncControls(){
  $('modeT').setAttribute('aria-pressed',state.mode==='t'?'true':'false');
  $('modeM').setAttribute('aria-pressed',state.mode==='m'?'true':'false');
  qEl.placeholder=state.mode==='m'?'いみ や キーワード（例：がんばる、ねこ）':'ことわざ か よみがな（例：さる）';
  $('hint').textContent=state.mode==='m'?'「どりょく」「むだ」「うそ」のように、意味のことばで さがせます。空白で区切ると両方に合うものだけ出ます。':'ひらがなでも漢字でも、とちゅうまででも さがせます。';
  if(qEl.value!==state.q)qEl.value=state.q;
  setPressed($('gyoChips'),state.gyo);setPressed($('tagChips'),state.tag);setPressed($('kindChips'),state.kind);
  if(state.tag||state.kind)$('tagDetails').open=true;
}
function makeChips(container,values,key){
  container.textContent='';
  const all=el('button','chip','すべて');all.type='button';all.dataset.v='';
  all.addEventListener('click',function(){state[key]='';syncControls();render();});
  container.appendChild(all);
  values.forEach(function(v){
    const b=el('button','chip',v);b.type='button';b.dataset.v=v;
    b.addEventListener('click',function(){state[key]=state[key]===v?'':v;syncControls();render();});
    container.appendChild(b);
  });
}
function setMode(m){
  state.mode=m;
  try{localStorage.setItem(LS_KEY,m);}catch(e){}
  syncControls();render();qEl.focus();
}
let tm=null;
qEl.addEventListener('input',function(){
  state.q=qEl.value;$('btnClear').hidden=!state.q;
  clearTimeout(tm);tm=setTimeout(render,80);
});
qEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();clearTimeout(tm);render();qEl.blur();}
  if(e.key==='Escape'){state.q='';qEl.value='';render();}
});
$('btnClear').addEventListener('click',function(){state.q='';qEl.value='';render();qEl.focus();});
$('btnReset').addEventListener('click',function(){state.q='';state.gyo='';state.tag='';state.kind='';syncControls();render();});
$('modeT').addEventListener('click',function(){setMode('t');});
$('modeM').addEventListener('click',function(){setMode('m');});
$('btnRandom').addEventListener('click',function(){
  const it=ITEMS[Math.floor(Math.random()*ITEMS.length)];showEntry(it.d.t);
});
$('btnPrint').addEventListener('click',function(){
  try{
    buildPrint();
    document.body.classList.add('print-all');
    window.print();
  }catch(err){showToast('印刷の準備でエラーが起きました。');if(window.console)console.error(err);}
});
window.addEventListener('afterprint',function(){document.body.classList.remove('print-all');});
function buildPrint(){
  const root=$('printAll');root.textContent='';
  root.appendChild(el('h1',null,'ことわざじてん'));
  root.appendChild(el('p','pcount','全'+ITEMS.length+'件（ことわざ・故事成語・慣用句）五十音順'));
  const cols=el('div','pcols');
  let cur='';
  ITEMS.forEach(function(it){
    if(it.gyo!==cur){cur=it.gyo;cols.appendChild(el('div','pgyo',cur+'行'));}
    const p=el('div','pitem');
    p.appendChild(el('span','pt',it.d.t));p.appendChild(document.createTextNode(' '));
    p.appendChild(el('span','py','（'+it.d.y+'）'));
    if(it.d.k!=='ことわざ')p.appendChild(el('span','pk',it.d.k));
    p.appendChild(el('span','pm',it.d.m));
    cols.appendChild(p);
  });
  root.appendChild(cols);
}
window.addEventListener('error',function(){showToast('エラーが起きました。うまく動かないときは、ページを読みこみ直してください。');});

/* ===== 起動 ===== */
makeChips($('gyoChips'),Object.keys(GYO),'gyo');
makeChips($('tagChips'),ALL_TAGS,'tag');
makeChips($('kindChips'),ALL_KINDS,'kind');
$('countAll').textContent='全'+ITEMS.length+'件';
syncControls();render();
</script>
</body>
</html>
