<style>
/* 採用管理（2026-10-26 代表者承認の凍結仕様 v1）。
   色は担当者会議のページと同じ濃さ（コントラスト7:1目標）。ライト固定。段階は色でなく番号と名前で示す。
   文字は 17px・押せる所は 44px 以上・フォーカスは 3px の枠。 */
:root{
  --pri:#0b57d0; --pri-l:#ecf3fe; --pri-d:#0842a0;
  --ok:#1e6b23; --ok-l:#e8f5e9; --ng:#b3261e; --ng-l:#fdecea;
  --warn-bg:#fdf3e3; --warn-tx:#8a5200;
  --g0:#f7f8f9; --g1:#f1f3f4; --g2:#e5e7ea; --g3:#d2d5d9;
  --g5:#6b7075; --g6:#5f6368; --g7:#4b4f52; --g9:#1f2124;
  --r:12px; --sh:0 1px 4px rgba(0,0,0,.10);
  --focus:#0b57d0;
}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  background:var(--g0); color:var(--g9); font-size:1.0625rem; line-height:1.6; padding-bottom:64px; overflow-wrap:anywhere}
button,input,select,textarea{font-family:inherit; font-size:1.0625rem; color:inherit}
button{cursor:pointer}
a{color:var(--pri-d)}
[hidden]{display:none !important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; margin:-1px; padding:0; border:0}

/* ── 見出し ── */
.hdr{position:sticky; top:0; z-index:50; background:var(--pri); color:#fff; padding:8px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; box-shadow:var(--sh)}
.hdr h1{font-size:1.0625rem; margin:0; font-weight:700; flex:1; white-space:nowrap}
.hdr-btn{display:inline-flex; align-items:center; min-height:44px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.5);
  color:#fff; border-radius:8px; padding:6px 12px; font-size:1rem; text-decoration:none; white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.28)}
.hdr-btn:focus-visible{outline:3px solid #fff; outline-offset:1px}
.hdr .sync{font-size:0.9375rem; background:rgba(0,0,0,.22); padding:2px 10px; border-radius:14px; white-space:nowrap}
.hdr .sync:empty{display:none}

#a-main{max-width:1600px; margin:0 auto; padding:12px}
.cd{background:#fff; border-radius:var(--r); box-shadow:var(--sh); padding:14px; margin-bottom:12px; min-width:0}
h2{font-size:1.125rem; margin:0 0 10px}
h3{font-size:1.0625rem; margin:14px 0 6px}
.hint{color:var(--g7); margin:6px 0}
.muted{color:var(--g6)}
.msg{margin:8px 0; padding:8px 12px; border-radius:8px}
.msg:empty{display:none}
.msg.ng{background:var(--ng-l); color:var(--ng); border:1px solid var(--ng); font-weight:600}
.msg.ok{background:var(--ok-l); color:var(--ok); border:1px solid var(--ok)}
.msg.warn{background:var(--warn-bg); color:var(--warn-tx); border:1px solid var(--warn-tx); font-weight:600}
.msg.busy{background:var(--g1); color:var(--g9); border:1px solid var(--g5)}
.gate{font-size:1.125rem}
.gate p{margin:6px 0}

/* ── ボタン ── */
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px; padding:8px 16px;
  border-radius:10px; border:1px solid var(--g5); background:#fff; color:var(--g9); font-weight:600; text-decoration:none}
.btn:hover{background:var(--g1)}
.btn.pri{background:var(--pri); border-color:var(--pri); color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ng{color:var(--ng); border-color:var(--ng)}
.btn.ngf{background:var(--ng); border-color:var(--ng); color:#fff}
.btn.sm{padding:6px 10px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.acts{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

/* ── タブ ── */
.tabs{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px}
.tab{min-height:44px; padding:8px 14px; border-radius:10px; border:1px solid var(--g5); background:#fff; font-weight:600}
.tab[aria-selected="true"]{background:var(--pri); border-color:var(--pri); color:#fff}

/* ── 選考ボード ── */
.bar{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:flex-end; margin:0 0 10px}
.fi{display:flex; flex-direction:column; gap:3px; min-width:0}
.fi label,.fl{font-weight:700; font-size:1rem}
.fi input,.fi select,.fi textarea,.dlg textarea,.dlg select,.dlg input{width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--g5); border-radius:8px; background:#fff; min-width:0}
.fi textarea,.dlg textarea{line-height:1.6; resize:vertical; min-height:88px}
.cols{display:grid; grid-template-columns:repeat(6,minmax(180px,1fr)); gap:10px; overflow-x:auto; align-items:start}
.col{background:var(--g1); border:2px solid transparent; border-radius:var(--r); padding:8px; min-height:160px; min-width:0}
.col h3{margin:0 0 8px; font-size:1rem}
.col.drop-ok{border:2px dashed var(--pri); background:var(--pri-l)}
.col.drop-no{opacity:.55}
.cards{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.card{background:#fff; border:1px solid var(--g3); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:4px}
.card.late{border:3px solid var(--ng)}
.card.soon{background:var(--warn-bg)}
.card-n{font-weight:700; text-align:left; background:none; border:0; padding:4px 0; min-height:44px; color:var(--pri-d); text-decoration:underline}
.card-s{color:var(--g7); font-size:0.9375rem}
.card-late{color:var(--ng); font-weight:700; font-size:0.9375rem}
.card-due{color:var(--warn-tx); font-weight:700; font-size:0.9375rem}
.card-due.past{color:var(--ng)}
.undo{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:120; background:var(--g9); color:#fff; border-radius:14px;
  padding:8px 10px 8px 16px; display:flex; align-items:center; gap:10px; max-width:94vw; box-shadow:0 6px 20px rgba(0,0,0,.3)}
.undo .btn{background:#fff; color:var(--g9)}
.m-stage{display:none}
.tbl{width:100%; border-collapse:collapse; background:#fff}
.tbl th,.tbl td{border:1px solid var(--g3); padding:6px 8px; text-align:left; vertical-align:top}
.tbl th{background:var(--g1)}
.tbl td.num,.tbl th.num{text-align:right; white-space:nowrap}
.tbl tr.few td{color:var(--g6)}
.tbl-wrap{overflow-x:auto}
.tbl caption{text-align:left; font-weight:700; padding:4px 0}
.imp-sum{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; margin:8px 0}
.ok-t{color:var(--ok); font-weight:700}
.ng-t{color:var(--ng); font-weight:700}

/* ── 詳細（右から出る板） ── */
.pane{position:fixed; top:0; right:0; bottom:0; width:min(560px,100vw); background:#fff; z-index:90; box-shadow:-4px 0 20px rgba(0,0,0,.2);
  overflow-y:auto; padding:0 16px 80px}
.pane-h{position:sticky; top:0; background:#fff; z-index:2; display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--g3)}
.pane-h h2{flex:1; margin:0; font-size:1.25rem}
.sec{border-top:1px solid var(--g3); padding:8px 0 12px}
.sec h3{margin:8px 0}
.fgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr)); gap:10px 12px; margin:0 0 8px}
.list{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.list li{border:1px solid var(--g3); border-radius:10px; padding:8px 10px}
.lockfs{border:0; margin:0; padding:0; min-width:0}
.lockfs:disabled{opacity:.75}
.chk{display:flex; align-items:center; gap:8px; min-height:44px; font-weight:600; cursor:pointer}
.chk input{width:24px; height:24px; flex:0 0 auto}
.chks{display:flex; flex-wrap:wrap; gap:0 14px}
.rt{border-collapse:collapse; width:100%}
.rt th,.rt td{border:1px solid var(--g3); padding:6px 8px; text-align:left}

/* ── 確かめの窓・評価の窓 ── */
.dlg{border:0; border-radius:14px; padding:0; max-width:min(94vw,720px); width:100%; box-shadow:0 12px 40px rgba(0,0,0,.25); color:var(--g9)}
.dlg::backdrop{background:rgba(0,0,0,.4)}
.dlg-in{padding:18px 20px 16px; max-height:86vh; overflow-y:auto}
.dlg-in h2{margin:0 0 8px}
.dlg-in p{margin:0 0 6px}
.dlg-btns{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-top:12px}
.score{border:0; margin:0 0 10px; padding:0}
.score legend{font-weight:700; padding:0}
.score-r{display:flex; gap:6px; flex-wrap:wrap}
.score-r label{display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; border:1px solid var(--g5); border-radius:8px; gap:4px; padding:0 8px; cursor:pointer}
.score-r input{width:20px; height:20px}

#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--g9); color:#fff;
  padding:10px 18px; border-radius:22px; font-size:1rem; z-index:200; opacity:0; transition:.25s; pointer-events:none; max-width:90%; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.chart-box{max-width:720px; height:280px}

/* ── iPhone（幅700px以下だけ）: ボードは段階の選択＋縦の一覧・詳細は全画面・事務所の操作は隠す ── */
.m-only{display:none}
@media (max-width:700px){
  .m-stage{display:flex}
  .cols{grid-template-columns:minmax(0,1fr)}
  .col.m-off{display:none}
  .pane{width:100vw}
  .pc-only{display:none !important}
  .m-only{display:block}
  input,select,textarea{font-size:16px}
}

/* ── 紙面（面接予定・白紙の評価シート）。印刷の準備の時だけ中身を作り、終わったら空にする ── */
#a-print{display:none}
.pv{color:#000; line-height:1.4}
.pv h1{font-size:1.5em; margin:0 0 .4em}
.pv h2{font-size:1.15em; margin:.8em 0 .3em}
.pv-t{width:100%; border-collapse:collapse}
.pv-t th,.pv-t td{border:1px solid #000; padding:.3em .4em; text-align:left; vertical-align:top; font-size:1em}
.pv-t th{background:#eee}
.pv-box{height:5em}
.pv-sc{white-space:nowrap; letter-spacing:.6em}
@media print{
  html,body{background:#fff !important}
  body{padding:0 !important}
  .hdr,#a-main,#toast,.dlg,.pane,.undo{display:none !important}
  #a-print{display:block; font-size:var(--ap-fs,12px)}
}
</style>
</head>
<body>

<header class="hdr">
  <a class="hdr-btn" href="index.html">← メニュー</a>
  <h1>採用管理</h1>

</header>

<main id="a-main">
  <!-- 現場端末・管理者でない時の案内 -->
  <div class="cd gate" id="a-gate" hidden></div>

  <section id="a-app" hidden>
    <nav class="tabs" role="tablist" aria-label="採用管理の画面">
      <button type="button" class="tab" role="tab" id="t-board" data-tab="board" aria-controls="p-board">選考</button>

      <button type="button" class="tab" role="tab" id="t-dash" data-tab="dash" aria-controls="p-dash">集計</button>
      <button type="button" class="tab" role="tab" id="t-import" data-tab="import" aria-controls="p-import">取り込み</button>
      <button type="button" class="tab" role="tab" id="t-expire" data-tab="expire" aria-controls="p-expire">保管期限</button>
      <button type="button" class="tab" role="tab" id="t-settings" data-tab="settings" aria-controls="p-settings">設定</button>
    </nav>
    <div class="msg" id="a-msg" role="alert"></div>

    <section class="cd" id="p-board" role="tabpanel" aria-labelledby="t-board" hidden></section>
    <section class="cd" id="p-sched" role="tabpanel" aria-labelledby="t-sched" hidden></section>
    <section class="cd" id="p-dash" role="tabpanel" aria-labelledby="t-dash" hidden></section>
    <section class="cd" id="p-import" role="tabpanel" aria-labelledby="t-import" hidden></section>
    <section class="cd" id="p-expire" role="tabpanel" aria-labelledby="t-expire" hidden></section>
    <section class="cd" id="p-settings" role="tabpanel" aria-labelledby="t-settings" hidden></section>
  </section>
</main>

<!-- 応募者の詳細（右から出る板・iPhone では全画面） -->
<aside class="pane" id="a-pane" aria-labelledby="a-pane-h" hidden></aside>
<div class="undo" id="a-undo" role="status" aria-live="polite" hidden></div>
<!-- 印刷する紙面（印刷の準備の時だけ中身を作り、終わったら空にする＝氏名を DOM に残さない） -->
<div id="a-print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog class="dlg" id="a-dlg" aria-labelledby="a-dlg-h"></dialog>
<dialog class="dlg" id="a-evdlg" aria-labelledby="a-ev-h"></dialog>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   採用管理（2026-10-26 代表者承認の凍結仕様 v1）
   - 応募者の情報の正本は共通ログインのデータベース（care-backend 0026・ats_*）。読み書きできるのは管理者＋2段階認証だけ
     （最終の判定はデータベースの RLS と RPC）。この画面は読む・RPC を呼ぶだけ
   - 事務所PCだけ。現場端末（su_device_role==='field'）では何も取りに行かず、案内だけを出す（ログインの部品も読まない）
   - 端末に残すのは UI の状態だけ: localStorage の ats_view（タブ）、sessionStorage の ats_open（開いている応募者の id）と
     ats_filter（職種・経路の絞り込み）。応募者の情報は端末に置かない。URL に氏名・番号を載せない
   - 職員マスタへの登録は、職員マスタの接続先（stfm_cfg を読むだけ・書かない）へ、職員マスタと同じ形で送る。
     先に保留の印（ats_mark_staff_pending）を保存し、保存できなければ送らない。「登録しました」は id を受け取った時だけ
   - 描画はすべて esc() を通す（数字・日付も）
   ═══════════════════════════════════════════════════════════════ */
var DEVICE_KEY='su_device_role';
var VIEW_KEY='ats_view';               // タブの名前だけ（localStorage・原則11）
var OPEN_KEY='ats_open';               // 開いている応募者の id だけ（sessionStorage）
var FILTER_KEY='ats_filter';           // 職種・経路の絞り込みだけ（sessionStorage）
var STF_CFG_KEY='stfm_cfg';            // 職員マスタの接続設定（読むだけ・書かない）
var TABS=['board','sched','dash','import','expire','settings'];
var ID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
var STF_URL_OK_RE=/^(https:\/\/|http:\/\/127\.0\.0\.1[:\/])/;
/* 職員マスタの GAS（staff-api.gs）の FLUSH_FAIL_MSG の写し。★1文字も違えない（違うと「確かめ中」を見分けられない） */
var FLUSH_FAIL_MSG='保存を確定できたか確かめられませんでした。画面を開き直して、保存されているか確かめてください';
var STF_TIMEOUT_MS=45000;
var UNDO_MS=10000;
var PENDING_MSG='職員マスタへの登録を確かめ中のため直せません';
var REGISTERED_MSG='すでに職員マスタへの登録が済んでいます。読み直しました';
var SU_FAC_WAIT_MS = 3000;
var SU_FAC_NG_MSG = '⚠️ 施設情報が読めません。印刷を中止しました。通信を確かめて画面を再読み込みしてから、もう一度押してください';

var gen=0;              // 世代。用途が現場に変わった・読み直した時に進め、出した時と違う応答は捨てる
var view='';            // 'field' | 'gate' | 'app'
var tab='board';
var apps=[];            // 応募者（メモリだけ）
var ivs=[];             // 面接（メモリだけ）
var settings=null;      // 設定（評価項目・保管月数・連絡途絶の日数）
var staffNames=[];      // 面接官の候補（職員の表示名・在籍だけ）
var myUid='';           // 自分の利用者 id（自分の評価を見分ける）
var curId='';           // 詳細で開いている応募者
var contacts=[];        // 開いている応募者の連絡の記録
var contactsFor='';
var evalStat={};        // 面接の id → {submitted,total}
var enums=null;         // 職員マスタの選択肢（雇用区分・資格）
var enumsState='idle';  // 'loading' | 'ok' | 'nocfg' | 'error'
var reg={};             // 応募者の id → 登録の途中の状態 {state,msg,resend,busy,staffId}
var dragId='';
var undoT=null;
var importPlan=null;
var importStaff='';     // 試算の時に職員マスタの一覧を読めたか（'ok'／'ng'／'nocfg'）
var importMsg='';
var dashPeriod='';      // 集計の期間（'' は未選択＝初めて開いた時に今月の件数で決める）
var stageLog=null;      // 集計のための段階の履歴（応募者の id と移った先だけ）
var chartObj=null;
var chartLoading=null;
var edDirty=false;      // 詳細の入力を保存していない
var ivEdit='';          // 直している面接の id（'' は新しい面接）
var evalCtx=null;       // 評価の窓の中身
var filter={job:'',src:''};
var showEnded=false;
var mStage='applied';
var printIv='';
var expireSel={};
var dlgDone_=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},3200)}
function setSync(t){var e=$('a-sync');if(e)e.textContent=t||''}
function setMsg(t,kind){var e=$('a-msg');if(!e)return;e.className='msg'+(t?' '+(kind||'ng'):'');e.textContent=t||''}
/* 黙って捨てると後で原因が追えない失敗だけを記録に残す（画面には出さない・su-errors の note） */
function atsNote_(where,e){ try{ if(window.SUErrors&&typeof window.SUErrors.note==='function') window.SUErrors.note('採用管理', e, 'ats:'+where); }catch(_){} }
function getDeviceRole(){try{return localStorage.getItem(DEVICE_KEY)||'office'}catch(e){return'office'}}
function isField(){return getDeviceRole()==='field'}
function today_(){return AtsCalc.todayJST()}
/* データベースの断りを職員に分かる言葉にする（コード・技術用語を出さない） */
function friendly_(e){
  var code=e&&e.code, m=String(e&&e.message||e||'');
  if(code==='42501'||/permission denied|row-level security/i.test(m)) return 'この操作をする権限がありません。管理者として2段階認証まで済んでいるか確かめてください。';
  if(code==='PGRST202'||code==='42P01'||code==='PGRST205') return 'データベースに採用管理の仕組みがまだありません（データベースの更新が必要です）。管理者に知らせてください。';
  if(/failed to fetch|network|load failed|timeout|タイムアウト/i.test(m)) return '通信できませんでした。電波・Wi-Fi を確かめてから、もう一度試してください。';
  return 'うまくいきませんでした。少し待ってから、もう一度試してください。';
}

/* ═══════════ ログインの部品（事務所PCで初めて読む・現場端末では読まない） ═══════════ */
function authLoad_(){
  if(window.SUAuth) return Promise.resolve();
  function has(re){ return Array.prototype.some.call(document.scripts,function(s){ return re.test(s.getAttribute('src')||''); }); }
  function load(src){
    return new Promise(function(ok,ng){
      var s=document.createElement('script'); s.src=src; s.async=true;
      s.onload=function(){ ok(); }; s.onerror=function(){ ng(new Error('load')); };
      document.head.appendChild(s);
    });
  }
  function wait(ready){
    return new Promise(function(ok,ng){
      var n=0; (function tick(){ if(ready()) return ok(); if(++n>100) return ng(new Error('timeout')); setTimeout(tick,100); })();
    });
  }
  var p=window.supabase ? Promise.resolve()
    : (has(/^supabase-js-/) ? wait(function(){ return !!window.supabase; }) : load('supabase-js-2.112.4.js'));
  return p.then(function(){
    if(window.SUAuth) return null;
    return has(/^su-auth\.js/) ? wait(function(){ return !!window.SUAuth; }) : load('su-auth.js?v=2026-10-24');
  });
}
/* データベースの窓口（読み・表への書き込み）。通信はこれと rpc_ と stfPost_ の3つだけを通す */
function db_(){ return window.SUAuth.client(); }
function rpc_(name,args){
  return Promise.resolve().then(function(){ return db_().rpc(name,args||{}); }).then(function(r){
    if(r&&r.error) throw r.error;
    return r?r.data:null;
  });
}
function rows_(r){ if(r&&r.error) throw r.error; return (r&&Array.isArray(r.data))?r.data:[]; }

/* ═══════════ 職員マスタ（GAS）への送信（職員マスタの apiPost と同じ形） ═══════════
   POST・本文は JSON の文字列・redirect:'follow'・res.json() 相当。Content-Type は足さない（職員マスタと同じ）。
   ★断りの { ok:false } も投げずに返す（応答の読み分けは AtsCalc.staffResult）。投げるのは、届いたか分からない時
     （通信の失敗・時間切れ・HTTP が成功でない・JSON でない）だけ＝呼び手は「確かめ中」として扱う */
function readStfCfg_(){
  try{ var o=JSON.parse(localStorage.getItem(STF_CFG_KEY)||'{}'); if(o&&typeof o==='object') return {url:String(o.url||''),token:String(o.token||'')}; }catch(e){ atsNote_('職員マスタの接続設定の読込', e); }
  return {url:'',token:''};
}
function stfReady_(){ var c=readStfCfg_(); return STF_URL_OK_RE.test(c.url)&&!!c.token; }
function stfPost_(payload,timeoutMs){
  var cfg=readStfCfg_();
  if(!STF_URL_OK_RE.test(cfg.url)||!cfg.token) return Promise.reject({nocfg:true});
  payload.token=cfg.token;
  var ctl=(typeof AbortController==='function')?new AbortController():null;
  var ms=Number(timeoutMs)>0?Number(timeoutMs):STF_TIMEOUT_MS;
  var timer=ctl?setTimeout(function(){ ctl.abort(); },ms):0;
  var opt={method:'POST',body:JSON.stringify(payload),redirect:'follow'};
  if(ctl) opt.signal=ctl.signal;
  return fetch(cfg.url,opt).then(function(res){
    if(!res.ok) throw {noAnswer:true,why:'HTTP '+res.status};
    return res.text();
  }).then(function(t){
    var d=null; try{ d=JSON.parse(t); }catch(e){ throw {noAnswer:true,why:'応答を読めません'}; }
    if(!d||typeof d!=='object') throw {noAnswer:true,why:'応答が空です'};
    if(timer) clearTimeout(timer);
    return d;
  },function(e){
    if(timer) clearTimeout(timer);
    if(e&&e.noAnswer) throw e;
    throw {noAnswer:true,why:(e&&e.name==='AbortError')?'応答がないため中断しました':'通信に失敗しました'};
  });
}
/* 書く送信にだけログインの証明を添える（職員マスタの GAS が書いた人を確かめる・3秒で返らなければ添えない・端末に残さない） */
function stfToken_(){
  var get=Promise.resolve().then(function(){ return db_().auth.getSession(); })
    .then(function(r){ return (r&&r.data&&r.data.session&&r.data.session.access_token)||''; })['catch'](function(){ return ''; });
  return Promise.race([get,new Promise(function(ok){ setTimeout(function(){ ok(''); },3000); })]);
}
/* 受付番号（16進32文字）。職員マスタの GAS の /^[A-Za-z0-9_-]{16,64}$/ に合う */
function newReqId_(){
  try{
    var a=crypto.getRandomValues(new Uint8Array(16)), s='', i;
    for(i=0;i<a.length;i++) s+=(a[i]<16?'0':'')+a[i].toString(16);
    return s;
  }catch(e){ atsNote_('受付番号', e); }
  var out=Date.now().toString(36);
  while(out.length<32) out+=Math.floor(Math.random()*4294967296).toString(36);
  return out.slice(0,32);
}

function boot_(){

  })['catch'](function(e){

/* 全部を読み直す（応募者・面接・設定・面接官の候補・自分の id） */
function loadAll_(){
  var my=gen;
  setSync('読み込んでいます…');

  return Promise.all([
    c.from('ats_applicants').select('*').order('received_on',{ascending:false}),

    if(my!==gen) return;

    view='app';

function rowById_(id){ for(var i=0;i<apps.length;i++) if(apps[i]&&apps[i].id===id) return apps[i]; return null; }
function replaceRow_(row){
  if(!row||!row.id) return;
  for(var i=0;i<apps.length;i++) if(apps[i].id===row.id){ apps[i]=row; return; }
  apps.unshift(row);
}
/* 開いたまま別のタブで用途が現場用に変わった時：世代を進め、中身を消してから読み込み直す（起動時の守りに任せる） */

/* ═══════════ 選考ボード ═══════════ */
function filtered_(){
  return apps.filter(function(a){
    if(filter.job&&(a.jobs||[]).indexOf(filter.job)<0) return false;
    if(filter.src&&(a.sources||[]).indexOf(filter.src)<0) return false;
    return true;
  });
}
function optionsOf_(key){
  var seen={};
  apps.forEach(function(a){ (a[key]||[]).forEach(function(x){ if(x) seen[x]=1; }); });
  return Object.keys(seen).sort();
}
function nextIv_(id){
  var now=Date.now(), best=null;
  ivs.forEach(function(v){ var t=Date.parse(v.held_at||''); if(v.applicant_id===id&&isFinite(t)&&t>=now-3600000&&(!best||t<Date.parse(best.held_at))) best=v; });
  return best;
}
function fmtDT_(iso){
  var t=Date.parse(iso||''); if(!isFinite(t)) return '';
  var d=new Date(t+9*3600000);
  return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
}

    (next?'<button type="button" class="btn sm" data-act="next" data-id="'+esc(a.id)+'">次の段階へ</button>':'')+

/* ── ドラッグ（マウス・HTML5）。置ける列だけ強調し、Esc（ブラウザが止める）・外で離した時は何もしない ── */
function onDragStart_(e){
  var c=e.target&&e.target.closest?e.target.closest('.card'):null; if(!c) return;
  var a=rowById_(c.getAttribute('data-id')); if(!a||AtsCalc.isEnd(a.stage)){ e.preventDefault(); return; }
  dragId=a.id;
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','ats'); }catch(err){ atsNote_('ドラッグ', err); }
  Array.prototype.forEach.call(document.querySelectorAll('.col'),function(col){
    var ok=AtsCalc.canMove(a.stage,col.getAttribute('data-stage'),!!a.staff_id).ok;
    col.classList.add(ok?'drop-ok':'drop-no');
  });
}
function clearDrop_(){ Array.prototype.forEach.call(document.querySelectorAll('.col'),function(col){ col.classList.remove('drop-ok'); col.classList.remove('drop-no'); }); }
function onDragOver_(e){
  if(!dragId) return;
  var col=e.target&&e.target.closest?e.target.closest('.col'):null;
  if(col&&col.classList.contains('drop-ok')) e.preventDefault();
}
function onDrop_(e){
  var col=e.target&&e.target.closest?e.target.closest('.col'):null;
  var id=dragId; dragId=''; clearDrop_();
  if(!id||!col||!col.classList) return;
  e.preventDefault();
  var a=rowById_(id), to=col.getAttribute('data-stage');
  if(!a||a.stage===to) return;
  tryMove_(a,to);
}
function onDragEnd_(){ dragId=''; clearDrop_(); }
/* 段階を動かす前の確かめ（入職完了は登録済みの時だけ） */
function tryMove_(a,to){
  var cm=AtsCalc.canMove(a.stage,to,!!a.staff_id);
  if(!cm.ok){
    if(cm.reason==='not_registered') toast('先に職員マスタへ登録してください');
    else if(cm.reason==='hired') toast('入職完了の方は動かせません');
    return Promise.resolve(false);
  }
  return moveStage_(a.id,to,'','',false);
}
function moveStage_(id,to,reason,note,isUndo){
  var a=rowById_(id); if(!a) return Promise.resolve(false);
  var from=a.stage, my=gen;
  setSync('保存しています…');
  return rpc_('ats_set_stage',{p_id:id,p_to:to,p_rev:a.rev,p_reason:reason||null,p_note:note||null}).then(function(d){
    if(my!==gen) return false;
    setSync('');
    if(d&&d.ok===true&&d.row){
      replaceRow_(d.row); paintAll_(); if(curId===id) paintDetail_();
      if(!isUndo) showUndo_('「'+d.row.name+'」を'+AtsCalc.stageLabel(to)+'へ移しました',function(){ return moveStage_(id,from,'','',true); });
      else toast('元に戻しました');
      return true;
    }
    if(d&&d.conflict){ if(d.row) replaceRow_(d.row); paintAll_(); if(curId===id) paintDetail_(); setMsg('他で直されました。読み直してから、もう一度動かしてください。','warn'); return false; }
    if(d&&d.reason==='not_registered'){ toast('先に職員マスタへ登録してください'); return false; }
    if(d&&d.reason==='pending'){ if(d.row) replaceRow_(d.row); paintAll_(); if(curId===id) paintDetail_(); setMsg(PENDING_MSG+'。','warn'); return false; }
    setMsg('段階を動かせませんでした。','ng'); return false;
  },function(e){
    if(my!==gen) return false;
    setSync(''); atsNote_('段階', e); setMsg(friendly_(e)); return false;
  });
}
function showUndo_(text,fn){
  var u=$('a-undo'); if(!u) return;
  clearTimeout(undoT);

/* ── 評価の入力（面接官ごとに1件。管理者が紙の評価を代わりに入れられる＝面接官をその面接の面接官から選ぶ） ──
   表から読めるのは自分が入れた行だけ。ほかの評価は ats_eval_peek（提出済みだけ）で見る */
function evalRowOf_(e,who){ var r=null; e.mine.forEach(function(x){ if(x&&x.interviewer===who) r=x; }); return r; }
function evalLoad_(e,who){

  e.scores=Object.assign({},e.row&&e.row.scores||{}); e.overall=e.row?e.row.overall:null; e.comment=e.row?e.row.comment||'':'';

function openEval_(ivId){

}
function evalHtml_(){

  var radios=function(name,cur){ var s=''; for(var n=1;n<=5;n++) s+='<label><input type="radio" name="'+esc(name)+'" value="'+n+'"'+(Number(cur)===n?' checked':'')+'>'+n+'</label>'; return s; };
  var submitted=e.mine.some(AtsCalc.evalVisible);

  h+='<div class="fi" style="max-width:360px"><label for="ev-who">面接官（紙の評価を代わりに入れる時も、その面接官を選ぶ）</label><select id="ev-who">'+names.map(function(n){
      var r=evalRowOf_(e,n); return '<option value="'+esc(n)+'"'+(n===e.who?' selected':'')+'>'+esc(n+(r?(r.status==='submitted'?'（提出済み）':'（下書き）')+(r.edited_after_peek?'（ほかの評価を見た後に入力）':''):''))+'</option>'; }).join('')+'</select></div>'+
    '<p class="hint">1（よくない）〜5（とてもよい）。ほかの面接官の評価は、評価を1つ提出すると見られます。</p>'+
    (e.row&&e.row.edited_after_peek?'<p class="msg warn">この評価は、ほかの評価を見た後に入力されています。</p>':'')+
    (e.row&&e.row.peeked_at&&!e.row.edited_after_peek?'<p class="msg warn">ほかの面接官の評価を見た後に直すと、直した印が残ります。</p>':'')+
    items.map(function(k,i){ return '<fieldset class="score"><legend>'+esc(k)+'</legend><div class="score-r">'+radios('ev'+i,e.scores[k])+'</div></fieldset>'; }).join('')+
    '<fieldset class="score"><legend>総合の点</legend><div class="score-r">'+radios('evo',e.overall)+'</div></fieldset>'+
    '<div class="fi"><label for="ev-c">コメント</label><textarea id="ev-c" maxlength="4000">'+esc(e.comment)+'</textarea></div>'+
    '<div class="msg'+(e.msg?' warn':'')+'" role="status">'+esc(e.msg)+'</div>';
  if(e.peek) h+='<h3>ほかの面接官の評価（提出済み）</h3>'+(e.peek.length?'<ul class="list">'+e.peek.map(function(p){
      return '<li><b>'+esc(p.interviewer||'')+'</b> 総合 '+esc(p.overall==null?'—':p.overall)+(p.edited_after_peek?'（ほかの評価を見た後に入力）':'')+'<br>'+
        items.map(function(k){ return esc(k)+' '+esc(p.scores&&p.scores[k]!=null?p.scores[k]:'—'); }).join('・')+(p.comment?'<br>'+esc(p.comment):'')+'</li>'; }).join('')+'</ul>':'<p class="muted">ほかの提出済みの評価はまだありません。</p>');
  h+='<div class="dlg-btns">'+(submitted?'<button type="button" class="btn" data-ev="peek">ほかの評価を見る</button>':'<span class="muted">提出すると見られます</span>')+
    '<button type="button" class="btn" data-ev="close">閉じる</button><button type="button" class="btn" data-ev="draft">下書き保存</button><button type="button" class="btn pri" data-ev="submit">提出</button></div></div>';
  return h;
}
function paintEval_(){ var d=$('a-evdlg'); if(d&&evalCtx) d.innerHTML=evalHtml_(); }
function readEval_(){
  var e=evalCtx; if(!e) return;
  settings.evalItems.forEach(function(k,i){ var c=document.querySelector('input[name="ev'+i+'"]:checked'); if(c) e.scores[k]=Number(c.value); });
  var o=document.querySelector('input[name="evo"]:checked'); if(o) e.overall=Number(o.value);
  var t=$('ev-c'); if(t) e.comment=String(t.value);
}
function evalKeep_(e,row){
  if(!row) return;
  e.row=row;
  for(var i=0;i<e.mine.length;i++) if(e.mine[i].id===row.id){ e.mine[i]=row; return; }
  e.mine.push(row);
}
/* 面接官を選び直す（書きかけがあれば確かめてから） */
function evalSwitch_(who){
  var e=evalCtx; if(!e||who===e.who) return Promise.resolve(false);
  var go=function(){ evalLoad_(e,who); paintEval_(); return true; };
  if(e.dirty) return askConfirm_('保存していない評価があります',['書きかけの評価を捨てて、面接官を変えますか？'],'捨てて変える',true).then(function(ok){ if(ok) return go(); paintEval_(); return false; });
  return Promise.resolve(go());
}
function saveEval_(submit){
  readEval_();
  var e=evalCtx; if(!e||!e.who) return Promise.resolve(false);
  if((e.iv.interviewers||[]).indexOf(e.who)<0){ e.msg='面接官は、この面接の面接官から選んでください。'; paintEval_(); return Promise.resolve(false); }
  var scores={};
  settings.evalItems.forEach(function(k){ var n=Number(e.scores[k]); if(n>=1&&n<=5) scores[k]=n; });
  var chk=AtsCalc.evalCheck(settings.evalItems,scores,e.overall,submit);
  if(!chk.ok){ e.msg='提出するには全部の点を選んでください（'+chk.missing.join('・')+'）。'; paintEval_(); return Promise.resolve(false); }
  var my=gen;
  return rpc_('ats_eval_put',{p_interview_id:e.iv.id,p_interviewer:e.who,p_scores:scores,p_overall:e.overall||null,p_comment:String(e.comment).slice(0,4000),p_submit:!!submit,p_rev:e.row?e.row.rev:null}).then(function(d){
    if(my!==gen||evalCtx!==e) return false;
    if(d&&d.ok===true&&d.row){ evalKeep_(e,d.row); e.dirty=false; e.msg=submit?'提出しました。':'下書きを保存しました。'; paintEval_(); loadEvalStat_(e.iv.applicant_id); return true; }
    if(d&&d.conflict){ if(d.row) evalKeep_(e,d.row); e.msg='他で直されました。閉じてから、もう一度開いてください。'; paintEval_(); return false; }
    if(d&&d.reason==='other_author'){ e.msg='この評価はほかの方が入れたため直せません。'; paintEval_(); return false; }
    if(d&&d.error==='badinterviewer'){ e.msg='面接官は、この面接の面接官から選んでください。'; paintEval_(); return false; }
    e.msg='保存できませんでした。'; paintEval_(); return false;
  },function(err){ atsNote_('評価の保存', err); e.msg=friendly_(err); paintEval_(); return false; });
}
function peekEval_(){
  var e=evalCtx; if(!e) return Promise.resolve(false);
  readEval_();
  var my=gen;
  return rpc_('ats_eval_peek',evalPeekArgs_(e)).then(function(d){
    if(my!==gen||evalCtx!==e) return false;
    /* 見た時刻を書くと自分の行の版が上がる＝返ってきた own の版で次を保存する */
    if(d&&d.ok===true){
      var cur=e.row;
      (Array.isArray(d.own)?d.own:[]).forEach(function(x){ evalKeep_(e,x); });
      e.row=evalRowOf_(e,e.who)||cur;
      /* ほかの方が入れた提出済みと、自分が代わりに入れたほかの面接官の提出済み */
      e.peek=(Array.isArray(d.rows)?d.rows:[]).concat(e.mine.filter(function(x){ return x&&x.interviewer!==e.who; }))
        .filter(function(x){ return x&&x.status==='submitted'&&x.interviewer!==e.who; });
      paintEval_(); return true;
    }
    e.msg='この評価を提出してから見られます。'; paintEval_(); return false;
  },function(err){ atsNote_('ほかの評価', err); e.msg=friendly_(err); paintEval_(); return false; });
}
function evalPeekArgs_(e){ return {p_interview_id:e.iv.id}; }
function closeEval_(force){
  var go=function(){ var d=$('a-evdlg'); evalCtx=null; try{ if(d.open) d.close(); }catch(e){ atsNote_('評価の窓', e); } d.innerHTML=''; };
  if(evalCtx&&evalCtx.dirty&&!force) return askConfirm_('保存していない評価があります',['書きかけの評価を捨てて閉じますか？'],'捨てて閉じる',true).then(function(ok){ if(ok) go(); return ok; });
  go(); return Promise.resolve(true);
}

function regOf_(id){ return reg[id]||(reg[id]={state:'',msg:'',resend:null,busy:false,staffId:''}); }
function regHtml_(a){

      '<button type="button" class="btn pri" data-act="reg-check"'+(r.busy?' disabled':'')+'>職員マスタを読み直して確かめる</button></div>';

  if(enumsState==='loading'||enumsState==='idle') return h+'<p class="muted">職員マスタの選択肢を読み込んでいます…</p><button type="button" class="btn pri" disabled>職員マスタへ登録</button></div>';
  if(enumsState==='error') return h+'<p class="msg ng">職員マスタの選択肢を読めませんでした。</p><button type="button" class="btn" data-act="enums-retry">もう一度読む</button> <button type="button" class="btn pri" disabled>職員マスタへ登録</button></div>';

/* 登録: 0. 職員マスタの一覧で同じ方がいないか確かめる（regPrecheck_・読めなければ送らない）→ 1. 確認の窓 →
   2. 保留の印を先に保存（できなければ送らない）→ 3. 職員マスタへ送る → 4〜6. 応答で分ける */
function regStart_(){
  var a=rowById_(curId); if(!a||a.staff_id||a.staff_pending_at||a.legacy_hired===true) return Promise.resolve('blocked');
  var r=regOf_(a.id); if(r.busy) return Promise.resolve('busy');
  if(edDirty){ dMsg_('先に「入職準備を保存」を押してください（保存した内容で登録します）。','warn'); return Promise.resolve('dirty'); }
  var b=AtsCalc.buildStaffCreate(a,enums);
  if(!b.ready) return Promise.resolve('notready');
  var id=a.id;
  r.resend=null;
  return regPrecheck_(id,b).then(function(pc){
    if(pc!=='go') return pc;
    var body='<div class="tbl-wrap"><table class="rt"><thead><tr><th>採用管理の項目</th><th>値</th><th>職員マスタの欄</th></tr></thead><tbody>'+
      b.rows.map(function(x){ return '<tr><td>'+esc(x.label)+'</td><td>'+esc(x.value)+'</td><td>'+esc(x.target)+'</td></tr>'; }).join('')+'</tbody></table></div>';
    return openDlg_({title:'職員マスタへ登録しますか？',lines:['本人希望などの文章は送りません。'],bodyHtml:body,ok:'登録する'}).then(function(ok){
      if(!ok){ r.busy=false; r.state=''; r.msg=''; if(curId===id) paintDetail_(); return 'cancel'; }
      return regSend_(id,newReqId_(),b.fields);
    });
  });
}
/* 送る前の照合（新しい登録・送り直しの両方が必ず通す）。返りは 'go'（送ってよい）か、送らなかった理由
   ・同じ方（氏名＋入職日＋生年月日・退職した方は除く）が1人 → 見比べの窓で聞いてからつなぐ（つなぐ直前に応募者の行を読み直す）
   ・2人以上 → 止める ・一覧を読めない → 送らない
   ・氏名だけ一致する在籍の職員がいる → 「それでも新しく登録しますか」と聞く */
function regPrecheck_(id,b){
  var r=regOf_(id), my=gen;
  r.busy=true; r.state='busy'; r.msg='職員マスタに同じ方がいないか確かめています…'; if(curId===id) paintDetail_();
  var sent={name:b.fields.name,hireDate:b.fields.hireDate,birthDate:b.fields.birthDate||''};
  var stop=function(kind,state,msg){ r.busy=false; r.state=state; r.msg=msg; if(curId===id) paintDetail_(); return kind; };
  return stfPost_({action:'list'},45000).then(function(d){
    if(!(d&&d.ok===true&&Array.isArray(d.rows))) throw {noAnswer:true,why:'一覧を読めません'};
    return d.rows;
  }).then(function(list){
    if(my!==gen) return 'stale';
    var hits=AtsCalc.staffMatches(list,sent);
    if(hits.length>1) return stop('many','unsure','氏名・入職日・生年月日が同じ方が職員マスタに'+hits.length+'人います。職員マスタで確かめてください（送っていません）。');
    if(hits.length===1) return regLink_(id,b,sent,hits[0]);
    var same=AtsCalc.sameNameActive(list,sent.name);
    if(!same.length) return 'go';
    return openDlg_({title:'同じ氏名の職員がいます（入職日が違います）',lines:['職員マスタに同じ氏名の在籍の職員がいます（職員ID '+same.map(function(x){ return String(x.id||''); }).join('・')+'）。','それでも新しく登録しますか？'],ok:'新しく登録する'}).then(function(ok){
      if(!ok) return stop('cancel','','職員マスタへは送っていません。');
      return 'go';
    });
  },function(e){
    if(my!==gen) return 'stale';
    if(!(e&&(e.noAnswer||e.nocfg))) atsNote_('登録の前の確かめ', e);
    return stop('nolist','ng',(e&&e.nocfg)?'職員マスタの接続先が見つかりません（接続設定）。送っていません。':'職員マスタの一覧を読めなかったため、送っていません（'+((e&&e.why)||friendly_(e))+'）。少し待ってから、もう一度押してください。');
  });
}
/* 職員マスタにいる方につなぐ。採用管理と職員マスタの値を並べて見せ、つなぐ直前に応募者の行を読み直して、窓を開いた時と変わっていれば止める */
function regLink_(id,b,sent,hit){
  var r=regOf_(id), my=gen, sid=String(hit.id||'');
  var row=function(lab,x,y){ return '<tr><td>'+esc(lab)+'</td><td>'+esc(x||'—')+'</td><td>'+esc(y||'—')+'</td></tr>'; };
  var body='<div class="tbl-wrap"><table class="rt"><thead><tr><th>項目</th><th>採用管理</th><th>職員マスタ（職員ID '+esc(sid)+'）</th></tr></thead><tbody>'+
    row('氏名',sent.name,hit.name)+row('フリガナ',b.fields.kana,hit.kana)+row('生年月日',sent.birthDate,hit.birthDate)+row('入職日',sent.hireDate,hit.hireDate)+'</tbody></table></div>';
  return openDlg_({title:'職員マスタにもういらっしゃいます',lines:['氏名・入職日'+(sent.birthDate?'・生年月日':'')+'が同じ方がいます。見比べてください。','新しく作らず、この方につなぎますか？'],bodyHtml:body,ok:'この方につなぐ'}).then(function(ok){
    if(!ok){ r.busy=false; r.state=''; r.msg='職員マスタへは送っていません。'; if(curId===id) paintDetail_(); return 'cancel'; }
    return Promise.resolve().then(function(){ return db_().from('ats_applicants').select('*').eq('id',id); }).then(function(res){
      if(my!==gen) return 'stale';
      var now=rows_(res)[0];
      var f=now?AtsCalc.buildStaffCreate(now,enums).fields:{};
      if(!now||String(f.name||'')!==sent.name||String(f.hireDate||'')!==sent.hireDate||String(f.birthDate||'')!==sent.birthDate){
        if(now) replaceRow_(now);
        r.busy=false; r.state='ng'; r.msg='内容が変わりました。もう一度押してください。'; paintAll_(); if(curId===id) paintDetail_(); return 'changed';
      }
      return regDone_(id,sid,'職員マスタの方（職員ID '+sid+'）につなぎました。');
    },function(e){
      if(my!==gen) return 'stale';
      atsNote_('つなぐ前の読み直し', e); r.busy=false; r.state='ng'; r.msg=friendly_(e)+'（つないでいません）'; if(curId===id) paintDetail_(); return 'error';
    });
  });
}
/* 保留を外そうとしたら、ほかの画面が送り直していた（受付番号が違う）＝そう知らせて読み直す */
function regOtherSend_(id){
  var r=regOf_(id);
  r.busy=false; r.state='unsure'; r.resend=null; r.holdAuto=true; r.msg='ほかの画面で送り直しています。読み直しました。';
  return loadAll_().then(function(){ if(curId===id) paintDetail_(); return 'other_send'; });
}
/* すでに登録済み（ほかの画面・端末で済んでいた）と言われた時は、そう知らせて全部を読み直す */
function regRegistered_(id){
  var r=regOf_(id);
  r.busy=false; r.state='ok'; r.msg=REGISTERED_MSG+'。';
  return loadAll_().then(function(){ if(curId===id) paintDetail_(); return 'registered'; });
}
function regSend_(id,reqId,fields){
  var a=rowById_(id), r=regOf_(id), my=gen, key=AtsCalc.sentKey(fields);
  if(!a){ r.busy=false; return Promise.resolve('none'); }
  r.busy=true; r.msg='送っています…'; r.state='busy'; r.resend=null; if(curId===id) paintDetail_();
  var sent={name:fields.name,hireDate:fields.hireDate,birthDate:fields.birthDate||''};
  r.sent=sent; r.reqId=reqId; r.key=key; r.fields=fields;
  return rpc_('ats_mark_staff_pending',{p_id:id,p_req_id:reqId,p_sent_key:key,p_rev:a.rev}).then(function(d){
    if(my!==gen) return 'stale';
    if(d&&d.reason==='registered') return regRegistered_(id);
    if(d&&d.reason==='pending'){ if(d.row) replaceRow_(d.row); r.busy=false; r.state='unsure'; r.msg='ほかの画面で登録を確かめ中です。職員マスタを読み直して確かめてください（ここからは送っていません）。'; if(curId===id) paintDetail_(); return 'pending'; }
    if(!(d&&d.ok===true)){
      if(d&&d.row) replaceRow_(d.row);
      r.busy=false; r.state='ng'; r.msg=(d&&d.conflict)?'他で直されました。読み直してから、もう一度押してください（職員マスタへは送っていません）。':'登録の準備を保存できなかったため、職員マスタへは送っていません。';
      if(curId===id) paintDetail_(); return 'nomark';
    }
    if(d.row) replaceRow_(d.row);
    return stfToken_().then(function(at){
      var payload={action:'bulkSave',creates:[{tempId:'ats1',fields:fields}],reqId:reqId};
      if(at) payload.accessToken=at;
      return stfPost_(payload).then(function(res){ return res; },function(e){ return {__noAnswer:true,why:e&&e.why}; });
    }).then(function(res){
      if(my!==gen) return 'stale';
      var k=res&&res.__noAnswer?{kind:'unsure',id:''}:AtsCalc.staffResult(res,FLUSH_FAIL_MSG);
      if(k.kind==='ok') return regDone_(id,k.id,'登録しました。');
      if(k.kind==='ng'){
        var pend=rowById_(id);
        return rpc_('ats_clear_staff_pending',{p_id:id,p_req_id:reqId,p_pending_at:pend?pend.staff_pending_at:null}).then(function(c){
          if(c&&c.reason==='other_send') return 'other';
          if(c&&c.row) replaceRow_(c.row); else { var x=rowById_(id); if(x) x.staff_pending_at=null; }
        },function(e){ atsNote_('保留を外す', e); }).then(function(o){
          if(o==='other') return regOtherSend_(id);
          r.busy=false; r.state='ng'; r.msg='登録できませんでした（'+(k.error||'理由不明')+'）。'; if(curId===id) paintDetail_(); paintAll_(); return 'ng';
        });
      }
      r.busy=false; r.state='unsure'; r.msg='登録できたか確かめ中です'+(res&&res.__noAnswer&&res.why?'（'+res.why+'）':'')+'。';
      var x=rowById_(id); if(x&&!x.staff_pending_at) x.staff_pending_at=new Date().toISOString();
      if(curId===id) paintDetail_(); return 'unsure';
    });
  },function(e){
    if(my!==gen) return 'stale';
    atsNote_('登録の準備', e); r.busy=false; r.state='ng'; r.msg=friendly_(e)+'（職員マスタへは送っていません）'; if(curId===id) paintDetail_(); return 'nomark';
  });
}
/* 職員 ID を控える（控えられた時だけ「登録しました」） */
function regDone_(id,staffId,okText){
  var r=regOf_(id), my=gen;
  r.staffId=staffId;
  return rpc_('ats_mark_staff',{p_id:id,p_staff_id:staffId}).then(function(d){
    if(my!==gen) return 'stale';
    if(d&&d.ok===true){ if(d.row) replaceRow_(d.row); else { var x=rowById_(id); if(x){ x.staff_id=staffId; x.stage='hired'; x.staff_pending_at=null; } } r.busy=false; r.state='ok'; r.msg=okText; paintAll_(); if(curId===id) paintDetail_(); return 'ok'; }
    if(d&&d.reason==='registered') return regRegistered_(id);
    r.busy=false; r.state='unsure'; r.msg='職員マスタには登録できました（職員ID '+staffId+'）が、採用管理に控えられませんでした。「職員マスタを読み直して確かめる」を押してください。'; if(curId===id) paintDetail_(); return 'markfail';
  },function(e){
    if(my!==gen) return 'stale';
    atsNote_('職員IDを控える', e); r.busy=false; r.state='unsure'; r.msg='職員マスタには登録できました（職員ID '+staffId+'）が、採用管理に控えられませんでした。「職員マスタを読み直して確かめる」を押してください。'; if(curId===id) paintDetail_(); return 'markfail';
  });
}
/* 職員マスタを読み直して確かめる（1件→控える／0件で8分未満→待つ／8分以上→保留を外して同じ受付番号で送り直せる／2件以上→止める） */
function regCheck_(id,auto){
  var a=rowById_(id), r=regOf_(id), my=gen;
  if(!a||r.busy) return Promise.resolve('busy');
  r.busy=true; if(!auto){ r.msg='確かめています…'; r.holdAuto=false; } if(curId===id) paintDetail_();
  var fields=r.fields||AtsCalc.buildStaffCreate(a,enums).fields;
  var sent=r.sent||{name:fields.name,hireDate:fields.hireDate,birthDate:fields.birthDate||''};
  return stfPost_({action:'list'},45000).then(function(d){
    if(my!==gen) return 'stale';
    if(!(d&&d.ok===true&&Array.isArray(d.rows))) throw {noAnswer:true,why:'一覧を読めません'};
    var hits=AtsCalc.staffMatches(d.rows,sent);
    if(hits.length===1) return regDone_(id,String(hits[0].id),'登録を確かめました（職員ID '+hits[0].id+'）。');
    if(hits.length>1){ r.busy=false; r.state='unsure'; r.msg='氏名・入職日・生年月日が同じ方が職員マスタに'+hits.length+'人います。職員マスタで確かめてください（ここでは決めません）。'; if(curId===id) paintDetail_(); return 'many'; }
    /* 外すかどうかは、端末の控えの行ではなく、その場でデータベースから読み直した行の印（時刻・受付番号）で決める
       （ほかの画面が同じ番号で送り直して印の時刻が新しくなっていても、古い控えで外さない） */
    return Promise.resolve().then(function(){ return db_().from('ats_applicants').select('*').eq('id',id); }).then(function(res){
    if(my!==gen) return 'stale';
    var cur=rows_(res)[0];
    if(!cur){ r.busy=false; r.state=''; r.msg=''; return loadAll_().then(function(){ return 'gone'; }); }
    replaceRow_(cur);
    if(cur.staff_id){ r.busy=false; r.state='ok'; r.msg=REGISTERED_MSG+'。'; paintAll_(); if(curId===id) paintDetail_(); return 'registered'; }
    if(!cur.staff_pending_at){ r.busy=false; r.state=''; r.msg='登録の確かめはもう済んでいます（ほかの画面で印が外れていました）。読み直しました。'; paintAll_(); if(curId===id) paintDetail_(); return 'cleared'; }
    var v=AtsCalc.staffVerdict(null,cur.staff_pending_at,Date.now());
    if(v==='wait'){ r.busy=false; r.state='unsure'; r.msg='まだ見つかりません。職員マスタが書き込んでいる途中のことがあるため、あと'+AtsCalc.staffWaitMinutes(cur.staff_pending_at,Date.now())+'分ほど待ってから、もう一度確かめてください。'; if(curId===id) paintDetail_(); return 'wait'; }
    /* 8分たっても見つからない＝入っていない（職員マスタの処理中の印 7分より長く待った）。受付番号は外す前にメモリへ控え、同じ番号で送り直せるようにする */
    var keep={reqId:cur.staff_req_id||'',key:cur.staff_sent_key||r.key||''};
    return rpc_('ats_clear_staff_pending',{p_id:id,p_req_id:keep.reqId,p_pending_at:cur.staff_pending_at}).then(function(c){
      if(my!==gen) return 'stale';
      if(c&&c.reason==='other_send') return regOtherSend_(id);
      if(c&&c.row) replaceRow_(c.row); else { var x=rowById_(id); if(x) x.staff_pending_at=null; }
      r.busy=false; r.state='absent'; r.resend=keep.reqId?keep:null;
      r.msg='職員マスタに登録されていませんでした。'+(keep.reqId?'「同じ受付番号で送り直す」を押してください。':'もう一度「職員マスタへ登録」を押してください。');
      if(curId===id) paintDetail_(); return 'absent';
    });
    });
  })['catch'](function(e){
    if(my!==gen) return 'stale';
    r.busy=false; r.state='unsure';
    r.msg=(e&&e.nocfg)?'職員マスタの接続先が見つかりません（接続設定）。':'職員マスタを読めませんでした（'+((e&&e.why)||friendly_(e))+'）。少し待ってから、もう一度確かめてください。';
    if(!(e&&e.noAnswer)&&!(e&&e.nocfg)) atsNote_('登録の確かめ', e);
    if(curId===id) paintDetail_(); return 'error';
  });
}
/* 同じ受付番号で送り直す（入職準備の中身を変えていれば、職員マスタが前の答えを返さないよう新しい番号にする） */
function regResend_(){
  var a=rowById_(curId), r=a?regOf_(a.id):null;
  if(!a||!r||!r.resend||r.busy||a.staff_id||a.staff_pending_at) return Promise.resolve('blocked');
  var b=AtsCalc.buildStaffCreate(a,enums);
  if(!b.ready) return Promise.resolve('notready');
  var same=AtsCalc.sentKey(b.fields)===r.resend.key, keep=r.resend, id=a.id;
  /* 送り直しも、送る前の照合を必ず通す（見つかった・2人以上・読めない時は送らない） */
  return regPrecheck_(id,b).then(function(pc){
    if(pc!=='go') return pc;
    return regSend_(id,same?keep.reqId:newReqId_(),b.fields);
  });
}

/* 印刷の前に施設情報を待つ（入居者マスタ・デイ利用表・フェイスシートと同じ作り） */
function suFacReady_(ms) {
  return new Promise(function (ok) {
    var F = window.SUFacility, done = false, tm = null;
    function fin() {
      if (done) return;
      done = true;
      if (tm) clearTimeout(tm);
      var r = false;
      try { r = !!F.ready(); } catch (e) { r = false; }
      ok(r);
    }
    if (!F || typeof F.ready !== 'function') { ok(false); return; }
    try { if (F.ready()) { ok(true); return; } } catch (e) { ok(false); return; }
    tm = setTimeout(fin, ms == null ? SU_FAC_WAIT_MS : ms);
    try { if (typeof F.onReady === 'function') F.onReady(fin); } catch (e) { /* 呼べなくても、上でかけた時計で必ず終わる */ }
  });
}

function loadStageLog_(){

    if(my!==gen) return;

var DASH_PERIODS=[['month','今月'],['3m','3か月'],['fy','今年度'],['all','全期間'],['year','年ごと']];
function dashData_(){
  var reached={}, ivn={};
  (stageLog||[]).forEach(function(l){ var k=l.applicant_id; if(AtsCalc.stageRank(l.to_stage)>AtsCalc.stageRank(reached[k])) reached[k]=l.to_stage; });
  ivs.forEach(function(v){ ivn[v.applicant_id]=(ivn[v.applicant_id]||0)+1; });
  var list=apps.map(function(a){ return {stage:a.stage,sources:a.sources,received_on:a.received_on,reached:reached[a.id]||'',interviews:ivn[a.id]||0,legacy_hired:a.legacy_hired===true,interview_on:a.interview_on||''}; });
  var rg=AtsCalc.periodRange(dashPeriod,today_());
  var f=AtsCalc.funnel(list,rg.from,rg.to);
  if(dashPeriod==='year') f.years=AtsCalc.yearTable(list);
  return f;
}
function paintDash_(){

  if(!dashPeriod) dashPeriod=AtsCalc.defaultPeriod(apps,today_());
  var f=dashData_(), all=AtsCalc.STAGES.concat(AtsCalc.END_STAGES);

  var html='<h2>集計</h2><div class="fi" style="max-width:260px"><label for="dash-per">期間（受付日）</label><select id="dash-per">'+per.map(function(x){ return '<option value="'+x[0]+'"'+(x[0]===dashPeriod?' selected':'')+'>'+esc(x[1])+'</option>'; }).join('')+'</select></div>'+
    (f.years?'<h3>年ごと（受付日の年）</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>年</th><th class="num">応募</th><th class="num">面接</th><th class="num">採用</th><th class="num">入職</th><th class="num">辞退</th></tr></thead><tbody>'+

function onImportFile_(file){
  if(!file) return Promise.resolve(false);
  importMsg='';
  return new Promise(function(ok){
    var fr=new FileReader();
    fr.onload=function(){ ok(new Uint8Array(fr.result)); };
    fr.onerror=function(){ ok(null); };
    fr.readAsArrayBuffer(file);
  }).then(function(bytes){
    if(!bytes){ importPlan={ok:false,error:'ファイルを読めませんでした。',items:[]}; paintImport_(); return false; }
    var dec=AtsCalc.decodeCsv(bytes,function(l){ return new TextDecoder(l,{fatal:false}); });
    return planFromText_(dec.text);
  });
}
/* 試算: 先に職員マスタの一覧（退職した方も含む）を1回読み、取り込み元で入職済みの方に職員IDを付ける。
   読めない時は職員IDを付けずに試算する（入職済みの印だけ）。ファイルの中身・一覧は端末に保存しない（メモリだけ） */
function planFromText_(text){
  var my=gen;
  importPlan=null; importStaff=''; setSync('職員マスタの一覧を読んでいます…'); paintImport_();
  var read=stfReady_()?stfPost_({action:'list'},45000).then(function(d){
    if(!(d&&d.ok===true&&Array.isArray(d.rows))) throw {noAnswer:true,why:'一覧を読めません'};
    return d.rows;
  }):Promise.reject({nocfg:true});
  return read.then(function(rows){ return {rows:rows,state:'ok'}; },function(e){
    if(!(e&&(e.noAnswer||e.nocfg))) atsNote_('取り込みの職員マスタの一覧', e);
    return {rows:null,state:(e&&e.nocfg)?'nocfg':'ng'};
  }).then(function(r){
    if(my!==gen) return false;
    setSync('');
    var have=apps.map(function(a){ return a.import_key; }).filter(Boolean);
    importPlan=AtsCalc.planImport(text,today_(),settings,have,r.rows);
    importStaff=r.state;
    paintImport_(); return true;
  });
}

    tbl('面接',li('面接日のある行（面接の記録を作る）',sm.interviewOn||0)+li('読めない値を備考に残した行',sm.warned||0))+
    tbl('入れられない行の理由',rs)+tbl('経路ごと（入れられる行）',src)+'</div>'+

function runImport_(){

    if(!ok) return false;
    var my=gen;
    setSync('取り込んでいます…');
    return rpc_('ats_import',{p_rows:rows}).then(function(d){
      if(my!==gen) return false;
      setSync('');
      if(d&&d.ok===true){ importPlan=null; importMsg=Number(d.inserted||0)+'件を取り込みました（取り込み済みで外した行 '+Number(d.skipped||0)+'件）。'; return loadAll_().then(function(){ return true; }); }
      /* 1行でも形が違えば1行も入らない。返った index（入れる行の何番目か）から CSV の行を知らせる */
      var bad=(d&&typeof d.index==='number'&&okItems[d.index])?okItems[d.index]:null;
      setMsg('取り込めませんでした（1件も入っていません）。'+(bad?'CSV の '+bad.line+'行目の値をデータベースが受け付けませんでした。':'')); return false;
    },function(e){ if(my!==gen) return false; setSync(''); atsNote_('取り込み', e); setMsg(friendly_(e)); return false; });
  });
}

/* ═══════════ 確かめの窓 ═══════════ */
function openDlg_(o){
  var d=$('a-dlg');
  if(!d||typeof d.showModal!=='function'){
    if(o.bodyHtml) { toast('このブラウザでは開けません。新しいブラウザで開いてください'); return Promise.resolve(null); }
    return Promise.resolve(window.confirm(o.title+'\n'+(o.lines||[]).join('\n')));
  }
  if(dlgDone_){ var old=dlgDone_; dlgDone_=null; old(null); }
  var back=document.activeElement;
  d.innerHTML='<div class="dlg-in"><h2 id="a-dlg-h">'+esc(o.title)+'</h2>'+(o.lines||[]).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join('')+(o.bodyHtml||'')+
    '<div class="dlg-btns"><button type="button" class="btn" data-dlg="no">やめる</button><button type="button" class="btn '+(o.danger?'ngf':'pri')+'" data-dlg="ok">'+esc(o.ok)+'</button></div></div>';
  return new Promise(function(resolve){
    var done=function(v){
      if(dlgDone_!==done) return;
      dlgDone_=null; d.removeEventListener('click',onClick); d.removeEventListener('cancel',onCancel);
      try{ if(d.open) d.close(); }catch(e){ atsNote_('確かめの窓', e); }
      d.innerHTML='';
      try{ if(back&&back.focus) back.focus(); }catch(e){ atsNote_('手元を戻す', e); }
      resolve(v);
    };
    var onClick=function(ev){
      var b=ev.target&&ev.target.closest?ev.target.closest('[data-dlg]'):null; if(!b) return;
      if(b.getAttribute('data-dlg')==='no'){ done(o.collect?null:false); return; }
      if(o.collect){ var v=o.collect(); if(v!=null) done(v); return; }
      done(true);
    };
    var onCancel=function(ev){ ev.preventDefault(); done(o.collect?null:false); };
    dlgDone_=done;
    d.addEventListener('click',onClick); d.addEventListener('cancel',onCancel);
    d.showModal();
    /* 初めの手元は「やめる」（消す・登録するなどの取り返しのつかない操作を Enter で進めない） */
    try{ d.querySelector('[data-dlg="no"]').focus(); }catch(e){ atsNote_('窓の手元', e); }
  });
}
function askConfirm_(title,lines,ok,danger){ return openDlg_({title:title,lines:lines,ok:ok,danger:danger}).then(function(v){ return !!v; }); }

/* ═══════════ 操作の受け口（インラインの on〜 は使わない・CSP） ═══════════ */
function onClick_(e){
  var t=e.target&&e.target.closest?e.target.closest('[data-act],[data-tab],[data-ev]'):null; if(!t) return;
  if(t.hasAttribute('data-tab')){ setTab_(t.getAttribute('data-tab')); return; }
  if(t.hasAttribute('data-ev')){
    var k=t.getAttribute('data-ev');
    if(k==='draft') saveEval_(false); else if(k==='submit') saveEval_(true); else if(k==='peek') peekEval_(); else if(k==='close') closeEval_(false);
    return;
  }
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id')||'', a=id?rowById_(id):rowById_(curId);
  if(act==='open'&&id) openDetail_(id);
  else if(act==='next'&&a){ var nx=AtsCalc.nextStage(a.stage); if(nx) tryMove_(a,nx); }
  else if(act==='new') newApplicant_();
  else if(act==='ended'){ showEnded=!showEnded; paintBoard_(); }
  else if(act==='undo'){ var fn=showUndo_.fn; hideUndo_(); if(fn) fn(); }
  else if(act==='close') closeDetail_(false);
  else if(act==='end'&&a&&!isPending_(a)) askEnd_(a);
  else if(act==='save-basic') saveBasic_();
  else if(act==='add-contact') addContact_();
  else if(act==='iv-save') saveInterview_();
  else if(act==='iv-edit'){ ivEdit=t.getAttribute('data-iv')||''; paintDetail_(); }
  else if(act==='iv-cancel'){ ivEdit=''; paintDetail_(); }
  else if(act==='eval') openEval_(t.getAttribute('data-iv')||'');
  else if(act==='save-prep') savePrep_();
  else if(act==='reg-start') regStart_();
  else if(act==='reg-check'&&curId) regCheck_(curId,false);
  else if(act==='reg-resend') regResend_();
  else if(act==='enums-retry') loadEnums_();
  else if(act==='print-sched') printGo_('sched','');
  else if(act==='print-sheet') printGo_('evalsheet',t.getAttribute('data-iv')||'');
  else if(act==='imp-run') runImport_();
  else if(act==='imp-clear'){ importPlan=null; importStaff=''; paintImport_(); }
  else if(act==='purge') runPurge_();
  else if(act==='save-settings') saveSettings_();
}
function onChange_(e){
