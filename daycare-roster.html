let printTimer = null;

/* ============================================================================
   印刷フィット（fitSheetPrint_）— 用紙1枚に収まる最大の文字サイズへ自動調整する。
   ★CSS の `table.sheet { --sh-fs / --sh-tm }` を書き換える方式。zoom や transform:scale と違い
     文字が実解像度で描かれ罫線も潰れない（帳票＝与薬・食数の読み取りに直結するため画質優先）。
   ★列幅（colgroup の px 指定）と表の総幅は変えない＝幅予算(1062px)と印刷レイアウトは不変。
     縮むのは行の高さだけ。
   収束は shift-app.html の shrinkZoomToFit と同じ考え方（比例補正→固定刻みフォールバック→反復上限）。
   ★下限 SHEET_FS_MIN を下回ってまでは縮めない。読めない紙面を出すくらいなら2枚に流す。
   （2026-08-05 運用指示「36名までは調整なしで1枚に入るように」を満たすための実装） */
const SHEET_FS_BASE = 11, SHEET_TM_BASE = 10;   // 画面既定（CSS の table.sheet と一致させること）
const SHEET_FS_MIN  = 7;                        // 帳票の可読性の下限（これ以下には縮めない）
/* ★拡大の上限（2026-08-05 運用指示）。実際に適用されるのは次の3つの最小値:
     ① このタブ別上限 … 時刻列(46px)に太字の「13:00」が欠けずに収まる最大（実測 15px）
     ② nameFitMaxFs_ … 氏名が2行に折り返さない最大（実データの最長氏名から算出・通常はこれが効く）
     ③ 用紙1枚に収まること … 下の実測ループ
   ★対象は【時刻列を46pxへ広げた帳票】。薬用(sc-med)は時刻列が 34px だったため 15px では「9:00」の
     末尾が欠け、長らく対象外にしていた。2026-08-17 に右の備考パネルを削除して時刻列を46pxへ広げた
     ＝daylist と同条件になったので解禁した。 */
const SHEET_FS_MAX_BY_TAB = { 'sc-daylist': 15, 'sc-allweek': 15, 'sc-med': 15 };
function sheetFsMax_(sc) { return SHEET_FS_MAX_BY_TAB[sc] || SHEET_FS_BASE; }

/* 氏名が2行に折り返さない最大の文字サイズ（2026-08-05 運用指示）。
 * 氏名列の幅は固定なので、上限は【いちばん長い氏名】だけで決まる。表示中の実データから測る＝
 * 入居者が入れ替われば自動で追従する（定数で決め打ちしない）。
 * 文字の幅は font-size に比例するので、基準サイズでの実測幅から比例計算で求める。
 * ★既定サイズ(11px)より小さくはしない。既定で折り返す長い氏名が1人でも居ると全体が
 *   際限なく小さくなるため。その場合は現状維持＝画面と同じ見え方に留める。 */
function nameFitMaxFs_(sc, capMax) {
  const cells = document.querySelectorAll('#' + sc + ' table.sheet td.c-nm');
  if (!cells.length) return capMax;
  const cs = getComputedStyle(cells[0]);
  /* ★安全代を取る。clientWidth は整数へ丸められ、文字幅も小数で出るため、ぴったりに合わせると
     0.1px 足りずに折り返す（実測: 幅72.96 に対し内寸73 で折り返した）。2%＋1px 引いておく。 */
  const avail = (cells[0].clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0) - 1) * 0.98;
  if (!(avail > 0)) return capMax;
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;'
    + 'font-family:' + cs.fontFamily + ';font-weight:' + cs.fontWeight
    + ';letter-spacing:' + cs.letterSpacing + ';font-size:' + SHEET_FS_BASE + 'px';
  document.body.appendChild(probe);
  let maxW = 0;
  const seen = Object.create(null);
  for (let i = 0; i < cells.length; i++) {
    // 合計行のラベル（「せせらぎ合計」等）は氏名列に置いているだけで氏名ではない。
    // 従来から2行で運用しており、これを1行に収めようとすると氏名の上限が不当に下がる。
    const row = cells[i].parentElement;
    if (row && row.classList.contains('sum')) continue;
    // 氏名の直後に（入院）が別行で入る場合があるので、先頭のテキストノード（＝氏名）だけを測る
    const fc = cells[i].firstChild;
    const t = String(((fc && fc.nodeType === 3) ? fc.nodeValue : cells[i].textContent) || '').trim();
    if (!t || seen[t]) continue;
    seen[t] = true;
    probe.textContent = t;
    const w = probe.getBoundingClientRect().width;
    if (w > maxW) maxW = w;
  }
  probe.remove();
  if (!(maxW > 0)) return capMax;
  const fs = SHEET_FS_BASE * (avail / maxW);
  return Math.max(SHEET_FS_BASE, Math.min(capMax, Math.floor(fs * 100) / 100));
}
let fittedFs = 0;                               // 直近の印刷で適用した文字サイズ（0=既定のまま）。通知に使う
const PAGE_MM_H = { 'A4 portrait': 297, 'A4 landscape': 210, 'A3 portrait': 420, 'A3 landscape': 297 };
const PAGE_MM_W = { 'A4 portrait': 210, 'A4 landscape': 297, 'A3 portrait': 297, 'A3 landscape': 420 };
function pageMarginMm_(spec) { return spec ? (parseFloat(spec.margin) || 0) : 8; }   // 上下左右同値の指定のみ対象
// 用紙の印刷可能高さ(px@96dpi)。spec 無し（利用表）は静的@page の A4縦8mm。
function pageAvailPx_(spec) {
  const mmH = (spec && PAGE_MM_H[spec.size]) ? PAGE_MM_H[spec.size] : 297;
  return (mmH - pageMarginMm_(spec) * 2) / 25.4 * 96;
}
// 用紙の印刷可能幅(px@96dpi)。A3縦・A4横はどちらも 297mm 幅＝1062px（列幅予算の根拠）。
function pageWidthPx_(spec) {
  const mmW = (spec && PAGE_MM_W[spec.size]) ? PAGE_MM_W[spec.size] : 210;
  return (mmW - pageMarginMm_(spec) * 2) / 25.4 * 96;
}
/* 画面のままでは実際の紙面高を測れない（@media print のルールが効かない）ため、高さに効く印刷ルール
   だけを一時的に画面へ適用して測る。★ここは @media print の該当規則と必ず同じ内容に保つこと。
   ★用紙の「幅」も再現する。凡例や表題は幅で折返し行数が変わるため、画面幅のまま測ると
     窓が狭い端末で高さを過大に見積もり、不必要に小さい文字で印刷してしまう。 */
function withPrintMetrics_(fn, spec) {
  const w = Math.round(pageWidthPx_(spec));
  const wrap = $('wrap');
  const sx = window.pageXOffset, sy = window.pageYOffset;                 // 測定用に幅を変えるので
  const wl = wrap ? wrap.scrollLeft : 0, wt = wrap ? wrap.scrollTop : 0;  // 閲覧位置を保全して戻す
  const st = document.createElement('style');
  st.textContent =
    '.hdr,#toast,.tnav{display:none!important}.noprint{display:none!important}' +
    /* 非表示設定が有効な時だけ凡例に出る注記。印刷時のみ表示＝再現しないと凡例を低く見積もり、
       縮小が要る局面（37名〜）で「収まる」と誤判定して2枚に溢れる。@media print の規則と同内容にする。 */
    '.hide-print-note{display:inline!important;font-weight:700}' +
    'html,body{width:' + w + 'px!important;min-width:0!important;overflow:visible!important}' +
    '.wrap{overflow:visible;padding:0;width:' + w + 'px!important}' +
    /* 印刷日も再現する（@media print の .print-date と同内容）。凡例の flex に入る要素なので、
       出さずに測ると折返し＝高さを過小評価する。 */
    '.print-date{display:inline-block!important;margin-left:auto;' +
      'font-size:9px;line-height:1.2;white-space:nowrap}' +
    '.legend{width:' + w + 'px!important}table.sheet{box-shadow:none}' +
    '#sc-daylist table.sheet td,#sc-daylist table.sheet th{padding-top:3px;padding-bottom:3px}' +
    'table.sheet td.c-nm{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15;overflow-wrap:anywhere}' +
    /* 利用表(table.roster)の印刷規則も再現する（fitRosterPrint_ の測定用）。
       ★@media print の該当規則と必ず同じ内容に保つこと。列幅は印刷用の --ro-w-*（表のインラインstyle）
         を参照させる＝画面幅(78/30/118)のまま測ると折返し行数が変わり高さを誤る。
       ★セレクタは table.roster / .col-* に限定＝帳票タブ(table.sheet)の測定には影響しない。 */
    'table.roster{box-shadow:none;width:100%}' +
    '.col-time{width:var(--ro-w-time,68px)}.col-flr{width:var(--ro-w-flr,26px)}' +
    '.col-rn{width:var(--ro-w-rn,24px)}.col-day{width:var(--ro-w-day,88px)}' +
    'table.roster th,table.roster td{padding:2px 3px}' +
    'table.roster td.user{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15}' +
    'table.roster tr.spacer td{height:5px}';
  document.head.appendChild(st);
  try { return fn(); }
  finally {
    st.remove();
    if (wrap) { wrap.scrollLeft = wl; wrap.scrollTop = wt; }
    window.scrollTo(sx, sy);
  }
}
/* ★--sh-fs/--sh-tm は CSS で table.sheet に定義されている。:root へ入れても table.sheet 自身の宣言が
   勝つため、必ず各 table.sheet のインラインstyleへ設定する（インラインが最優先）。 */
function setSheetFont_(fs) {
  document.querySelectorAll('table.sheet').forEach(t => {
    if (fs == null) { t.style.removeProperty('--sh-fs'); t.style.removeProperty('--sh-tm'); return; }
    t.style.setProperty('--sh-fs', fs.toFixed(2) + 'px');
    t.style.setProperty('--sh-tm', (fs * (SHEET_TM_BASE / SHEET_FS_BASE)).toFixed(2) + 'px');   // 時刻は本文との比率を維持
  });

// 現在のタブの「紙に載る総高」= 凡例＋セクション（表題・表・備考を含む）
function measureSheetH_(sc) {
  const lg = $('legend'), sec = document.getElementById(sc);
  return (lg ? lg.getBoundingClientRect().height : 0) + (sec ? sec.getBoundingClientRect().height : 0);
}

  const sec = document.getElementById(sc);

  const spec = PRINT_SPEC[sc];
  if (spec && /\s/.test(String(spec.margin).trim())) return;   // 上下左右が同値でない margin は高さ算出が合わない＝フィットしない
  const avail = pageAvailPx_(spec);

    withPrintMetrics_(() => {
      setSheetFont_(SHEET_FS_BASE);                 // まず既定サイズで測る
      let fs = SHEET_FS_BASE, h = measureSheetH_(sc), n = 0;
      if (h > avail) {
        /* 収まらない → 縮める（従来どおり）。下限を割ってまでは縮めない＝読めない紙面を出さない。 */
        while (h > avail && fs > SHEET_FS_MIN && n < 8) {
          let next = fs * (avail / h) * 0.995;      // 比例補正
          if (!(next > 0) || !(next < fs)) next = fs * 0.97;   // 縮まない/不正値なら固定刻み（無限ループ・発散の封じ）
          fs = Math.max(SHEET_FS_MIN, next);
          setSheetFont_(fs);
          h = measureSheetH_(sc);
          n++;
        }
      } else {
        /* 余白がある → 1枚に収まる範囲で大きくする（2026-08-05 運用指示「上下に伸ばして大きく」）。
           ★必ず「収まることを実測してから採用」する。溢れた候補は採らずに直前の値で確定する
           （＝拡大が原因で2枚に流れることが構造的に起きない）。 */
        /* 拡大の上限は「タブ別の上限」と「氏名が1行に収まる上限」の小さい方
           （2026-08-05 運用指示: 氏名を2行にしない） */
        let best = SHEET_FS_BASE, fsMax = nameFitMaxFs_(sc, sheetFsMax_(sc));
        while (fs < fsMax && n < 8) {
          let next = Math.min(fsMax, fs * (avail / h) * 0.99);
          if (!(next > fs + 0.05)) break;           // これ以上伸びない（収束）
          setSheetFont_(next);
          const h2 = measureSheetH_(sc);
          if (h2 > avail) { break; }                 // 溢れたら採らない（best は直前のまま）
          best = next; fs = next; h = h2; n++;
        }
        setSheetFont_(best);
        fs = best;
      }
      if (fs === SHEET_FS_BASE) { setSheetFont_(null); fittedFs = 0; }   // 既定のまま＝画面・印刷とも従来どおり
      else fittedFs = fs;                            // 拡大・縮小とも呼び出し側へ知らせる（黙って変えない）
    }, spec);
  } catch (e) {
    // 測定に失敗したら縮小を持ち越さない（画面が縮んだままになる方が害が大きい）
    setSheetFont_(null); fittedFs = 0;
  }
}
/* ============================================================================
   印刷フィット（fitRosterPrint_）— 利用表タブ用。2026-08-17 運用指示
   「左右に余白があるためできるだけ大きく用紙に出力」に対する縦方向の対応。
   列幅は setRosterPrintCols_ が用紙幅いっぱいに配分し、こちらは A4縦1枚に収まる最大の文字サイズを決める。
   ★帳票タブ(fitSheetPrint_)と同じ考え方: 拡大は「収まることを実測してから採用」＝溢れた候補は採らない。
   ★縮小は今回の追加。階でブロック分けすると行数が増える（曜日ごとに階の人数が違うため）ので、
     従来1枚だった帳票が2枚に流れうる。読める下限(9px)までは縮めて1枚を維持し、縮めた時はトーストで知らせる。
   ★文字サイズは @media print 限定の後勝ち規則（#dyn-roster）で適用する。インラインstyleに残すと
     afterprint が発火しない環境（モバイルSafari/WebView）で画面が縮んだまま残るため。
   ============================================================================ */
const ROSTER_FS_BASE = 12, ROSTER_FS_MAX = 20, ROSTER_FS_MIN = 9;   // BASE は CSS の table.roster --ro-fs と一致させること
/* ★上限20px の根拠: 狭い列は文字サイズに上限を持たせてあり（No.=12px・階=15px）、
   利用時間列は文字に比例して広げる（setRosterPrintCols_）ので、20px でも欠けは起きない。
   ここより上げても、実際に効くのは下の rosterNameFitMaxFs_（氏名が1行に収まる上限。
   曜日列は 12px時102px → 20px時87px と狭くなるため、通常はこちらが先に効く）。 */
let fittedRoFs = 0;                                                 // 直近の印刷で適用した文字サイズ（0=既定のまま）
// 測定用: 画面へ一時的に適用する（測り終えたら必ず null で戻す）
function setRosterFontLive_(fs) {
  const t = $('roster');
  if (!t) return;
  if (fs == null) t.style.removeProperty('--ro-fs');
  else t.style.setProperty('--ro-fs', fs.toFixed(2) + 'px');
}
/* 氏名が2行に折り返さない最大の文字サイズ（帳票タブの nameFitMaxFs_ と同じ考え方の利用表版）。
   ★別関数にしてあるのは、対象セル（td.user）・基準サイズ（12px）・列幅が文字サイズで変わる点が
     帳票タブ（td.c-nm・11px・固定幅）と違うため。共通化は3例目が出てから。
   ★列幅は文字が大きいほど狭くなる（利用時間列へ回すため）。いちばん狭くなる上限側の幅で判定する＝安全側。 */
function rosterNameFitMaxFs_(tbl, nCols, capMax) {
  setRosterPrintCols_(tbl, nCols, capMax);
  const cells = tbl.querySelectorAll('tbody td.user');
  if (!cells.length) return capMax;
  const cs = getComputedStyle(cells[0]);
  // 安全代: clientWidth は整数丸め・文字幅は小数のため、ぴったりだと0.1px足りずに折り返す（2%＋1px引く）
  const avail = (cells[0].clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0) - 1) * 0.98;
  if (!(avail > 0)) return capMax;
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;'
    + 'font-family:' + cs.fontFamily + ';font-weight:' + cs.fontWeight
    + ';letter-spacing:' + cs.letterSpacing + ';font-size:' + ROSTER_FS_BASE + 'px';
  document.body.appendChild(probe);
  let maxW = 0;
  const seen = Object.create(null);
  for (let i = 0; i < cells.length; i++) {
    // 氏名の直後に（入院）が続く場合があるので、先頭のテキストノード（＝氏名）だけを測る
    const fc = cells[i].firstChild;
    const t = String(((fc && fc.nodeType === 3) ? fc.nodeValue : cells[i].textContent) || '').trim();
    if (!t || seen[t]) continue;
    seen[t] = true;
    probe.textContent = t;
    const wpx = probe.getBoundingClientRect().width;
    if (wpx > maxW) maxW = wpx;
  }
  probe.remove();
  if (!(maxW > 0)) return capMax;
  const fs = ROSTER_FS_BASE * (avail / maxW);
  // 既定より小さくはしない（長い氏名が1人でも居ると際限なく小さくなるため。その場合は現状維持）
  return Math.max(ROSTER_FS_BASE, Math.min(capMax, Math.floor(fs * 100) / 100));
}
// 印刷用: @media print の中だけで効く規則として注入する（画面には持ち越さない）
function applyRosterPrintFont_(fs) {
  const old = document.getElementById('dyn-roster');
  if (old) old.remove();
  if (fs == null) return;
  const st = document.createElement('style');
  st.id = 'dyn-roster';
  st.textContent = '@media print{table.roster{--ro-fs:' + fs.toFixed(2) + 'px}}';
  document.head.appendChild(st);
}
function fitRosterPrint_() {
  const tbl = $('roster');
  if (!tbl || !tbl.tBodies.length || !tbl.tBodies[0].rows.length) { applyRosterPrintFont_(null); fittedRoFs = 0; return; }
  const avail = pageAvailPx_(null);            // 静的@page の A4縦8mm → 1062px
  const nCols = tbl.tHead ? tbl.tHead.rows[0].querySelectorAll('th.th-day').length : NDAY;
  // 文字サイズを変えるたびに列幅も引き直す（利用時間列が文字に比例するため）
  const setFs = fs => { setRosterFontLive_(fs); setRosterPrintCols_(tbl, nCols, fs); };
  let best = ROSTER_FS_BASE;
  try {
    withPrintMetrics_(() => {
      setFs(ROSTER_FS_BASE);                   // まず既定サイズで測る
      let fs = ROSTER_FS_BASE, h = measureSheetH_('sc-roster'), n = 0;
      if (h > avail) {
        while (h > avail && fs > ROSTER_FS_MIN && n < 8) {
          let next = fs * (avail / h) * 0.995;                 // 比例補正
          if (!(next > 0) || !(next < fs)) next = fs * 0.97;   // 縮まない/不正値なら固定刻み（無限ループ封じ）
          fs = Math.max(ROSTER_FS_MIN, next);
          setFs(fs);
          h = measureSheetH_('sc-roster');
          n++;
        }
        /* ★縮めた結果ちゃんと1枚に入った時だけ採用する。下限(9px)まで縮めても収まらないなら
           従来サイズへ戻す＝「読めない紙面で、しかも2枚」を避ける（改修前と同じ12pxで2枚に流す）。 */
        best = (h <= avail) ? fs : ROSTER_FS_BASE;
      } else {
        /* 拡大の上限は「タブの上限(20px)」と「氏名が1行に収まる上限」の小さい方
           （2026-08-05 に帳票タブで決めた「氏名を2行にしない」を利用表にも適用） */
        const fsMax = rosterNameFitMaxFs_(tbl, nCols, ROSTER_FS_MAX);
        setFs(fs);                             // 上限判定で触った列幅を測定時の値へ戻す
        while (fs < fsMax && n < 8) {
          const next = Math.min(fsMax, fs * (avail / h) * 0.99);
          if (!(next > fs + 0.05)) break;      // これ以上伸びない（収束）
          setFs(next);
          const h2 = measureSheetH_('sc-roster');
          if (h2 > avail) break;               // 溢れたら採らない（best は直前のまま）
          best = next; fs = next; h = h2; n++;
        }
      }
      /* ★列幅の最終確定は【この中で】行う。rosterTimeColW_ は padding の実測値を使うため、
         測定用スタイル（印刷と同じ padding:2px 3px）の外で呼ぶと画面の padding:2px 4px で計算され、
         「1枚に収まる」と判定した時の列幅と実際に刷る列幅がずれる。 */
      setFs(best);
    }, null);
  } catch (e) {
    best = ROSTER_FS_BASE;                     // 測定に失敗したら従来サイズで刷る（画面も紙も壊さない）
    // 例外時は測定用スタイルの外で引き直す（padding が2px広く出る＝利用時間列が広い安全側）
    try { setRosterPrintCols_(tbl, nCols, best); } catch (e2) {}
  }
  setRosterFontLive_(null);                    // ★測定用の一時適用は必ず戻す（画面は常に既定サイズ）
  const changed = Math.abs(best - ROSTER_FS_BASE) > 0.01;
  applyRosterPrintFont_(changed ? best : null);
  fittedRoFs = changed ? best : 0;
}

/* 印刷日の文字列（YYYY/MM/DD）。印刷のたびに採り直すのでタブを開きっぱなしでも古くならない。 */
function printDateText_() {
  const d = new Date(), p2 = v => (v < 10 ? '0' + v : String(v));
  return '印刷日：' + d.getFullYear() + '/' + p2(d.getMonth() + 1) + '/' + p2(d.getDate());
}
/* 凡例の右端に印刷日を置く（無ければ作る）。renderLegend の最後と、印刷の直前の両方から呼ぶ。
   ★印刷経路は printNow（印刷ボタン）と beforeprint（Cmd/Ctrl+P・PDF出力）の2つ。両方から呼ぶ。 */
function stampPrintDate_() {
  const box = $('legend');
  if (!box) return;
  let n = box.querySelector('.print-date');
  if (!n) { n = el('span', 'print-date'); box.appendChild(n); }
  n.textContent = printDateText_();
}
function clearPrintState_() {
  clearTimeout(printTimer); printTimer = null;   // ★前ジョブの保険タイマーを必ず止める
  document.body.classList.remove('pr-batch');
  const nodes = document.querySelectorAll('#dyn-page,#dyn-roster');   // 用紙指定＋利用表の印刷文字サイズ
  for (let i = 0; i < nodes.length; i++) nodes[i].remove();
  $('printBatch').textContent = '';     // ★氏名をDOMに残さない
  setSheetFont_(null);                  // 印刷用に縮めた文字サイズを画面へ持ち越さない
  setRosterFontLive_(null);             // 同上（測定が中断された場合の保険）
  fittedRoFs = 0;
}
function printNow() {
  clearPrintState_();
  stampPrintDate_();
  const sc = activeTab();
  const spec = PRINT_SPEC[sc];
  if (spec) {
    const st = document.createElement('style');
    st.id = 'dyn-page';
    st.textContent = '@media print{@page{size:' + spec.size + ';margin:' + spec.margin + '}}';
    document.head.appendChild(st);      // ページ先頭の静的スタイルより後にappend＝後勝ち（コメント内にタグ表記を書かない＝構文チェッカの誤検知回避）
  }
  fitSheetPrint_(sc);                   // 用紙1枚に収まる最大の文字サイズへ（収まるなら既定のまま）
  if (sc === 'sc-roster') fitRosterPrint_();   // 利用表は専用のフィット（列幅は描画時に配分済み）
  // 縮小したら黙らずに知らせる（＝紙面が小さくなった理由が現場に分かるように）。
  // 拡大は「読みやすくなる」方向なので通知しない（毎回の印刷でトーストが出るのは邪魔）。
  if (fittedFs && fittedFs < SHEET_FS_BASE) toast('1枚に収めるため文字を ' + fittedFs.toFixed(1) + 'px に縮小しました（利用者が多いため）');
  if (fittedRoFs && fittedRoFs < ROSTER_FS_BASE) toast('1枚に収めるため文字を ' + fittedRoFs.toFixed(1) + 'px に縮小しました（利用者が多いため）');
  if (sc === 'sc-weekly') {             // 一括6枚: 6ページを構築して並べる
    const host = $('printBatch');
    host.textContent = '';
    const ppl = MODEL || [];
    for (let d = 0; d < NDAY; d++) {
      const pg = el('div', 'pg');
      pg.appendChild(el('div', 'pg-date', printDateText_()));   // 一括6枚は凡例が出ないので各ページ先頭へ
      pg.appendChild(weeklyTable(ppl, d));
      host.appendChild(pg);             // ★ちょうど6要素（末尾の空白ページ防止）
    }
    document.body.classList.add('pr-batch');
  }
  let cleaned = false;
  const done = function () { if (cleaned) return; cleaned = true; clearPrintState_(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  // afterprint 未発火の保険。★モジュールスコープに保持し、次ジョブ開始時の clearPrintState_() で
  //   必ず止める（放置すると前ジョブのタイマーが次ジョブ中に発火し、@page と印刷用DOMを消してしまう）。
  printTimer = setTimeout(done, 3000);

}
// OSの印刷ショートカット（Cmd/Ctrl+P）は printNow を通らないため、用紙指定が効かない。
// beforeprint で同じ準備を通し、どの経路でもタブの用紙で出るようにする。
window.addEventListener('beforeprint', function () {
  stampPrintDate_();   // ★早期returnの前に置く（利用表タブは printNow でも下のガードを通過するため）
  // printNow 経由なら準備済み。#dyn-roster も見るのは、利用表(spec=null)では #dyn-page が作られず
  // 同じフィット計算を二度走らせてしまうため（結果は同じだが測定は重い）。
  // ※ただし利用表で文字サイズが既定のまま（＝#dyn-roster を作らない）場合はここを通過し、
  //   fitRosterPrint_ が2回走る。結果は同値で、末尾のタイマー条件も false になるため害はない。
  if (document.querySelector('#dyn-page,#dyn-roster') || document.body.classList.contains('pr-batch')) return;
  const sc = activeTab();
  const spec = PRINT_SPEC[sc];
  if (spec) {
    const st = document.createElement('style');
    st.id = 'dyn-page';
    st.textContent = '@media print{@page{size:' + spec.size + ';margin:' + spec.margin + '}}';
    document.head.appendChild(st);
  }
  fitSheetPrint_(sc);   // Cmd/Ctrl+P 経路でも同じ自動フィットを通す
  if (sc === 'sc-roster') fitRosterPrint_();
  if (sc === 'sc-weekly') {
    const host = $('printBatch');
    host.textContent = '';
    for (let d = 0; d < NDAY; d++) {
      const pg = el('div', 'pg');
      pg.appendChild(el('div', 'pg-date', printDateText_()));
      pg.appendChild(weeklyTable(MODEL || [], d));
      host.appendChild(pg);
    }
    document.body.classList.add('pr-batch');
  }

  // 次に別タブで Ctrl+P すると冒頭のガードが古い #dyn-page を見て早期returnし、前タブの用紙で刷られる。
  // ★下の条件が printTimer 競合を防ぐ唯一の防御＝外さないこと。
  //   sc-roster は spec=null かつ非weekly のため printNow 経由でも冒頭のガードを通過してここへ到達する
  //   （#dyn-page も pr-batch も作らないため）。条件を外して無条件に張ると、printNow が直前に仕掛けた
  //   done のタイマーを上書きし、afterprint 未発火時に done が走らず afterprint リスナが残留する。
  //   ★#dyn-roster の条件を足したのは、利用表(spec=null)でもこの経路が印刷用の文字サイズ規則を
  //     作るようになったため。afterprint 未発火だと残留し、次に別タブで Ctrl+P した時に冒頭のガードが
  //     それを見て早期returnし、前タブの用紙で刷られる（#dyn-page と同型の事故）。
  //     ここへ到達した時点で冒頭のガードは通過済み＝#dyn-roster があれば今回のこのハンドラが作った物なので、
  //     printNow が仕掛けた done のタイマーを奪う心配はない（printNow 経由なら冒頭で早期returnしている）。
  if (spec || sc === 'sc-weekly' || document.querySelector('#dyn-roster')) printTimer = setTimeout(clearPrintState_, 3000);
});
window.addEventListener('afterprint', clearPrintState_);   // どの経路でも必ず後片付け

/* ============================================================================
   タブ / 凡例 / UI
   ============================================================================ */
let MODEL = null;
let ROSTER_SUB = '';   // 利用表タブの指標（改修前からの表示）
let MODEL_SUB  = '';   // 新4タブの指標
const LEGENDS = {
  'sc-roster':  [['sw', '黄＝入浴あり'], ['hosp', '（入院）＝入院中（合計には計上しない）'], ['t', '利用時間帯ごとに居室階（２階→１階）で分け、氏名は五十音順／下段に日別の入浴合計・利用合計']],
  'sc-daylist': [['sw', '黄＝入浴あり'], ['star', '☆＝訪問診療'], ['t', '上段＝デイ利用者／下段＝デイ休み（２階で昼食）']],
  'sc-allweek': [['sw', '黄＝入浴あり'], ['t', '氏名は各曜日に反復／利用日は開始・終了の時刻で表します']],
  /* 薬用の凡例メッセージは 2026-08-17 運用指示で削除（紙面の上部を空けて表を大きく出すため）。
     チェック欄の説明は画面側のチェックリスト内（.chk-sub）に残っている＝案内は失われていない。
     配列は空でも凡例バー自体は残す＝印刷日と⚠警告バッジ（階未設定・非表示中など）の置き場所。 */

  'sc-weekly':  [['t', 'デイ＝その日の利用者／２階＝デイに行かない方（2階食堂で昼食）。印刷は6曜日を一括で6枚出します']]

function activeTab() {
  const b = document.querySelector('.tnav button[aria-selected="true"]');

}
function renderLegend(sc) {
  const box = $('legend');
  box.textContent = '';
  (LEGENDS[sc] || []).forEach(([k, t]) => {
    if (k === 'sw') { const s = el('span', 'lg'); s.appendChild(el('span', 'lg-sw')); s.appendChild(document.createTextNode(t)); box.appendChild(s); }
    else if (k === 'hosp') { const s = el('span', 'lg'); s.appendChild(el('span', 'hosp-tag', '（入院）')); s.appendChild(document.createTextNode(t.replace('（入院）', ''))); box.appendChild(s); }

  // ★noprint: これは運用診断用の計器であって帳票の内容ではない。元表に無い文言を紙面へ足さない
  //   （既存の⚠バッジは従来から印刷されている＝現行挙動として触らない）。
  if (sc !== 'sc-roster' && (floorSrcCount.room || floorSrcCount.plan)) {
    let t = '階の出典: 居室 ' + floorSrcCount.room + '名';
    if (floorSrcCount.plan) t += '／週間計画の旧設定 ' + floorSrcCount.plan + '名（マスタに居室未登録）';
    box.appendChild(el('span', 'noprint', t));
  }
  // 階未設定は黙って落とさず警告として可視化（マスタ未登録＝ビューから脱落する事故の防止）
  const nf = (MODEL || []).filter(p => p.floor === 0).length;
  if (nf && sc !== 'sc-roster') box.appendChild(el('span', 'warn-badge', '⚠ 階未設定 ' + nf + '名（マスタ未登録）'));
  // 同一曜日の重複予定は本モデルで1枠に潰れる＝利用表タブと件数が食い違うため明示する
  if (dupCount && sc !== 'sc-roster') box.appendChild(el('span', 'warn-badge', '⚠ 同一曜日の重複予定 ' + dupCount + '件（1枠のみ表示）'));
  // 非表示設定が有効な時は全タブで明示（黙って人を落とさない）。
  //   画面用: 絵文字バッジ（noprint）。印刷用: 絵文字なしの注記（.hide-print-note＝印刷時のみ表示）。
  //   与薬・食数帳票から人が無言で欠落する事故を防ぐため、解除忘れが紙面でも分かるようにする（2026-07-27 運用裁定）。
  if (hiddenNowCount) {
    box.appendChild(el('span', 'warn-badge noprint', '🙈 非表示 ' + hiddenNowCount + '名（全端末共通・右上で解除）'));
    box.appendChild(el('span', 'hide-print-note', '※非表示設定により ' + hiddenNowCount + '名を除外中'));
  }
  stampPrintDate_();   // 印刷日は常に凡例の最後（＝右端）。印刷時のみ表示されるが、測定にも載せる
}
const TAB_KEY = 'dcr_activeTab';   // リロード後も同じタブを開くための端末保存（タブidは個人情報でない）
function goto(sc) {
  document.querySelectorAll('.tnav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.sc === sc)));
  document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === sc));
  renderLegend(sc);
  $('hdrSub').textContent = (sc === 'sc-roster') ? ROSTER_SUB : MODEL_SUB;   // タブごとの指標を出し分け
  $('btnPrint').setAttribute('aria-label', (PRINT_SPEC[sc] ? PRINT_SPEC[sc].size : 'A4 portrait') + ' で印刷');
  try { if (PRINT_SPEC.hasOwnProperty(sc)) localStorage.setItem(TAB_KEY, sc); } catch (e) {}
}
// 保存済みタブ（既知のタブのみ）。無効/未保存は利用表。
function savedTab() {
  try { const s = localStorage.getItem(TAB_KEY); if (s && PRINT_SPEC.hasOwnProperty(s)) return s; } catch (e) {}
  return 'sc-roster';
}

let toastTimer = null;
function toast(msg, isNg) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'on' + (isNg ? ' ng' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2600);
}
function setSyncState(txt) { $('syncState').textContent = txt; }

function renderAll(db) {
  db = dcrOverlayMaster(db);   // 入居者マスタ由来の入院/訪問診療を【重ねたコピー】で描画（DBは書き換えない）
  // 非表示設定を反映: 候補一覧（非表示者も含む・五十音）を作り、db から非表示を除いたビューを全描画へ渡す。
  HIDE_CANDIDATES = collectHideCandidates(db);
  hiddenNowCount = HIDE_CANDIDATES.filter(c => c.hidden).length;   // 現候補のうち実際に隠れている人数
  updateHideButton();
  // 非表示モーダルを開いたまま裏で候補が変わっても（更新/保存/起動時取得）、一覧を権威データへ再同期する。
  // ★これが無いと、開いたままのチェックボックスが古い並びを指し、別人を非表示にしうる（識別子照合と二重の防御）。
  try { if (!$('hideModal').hidden) renderHideList(); } catch (e) {}
  const view = viewExcludingHidden(db);   // 非表示ゼロなら db 原本（挙動完全不変）
  MODEL = buildModel(view);
  const empty = $('boardEmpty');
  // 空判定は利用表タブ基準（collectDaycare＝日〜土の全曜日）で行う。MODEL は月〜土のため、
  // これを空判定に使うと「日曜のみ通所」のデータで利用表まで空表示になり既存挙動が変わる。
  const rosterHas = collectDaycare(view).plans.length > 0;
  if (!rosterHas && !MODEL.length) {
    ['roster', 'tblDaylist', 'tblAllweek', 'tblMed'].forEach(id => { $(id).textContent = ''; });
    $('weeklyPages').textContent = '';
    $('hospBox').style.display = 'none';
    empty.classList.add('on');
    // 元データはあるが全員を非表示にしている場合は、その旨を出して解除へ導く（黙って空にしない）。
    if (HIDE_CANDIDATES.length && hiddenNowCount >= HIDE_CANDIDATES.length) {
      $('emptyMsg').textContent = '表示できる利用者がいません（' + hiddenNowCount + '名を非表示設定中）。右上「非表示設定」で解除できます。';
    } else {
      $('emptyMsg').textContent = db ? '通所（デイサービス）の予定がありません。' : '週間計画のデータが見つかりません。';
    }
    // タブ(.tnav)は空状態でも押せるため、退避値を消さないと goto() が前回の件数を復活させてしまう。
    ROSTER_SUB = ''; MODEL_SUB = '';
    $('hdrSub').textContent = '';
    $('legend').textContent = '';   // 前回描画の凡例バッジ（非表示 N名 等）が古い件数で残らないようにする
    return;
  }
  empty.classList.remove('on');
  // 各ビューは独立して描画（1つが落ちても他を巻き込まない）。★view（非表示除外後）を渡す。
  const safe = (fn, id) => { try { fn(); } catch (e) { toast(id + ' の描画に失敗しました', true); } };
  safe(() => renderRoster(view), '利用表');
  safe(() => renderDaylist(MODEL), 'デイ利用者一覧表');
  safe(() => renderAllweek(MODEL), '全員リスト');
  safe(() => renderMed(MODEL), '薬用');
  safe(() => renderWeekly(MODEL), '週間名簿');
  const dei = []; for (let d = 0; d < NDAY; d++) dei.push(countOn(MODEL, d));
  MODEL_SUB = 'デイ母集団 ' + MODEL.length + '名／デイ ' + dei.join('・');
  goto(activeTab());   // 凡例・指標を現在のタブに合わせて反映
}

let busy = false;
// silent=true: 起動時の自動取得（成功・失敗ともトーストを出さず、状態表示のみ更新する）
async function refresh(silent) {
  if (busy) return;
  // 未送信の楽観的変更がある間は取得しない（サーバ版でDBを差し替えると未保存分を取りこぼす）。
  // 背景ワーカーが送信中／キューに残っている間はスキップし、送信完了後の取得に委ねる。
  if (saverRunning || pendingFlags.size) { if (!silent) toast('保存中です。完了後にお試しください', true); return; }
  busy = true;
  $('btnRefresh').disabled = true;
  setSyncState('取得中…');
  try {
    const remote = await fetchRemote();
    // 取得の往復中にトグルが始まっていたら、この結果は破棄（未送信の楽観的変更をサーバ版で潰さない）。
    if (saverRunning || pendingFlags.size) { setSyncState(DB && DB.residents ? ('端末表示（' + DB.residents.length + '名）') : ''); return; }
    if (remote) {
      DB = remote.data; careRev = remote.rev;   // ★データと版は必ず同時に更新する（片方だけ進めない）
      renderAll(DB);
      setSyncState('取得OK（' + DB.residents.length + '名）');
      if (!silent) toast('最新の週間計画を取得しました');
    } else {
      setSyncState('クラウドにデータなし');
    }
  } catch (e) {
    setSyncState(silent ? '端末キャッシュ表示（取得失敗）' : '取得失敗');
    if (!silent) toast('取得に失敗しました。通信環境を確認してください', true);
  } finally {
    busy = false;
    $('btnRefresh').disabled = false;
  }
}

/* ── 非表示設定モーダルの描画・開閉 ── */
function updateHideButton() {
  const b = $('btnHide');
  if (!b) return;
  b.textContent = hiddenNowCount ? ('🙈 非表示設定 (' + hiddenNowCount + ')') : '🙈 非表示設定';
  b.classList.toggle('active', hiddenNowCount > 0);   // 有効時は目立たせる（黙って隠さない）
}
let hideModalPrevFocus = null;
function renderHideList() {
  const box = $('hideList');
  const keepScroll = box.scrollTop;   // 背景保存/更新のたびに作り直しても閲覧位置を保つ（トグル時のガタつき防止）
  box.textContent = '';
  if (!HIDE_CANDIDATES.length) {
    box.appendChild(el('div', 'modal-empty', 'デイサービスの利用者がいません。'));
    return;
  }
  HIDE_CANDIDATES.forEach(c => {
    const lb = el('label', 'modal-item');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = c.hidden;   // サーバ正本(dcrHidden)から復元
    // ★配列位置でなく安定ID(masterId/内部id)で紐付ける。裏で候補順がずれても別人を書き換えない（非PII）。
    cb.dataset.mid = (c.masterId != null ? String(c.masterId) : '');
    cb.dataset.rid = (c.rid != null ? String(c.rid) : '');
    cb.setAttribute('aria-label', c.name + ' を非表示にする');
    lb.appendChild(cb);
    lb.appendChild(document.createTextNode(c.name));   // 氏名は textContent（個人情報・XSS防止）
    if (c.kana) lb.appendChild(el('span', 'mi-kana', c.kana));
    box.appendChild(lb);
  });
  box.scrollTop = keepScroll;   // 閲覧位置を復元
}
// チェックボックス → 現 HIDE_CANDIDATES の該当者を安定IDで引く（idx依存を避ける）。見つからなければ null。
function hideCandidateFromCb_(cb) {
  const mid = cb.dataset.mid || '', rid = cb.dataset.rid || '';
  return HIDE_CANDIDATES.find(x =>
    (mid && x.masterId != null && String(x.masterId) === mid) ||
    (rid && x.rid != null && String(x.rid) === rid)) || null;
}
function openHideModal() {
  renderHideList();
  const m = $('hideModal');
  hideModalPrevFocus = document.activeElement;   // 閉じたらトリガーへ戻す
  m.hidden = false;
  const f = $('hideClose'); if (f) f.focus();
}
function closeHideModal() {
  $('hideModal').hidden = true;
  if (hideModalPrevFocus && hideModalPrevFocus.focus) { try { hideModalPrevFocus.focus(); } catch (e) {} }
}

function init() {
  // クリックイベントを silent 引数として渡さない（イベントオブジェクトは真値のため、
  // 手動更新なのにトーストが出ない＝成功・失敗が現場に見えなくなる）。
  $('btnRefresh').addEventListener('click', () => refresh(false));
  $('btnRefresh2').addEventListener('click', () => refresh(false));
  $('btnPrint').addEventListener('click', printNow);
  // タブ/アプリを閉じる直前、未送信の変更をベストエフォートで送る（楽観的UIで即消えるため閉じられやすい・原則6）。
  window.addEventListener('pagehide', flushPendingBeacon_);
  // アプリ間ジャンプ（既存 shift-app.html と同じく相対パス・別タブ）。
  // 本ツールは読み取り専用のため、遷移前に保存すべき状態は無い。
  $('btnMaster').addEventListener('click', () => window.open('resident-master.html', '_blank'));
  $('btnCare').addEventListener('click', () => window.open('care-schedule.html', '_blank'));
  // 非表示設定モーダル
  $('btnHide').addEventListener('click', openHideModal);
  $('hideClose').addEventListener('click', closeHideModal);
  $('hideDone').addEventListener('click', closeHideModal);
  $('hideModal').addEventListener('click', e => { if (e.target === $('hideModal')) closeHideModal(); });   // 背景クリックで閉じる
  document.addEventListener('keydown', e => {
    if ($('hideModal').hidden) return;
    if (e.key === 'Escape') { closeHideModal(); return; }
    if (e.key === 'Tab') {   // フォーカスをモーダル内に閉じ込める（HIG: キーボード到達性）
      const f = [...$('hideModal').querySelectorAll('button, input')].filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $('hideList').addEventListener('change', e => {
    const cb = e.target;
    if (!cb || cb.type !== 'checkbox') return;
    const c = hideCandidateFromCb_(cb);   // 安定IDで引く（並び替え耐性）
    if (!c) { toast('一覧が更新されました。もう一度開き直してください', true); renderHideList(); return; }
    // dcrHidden を全端末共通で保存（queueFlags が即時反映＋背景保存。runSaver がモーダルも再同期）
    writeResidentFlag([{ rid: c.rid, masterId: c.masterId, name: c.name }], 'dcrHidden', cb.checked, '非表示設定');
  });
  $('hideShowAll').addEventListener('click', () => {
    const items = HIDE_CANDIDATES.filter(c => c.hidden).map(c => ({ rid: c.rid, masterId: c.masterId, name: c.name }));
    if (!items.length) { toast('非表示の利用者はいません'); return; }
    writeResidentFlag(items, 'dcrHidden', false, '非表示設定');   // 全端末へ反映
  });
  $('tnav').addEventListener('click', e => { const b = e.target.closest('button[data-sc]'); if (b) goto(b.dataset.sc); });

  // 旧・端末ローカル方式の非表示キーは全端末共通(dcrHidden)へ移行済み＝不要なので掃除する（残っても読まれない）。
  try { localStorage.removeItem('dcr_hidden'); } catch (e) {}
  DB = loadLocal();
  const restore = savedTab();   // ★renderAll 内の goto(activeTab()) が DOM既定(利用表)を保存で上書きする前に確保
  renderAll(DB);
  goto(restore);   // リロード後も直前に開いていたタブに留まる（既定は利用表）
  setSyncState(DB ? '端末キャッシュ表示（' + DB.residents.length + '名）' : 'データなし');
  /* 起動時の自動取得（2026-07-23 追加）。本ツールは端末キャッシュ(care_schedule_v2)へ書かないため、
     これが無いと「薬用タブで保存した昼食薬がリロードで古く見える」「他端末の居室変更が見えない」。
     薬用の色は印刷に出る＝古い状態のまま与薬帳票を刷る事故を防ぐ意味でも、開いた時点で最新に揃える。
     失敗しても従来どおり端末キャッシュ表示のまま（オフラインでも起動を妨げない・トーストも出さない）。 */
  if (syncTarget().endpoint) refresh(true);

  /* 入居者マスタの入院状態を重ねる（2026-08-02 追加）。
     接続設定が無い端末では何も起きない＝従来どおりの表示のまま。 */
  dcrFetchMasterHosp(true).then(function(ok){ if (ok && DB) renderAll(DB); });
  setInterval(function(){ try{ dcrWatchMasterState(); }catch(e){} }, 60000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) { try{ dcrWatchMasterState(); }catch(e){} }   // 復帰時に即時1回
  });
}
init();
</script>
