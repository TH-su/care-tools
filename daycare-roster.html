<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 検索エンジンに載せない（公開URLだが業務用ツールのため） -->
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.2, user-scalable=yes">
<!-- 実在入居者の氏名を表示する読み取り専用ビュー: キャッシュ残留を防ぐ -->
<meta http-equiv="Cache-Control" content="no-store">
<title>通所せせらぎ 利用表</title>
<style>
/* 通所（せせらぎ）— 週間計画(care_schedule_v2)を参照し、現場のExcel帳票5種をタブで表示する。
   5タブは全て「デイ母集団 × 月〜土 × {デイ利用 or 2階食堂で昼食}」という単一データモデルの別表現。
   ★書き込みは利用者フィールドの昼食薬(lunchMed)と非表示(dcrHidden)の2点のみ（2026-07-23/27/28）。
     楽観的UI＋背景保存（queueFlags/runSaver）で全端末共通に同期する。通常はrevキャッシュで1往復PUT、
     版ずれ時のみ最新GET＋自分の未確定フラグを載せ直して再PUT（rev競合ガード維持）。
     予定・時刻・辞書・rev運用や他フィールドには書き込まない＝他端末が編集中の週間計画を壊さない。 */
:root {
  --pri: #0b57d0; --pri-l: #ecf3fe; --pri-d: #0842a0;
  --ok: #2e7d32; --ng: #c62828;
  --bath-bg: #ffff00; --bath-b: #d4b800;   /* 入浴あり=ビビッドな黄（元のせせらぎ表と同じ） */
  --g0: #f8f9fa; --g1: #f1f3f4; --g2: #e8eaed; --g3: #dadce0;
  --g5: #9aa0a6; --g6: #80868b; --g7: #5f6368; --g8: #3c4043; --g9: #202124;
  --r: 12px; --sh: 0 1px 6px rgba(0,0,0,.12);
  --line: #b7bcc2;   /* 表罫線（スプレッドシート風に濃いめ） */
  --sese: #99cc00;   /* 「せせらぎ」ラベルの識別色（元表を継承） */
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  font-size: 0.875rem; color: var(--g9); background: var(--g1);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ===== ヘッダー ===== */
.hdr {
  flex-shrink: 0; min-height: 50px; background: var(--pri); color: #fff;
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex-wrap: wrap;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); z-index: 100;
}
.hdr-title { font-size: 0.9375rem; font-weight: 700; white-space: nowrap; }
.hdr-sub { font-size: 0.6875rem; opacity: .9; white-space: nowrap; }
.hdr-sp { flex: 1; }
.hdr-btn {
  min-height: 40px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35);
  color: #fff; border-radius: 6px; padding: 6px 14px; font-size: 0.8125rem; cursor: pointer; white-space: nowrap;
}
.hdr-btn:hover { background: rgba(255,255,255,.28); }
.hdr-btn:disabled { opacity: .4; cursor: default; }
.hdr-btn:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
.hdr-btn.solid { background: var(--pri); border-color: var(--pri); }   /* 白背景の空状態に置くボタン */
.sync-state { font-size: 0.6875rem; opacity: .9; white-space: nowrap; }

/* ===== タブ（weight-record 準拠の上タブ）=====
   規約既定は .bnav(下タブ)だが、本ツールは body が overflow:hidden の flex column で
   スクロール箱が .wrap 単独のため、fixed な .bnav は padding-bottom と印刷CSSの両方に干渉する。
   .hdr の直後に flex-shrink:0 の兄弟を1つ足す上タブなら既存の flex/scroll 配管に触れずに済む。 */
.tnav {
  flex-shrink: 0; display: flex; background: #fff; border-bottom: 1px solid var(--g3);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tnav button {
  flex: 1 0 auto; min-height: 44px; padding: 8px 14px;   /* HIG: タップ領域44px以上 */
  border: none; background: none; color: var(--g7); font-size: 0.8125rem; cursor: pointer;
  white-space: nowrap; border-bottom: 3px solid transparent;
}
.tnav button:hover { background: var(--g0); }
.tnav button:focus-visible { outline: 2px solid var(--pri); outline-offset: -2px; }
/* アクティブは 色＋下線＋背景 の3重表現（HIG: 色だけに意味を持たせない） */
.tnav button[aria-selected="true"] { color: var(--pri-d); font-weight: 700; border-bottom-color: var(--pri); background: var(--pri-l); }

.legend {
  flex-shrink: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 5px 12px; background: #fff; border-bottom: 1px solid var(--g3);
  font-size: 0.6875rem; color: var(--g7); min-height: 26px;
}
.lg { display: inline-flex; align-items: center; gap: 4px; }
.lg-sw { width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--bath-b); background: var(--bath-bg); flex-shrink: 0; }
.warn-badge { color: var(--ng); font-weight: 700; }
.hide-print-note { display: none; }   /* 非表示適用中に印刷帳票だけへ出す注記（画面では非表示・@media print で表示）＝人が無言で欠落する事故を防ぐ */

/* ===== 表（利用表タブ）===== */
.wrap {
  flex: 1; overflow: auto; padding: 12px; -webkit-overflow-scrolling: touch;
  position: relative;   /* .board-empty(position:absolute; inset:0) の位置指定祖先。無いとビューポート基準になりタブバーを覆う */
}
.scr { display: none; }
.scr.on { display: block; }
.sheet-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
table.roster {
  border-collapse: collapse; background: #fff; margin: 0 auto; box-shadow: var(--sh);
  table-layout: fixed;
  /* ★文字サイズを変数化（2026-08-17）。画面は従来どおり 0.75rem＝端末の文字サイズ設定に追従する
     （px 直書きにするとブラウザの文字サイズ変更が効かなくなる＝改修前の 0.75rem からの後退になる）。
     印刷時のみ fitRosterPrint_ が用紙1枚に収まる最大値を px で決める（帳票タブの --sh-fs と同じ作法）。
     ★印刷の適用は @media print 内の後勝ち規則（#dyn-roster）で行い、画面へは持ち越さない。 */
  --ro-fs: 0.75rem;
}
table.roster th, table.roster td {
  border: 1px solid var(--line); padding: 2px 4px; font-size: var(--ro-fs); line-height: 1.3;
  text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
table.roster thead th { background: var(--g1); font-weight: 700; height: 30px; }
.col-time { width: 78px; background: var(--g0); }
.col-rn   { width: 30px; color: var(--g6); font-weight: 400; background: var(--g0); }
/* No.列は「何番目か」を数える目盛りで、現場が読み取る値ではない。列幅が固定なので印刷の文字拡大に
   付き合わせると2桁(10〜)が欠ける。ここだけ従来サイズを上限にする（帳票タブの .c-rn と同じ扱い）。
   ★min() なので縮小方向には従う（9pxまで縮む時は一緒に縮む）。
   ★セレクタは必ず table.roster を付ける。`.col-rn` 単独では上の
     `table.roster th, table.roster td`（クラス1＋要素2）に詳細度で負けて無効になる。 */
table.roster .col-rn { font-size: min(var(--ro-fs), 12px); }
.col-day  { width: 118px; }
/* 階ラベル列（利用時間欄の右隣・2026-08-17 運用指示「2階が上・1階が下」）。
   幅28pxに「階未設定」を横書きで入れると nowrap+overflow:hidden で切れて読めないため縦書きにする
   （帳票タブの .c-sec と同じ理由・同じ作法）。色は他タブと統一（2階=緑／1階=水色／未設定=薄橙）。
   色だけに意味を持たせず「２階」「１階」の文字でも示す（HIG: 色覚特性配慮）。 */
.col-flr {
  width: 28px; background: var(--g0); font-weight: 700;
  writing-mode: vertical-rl; text-orientation: upright;
}
/* ★overflow と font-size は必ず table.roster 付きで指定する。`.col-flr` 単独では
   `table.roster th, table.roster td`（クラス1＋要素2）に詳細度で負け、overflow:hidden のままになる
   ＝1行しかない階ブロック（例「階未設定」1名）で縦書きラベルが切れる。
   ★縦書きなので文字サイズは【列幅】を食う。28px 列に収まる上限を付ける（印刷の拡大時も欠けない）。
     縮小方向には従う（min）。字間は 0（1文字ぶんの高さを無駄に増やさないため）。 */
table.roster .col-flr { overflow: visible; letter-spacing: 0; font-size: min(var(--ro-fs), 15px); }
.col-flr.f2 { background: var(--sese); }
.col-flr.f1 { background: #b3e5fc; }
.col-flr.f0 { background: #fff3e0; }   /* 階未設定＝黙って落とさず可視化（他タブの .nofloor と同色） */
/* 同じ利用時間帯の中で階が切り替わる行に太い上罫線（border-collapse なので太い方が勝つ） */
table.roster tr.flr-top td, table.roster tr.flr-top th { border-top: 2px solid var(--g8); }
.th-day.sat { color: #1565c0; }
.th-day.sun { color: #c0392b; }
/* ★font-size は table.roster 付き（.plan-label 単独では上のセル規則に詳細度で負けて無効になる） */
.plan-label { background: var(--g0); font-weight: 700; writing-mode: horizontal-tb; }
table.roster .plan-label { font-size: var(--ro-fs); }
td.user { text-align: start; }
td.user.bath { background: var(--bath-bg); }        /* デイ参加日に入浴あり=黄 */
td.empty { background: #fff; }
/* 利用時間帯ブロック間の分断（見やすさ向上・上段9:00-13:00と下段9:00-13:30 等を分ける薄グレー帯） */
table.roster tr.spacer td { height: 10px; background: var(--g2); border-left: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
/* 入院中（ワークスケジュールの入院入力＝care_schedule_v2 の hospitalized を反映）。
   色だけに頼らず「（入院）」の文言でも示す（HIG: 色覚特性配慮） */
.hosp-tag { color: var(--ng); font-weight: 700; font-size: 0.6875rem; margin-left: 3px; white-space: nowrap; }
/* 利用表の（入院）は本文サイズに連動させる（既定12px時は11px＝従来と同値）。固定pxだと印刷の
   文字拡大時に（入院）だけ取り残されて見落とされる（帳票タブの .c-nm .hosp-tag と同じ扱い）。 */
table.roster .hosp-tag { font-size: calc(var(--ro-fs) * 0.92); }
tr.tot th { background: var(--g1); font-weight: 700; }
tr.tot td { font-weight: 700; }
tr.tot.use td { color: var(--pri-d); }
.hosp-box {
  max-width: 900px; margin: 12px auto 0; background: #fff; border: 1px solid var(--g3);
  border-radius: 8px; padding: 8px 12px; font-size: 0.75rem; color: var(--g7);
}
.hosp-box b { color: var(--g9); }
.hosp-names { color: var(--g8); }

/* ===== 共通: 帳票テーブル（View1/2/3）===== */
table.sheet { border-collapse: collapse; background: #fff; margin: 0 auto; table-layout: fixed; box-shadow: var(--sh); }
/* ★文字サイズは変数化してある（2026-08-05）。印刷時は fitSheetPrint_ が用紙に収まる最大値へ
   自動調整する。画面は既定値のまま＝画面表示は従来と同じ見え方。 */
table.sheet { --sh-fs: 11px; --sh-tm: 10px; }
table.sheet th, table.sheet td {
  border: 1px solid var(--line); padding: 1px 3px; font-size: var(--sh-fs); line-height: 1.25;
  text-align: center; overflow: hidden; white-space: nowrap;
}
/* ★列幅は必ず <colgroup> で宣言する。table-layout:fixed は列幅を「最初の行」からしか読まないため、
   曜日見出しを colspan=3 で1行目に置く本表では、2行目に書いた幅指定は無視されて自動配分される。
   ★ここの値は JS の W（setupSheet が table 幅を明示するのに使う）と必ず一致させること。
   食い違うと fixed が差分を各列へ再配分し、colgroup 側の指定が黙って無効化される。
   用紙の幅予算はどれも 1062px（A4横・A3縦とも 297mm − 余白8mm×2）。現在の内訳（2026-08-17 更新）:
   med    : 24 + 20 + 6×(76+46+46) = 1052px ≦ 1062px
     ★2026-08-17 運用指示: 右の備考パネル(112+gap8)を削除し、空いた幅を表へ回した
       （氏名80→76・時刻34→46＝daylist と同値）。時刻列が46pxになったため印刷の文字拡大も解禁した
       （SHEET_FS_MAX_BY_TAB に sc-med を追加）。
   daylist: 24 + 26 + 6×(76+46+46) = 1058px ≦ 1062px。備考は表の下＝表は全幅
   allweek: 44 +      6×(76+46+46) = 1052px ≦ 1062px
     ★2026-08-05: 氏名(96/100→76)を縮めて時刻(36/34→46)へ回した。時刻は帳票で最も読まれる値だが
       列が狭く小さい文字でしか収まらなかったため。氏名は折返すので欠けない（高さに転嫁される）。
     ★daylist の No.列だけ 26px なのは、印刷の文字拡大(最大15px)で2桁が欠けたため（実測 sw=26/cw=19）。
       allweek の No.列(44px)が広いのは合計行の「入居者」ラベルを収めるため。 */
table.sheet col.w-sec   { width: 24px; }
table.sheet col.w-rn    { width: 20px; }
/* デイ利用者一覧表の No.列。20px は 11px フォントの2桁（10〜）に対して元から余裕が無い
   （内容幅は罫線・paddingを引くと約12px＝実測でも 60名規模で欠ける）。階ごとの連番が2桁に届くのは
   人数が増えた時だけなので今まで表面化していなかった。6px 広げて確実に収める。
   表の総幅は 1052→1058px で用紙の幅予算 1062px 内。★JS W.rnDl と一致必須。
   ※印刷の文字拡大（最大15px）は .c-rn には効かない（下の min() で 11px 上限）。 */
table.sheet col.w-rn-dl { width: 26px; }
table.sheet col.w-rn-aw { width: 44px; }    /* 全員リスト用 No.列（合計行の「入居者」を収める・★JS W.rnAw と一致必須） */
table.sheet col.w-nm    { width: 76px; }    /* med用 氏名列（★JS W.nm と一致必須） */
/* ★2026-08-05 運用指示: 氏名欄が広く時刻が小さくて読みづらいため、氏名を縮めて時刻へ回した。
   表の総幅(1052px)は据え置き＝用紙の幅予算(1062px)は変えていない。
   氏名76px でも .c-nm は折返す（欠けない）。時刻46px なら 13px 太字の「13:00」が余裕で入る。 */
table.sheet col.w-nm-aw { width: 76px; }    /* 全員リスト用 氏名列（★JS W.nmAw と一致必須） */
table.sheet col.w-nm-dl { width: 76px; }    /* デイ利用者一覧表用 氏名列（★JS W.nmDl と一致必須） */
/* med用 時刻列。2026-08-17 に右の備考パネルを削除した幅（120px）を時刻へ回して 34→46px。
   34px では 11px でも太字「13:00」が欠けるため padding を詰めて凌いでいたが、46px なら余裕で収まる
   （daylist で実測済みの値と同一）。★JS W.tm と一致必須。 */
table.sheet col.w-tm    { width: 46px; }
table.sheet col.w-tm-aw { width: 46px; }    /* 全員リスト用 時刻列（★JS W.tmAw と一致必須） */
table.sheet col.w-tm-dl { width: 46px; }    /* デイ利用者一覧表用 時刻列（★JS W.tmDl と一致必須） */
/* 氏名は欠けさせない: 最小の氏名列(76px)でも nowrap だと8文字以上で末尾が切れる。
   氏名の欠落は帳票として許容できないため折返す（既存の利用表タブと同じ方針）。
   ★padding を詰めるのは必須。折返しの判定は「内容ボックス」で行われる一方 overflow:hidden は
   「パディングボックス」で切るため、既定の padding(左右3px)のままだと内容ボックスが狭まり、
   本来1行で収まる氏名まで折返して全行の高さが倍増する（＝1枚に収まらなくなる）。 */
table.sheet .c-nm {
  text-align: start; white-space: normal; word-break: break-all;
  padding-left: 1px; padding-right: 1px;
}
/* 時刻セル: 列を 34px で運用していた頃、11px フォントの「13:00」(31.6px)が描画可能幅に入らず
   末尾の「0」が欠けた（開始9:00は4文字で収まり見落としやすい）。その対策として padding を詰めてある。
   ★2026-08-17 に全帳票の時刻列が46pxになったので余裕はあるが、詰めた padding は行高の節約にも
     効いているため据え置く。 */
/* 時刻は帳票で最も読まれる値。太字にして視認性を上げる（2026-08-05 運用指示）。
   色も本文と同じ濃さへ（従来の --g7 は薄く、縮小印刷で沈んでいた）。 */
table.sheet .c-tm { color: var(--g9); font-size: var(--sh-tm); font-weight: 700;
  padding-left: 1px; padding-right: 1px; }
/* （入院）は氏名の右に置くと氏名列に入らず、タグごと・氏名の一部ごと欠ける。
   氏名の下段へ回して両方を残す（入院者の行だけ2行になる）。table.sheet 限定＝既存の利用表は無改変。 */
/* 固定pxにすると印刷の文字拡大(最大15px)で本文の6割まで小さくなる。（入院）は帳票の判断材料なので
   本文と連動させる（既定11px時は 9.02px＝従来と同値・画面と既存印刷は不変）。 */
table.sheet .c-nm .hosp-tag { display: block; margin-left: 0; font-size: calc(var(--sh-fs) * 0.82); line-height: 1.1; }
/* No.列は「何番目か」を数えるだけの目盛りで、現場が読み取る値ではない。列幅(20〜26px)が固定なので
   印刷の文字拡大(最大15px)に付き合わせると2桁(10〜)が欠ける。ここだけ従来サイズを上限にする。 */
table.sheet .c-rn { color: var(--g6); background: var(--g0); font-size: min(var(--sh-fs), 11px); }
/* 20px 列に 11px の見出し「No.」は入らない（末尾が欠ける）。連番の数字は2桁までなので見出しだけ縮める。 */
table.sheet th.c-rn { font-size: 0.5625rem; padding-left: 1px; padding-right: 1px; }
/* 区画ラベル（２階入居者 等）は縦書き（元Excelと同じ）。幅24pxに横書きで入れると
   nowrap+overflow:hidden で切れて読めなくなる（table-layout:fixed なので列は伸びない）。 */
table.sheet .c-sec {
  background: var(--g0); font-weight: 700;
  writing-mode: vertical-rl; text-orientation: upright;
  white-space: nowrap; overflow: visible; letter-spacing: 1px;
}
/* 全員リスト合計行の左端ラベル「入居者」。旧ふりがな列に置いていたものを No.列(44px)へ移した。
   11px のままだと3文字=33px が内容幅(44−罫線2−padding6=36px)に対して余裕を欠くため 10px に落とす。 */
table.sheet .c-sum-lb {
  color: var(--g7); font-size: 0.625rem;
  padding-left: 1px; padding-right: 1px;
}
/* 備考はテーブルの外に置く（元表はグリッド内に埋め込み、火・水の枠を15→11に潰していた）。
   横に並べることで全曜日の枠数が揃い、rowSpan のハックも不要になる。 */
/* safe center: 収まる時は中央、はみ出す時は左詰め。素の center だと内容が容器より広い場合に
   左側がはみ出してスクロールで到達できなくなる（区画ラベル列が永久に見えなくなる）。 */
.sheet-row { display: flex; gap: 8px; align-items: flex-start; justify-content: safe center; width: max-content; min-width: 100%; }
/* ※薬用の右側備考パネル(.note-panel)は 2026-08-17 運用指示で削除した（空いた幅は表へ回した）。 */
/* デイ利用者一覧表の備考は「表の下」に置く＝横幅を表に使い切る。幅は JS で表と同じにし中央寄せ・横並びでコンパクト。 */
.note-below {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 14px;
  margin: 8px auto 0;   /* 表(margin:0 auto)と同じく中央寄せ。width は renderDaylist で表幅に合わせる */
  background: #fff; border: 1px solid var(--line); box-shadow: var(--sh);
  padding: 5px 10px; font-size: 0.6875rem; line-height: 1.5; color: var(--g8);
}
.note-below .nb-h { font-weight: 700; background: var(--g1); padding: 1px 8px; border-radius: 3px; }
.note-below .nb-item { white-space: nowrap; }
table.sheet thead th { background: var(--g1); font-weight: 700; }
/* 表の中盤に再掲する曜日見出し行（tbody 内に置くため thead の指定が効かない＝同じ見た目を明示する）。
   長い表で「今どの曜日の列か」を追いやすくするための再掲（2026-08-03 運用指示）。
   ★区画ラベル列(c-sec)と No.列(c-rn) は thead でも詳細度で自前の背景(--g0)が勝つため、
     再掲行でも同じになるよう明示的に戻す（＝上部ヘッダーと寸分違わぬ見た目にする）。 */
table.sheet tr.rehead th { background: var(--g1); font-weight: 700; }
table.sheet tr.rehead th.c-sec, table.sheet tr.rehead th.c-rn { background: var(--g0); }
table.sheet .sec-h { background: var(--g0); font-weight: 700; text-align: center; }
table.sheet .sese { background: var(--sese); font-weight: 700; }        /* ２階入居者ラベル＝緑（元表を継承） */
table.sheet .flr1 { background: #b3e5fc; font-weight: 700; }           /* １階入居者ラベル＝薄い水色（2階と別色にして区切りを明確化） */
/* 階ごとの塊を濃い・太い罫線で囲む（border-collapse なので太い方が勝つ）。外周セルにだけ付与。 */
table.sheet .blk-top  { border-top: 2px solid var(--g9); }
table.sheet .blk-bot  { border-bottom: 2px solid var(--g9); }
table.sheet .blk-left { border-left: 2px solid var(--g9); }
table.sheet .blk-right{ border-right: 2px solid var(--g9); }
/* 曜日ごとの縦太罫線（各曜日の先頭列に左・最終曜日の末尾列に右）。階の横太罫線と交差して曜日をマス状に囲む。
   blk-* と同色・同太さ(2px var--g9)なので交点はきれいに連結する。table-layout:fixed＋表幅固定のため列幅は不変。 */
table.sheet .dsep { border-left: 2px solid var(--g9); }
table.sheet .dend { border-right: 2px solid var(--g9); }
/* 薬用: 右のチェックリストでチェックした利用者の氏名セル＝薄オレンジ（入浴黄#ffff00・階未設定#fff3e0 と区別）。
   印刷にもこの色のまま出す（@media print に打ち消しを置かない＝画面と紙面を一致させる） */
table.sheet td.med-hl { background: #ffe0b2; }
table.sheet td.nm.bath { background: var(--bath-bg); }
table.sheet tr.sum th, table.sheet tr.sum td { background: var(--g1); font-weight: 700; }
/* ── デイ利用者一覧表の「切断」（2026-08-05 運用指示）─────────────────────────
   「せせらぎ合計」の下で表を切り、2行ぶんの空白を挟んでから下段（デイ休み）を始める。
   ★1つの table のまま実現する。表を2つに割ると table-layout:fixed の列幅が上下でずれるため。
   ★切り口の罫線は階の区画（blk-*）と同じ太線（2px var(--g9)）で締める。
   ★空白の高さは文字サイズ連動。印刷フィットで文字が縮めば空白も一緒に縮む＝1枚に収まる。 */
table.sheet tr.cut-above th, table.sheet tr.cut-above td { border-bottom: 2px solid var(--g9); }
table.sheet tr.cut-gap td {
  border: 0; background: #fff; padding: 0; height: calc(var(--sh-fs) * 2.6);
}
table.sheet tr.cut-title th {
  border: 0;
  border-top: 2px solid var(--g9); border-left: 2px solid var(--g9); border-right: 2px solid var(--g9);
  background: var(--g1); color: var(--g9); font-weight: 700; letter-spacing: 2px;
  font-size: calc(var(--sh-fs) * 1.6); line-height: 1.45; padding: 3px 4px; white-space: nowrap;
}
/* ☆は .c-tm セル内に置くため、放置すると時刻用の 10px を継承して視認性が落ちる。記号は 11px を保つ。 */
.star { color: var(--ng); font-weight: 700; font-size: 0.6875rem; }   /* ☆＝訪問診療（元表の赤字☆）。凡例用の既定 */
/* 帳票内の☆は本文と連動させる（既定11px時は従来と同値）。時刻セル(--sh-tm)を継承したままだと、
   印刷の文字拡大時に☆だけ取り残されて見落とされる。 */
table.sheet .star { font-size: var(--sh-fs); }
.nofloor { background: #fff3e0; }                     /* 階未設定＝黙って落とさず可視化 */

/* ===== 薬用: 画面専用の入居者チェックリスト（印刷されない）===== */
.chk-panel {
  flex: 0 0 176px; align-self: stretch; background: #fff; border: 1px solid var(--line);
  box-shadow: var(--sh); padding: 6px 8px; font-size: 0.75rem; color: var(--g8);
}
.chk-h { background: var(--g1); font-weight: 700; text-align: center; font-size: 0.75rem; padding: 3px; margin: 0 -8px 6px; }
.chk-sub { color: var(--g6); font-size: 0.625rem; }
.chk-flr { font-weight: 700; color: var(--g7); margin: 6px 0 2px; }
.chk-item {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 2px 2px;   /* HIG: タップ領域44px以上 */
  cursor: pointer; border-radius: 4px;
}
.chk-item:hover { background: var(--g0); }
.chk-item input { width: 18px; height: 18px; flex-shrink: 0; }
.chk-clear {
  margin-top: 8px; width: 100%; min-height: 44px; border: 1px solid var(--g3);
  background: var(--g0); color: var(--g7); border-radius: 6px; font-size: 0.75rem; cursor: pointer;
}
.chk-clear:hover { background: var(--g1); }
.chk-clear:focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }

/* ===== 週間名簿（View4）===== */
.wk-page { background: #fff; box-shadow: var(--sh); margin: 0 auto 14px; padding: 10px; max-width: 780px; }
table.wk { border-collapse: collapse; width: 100%; table-layout: fixed; }
table.wk td, table.wk th {
  font-family: "HG丸ｺﾞｼｯｸM-PRO", "Hiragino Maru Gothic ProN", -apple-system, sans-serif;
  font-size: 1.375rem; font-weight: 700; text-align: center; vertical-align: middle;
  height: 30px; padding: 1px; border: none; white-space: nowrap;
}
table.wk .wk-day { width: 16%; color: #ff0000; border: 2px solid var(--g9); }
table.wk .wk-h { color: #ff0000; width: 42%; }
table.wk .wk-sum { color: #111; }
table.wk .wk-blank { color: transparent; }

.board-empty {
  position: absolute; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; color: var(--g6);
  font-size: 0.875rem; text-align: center; padding: 24px; background: var(--g1);
}
.board-empty.on { display: flex; }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--g9); color: #fff; border-radius: 8px; padding: 10px 18px;
  font-size: 0.8125rem; z-index: 500; display: none; max-width: 90%; box-shadow: 0 4px 16px rgba(0,0,0,.3);   /* モーダル(400)より前面＝モーダル中のトーストも見える */
}
#toast.ng { background: var(--ng); }
#toast.on { display: block; }

/* ===== 非表示設定モーダル（全端末共通で表示を絞る・印刷にも出さない）===== */
.hdr-btn.active { background: #fff; color: var(--pri-d); border-color: #fff; font-weight: 700; }   /* 非表示が有効な時に目立たせる（黙って隠さない） */
.modal-ov {
  position: fixed; inset: 0; z-index: 400;   /* ヘッダ(100)より前面／トースト(500)は更に前面に出す */
  background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal-ov[hidden] { display: none; }
.modal-box {
  background: #fff; border-radius: var(--r); box-shadow: 0 8px 32px rgba(0,0,0,.35);
  width: 420px; max-width: 100%; max-height: 84vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--g3); }
.modal-title { font-size: 0.9375rem; font-weight: 700; flex: 1; }
.modal-x {
  min-width: 44px; min-height: 44px; border: none; background: none; color: var(--g7);
  font-size: 1.125rem; cursor: pointer; border-radius: 6px;
}
.modal-x:hover { background: var(--g1); }
.modal-x:focus-visible { outline: 2px solid var(--pri); outline-offset: -2px; }
.modal-sub { padding: 8px 14px; font-size: 0.75rem; color: var(--g7); line-height: 1.5; border-bottom: 1px solid var(--g2); }
.modal-list { overflow: auto; -webkit-overflow-scrolling: touch; padding: 4px 8px; flex: 1; }
.modal-item {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 2px 6px;   /* HIG: タップ領域44px以上 */
  cursor: pointer; border-radius: 6px;
}
.modal-item:hover { background: var(--g0); }
.modal-item input { width: 18px; height: 18px; flex-shrink: 0; }
.modal-item .mi-kana { color: var(--g6); font-size: 0.6875rem; margin-left: auto; }
.modal-empty { padding: 18px 14px; color: var(--g6); font-size: 0.8125rem; text-align: center; }
.modal-foot { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--g3); }
.modal-btn {
  flex: 1; min-height: 44px; border: 1px solid var(--g3); background: var(--g0); color: var(--g8);
  border-radius: 8px; font-size: 0.8125rem; cursor: pointer;
}
.modal-btn:hover { background: var(--g1); }
.modal-btn:focus-visible { outline: 2px solid var(--pri); outline-offset: 1px; }
.modal-btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* 一括印刷用の隠しコンテナ（印刷時のみ構築し、印刷後に必ず破棄＝氏名をDOMに残さない） */
.print-batch { display: none; }

/* 印刷日（用紙の右上・全帳票共通／2026-08-05 運用指示）。画面には出さない。
   ★当初 position:fixed で用紙の右上へ重ねたが、①全ページに繰り返すかがブラウザ依存
   ②2ページ目以降は右上が表の中身のため帳票を白く塗り潰す、の2点で採用できない。
   凡例（帳票の見出し行）の右端へ【流れの中に】置く。凡例が長い帳票では折り返すだけで、
   表の内容には決して重ならない。一括6枚印刷は凡例を出さないため各ページ先頭に .pg-date を置く。 */
.print-date, .pg-date { display: none; }

/* ===== 印刷 =====
   既定タブ(利用表)の A4縦 は静的 @page のまま＝現行完全無改変。
   他タブは印刷時に @page を動的注入して用紙を切り替える（care-schedule.html:3989 で実証済みの手法）。 */
@media print {
  @page { size: A4 portrait; margin: 8mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact; }
  html, body { overflow: visible; height: auto; background: #fff; }
  .hdr, #toast, .tnav { display: none !important; }
  .legend { border-bottom: 1px solid #000; }
  /* 印刷日は凡例の右端。flex の margin-left:auto なので、凡例が短い帳票では右端へ、
     長い帳票では折り返した行の右端へ回る＝表の内容には重ならない。 */
  .print-date { display: inline-block; margin-left: auto;
    font-size: 9px; line-height: 1.2; color: #000; white-space: nowrap; }
  body.pr-batch .pg-date { display: block; text-align: end; font-size: 9px; line-height: 1.2;
    color: #000; padding: 0 2mm 1mm 0; }
  .hide-print-note { display: inline; color: #000; font-weight: 700; }   /* 非表示適用中のみ帳票へ小さく明示（.noprint の打消しは既存規則を使う） */
  .wrap { overflow: visible; padding: 0; }
  /* 印刷の列幅はA4縦の印刷可能幅(≈733px@96dpi)を使い切る値を JS が算出して渡す
     （setRosterPrintCols_ が --ro-w-* を表のインラインstyleへ設定＝曜日数で自動配分）。
     ★2026-08-17 運用指示「左右に余白があるためできるだけ大きく」。旧指定は 68/24/88（合計620px）だったが、
       width:auto のため自動レイアウトに置き換わり、実際には用紙幅733pxまで内容依存で引き伸ばされていた
       （実測）。つまり余っていたのは幅ではなく【縦】と【文字の大きさ】で、列は不均等だった。
       下の fallback 値は JS が動かなかった時の従来指定。
     ★--ro-w-* は @media print の中でしか参照しない＝画面の列幅(78/30/118)は不変。
     ★width は 100%（＝用紙の印刷可能幅ぴったり）。旧 width:auto では table-layout:fixed が無効化され
       （CSS 2.1 §17.5.2.1「width:auto なら自動アルゴリズムを使う」）、列幅が内容依存でばらついていた
       ＝人数の多い曜日だけ列が広く、少ない曜日は狭く、同じ氏名が曜日によって折り返す状態だった。
       幅を明示すると固定レイアウトが成立し、曜日列が均等になる（元Excelと同じ見た目）。
       ★固定レイアウトでは nowrap セルが列を超えると欠ける。利用時間列は文字サイズに比例して広げ、
         No.列と階ラベルには文字サイズ上限を付けてあるのが対策（上の各規則）。 */
  table.roster { box-shadow: none; width: 100%; }
  .col-time { width: var(--ro-w-time, 68px); }
  .col-flr  { width: var(--ro-w-flr, 26px); }
  .col-rn { width: var(--ro-w-rn, 24px); }
  .col-day { width: var(--ro-w-day, 88px); }
  table.roster th, table.roster td { border-color: #000; padding: 2px 3px; }
  /* 氏名＋（入院）で列が広がり用紙幅を超えるのを防ぐ: 印刷では折返して列幅を固定に保つ
     （nowrap のままだと列が伸び、入院者が複数曜日に出た時に A4縦の印刷可能幅を超える）。
     折返しはコストが縦に移るため line-height を詰めて1ページ収容行数を稼ぐ
     （実測: 1.3 では全行折返し時に23行が限界＝実運用21行に対し余裕2行しかない）。 */
  table.roster td.user { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.15; }
  /* 分断帯は印刷でも残す（見やすさ）が、行高予算（実運用21行/限界23行）を圧迫しないよう最小高にする */
  table.roster tr.spacer td { height: 5px; }

  table.sheet { box-shadow: none; }
  table.sheet th, table.sheet td { border-color: #000; }
  /* デイ利用者一覧表(A3縦・全幅)は行を少し高くして用紙を縦に広く使う（#sc-daylist 限定＝他タブ印刷に非干渉）。
     ★2026-08-03 実測（凡例・印刷時の氏名折返しを含む総高／A3縦の印刷可能高≈1527px）:
       padding 4px: 28名=1491(余裕36)・30名=1560(溢れる)
       padding 3px: 28名=1383(余裕144)・30名=1446(余裕81)・31名=1487(余裕40)
     曜日見出しの中盤再掲(+2行)で 4px では余裕が尽きるため 3px へ。旧コメントの「28名≈1409px」は
     凡例(89px)を数え落としていた値＝実測とずれていたので上の実測値に置き換えた。 */
  #sc-daylist table.sheet td, #sc-daylist table.sheet th { padding-top: 3px; padding-bottom: 3px; }
  /* 薬用の画面専用チェックリストは印刷しない。太枠(blk-*)は詳細度で border-color(#000)指定に勝ち var(--g9)=濃色のまま帳票に出る（体感は黒）。 */
  .noprint { display: none !important; }
  /* 薬用のチェック色(.med-hl=薄オレンジ)は印刷にも出す（2026-07-21 運用指示・昼食のある方を紙面で判別するため）。
     旧: ここで background:transparent に上書きして消していた。上書きを持たない＝画面と印刷が同一になる
     （階未設定 .nofloor との重なりも、詳細度で .med-hl が勝つ画面と同じ結果になる）。
     塗り自体は冒頭の print-color-adjust:exact で「背景のグラフィック」設定に関係なく出る（入浴の黄と同じ経路）。 */
  /* 氏名は画面・印刷とも折返す（切れたら情報が失われるため。折返し自体は .c-nm の基底で指定済み）。
     ここでは印刷時に overflow/line-height を詰めて行増を最小化する。
     折返しのコストは縦に移るが高さに余裕がある（実測: A3縦 704/1527・A4横 594/733）。 */
  table.sheet td.c-nm { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.15; overflow-wrap: anywhere; }
  .wk-page { box-shadow: none; padding: 0; max-width: none; }

  /* 一括6枚印刷（View4）: 画面の .scr を隠し、6ページを並べる。
     ★body は flex column のままだと .pg の break-after がフレックスアイテム内フラグメンテーション
       頼みになり不安定。一括印刷時だけ block 化する（.pr-batch にスコープし、既定タブの
       A4縦印刷経路には一切触れない）。 */
  body.pr-batch { display: block; }
  body.pr-batch .scr, body.pr-batch .legend { display: none !important; }
  body.pr-batch .print-batch { display: block; }
  .pg { break-after: page; page-break-after: always; }          /* 旧仕様併記＝Safari保険 */
  .pg:last-child { break-after: auto; page-break-after: auto; } /* 末尾の空白ページ防止 */
  .pg table { break-inside: avoid; page-break-inside: avoid; }
  body.pr-batch table.wk td, body.pr-batch table.wk th { font-size: 26pt; height: 10.1mm; }
}
</style>
</head>
<body>

<header class="hdr">
  <span class="hdr-title">通所せせらぎ</span>
  <span class="hdr-sub" id="hdrSub">読込中…</span>
  <span class="hdr-sp"></span>
  <span class="sync-state" id="syncState">読込中…</span>
  <!-- アプリ間ジャンプ（shift-app.html と同形式・相対パス＝同一オリジン）。
       「更新」「印刷」の位置は動かさない＝現場の操作記憶を壊さないため左側へ足す。
       .hdr は @media print で display:none のため帳票には出ない。 -->
  <button class="hdr-btn" id="btnHide" aria-label="利用者の非表示設定を開く（全端末共通）" aria-haspopup="dialog">🙈 非表示設定</button>
  <button class="hdr-btn" id="btnMaster" aria-label="入居者マスタアプリを新しいタブで開く">👤 入居者マスタ</button>
  <button class="hdr-btn" id="btnCare" aria-label="週間計画アプリを新しいタブで開く">📅 週間計画</button>
  <button class="hdr-btn" id="btnRefresh" aria-label="クラウドから最新の週間計画を取得">更新</button>
  <button class="hdr-btn" id="btnPrint" aria-label="表示中のタブを印刷">印刷</button>
</header>

<nav class="tnav" id="tnav" role="tablist" aria-label="帳票の切り替え">
  <button role="tab" data-sc="sc-roster"  aria-selected="true"  aria-controls="sc-roster">利用表</button>
  <button role="tab" data-sc="sc-daylist" aria-selected="false" aria-controls="sc-daylist">デイ利用者一覧表</button>
  <button role="tab" data-sc="sc-allweek" aria-selected="false" aria-controls="sc-allweek">全員リスト</button>
  <button role="tab" data-sc="sc-med"     aria-selected="false" aria-controls="sc-med">薬用</button>
  <button role="tab" data-sc="sc-weekly"  aria-selected="false" aria-controls="sc-weekly">週間名簿</button>
</nav>

<div class="legend" id="legend"></div>

<!-- 共通データ層（Phase 0）。契約 → ドライバの順。ビルド不要・素の script src 1組。
     ★?v= は必須。HTMLの no-store はサブリソースには効かないため、付けないと
       「新しいHTML × 古いJS」の組合せが現場端末に残る（meds-effect-dict.js と同じ作法）。
       データ層の契約を変えた日にこの値を更新する。 -->
<script src="su-data.js?v=2026-08-13"></script>
<script src="su-data-gas.js?v=2026-08-13"></script>

<script>
'use strict';

/* ============================================================================
   通所せせらぎ（5タブ）— 参照中心（書込みは昼食薬lunchMedと非表示dcrHiddenの2フィールドのみ・全端末共通）
   データ源: care_schedule_v2（daycare イベント＋ residents の room / floor / lunchMed /
             visitingMed / hospitalized / kana）。
   ★階(1階/2階)の決定は room（入居者マスタ由来の居室）を第一とする。2026-07-21 追加。
     room は care-schedule.html が su_residents_common から「master常勝」で取り込むため、
     入居者マスタで居室を直せば部屋移動が自動で追従する（旧経路＝ワークスケジュールの
     デイサービスマスタ手書き floor は、room が取れない時のフォールバックとして残す）。
   ★書込みは昼食薬(lunchMed)と非表示(dcrHidden)の2利用者フィールドのみ。予定/時刻/辞書/rev運用には書き込まない。
   5タブは「デイ母集団 × 月〜土 × {デイ利用 or 2階食堂で昼食}」の単一モデルの別表現。
   「２階」は居室の階(floor)ではなく『その日デイに行かない人が2階食堂で昼食を摂る』場所の意味。
   既知の制約: 自費区分（赤/緑）は週間計画に無いため非対応。
   ============================================================================ */

const LS_KEY  = 'care_schedule_v2';
const DAYS_JA = ['月', '火', '水', '木', '金', '土', '日'];
const NDAY    = 6;                       // 月〜土（せせらぎ日曜休）

const $ = id => document.getElementById(id);

function toMin(t) {
  if (typeof t !== 'string') return null;
  const p = t.split(':');
  if (p.length < 2) return null;
  const h = parseInt(p[0], 10), m = parseInt(p[1], 10);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function minToLabel(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return h + ':' + (m < 10 ? '0' + m : m);
}
function el(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;   // 氏名等は textContent で（要配慮個人情報・XSS防止）
  return n;
}

// ── データ取得（読み取り専用） ──
let DB = null;

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && Array.isArray(obj.residents)) ? obj : null;
  } catch (e) {
    return null;
  }
}
/* 共通データ層へ「接続先の決め方」を渡す（Phase 0）。
   毎回 syncTarget() を呼ぶ形にしてあるので、設定が途中で変わっても次の通信から反映される
   ＝従来の挙動と同じ。
   ★ここで素に SU.data.init(...) と書くと、su-data.js が読めなかったときに ReferenceError で
     このスクリプトのトップレベルが止まり、末尾の init() まで届かず「押しても何も起きない画面」になる。
     改修前は外部依存ゼロの1ファイルだったので、これは移設で新しく増える壊れ方。
     読めていないことを画面に出し、残りの処理は続ける（入居者マスタの薬効辞書ガードと同じ作法）。 */
var SU_DATA_READY = !!(window.SU && window.SU.data);
if (SU_DATA_READY) {
  SU.data.init({ appId: 'daycare-roster', resolveTarget: function () { return syncTarget(); } });
} else {
  document.addEventListener('DOMContentLoaded', function () {
    try {
      toast('データ層を読み込めていません（su-data.js）。同期できません。ページを再読み込みしてください');
    } catch (e) {}
  });
}

function syncTarget() {
  try {
    const c = JSON.parse(localStorage.getItem('su_sync_common') || '{}');
    if (c && c.endpoint) return { endpoint: String(c.endpoint).trim(), token: String(c.token || '').trim() };
  } catch (e) {}
  try {
    const s = JSON.parse(localStorage.getItem('ws_settings') || '{}');
    if (s && s.endpoint) return { endpoint: String(s.endpoint).trim(), token: String(s.token || '').trim() };
  } catch (e) {}
  return { endpoint: '', token: '' };
}
/* GAS 共通トランスポート（get/put 共用）。care-schedule.html / work-schedule.html と同一契約：
   text/plain で CORS preflight を回避し、{ok, data, rev, conflict, error} を返す。
   ★2026-08-13 Phase 0: 通信の実体を su-data.js（共通データ層）へ移した。
     送る形・応答・例外は同一で、この関数の呼び出し側は一切変えていない。
     接続先の解決（syncTarget）はこのアプリの都合なので、ここから渡し続ける。
   ★action で名前付き契約（kvGet / kvPut）へ振り分ける。逃げ道の kvRaw に主経路を通したままだと、
     rev 楽観ロックの契約がデータ層を一度も通らず、バックエンドを差し替える時に結局ここを
     もう一度書き直すことになる（＝Phase 0 の目的が果たせない）。 */
async function gasCall(payload) {
  var p = payload || {};
  if (p.action === 'get') return SU.data.kvGet(p.key);
  if (p.action === 'put') return SU.data.kvPut(p.key, p.data, p.rev);
  return SU.data.kvRaw(p);          // それ以外は従来どおりそのまま通す
}
/* ★2026-08-05 修正: ここで careRev を書き換えない。取得の直後には「未送信があれば結果を破棄する」
   分岐があり、従来は破棄した場合でも版だけが進んでいた。すると【古い DB × 新しい rev】の組合せが残り、
   その後の背景保存(runSaver)の PUT が版ガードをすり抜けて通ってしまう＝他端末の更新を無言で巻き戻す。
   データと版は必ず同時に更新する必要があるため、版は呼び出し側へ返して DB 差し替えと同時に代入する。 */
async function fetchRemote() {
  const t = syncTarget();
  if (!t.endpoint) { toast('同期先が未設定です（週間計画アプリで設定してください）', true); return null; }
  const j = await gasCall({ action: 'get', key: LS_KEY });
  if (!j.ok) throw new Error(j.error || '応答エラー');
  return (j.data && Array.isArray(j.data.residents)) ? { data: j.data, rev: Number(j.rev) || 0 } : null;
}
/* 書戻し用: 最新をrev付きで取得（put の版ガードに使う）。
   ここでも careRev を書き換えない（上の fetchRemote と同型）。呼び出し側は data の有効性を確かめてから
   DB と careRev を同時に代入する。ここで版だけ先に進めると、data が空で採用しなかった場合に
   【古い DB × 新しい rev】が残り、次の PUT が版ガードをすり抜けて他端末の更新を無言で巻き戻す。 */
async function getRemoteWithRev() {
  const j = await gasCall({ action: 'get', key: LS_KEY });
  if (!j || !j.ok) throw new Error((j && j.error) || '応答エラー');
  return { data: (j.data && Array.isArray(j.data.residents)) ? j.data : null, rev: Number(j.rev) || 0 };
}

/* ── サーバDBから当該利用者を引く（昼食薬・非表示の書込みで共用）───────────────────
   照合順: ①masterId ②内部id ③正規化氏名（一意に絞れた時のみ）。同姓同名で別人を書き換えない。 */
function suNormName_(s) { return String(s == null ? '' : s).replace(/[\s　]/g, ''); }
function findServerResident_(residents, item) {
  let r = null;
  if (item.masterId != null) r = residents.find(x => x && x.masterId != null && x.masterId === item.masterId);
  if (!r && item.rid != null) r = residents.find(x => x && x.id === item.rid);
  if (!r) {
    // 氏名フォールバックは「一意に絞れた時だけ」採用する。同姓同名が複数居る場合に先頭を選ぶと
    // 別人を書き換える（＝与薬・非表示の誤り）ため、絞れなければ null で安全側に倒す。
    const m = residents.filter(x => suNormName_(x.name) === suNormName_(item.name));
    r = (m.length === 1) ? m[0] : null;
  }
  return r || null;
}
/* ── 利用者フラグ（lunchMed＝昼食薬 / dcrHidden＝非表示）の楽観的保存＝本ツール唯一の書込み経路 ──
   体感を軽くするため「楽観的UI＋背景保存」方式（2026-07-28）。従来は1トグルごとに GET＋PUT の2往復を
   待ち、その間モーダルを固めていた（GAS遅延がそのまま体感になり非常に重い）。改善:
     - トグル時は即座に手元(DB)へ反映し再描画して待たせない（体感≒描画数msのみ）。
     - 保存は背景の単発ワーカー runSaver が行う。通常は careRev（保存済みサーバ版）で直接PUT＝1往復。
       他端末が先に更新して版がずれた時だけ最新をGETし、自分の未確定フラグだけ載せ直して再PUT
       （read-freshフォールバック）＝他端末が編集中の週間計画(events)や他フィールドを壊さない。
     - 保存に失敗したら最新をGETして権威状態へ戻し、未確定の楽観的変更は破棄する（偽の保存済みを残さない）。
   全端末共通・GAS無改造・rev競合ガードは不変。careRev は GET/PUT成功のたびに更新する。 */
let careRev = 0;                 // 直近に観測したサーバ版（案A: 次回の直接PUTに使う）
let saveDirty = false;          // 未送信の変更があるか
let saverRunning = false;       // 背景ワーカーの単発ガード
let flagSeq = 0;                // 各トグルに付ける単調増加の版（飛行中の再トグルを取りこぼさない）
let saverRetry_ = null;        // 未送信が残った時の再送タイマー
const pendingFlags = new Map(); // 未確定の変更 key="識別子|field" -> {rid,masterId,name,field,value,prev,seq,label}
// 未送信が残った時、時間をおいて自動再送（通信断続・多重競合からの自己回復＝原則6）。
function scheduleSaverRetry_() {
  if (saverRetry_) return;
  saverRetry_ = setTimeout(function () { saverRetry_ = null; if (pendingFlags.size) { saveDirty = true; runSaver(); } }, 5000);
}
// タブ/アプリを閉じる直前、未送信があればベストエフォートで最終送信（rev不一致はサーバ側で拒否＝安全）。
function flushPendingBeacon_() {
  try {
    /* 送ってよいかの判定（未送信あり・実データあり）はここ＝アプリ側に残す。
       Phase 0: 送信そのものは共通データ層へ。送る本文の形は従来と同一。 */
    if (!pendingFlags.size || !DB || !Array.isArray(DB.residents) || !DB.residents.length) return;
    SU.data.kvPutBeacon(LS_KEY, DB, careRev);
  } catch (e) {}
}
function pendingKey_(item, field) {
  const idp = (item.masterId != null) ? ('m' + item.masterId)
            : (item.rid != null) ? ('i' + item.rid)
            : ('n' + suNormName_(item.name));
  return idp + '|' + field;
}
// items の field を DB へ即時反映し、背景保存キューへ積む（楽観的UI）。
function queueFlags(items, field, value, label) {
  const t = syncTarget();
  if (!t.endpoint) { toast('同期先が未設定です（週間計画アプリで設定してください）', true); renderAll(DB); return; }
  if (!DB || !Array.isArray(DB.residents)) { toast('データがありません', true); return; }
  if (!items || !items.length) return;
  let applied = 0;
  for (const it of items) {
    const r = findServerResident_(DB.residents, it);
    if (!r) continue;                    // 手元に無い＝一覧が古い（下でまとめて通知）
    const key = pendingKey_(it, field);
    const existing = pendingFlags.get(key);
    const prev = existing ? existing.prev : !!r[field];   // 未確定変更を始める前の値（＝直近確定値）を保持＝失敗時の巻き戻し用
    r[field] = !!value;                  // ★即時反映
    pendingFlags.set(key, { rid: it.rid, masterId: it.masterId, name: it.name, field: field, value: !!value, prev: prev, seq: ++flagSeq, label: label });
    applied++;
  }
  if (applied < items.length) toast('一覧が更新されました。もう一度開き直してください', true);
  if (!applied) { renderAll(DB); return; }   // 見た目だけ変わったチェックを権威状態へ戻す
  renderAll(DB);                         // 即描画（行が即座に消える/戻る・モーダルも同期）
  saveDirty = true;
  runSaver();                            // 背景保存（待たない）
}
async function runSaver() {
  if (saverRunning) return;
  saverRunning = true;
  if (saverRetry_) { clearTimeout(saverRetry_); saverRetry_ = null; }
  setSyncState('保存中…');
  let notFound = 0, lastLabel = '設定';
  try {
    // 取得(refresh)進行中はDB差し替えと競合するので終わるまで待つ（最大3秒）。
    let w = 0; while (busy && w++ < 300) await new Promise(r => setTimeout(r, 10));
    let guard = 0;
    while (saveDirty && guard++ < 30) {
      saveDirty = false;
      notFound = 0;
      // 未確定フラグを現DBへ確実に反映（refresh等でDBが差し替わっていてもPUTに必ず含める）
      for (const p of pendingFlags.values()) { const r = findServerResident_(DB.residents, p); if (r) r[p.field] = !!p.value; else notFound++; lastLabel = p.label || lastLabel; }
      const snapshot = JSON.parse(JSON.stringify(DB));
      if (!snapshot || !Array.isArray(snapshot.residents) || !snapshot.residents.length) throw new Error('手元データが空のため中止');
      const sentSeq = new Map(); for (const [k, v] of pendingFlags) sentSeq.set(k, v.seq);   // 送信時の版を控える
      const res = await gasCall({ action: 'put', key: LS_KEY, rev: careRev, data: snapshot });
      if (res && res.ok) {
        careRev = Number(res.rev) || careRev;           // 案A: 次回も直接PUTできる
        // 飛行中に再トグルされていない項目だけ確定として削除（seq一致）。再トグル分は残し次周で再送＝無言消失を防ぐ。
        sentSeq.forEach((sq, k) => { const cur = pendingFlags.get(k); if (cur && cur.seq === sq) pendingFlags.delete(k); });
      } else if (res && res.conflict) {
        const f = await getRemoteWithRev();             // read-freshフォールバック（他端末の更新を取り込む）
        if (!f.data || !Array.isArray(f.data.residents) || !f.data.residents.length) throw new Error('クラウドが空');
        for (const p of pendingFlags.values()) { const r = findServerResident_(f.data.residents, p); if (r) r[p.field] = !!p.value; }
        DB = f.data; careRev = f.rev; renderAll(DB);    // 併合結果を反映して再PUT
        saveDirty = true;
      } else {
        /* bathwipe/visitwipe＝サーバー側の一括消失ガード（2026-08-05）。この端末の手元データが古い。
           下の catch が最新をGETして権威状態へ戻す（＝正しい復旧）ので、文言だけ分かるようにする。 */
        var em = (res && res.error) || '保存に失敗しました';
        if (em === 'bathwipe' || em === 'visitwipe') em = 'この端末の週間計画が古いため拒否されました';
        throw new Error(em);
      }
    }
    renderAll(DB);   // 交錯した先行refresh等で表示がずれても、最終的にDB（＝送信済みの状態）へ揃える
    if (!pendingFlags.size) {
      setSyncState('保存OK（全端末に同期）');
      toast((lastLabel || '設定') + 'を保存しました（全端末に同期）' + (notFound ? ('・' + notFound + '名は反映できませんでした') : ''), !!notFound);
    } else {
      setSyncState('未保存（再送待ち）');
      scheduleSaverRetry_();   // 残った未送信は時間をおいて自動再送（原則6）
    }
  } catch (e) {
    // 失敗: catch突入時点の未送信だけを対象に処理（回復中に積まれた新規は巻き添えにしない）。
    const keys = [...pendingFlags.keys()];
    let restored = false;
    try { const f = await getRemoteWithRev(); if (f && f.data && Array.isArray(f.data.residents) && f.data.residents.length) { DB = f.data; careRev = f.rev; restored = true; } } catch (e2) {}
    if (!restored) { for (const k of keys) { const p = pendingFlags.get(k); if (!p) continue; const r = findServerResident_(DB.residents, p); if (r) r[p.field] = !!p.prev; } }   // GET不可＝prevで巻き戻し
    keys.forEach(k => pendingFlags.delete(k));
    renderAll(DB);
    setSyncState('保存失敗');
    toast((lastLabel || '設定') + 'を保存できませんでした（' + (e && e.message ? e.message : '') + '）。変更を取り消しました', true);
    if (pendingFlags.size) scheduleSaverRetry_();   // 回復GET中に積まれた新規があれば再送
  } finally {
    saverRunning = false;
  }
}
function writeResidentFlag(items, field, value, label) { queueFlags(items, field, value, label || '設定'); }
// 昼食薬（従来の呼び出し元はこのラッパを使う）
function writeLunchMed(items, value) { return writeResidentFlag(items, 'lunchMed', value, '昼食薬'); }

/* ============================================================================
   統一データモデル — 5タブ全てがここから生成される
   ============================================================================ */
// 粒度に注意: bathing はイベント単位（曜日別）／floor・lunchMed・visitingMed・hospitalized は
// 利用者単位／end はセル単位（同一人物で曜日により 13:30 と 13:00 が混在しうる）。
let dupCount = 0;      // 同一曜日に複数の通所予定があり、本モデルで落ちた件数（警告表示用）
let floorSrcCount = { room: 0, plan: 0, none: 0 };   // 階の出典の内訳（凡例に出す＝居室連携が効いているかの計器）

/* 居室番号 → 階。入居者マスタの room（例 "201" / "105"）の先頭1文字が階を表す。
   取れない・想定外は 0 を返し、呼び出し側で従来の floor へフォールバックさせる。
   ★判定方針: 誤った階に置くことは、階未設定で見せることより危険（帳票の配膳・与薬の区画が狂う）。
     迷ったら 0 を返して安全側に倒す。
   ★正規表現は必ず先頭アンカー(^)にすること。/\d/ のような非アンカーだと入居者マスタの
     居室欄（自由テキスト入力）に "B201" や "201→105移動" のような値が入った時、
     文字列の途中の数字を拾って【誤った階へ配置】してしまう（2026-07-21 レビュー指摘）。
     アンカーがあれば規約外の表記は 0 に落ち、旧floor→階未設定⚠ の順で安全に退避する。
   ★ラウレアハレは1階/2階のみ。3階以上("301"等)は一致させない＝データ異常として「階未設定」に落とす。 */
function roomToFloor(room) {
  // 全角数字は半角へ寄せる（自由テキスト欄のため "２０１" の混入がありうる。
  // 寄せないと登録済みなのに「居室未登録」と誤って集計される）
  const s = String(room == null ? '' : room).trim()
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const m = s.match(/^([12])/);
  return m ? parseInt(m[1], 10) : 0;
}

/* ═══════════ 入居者マスタの入院状態を重ねる ═══════════ 2026-08-02 追加
 * 経緯: 排泄ケア記録／入居者マスタで入院にしても、この表には反映されていなかった。
 *   排泄・マスタ → マスタGAS までは届いているが、週間計画アプリは受け取った入院状態を
 *   端末内(saveLocalOnly)にしか保存せず care_schedule_v2 のサーバー版へ push しないため、
 *   サーバー版だけを読むこのツールには永久に届かない、というのが原因だった。
 *
 * 方針: **書き込みを一切増やさずに直す。**
 *   care_schedule_v2 へ書くと、複数端末での上書き合戦や入院フラグの巻き戻りを招く
 *   （このツールは「端末キャッシュへ書かない」という設計で事故を避けてきた・461行の注記）。
 *   そこで、描画の直前にマスタの名簿を読んで **メモリ上の db にだけ**入院を重ねる。
 *   保存は一切しない＝失敗しても壊れるものが無い。
 *
 * 規則:
 *   ・マスタ常勝。ただし **マスタが hospitalized を配信してきた人だけ**。
 *     未配信（旧GAS・項目なし）は触らない＝現場の入力を false で潰さない。
 *   ・突合は masterId。氏名照合はしない（同姓同名で別人に付けない）。
 *   ・接続設定(rmaster_cfg)が無い端末では何もしない＝従来どおりの表示。
 */
var DCR_RMASTER_CFG_KEY = 'rmaster_cfg';
var DCR_HOSP_TTL_MS     = 60000;      // 名簿の取り直し間隔（stateRev が動いた時は即時）
var dcrHospMap = null;                // masterId(string) -> bool ／ null = 未取得
/* ☆訪問診療（2026-08-02 追加）。
   このフラグは読み手（下の描画）だけがあって**書き手がどこにも無く、☆が永久に出ない**状態だった。
   入居者マスタの「往診曜日(visitDay)」が入っている＝訪問診療を受けている、なので、
   入院を取りに行くのと同じ応答からそのまま導出する（追加のリクエストは発生しない）。
   ★週間計画側に visitingMed を入力するUIは無い＝現場の入力を潰す心配がない。 */
var dcrVmedMap = null;                // masterId(string) -> bool ／ null = 未取得
var dcrHospAt  = 0;
var dcrHospRev = null;                // 前回見た {rev, srev}
var dcrHospBusy = false;

function dcrGetMasterCfg(){
  try{
    var s = localStorage.getItem(DCR_RMASTER_CFG_KEY); if (!s) return null;
    var o = JSON.parse(s);
    var url = String((o && o.url) || '').trim();
    if (!/^https:\/\//i.test(url)) return null;
    return { url: url, token: String((o && o.token) || '').trim() };
  }catch(e){ return null; }
}

/* 入院・訪問診療を重ねた【描画用のコピー】を返す。db 自身は決して書き換えない。
 *
 * ★2026-08-05 修正: 従来は引数の db を破壊的に書き換えていた。この db は多くの場合グローバル DB
 * そのもので、フラグ保存の背景ワーカー runSaver は DB のスナップショットを care_schedule_v2 へ
 * PUT する。つまり「保存は一切しない」という上の宣言に反し、マスタ由来の hospitalized と
 * visitingMed が週間計画のサーバー版へ実際に書き込まれていた（data-contracts §10-5 にも反する）。
 * 変更がある利用者だけを複製する copy-on-write にして、DB を汚さずに描画だけ変える。
 * 変更が無ければ db をそのまま返す＝従来どおり追加コストなし。 */
function dcrOverlayMaster(db){
  if ((!dcrHospMap && !dcrVmedMap) || !db || !Array.isArray(db.residents)) return db;
  var rs = db.residents.slice(), changed = false;
  for (var i = 0; i < rs.length; i++){
    var r = rs[i];
    if (!r || r.masterId == null || r.masterId === '') continue;
    var mid = String(r.masterId), nr = null, k;
    if (dcrHospMap){
      var v = dcrHospMap[mid];
      if (v !== undefined && !!r.hospitalized !== !!v){   // 未配信＝触らない
        nr = {}; for (k in r) if (Object.prototype.hasOwnProperty.call(r, k)) nr[k] = r[k];
        nr.hospitalized = !!v;
      }
    }
    if (dcrVmedMap){
      /* ☆訪問診療。往診曜日が入っていれば true。
         こちらは「キーが無い＝false」で構わない（週間計画側に入力UIが無く、
         潰す対象の現場入力が存在しないため）。 */
      var w = !!dcrVmedMap[mid];
      if (!!r.visitingMed !== w){
        if (!nr){ nr = {}; for (k in r) if (Object.prototype.hasOwnProperty.call(r, k)) nr[k] = r[k]; }
        nr.visitingMed = w;
      }
    }
    if (nr){ rs[i] = nr; changed = true; }
  }
  if (!changed) return db;
  var out = {};
  for (var k2 in db) if (Object.prototype.hasOwnProperty.call(db, k2)) out[k2] = db[k2];
  out.residents = rs;
  return out;
}

/* マスタGASから名簿を取り、入院だけを取り出して保持する。
   ★取得した氏名・生年月日などは一切保持しない（入院の真偽と masterId のみ）。 */
function dcrFetchMasterHosp(force){
  if (dcrHospBusy) return Promise.resolve(false);
  var cfg = dcrGetMasterCfg(); if (!cfg || !cfg.token) return Promise.resolve(false);
  if (!force && dcrHospMap && (Date.now() - dcrHospAt) < DCR_HOSP_TTL_MS) return Promise.resolve(false);
  dcrHospBusy = true;
  /* Phase 0: 入居者マスタからの名簿取得を共通データ層へ移した（GET+クエリの形は同一）。 */
  return SU.data.getRoster({ endpoint: cfg.url, token: cfg.token, transport: 'GET' })
    .then(function(j){
      if (!j || !Array.isArray(j.roster)) return false;
      var m = {}, vm = {}, sawVisitDay = false;
      j.roster.forEach(function(x){
        if (!x || x.masterId == null) { if (x && x.id != null) x.masterId = x.id; }
        var mid = (x && (x.masterId != null ? x.masterId : x.id));
        if (mid == null || mid === '') return;
        /* hospitalized はキーが実在する時だけ採用（旧GASは項目ごと無い）。
           無い人を false 扱いにすると現場の入院表示を一括で消してしまう。 */
        if (Object.prototype.hasOwnProperty.call(x, 'hospitalized')) m[String(mid)] = !!x.hospitalized;
        /* ☆訪問診療＝往診曜日が入っているか。旧GAS（visitDay を返さない）では
           1件も見つからないので、その場合は導出そのものを行わない（全員 ☆無しにしない）。 */
        if (Object.prototype.hasOwnProperty.call(x, 'visitDay')){
          sawVisitDay = true;
          if (String(x.visitDay || '').trim() !== '') vm[String(mid)] = true;
        }
      });
      dcrHospMap = m; dcrVmedMap = sawVisitDay ? vm : null; dcrHospAt = Date.now();
      if (typeof j.stateRev === 'number' || typeof j.srev === 'number') {
        dcrHospRev = { rev: j.stateRev, srev: j.srev };
      }
      return true;
    })
    .catch(function(){ return false; })
    .then(function(ok){ dcrHospBusy = false; return ok; });
}

/* 版数(stateRev)だけを見張り、動いた時に名簿を取り直す。
   合言葉不要・応答は数値2つだけ＝個人情報ゼロ。表示中のみ回す。 */
function dcrWatchMasterState(){
  var cfg = dcrGetMasterCfg(); if (!cfg) return;
  if (document.hidden) return;
  /* Phase 0: 状態版数の監視も共通データ層へ。★合言葉は渡さない（この口は個人情報を返さないため、
     不要な合言葉を投げない）。token を渡さなければ su-data 側もクエリに載せない。 */
  SU.data.kvRaw({ action: 'stateRev' }, { endpoint: cfg.url, transport: 'GET' })
    .then(function(j){
      if (!j || j.ok !== true) return;                       // 未対応GAS＝静かに見送る
      var changed = !dcrHospRev || j.rev !== dcrHospRev.rev || j.srev !== dcrHospRev.srev;
      dcrHospRev = { rev: j.rev, srev: j.srev };
      if (!changed) return;
      return dcrFetchMasterHosp(true).then(function(ok){
        if (ok && DB) renderAll(DB);                         // 入院が変わったら描き直す
      });
    })
    .catch(function(){});
}

function buildModel(db) {
  const residents = (db && Array.isArray(db.residents)) ? db.residents : [];
  const people = [];
  dupCount = 0;
  floorSrcCount = { room: 0, plan: 0, none: 0 };
  for (const r of residents) {
    if (!r || r.movedOut) continue;
    const days = [null, null, null, null, null, null];
    let hasDc = false;
    for (const ev of (Array.isArray(r.events) ? r.events : [])) {
      if (!ev || ev.serviceType !== 'daycare') continue;
      const dow = Number(ev.dayOfWeek);
      if (!(dow >= 0 && dow < NDAY)) continue;
      const s = toMin(ev.startTime), e = toMin(ev.endTime);
      if (s == null || e == null || e <= s) continue;
      // 同一曜日に複数の通所予定がある場合、本モデルは1枠しか持てないため後勝ちで落ちる。
      // 黙って捨てると利用表タブ（両方描画・両方計上）と食い違うので件数を数えて警告する。
      if (days[dow]) dupCount++;
      days[dow] = { s: s, e: e, bath: !!ev.bathing };
      hasDc = true;
    }
    if (!hasDc) continue;                                  // デイ母集団のみ
    // 階の決定: ①居室(room)由来＝入居者マスタが正 → ②週間計画の floor（旧経路・手書きマスタ由来）
    //           → ③0=階未設定（既存どおり⚠で可視化）。①が取れる人だけ②を上書きするので、
    //           居室未登録者の現行表示は一切変わらない（デグレ無しのフォールバック）。
    const fRoom = roomToFloor(r.room);
    const fPlan = (r.floor === 1 || r.floor === 2) ? r.floor : 0;
    const floor = fRoom || fPlan;
    floorSrcCount[fRoom ? 'room' : (fPlan ? 'plan' : 'none')]++;
    people.push({
      name: String(r.name || '（無名）'),
      kana: String(r.kana || ''),
      rid: (r.id != null ? r.id : null),                   // 昼食薬の書戻し時にサーバDBの当該入居者を引く安定キー
      masterId: (r.masterId != null ? r.masterId : null),  // 同上（マスタ由来の一意ID・氏名照合より優先）
      floor: floor,                                        // 0=階未設定（居室・週間計画とも不明）
      lunchMed: !!r.lunchMed,
      visitingMed: !!r.visitingMed,      // 訪問診療（☆）— 新フラグ。未入力なら false
      hosp: !!r.hospitalized,
      days: days
    });
  }
  people.sort((a, b) => (a.kana || a.name).localeCompare(b.kana || b.name, 'ja'));
  people.forEach((p, i) => { p.pid = i; });   // 安定ID（薬用チェックリスト↔表セルの紐付け用）
  return people;
}

/* ── 非表示設定（全端末共通で表示を絞る）─────────────────────────────────────
   用途: 入居前などで居室未入力の利用者が表に正しく分配されない時、一時的に表から外す。
   設計（2026-07-27 全端末共通化）:
     - 状態は care_schedule_v2 の利用者フィールド `dcrHidden`(boolean) に持つ＝サーバ正本・全端末共通。
       書込みは昼食薬(lunchMed)と同じ writeResidentFlag（read-fresh＋rev競合ガード）で当該1フィールドのみ更新。
       週間計画の予定(events)・他フィールドは変更しない。care_schedule_v2 以外のキーは触らない。
     - dcrHidden は work-schedule/care-schedule の同期でも保持される利用者スカラー（lunchMed 同型）。
       万一どこかで落ちても「再表示」に倒れる＝消失より復活（multi-device-sync 原則5）で安全側。
     - フィルタは renderAll で db.residents を1回絞るだけ。各描画関数（roster/daylist/allweek/med/weekly）は
       無改変で、5タブ全てと全集計から自動的に外れる。非表示ゼロなら db をそのまま渡す＝挙動完全不変。 */
let HIDE_CANDIDATES = [];        // 非表示設定ウィンドウ用: 全デイ母集団 {name,kana,hidden,rid,masterId}（五十音順・非表示者も含む）
let hiddenNowCount = 0;          // 現候補のうち実際に非表示になっている人数（バッジ・ボタン表示用）
// デイ母集団の判定（roster は日曜も表示するため dow 0..6。buildModel の月〜土より広く取り、全タブの表示対象を漏れなく候補にする）
function isDaycareResident(r) {
  const evs = Array.isArray(r.events) ? r.events : [];
  for (const ev of evs) {
    if (!ev || ev.serviceType !== 'daycare') continue;
    const dow = Number(ev.dayOfWeek);
    if (!(dow >= 0 && dow <= 6)) continue;
    const s = toMin(ev.startTime), e = toMin(ev.endTime);
    if (s == null || e == null || e <= s) continue;
    return true;
  }
  return false;
}
function collectHideCandidates(db) {
  const residents = (db && Array.isArray(db.residents)) ? db.residents : [];
  const out = [];
  for (const r of residents) {
    if (!r || r.movedOut) continue;
    if (!isDaycareResident(r)) continue;
    out.push({ name: String(r.name || '（無名）'), kana: String(r.kana || ''),
               hidden: !!r.dcrHidden, rid: (r.id != null ? r.id : null), masterId: (r.masterId != null ? r.masterId : null) });
  }
  out.sort((a, b) => (a.kana || a.name).localeCompare(b.kana || b.name, 'ja'));   // 五十音順
  return out;
}
// 非表示(dcrHidden)を除いた db ビュー。非表示ゼロなら原本を同一参照で返す＝機能未使用時の挙動を完全不変に保つ。
function viewExcludingHidden(db) {
  if (!db || !Array.isArray(db.residents)) return db;
  if (!db.residents.some(r => r && r.dcrHidden)) return db;
  return Object.assign({}, db, { residents: db.residents.filter(r => !r.dcrHidden) });
}
/* 表示用: 指定曜日にデイを利用する人／しない人（＝2階食堂で昼食）。入院者も「登録」として表示に残す。 */
const onDay  = (ppl, d) => ppl.filter(p => p.days[d]);
const offDay = (ppl, d) => ppl.filter(p => !p.days[d]);
/* 計上用: 入院者は実稼働ではないので数えない（＝利用表タブと同じ契約。凡例にも明示している）。
   ★表示と計上を必ず使い分けること。onDay().length を合計に使うと入院者を数えてしまい、
     厨房の食数が過大になる。
   なお hosp は利用者単位（曜日非依存）で onDay/offDay は排他・網羅なので、
   「昼食合計」= countOn+countOff は除外の有無にかかわらず全曜日で定数になる。これはモデル上正しく
   （デイ母集団の非入院者は必ずどこかで昼食を摂る）、除外はその定数を実食数に合わせるためのもの。
   合計が動かないことをバグと見て「修正」しないこと。 */
const countOn  = (ppl, d) => onDay(ppl, d).filter(p => !p.hosp).length;
const countOff = (ppl, d) => offDay(ppl, d).filter(p => !p.hosp).length;

/* ============================================================================
   View 0 — 利用表（利用時間帯 × 居室階）
   ★2026-08-17 運用指示: 各利用時間帯の中を居室の階で分け（２階が上・１階が下）、
     階ラベルを利用時間欄の右隣に出す。氏名は階ごとに五十音順。
     階の決定は他タブ（buildModel）と同じ「居室(room)が第一・週間計画のfloorが次・0=未設定」。
     ★合計（入浴合計・利用合計）の数え方は改修前と完全に同一＝集計は触っていない。
   ============================================================================ */
const FLOOR_ORDER = [2, 1, 0];                                        // ２階 → １階 → 階未設定
const FLOOR_LABEL = { 2: '２階', 1: '１階', 0: '階未設定' };
const byKana = (a, b) => String(a.kana || a.name).localeCompare(String(b.kana || b.name), 'ja');   // 五十音順（他タブと同じ整列規則）

function collectDaycare(db) {
  const plansMap = {};                       // key "s-e" -> { label, s, e, floors: { [floor]: days[7][] } }
  const hosp = new Set();
  const bath = [0, 0, 0, 0, 0, 0, 0];
  const use  = [0, 0, 0, 0, 0, 0, 0];
  let maxDay = 5;                            // 既定 月〜土（土=5）。日にデータがあれば7列へ拡張
  const residents = (db && Array.isArray(db.residents)) ? db.residents : [];
  for (const r of residents) {
    if (!r || r.movedOut) continue;
    const evs = Array.isArray(r.events) ? r.events : [];
    // 階: ①居室(入居者マスタ由来) → ②週間計画の旧設定 → ③0=未設定（buildModel と同じ判定）
    const floor = roomToFloor(r.room) || ((r.floor === 1 || r.floor === 2) ? r.floor : 0);
    const kana  = String(r.kana || '');
    for (const ev of evs) {
      if (!ev || ev.serviceType !== 'daycare') continue;
      const dow = Number(ev.dayOfWeek);
      if (!(dow >= 0 && dow <= 6)) continue;
      const s = toMin(ev.startTime), e = toMin(ev.endTime);
      if (s == null || e == null || e <= s) continue;
      const name = String(r.name || '（無名）');
      const isHosp = !!r.hospitalized;               // ワークスケジュール／週間計画の入院入力
      if (isHosp) hosp.add(name);
      const key = s + '-' + e;
      if (!plansMap[key]) plansMap[key] = { label: minToLabel(s) + '〜' + minToLabel(e), s: s, e: e, floors: {} };
      const fl = plansMap[key].floors;
      if (!fl[floor]) fl[floor] = [[], [], [], [], [], [], []];
      fl[floor][dow].push({ name: name, kana: kana, bath: !!ev.bathing, hosp: isHosp });
      if (!isHosp) {                                 // 入院中は実稼働ではないため合計に数えない
        use[dow]++;
        if (ev.bathing) bath[dow]++;
      }
      if (dow > maxDay) maxDay = dow;
    }
  }
  // 時間帯ごとに階ブロックへ組み直す。該当者0名の階はブロックを作らない（空行を出さない）。
  const plans = Object.values(plansMap).sort((a, b) => a.s - b.s || a.e - b.e).map(p => {
    const blocks = [];
    FLOOR_ORDER.forEach(f => {
      const days = p.floors[f];
      if (!days) return;
      let rows = 0;
      for (let d = 0; d <= 6; d++) { days[d].sort(byKana); if (days[d].length > rows) rows = days[d].length; }
      if (rows) blocks.push({ floor: f, days: days, rows: rows });
    });
    return { label: p.label, s: p.s, e: p.e, blocks: blocks };
  });
  return { plans: plans, hosp: [...hosp], bath: bath, use: use, nCols: maxDay + 1 };
}

/* 印刷の列幅を用紙幅いっぱいに配分する（2026-08-17 運用指示「左右の余白を余らせない」）。
   ★画面の列幅は不変。--ro-w-* は @media print の中でしか参照されない。
   A4縦・余白8mm の印刷可能幅は 733px。固定分（利用時間+階+No.）を引いた残りを曜日数で割る。 */
const RO_PR_TIME = 68, RO_PR_FLR = 28, RO_PR_RN = 24;   // 下限（従来の指定値）
/* 利用時間ラベル（例 10:00〜13:30）が欠けない列幅を、実際のラベル文字列から測る。
   ★固定レイアウトでは列幅を超えた nowrap セルは切られる。従来の 68px 指定は width:auto＝自動レイアウトに
     救われて実際には 94px 貰っていただけで、幅を明示した今そのまま使うと 12px でも末尾が欠ける（実測）。
   ★時刻は帳票で最も読まれる値なので、ここは必要な幅を必ず確保し、残りを曜日列へ配る。 */
function rosterTimeColW_(table, f) {
  // 見出し「利用時間」も測る（実データでは時間帯ラベルの方が広いが、暗黙の前提にしない）
  const labels = table.querySelectorAll('tbody th.plan-label, thead th.col-time');
  if (!labels.length) return Math.round(RO_PR_TIME * f / ROSTER_FS_BASE);
  const cs = getComputedStyle(labels[0]);
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;'
    + 'font-family:' + cs.fontFamily + ';font-weight:' + cs.fontWeight
    + ';letter-spacing:' + cs.letterSpacing + ';font-size:' + f + 'px';
  document.body.appendChild(probe);
  let maxW = 0;
  for (let i = 0; i < labels.length; i++) {
    probe.textContent = labels[i].textContent;
    const w = probe.getBoundingClientRect().width;
    if (w > maxW) maxW = w;
  }
  probe.remove();
  const pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0) + 2;   // padding＋罫線
  return Math.max(RO_PR_TIME, Math.ceil(maxW + pad + 1));                                   // +1 は丸めの安全代
}
function setRosterPrintCols_(table, nCols, fs) {
  const f = (fs > 0) ? fs : ROSTER_FS_BASE;
  /* 階ラベルは縦書き＝列幅は1文字分で足りる／No.列は文字サイズ上限つき（上の CSS）なので固定。 */
  const time  = rosterTimeColW_(table, f);
  const avail = pageWidthPx_(null);                                     // A4縦8mm → 733.4px
  const rest  = avail - time - RO_PR_FLR - RO_PR_RN;
  const day   = Math.max(60, Math.floor(rest / Math.max(1, nCols)));    // 60px は氏名が読める下限の保険
  table.style.setProperty('--ro-w-time', time + 'px');
  table.style.setProperty('--ro-w-flr', RO_PR_FLR + 'px');
  table.style.setProperty('--ro-w-rn', RO_PR_RN + 'px');
  table.style.setProperty('--ro-w-day', day + 'px');
}

function renderRoster(db) {
  const data = collectDaycare(db);
  const table = $('roster');
  if (!data.plans.length) { table.textContent = ''; $('hospBox').style.display = 'none'; ROSTER_SUB = ''; return; }
  const nCols = data.nCols;
  table.textContent = '';

  const thead = el('thead');
  const htr = el('tr');
  htr.appendChild(el('th', 'col-time', '利用時間'));
  htr.appendChild(el('th', 'col-flr', '階'));
  htr.appendChild(el('th', 'col-rn', ''));
  for (let d = 0; d < nCols; d++) {
    htr.appendChild(el('th', 'th-day col-day' + (d === 5 ? ' sat' : d === 6 ? ' sun' : ''), DAYS_JA[d]));
  }
  thead.appendChild(htr);
  table.appendChild(thead);

  const tbody = el('tbody');
  data.plans.forEach((plan, pi) => {
    // 利用時間ラベルは時間帯の全行（＝各階ブロックの行数の合計）を占有する
    let nRows = 0;
    plan.blocks.forEach(b => { nRows += b.rows; });
    if (!nRows) nRows = 1;
    let first = true;                                  // 時間帯の先頭行（利用時間ラベルを置く行）か
    plan.blocks.forEach((blk, bi) => {
      for (let i = 0; i < blk.rows; i++) {
        const tr = el('tr');
        if (first) {
          const lbl = el('th', 'plan-label', plan.label);
          lbl.rowSpan = nRows;
          tr.appendChild(lbl);
        }
        if (i === 0) {
          const fl = el('th', 'col-flr f' + blk.floor, FLOOR_LABEL[blk.floor]);
          fl.rowSpan = blk.rows;
          tr.appendChild(fl);
        }
        tr.appendChild(el('td', 'col-rn', String(i + 1)));   // 連番は階ごとに1から（他タブと同じ作法）
        for (let d = 0; d < nCols; d++) {
          const u = blk.days[d][i];
          if (u) {
            const td = el('td', 'user' + (u.bath ? ' bath' : ''));
            td.appendChild(document.createTextNode(u.name));
            if (u.hosp) td.appendChild(el('span', 'hosp-tag', '（入院）'));
            td.title = u.name + (u.hosp ? '（入院）' : '') + (u.bath ? '（入浴あり）' : '');
            tr.appendChild(td);
          } else {
            tr.appendChild(el('td', 'empty', ''));
          }
        }
        if (bi > 0 && i === 0) tr.classList.add('flr-top');   // 同じ時間帯の中で階が切り替わる境目
        tbody.appendChild(tr);
        first = false;
      }
    });
    // 利用時間帯ブロックの間に空白行を1本入れて上下を分断（最後のブロックの後には入れない）
    if (pi < data.plans.length - 1) {
      const sp = el('tr', 'spacer');
      const spTd = el('td');
      spTd.colSpan = 3 + nCols;   // plan-label列 + col-flr列 + col-rn列 + 曜日列
      sp.appendChild(spTd);
      tbody.appendChild(sp);
    }
  });
  table.appendChild(tbody);

  const tfoot = el('tfoot');
  const bathTr = el('tr', 'tot bath-row');
  const bth = el('th', null, '入浴合計'); bth.colSpan = 3; bathTr.appendChild(bth);   // 利用時間+階+No.
  for (let d = 0; d < nCols; d++) bathTr.appendChild(el('td', null, String(data.bath[d])));
  tfoot.appendChild(bathTr);
  const useTr = el('tr', 'tot use');
  const uth = el('th', null, '利用合計'); uth.colSpan = 3; useTr.appendChild(uth);
  for (let d = 0; d < nCols; d++) useTr.appendChild(el('td', null, String(data.use[d])));
  tfoot.appendChild(useTr);
  table.appendChild(tfoot);

  /* 印刷の列幅を用紙幅いっぱいに配分（画面幅は不変）。
     ★必ず表を組み立てた後に呼ぶ。利用時間ラベルの実幅を測って列幅を決めるため、
       行が無い状態で呼ぶと仮の値(68px)になり、印刷フィットが走らない経路でラベルが欠ける。 */
  setRosterPrintCols_(table, nCols);

  const hospBox = $('hospBox');
  if (data.hosp.length) { $('hospNames').textContent = data.hosp.join('　'); hospBox.style.display = ''; }
  else { hospBox.style.display = 'none'; }

  // 利用表タブの指標（改修前からの表示。タブ切替で出し分けるため保持する）
  const totalUse = data.use.reduce((a, b) => a + b, 0);
  ROSTER_SUB = '利用時間別／延べ利用 ' + totalUse + '件・' + data.plans.length + '区分';
}

/* ============================================================================
   共通パーツ — 曜日ヘッダ（氏名/開始/終了 の3列×6曜日）
   ============================================================================ */
// 列幅の宣言。table-layout:fixed は最初の行しか見ないため、colspan を含む表では colgroup が必須。
// さらに table 自身に明示幅が無いと fixed が効かず自動レイアウトへ寄るため、幅も併せて設定する。
// ★この値は CSS の col.w-* と必ず一致させること（食い違うと fixed が差分を再配分し CSS 側が無効化される）。
// rnAw/nmAw/tmAw=全員リスト用（ふりがな列を廃止した110pxを全列へ均等配分した値）／
// nmDl=デイ利用者一覧表用（備考を表の下へ出すぶん氏名列を最大化）
const W = { sec: 24, rn: 20, rnDl: 26, nm: 76, tm: 46, rnAw: 44, nmAw: 76, tmAw: 46, nmDl: 76, tmDl: 46 };
const TBL_W = {
  day:     W.sec + W.rn   + NDAY * (W.nm   + W.tm * 2),   // 1052 med：右の備考を削除して表へ回した（≦1062）
  daylist: W.sec + W.rnDl + NDAY * (W.nmDl + W.tmDl * 2), // 1058 デイ利用者一覧表：24+26+6×(76+46+46)（≦A3縦 1062）
  allweek: W.rnAw + NDAY * (W.nmAw + W.tmAw * 2)          // 1052 全員リスト：44+6×(76+46+46)（≦A3縦 1062）
};
function colgroupFor(kind) {
  const cg = el('colgroup');
  let nmCol, tmCol = 'w-tm';
  // 全員リストは区画ラベル列(w-sec)を持たず、No.列も専用幅（合計行の「入居者」ラベルを収める）
  if (kind === 'allweek') { cg.appendChild(el('col', 'w-rn-aw')); nmCol = 'w-nm-aw'; tmCol = 'w-tm-aw'; }
  else {
    cg.appendChild(el('col', 'w-sec'));
    cg.appendChild(el('col', kind === 'daylist' ? 'w-rn-dl' : 'w-rn'));
    if (kind === 'daylist') { nmCol = 'w-nm-dl'; tmCol = 'w-tm-dl'; }
    else { nmCol = 'w-nm'; }
  }
  for (let d = 0; d < NDAY; d++) {
    cg.appendChild(el('col', nmCol));
    cg.appendChild(el('col', tmCol));
    cg.appendChild(el('col', tmCol));
  }
  return cg;
}
function setupSheet(table, kind) {
  table.textContent = '';
  table.style.width = (TBL_W[kind] || TBL_W.day) + 'px';   // ★明示幅（fixed成立の条件）
  table.appendChild(colgroupFor(kind));
}

/* 曜日見出しの2行（曜日名／開始・終了）を生成する。thead と、表の中盤に再掲する行の両方で共用。
   rehead=true のときは tbody 内に置くため .rehead を付ける（thead 限定の背景指定を補う）。 */
function dayHeaderRows(rehead) {
  const cls = rehead ? 'rehead' : null;
  const tr = el('tr', cls);
  tr.appendChild(el('th', 'c-sec', ''));
  tr.appendChild(el('th', 'c-rn', ''));
  for (let d = 0; d < NDAY; d++) {
    const th = el('th', 'th-day dsep' + (d === 5 ? ' sat' : '') + (d === NDAY - 1 ? ' dend' : ''), DAYS_JA[d]);
    th.colSpan = 3;
    tr.appendChild(th);
  }
  const tr2 = el('tr', cls);
  tr2.appendChild(el('th', 'c-sec', ''));
  tr2.appendChild(el('th', 'c-rn', ''));
  for (let d = 0; d < NDAY; d++) {
    tr2.appendChild(el('th', 'c-nm dsep', ''));
    tr2.appendChild(el('th', 'c-tm', '開始'));
    tr2.appendChild(el('th', 'c-tm' + (d === NDAY - 1 ? ' dend' : ''), '終了'));
  }
  return [tr, tr2];
}
function dayHeader() {
  const thead = el('thead');
  dayHeaderRows(false).forEach(r => thead.appendChild(r));
  return thead;
}
// デイ区画の1セル（氏名＋開始＋終了）。入浴は黄、入院は（入院）。
// dsep=曜日の先頭列に左太線／dend=最終曜日の末尾列に右太線＝曜日ごとに縦の太罫線で囲む。
function deiCells(tr, p, d, showBath) {
  const endCls = (d === NDAY - 1) ? ' dend' : '';
  if (!p) { tr.appendChild(el('td', 'c-nm dsep')); tr.appendChild(el('td', 'c-tm')); tr.appendChild(el('td', 'c-tm' + endCls)); return; }
  const s = p.days[d];
  const td = el('td', 'c-nm dsep nm' + (showBath && s && s.bath ? ' bath' : '') + (p.floor === 0 ? ' nofloor' : ''));
  if (p.pid != null) td.dataset.pid = p.pid;   // 薬用チェックリストで該当利用者の枠を薄オレンジにするための紐付け
  td.appendChild(document.createTextNode(p.name));
  if (p.hosp) td.appendChild(el('span', 'hosp-tag', '（入院）'));
  td.title = p.name + (p.hosp ? '（入院）' : '') + (s && s.bath ? '（入浴あり）' : '');
  tr.appendChild(td);
  tr.appendChild(el('td', 'c-tm', s ? minToLabel(s.s) : ''));
  tr.appendChild(el('td', 'c-tm' + endCls, s ? minToLabel(s.e) : ''));
}

/* ============================================================================
   View 1 — デイ利用者一覧表（A3縦・備考は表の下・表は全幅）
   上段=デイ利用者(せせらぎ・2階/1階) → せせらぎ合計
   下段=昼食(2階食堂)=その日デイに行かない人(2階/1階・☆訪問診療) → ２階合計・昼食合計
   ============================================================================ */
// 元表の備考。「☆往診対象者は13:05までの…」は削除（13:05はシート内に実体が無い口頭ルールのため）。
// 「往診」は誤りのため「訪問診療」に統一。
const DAYLIST_NOTES = [
  '☆昼食後の薬',
  '・せせらぎ利用者分は1階へ',
  'それ以外は2階へ',
  '分けてセットしておきます',
  '☆祝日',
  '営業します',
  '☆黄色で色付けしている方は入浴ありの方です',
  '裏側に訪問診療一覧表をつけています',
  '施設職員は1階の方の誘導もお願いします'
];

function sectionRows(tbody, ppl, label, isDei, showBath, showStar, floorKey) {
  // 曜日ごとに人が違うため、区画の行数＝各曜日の最大人数（元表は固定枠だが実データに追従させる）
  let n = 0;
  for (let d = 0; d < NDAY; d++) n = Math.max(n, (isDei ? onDay(ppl, d) : offDay(ppl, d)).length);
  if (!n) n = 1;
  // ラベル色: 1階＝薄い水色(flr1)／2階・階未設定＝緑(sese)。階ごとに別色で区切りを明確化。
  const labelColor = (floorKey === 1) ? 'flr1' : 'sese';
  for (let i = 0; i < n; i++) {
    const tr = el('tr');
    // ラベルは rowSpan で区画の左列全体を占有＝左/上/下の外周罫線をここに集約
    if (i === 0) { const th = el('th', 'c-sec ' + labelColor + ' blk-left blk-top blk-bot', label); th.rowSpan = n; tr.appendChild(th); }
    tr.appendChild(el('td', 'c-rn', String(i + 1)));
    for (let d = 0; d < NDAY; d++) {
      const list = isDei ? onDay(ppl, d) : offDay(ppl, d);
      const p = list[i];
      if (isDei) { deiCells(tr, p, d, showBath); }
      else {
        // 昼食区画: 時刻は出さず、氏名の右隣（開始列）を☆欄に転用（元表と同じ）
        const td = el('td', 'c-nm dsep' + (p && p.floor === 0 ? ' nofloor' : ''));
        if (p) {
          td.appendChild(document.createTextNode(p.name));
          if (p.hosp) td.appendChild(el('span', 'hosp-tag', '（入院）'));
        }
        tr.appendChild(td);
        const st = el('td', 'c-tm');
        if (p && showStar && p.visitingMed) { st.appendChild(el('span', 'star', '☆')); st.title = '訪問診療'; }
        tr.appendChild(st);
        tr.appendChild(el('td', 'c-tm' + (d === NDAY - 1 ? ' dend' : '')));
      }
    }
    // 塊を太罫線で囲む: 1行目=上辺／最終行=下辺／各行の最終セル=右辺（ラベルが左辺を担当）
    const cells = tr.children;
    for (let c = 0; c < cells.length; c++) {
      if (i === 0) cells[c].classList.add('blk-top');
      if (i === n - 1) cells[c].classList.add('blk-bot');
    }
    if (cells.length) cells[cells.length - 1].classList.add('blk-right');
    tbody.appendChild(tr);
  }
}
function sumRow(tbody, label, counts) {
  const tr = el('tr', 'sum');
  tr.appendChild(el('th', 'c-sec', ''));
  tr.appendChild(el('td', 'c-rn', ''));
  for (let d = 0; d < NDAY; d++) {
    tr.appendChild(el('td', 'c-nm dsep', label));  // ラベル/値の列配置は氏名列基準に統一（元表は区画で不統一）
    const v = el('td', 'c-tm' + (d === NDAY - 1 ? ' dend' : ''), String(counts[d])); v.colSpan = 2;
    tr.appendChild(v);
  }
  tbody.appendChild(tr);
  return tr;
}

function renderDaylist(ppl) {
  const table = $('tblDaylist');
  $('dlTitle').textContent = 'デイ利用者一覧表（全利用者 ' + ppl.length + ' 名）';
  setupSheet(table, 'daylist');
  table.appendChild(dayHeader());
  const tbody = el('tbody');

  const f2 = ppl.filter(p => p.floor === 2), f1 = ppl.filter(p => p.floor === 1), f0 = ppl.filter(p => p.floor === 0);
  // ── デイ利用者（せせらぎ） ──
  sectionRows(tbody, f2, '２階入居者', true, true, false, 2);
  sectionRows(tbody, f1, '１階入居者', true, true, false, 1);
  if (f0.length) sectionRows(tbody, f0, '階未設定', true, true, false, 0);
  // 合計は countOn/countOff＝入院者を除いた実稼働（厨房の食数に直結するため過大計上しない）
  const sese = []; for (let d = 0; d < NDAY; d++) sese.push(countOn(ppl, d));
  const seseSum = sumRow(tbody, 'せせらぎ合計', sese);
  seseSum.classList.add('cut-above');   // ここで表を切る＝上側の締め（太線）
  /* ★2026-08-05 運用指示: せせらぎ合計より下を切り離し、2行ぶんの空間と大見出しを置く。
     1つの table のままにするのは、列幅（table-layout:fixed + colgroup）を上下で揃えるため。
     表を2つに割ると列がずれる。 */
  const gap = el('tr', 'cut-gap');
  const gapTd = el('td', null, ''); gapTd.colSpan = 2 + NDAY * 3; gap.appendChild(gapTd);
  tbody.appendChild(gap);
  const ttl = el('tr', 'cut-title');
  const ttlTh = el('th', null, 'デイ休み（２階で昼食）'); ttlTh.colSpan = 2 + NDAY * 3; ttl.appendChild(ttlTh);
  tbody.appendChild(ttl);
  // 中盤（昼食区画の直前）に曜日見出しを再掲＝長い表でも下段でどの曜日の列か追える（2026-08-03 運用指示）
  dayHeaderRows(true).forEach(r => tbody.appendChild(r));
  // ── 昼食（2階食堂）＝その日デイに行かない人 ──
  sectionRows(tbody, f2, '２階入居者', false, false, true, 2);
  sectionRows(tbody, f1, '１階入居者', false, false, true, 1);
  if (f0.length) sectionRows(tbody, f0, '階未設定', false, false, true, 0);
  const lunch = []; for (let d = 0; d < NDAY; d++) lunch.push(countOff(ppl, d));
  sumRow(tbody, '２階合計', lunch);
  sumRow(tbody, '昼食合計', sese.map((v, i) => v + lunch[i]));
  table.appendChild(tbody);

  // 備考（表の下・横並びでコンパクトに＝横幅を表に使い切る）。幅は表と同じにして中央で揃える。
  const note = $('noteDaylist');
  note.textContent = '';
  note.style.width = TBL_W.daylist + 'px';
  note.appendChild(el('span', 'nb-h', '備考'));
  DAYLIST_NOTES.forEach(t => note.appendChild(el('span', 'nb-item', t)));
}

/* ============================================================================
   View 2 — 全員リスト（A4横）: No. ＋ 曜日ごとの氏名/開始/終了
   氏名は6ブロック全てに反復（元表どおり）。利用の有無は時刻の有無で表す。
   ふりがな列は廃止（2026-07-21 運用指示）。並びは buildModel の kana 昇順ソートで担保しており、
   列を出さなくても五十音順は変わらない（＝p.kana は表示用でなく整列用として残す）。
   ============================================================================ */
// 全員リストの曜日見出し行（No. ＋ 曜日ごとに 氏名/曜日名(colspan2)）。thead と中盤の再掲で共用。
function allweekHeaderRow(rehead) {
  const tr = el('tr', rehead ? 'rehead' : null);
  tr.appendChild(el('th', 'c-rn', 'No.'));
  for (let d = 0; d < NDAY; d++) {
    tr.appendChild(el('th', 'c-nm dsep', '氏名'));
    const th = el('th', 'th-day' + (d === 5 ? ' sat' : '') + (d === NDAY - 1 ? ' dend' : ''), DAYS_JA[d]); th.colSpan = 2;
    tr.appendChild(th);
  }
  return tr;
}
function renderAllweek(ppl) {
  const table = $('tblAllweek');
  setupSheet(table, 'allweek');
  const thead = el('thead');
  thead.appendChild(allweekHeaderRow(false));
  table.appendChild(thead);

  const tbody = el('tbody');
  const blocks = [{ label: '２階入居者', list: ppl.filter(p => p.floor === 2) },
                  { label: '１階入居者', list: ppl.filter(p => p.floor === 1) }];
  const f0 = ppl.filter(p => p.floor === 0);
  if (f0.length) blocks.push({ label: '階未設定', list: f0 });
  let dataRowsBefore = 0;   // ここまでに描いたデータ行数（空ブロックの見出し行は数えない）
  for (const b of blocks) {
    // 「１階入居者」ブロックの上に曜日見出しを再掲＝長い表でも下段でどの曜日の列か追える（2026-08-03 運用指示）。
    // ★上にデータ行が1行も無い時（２階が0名等）は出さない。空ブロックでも見出し行は描かれるため、
    //   行数ではなくデータ行数で判定しないと、上端で曜日行が近接して二重に見える。
    if (b.label === '１階入居者' && dataRowsBefore > 0) tbody.appendChild(allweekHeaderRow(true));
    // 各階ブロックを太枠で囲む: 見出し(全幅)=上辺＋左右上隅／各データ行=左右辺／最終行=下辺
    const hr = el('tr');
    const h = el('th', 'sec-h blk-top blk-left blk-right', b.label); h.colSpan = 1 + NDAY * 3;   // No.列(1) ＋ 曜日×3
    if (!b.list.length) h.classList.add('blk-bot');   // 空ブロックは見出しだけで箱を閉じる
    hr.appendChild(h);
    tbody.appendChild(hr);
    const n = b.list.length;
    b.list.forEach((p, i) => {
      const r = el('tr');
      r.appendChild(el('td', 'c-rn', String(i + 1)));
      for (let d = 0; d < NDAY; d++) deiCells(r, p, d, true);
      const cells = r.children;
      cells[0].classList.add('blk-left');                 // 左辺（c-rn）
      cells[cells.length - 1].classList.add('blk-right');  // 右辺（最終セル）
      if (i === n - 1) { for (let c = 0; c < cells.length; c++) cells[c].classList.add('blk-bot'); }  // 下辺
      tbody.appendChild(r);
    });
    dataRowsBefore += n;
  }
  table.appendChild(tbody);

  const tfoot = el('tfoot');
  const sr = el('tr', 'sum');
  sr.appendChild(el('td', 'c-rn c-sum-lb', '入居者'));   // 旧ふりがな列に置いていた行ラベルを No.列へ移設
  for (let d = 0; d < NDAY; d++) {
    sr.appendChild(el('td', 'c-nm dsep', String(ppl.length) + '名'));
    const v = el('td', 'c-tm' + (d === NDAY - 1 ? ' dend' : ''), String(countOn(ppl, d))); v.colSpan = 2;   // 入院者を除いた実稼働
    sr.appendChild(v);
  }
  tfoot.appendChild(sr);
  table.appendChild(tfoot);
}

/* ============================================================================
   View 3 — 薬用（A4横）: デイ利用者の上表のみ。
   元表のグリッドには塗りゼロ（＝入浴の黄は出さない）。右のチェック欄は画面専用(印刷しない)だが、
   チェックで付く薄オレンジは印刷にも出す（2026-07-21 運用指示）。
   ★2026-08-17 運用指示: 右の備考パネルと上部の凡例メッセージを削除し、空いた幅を表の列へ回した
     （氏名76・時刻46＝daylist と同値。旧「昼食薬あり名簿」「薬」大ラベルは以前に削除済み）。
   ============================================================================ */

function renderMed(ppl) {
  const table = $('tblMed');
  $('medTitle').textContent = 'デイ利用者一覧表（薬用・全利用者 ' + ppl.length + ' 名）';
  setupSheet(table, 'day');
  table.appendChild(dayHeader());
  const tbody = el('tbody');

  const f2 = ppl.filter(p => p.floor === 2), f1 = ppl.filter(p => p.floor === 1), f0 = ppl.filter(p => p.floor === 0);
  sectionRows(tbody, f2, '２階入居者', true, false, false, 2);   // showBath=false（元表は塗りゼロ）
  sectionRows(tbody, f1, '１階入居者', true, false, false, 1);
  if (f0.length) sectionRows(tbody, f0, '階未設定', true, false, false, 0);
  table.appendChild(tbody);

  // 昼食薬(lunchMed=true)の人の氏名セルを薄オレンジに（同期済みの正データ由来＝全端末で一致・印刷にも出る）。
  ppl.forEach(p => { if (p.lunchMed) table.querySelectorAll('[data-pid="' + p.pid + '"]').forEach(td => td.classList.add('med-hl')); });

  // 右側: 昼食薬チェックリスト（このチェック欄自体は印刷されない）。
  // チェック＝その人の lunchMed を全端末へ保存・同期し、表の氏名セルが薄オレンジになる（色は印刷にも出る）。
  const chk = $('chkMed');
  chk.textContent = '';
  chk.appendChild(el('div', 'chk-h', '昼食薬チェック'));
  chk.appendChild(el('div', 'chk-sub', 'チェック＝昼食後に薬がある方。全端末に保存・同期されます（枠の色は印刷にも出ます／このチェック欄自体は印刷されません）'));
  const addGroup = (list, label) => {
    if (!list.length) return;
    chk.appendChild(el('div', 'chk-flr', label));
    list.forEach(p => {
      const lb = el('label', 'chk-item');
      const cb = el('input'); cb.type = 'checkbox'; cb.dataset.pid = p.pid;
      cb.checked = !!p.lunchMed;   // ★同期済みの正データから復元（リロード・他端末でも一致）
      cb.setAttribute('aria-label', p.name + ' の昼食薬（チェックで全端末に保存）');
      lb.appendChild(cb);
      lb.appendChild(document.createTextNode(p.name));   // 氏名は textContent（個人情報・XSS防止）
      chk.appendChild(lb);
    });
  };
  addGroup(f2, '２階入居者');
  addGroup(f1, '１階入居者');
  if (f0.length) addGroup(f0, '階未設定');
  // 変更は委譲（onchange の property 代入＝再描画で重複登録しない）。楽観的に色を反映し、
  // 保存は writeLunchMed→queueFlags が背景で実行（成否は runSaver の再描画で権威状態へ収束）。
  chk.onchange = (e) => {
    const cb = e.target;
    if (!cb || cb.type !== 'checkbox' || cb.dataset.pid == null) return;
    const p = (MODEL || []).find(x => String(x.pid) === String(cb.dataset.pid));
    if (!p) return;
    $('tblMed').querySelectorAll('[data-pid="' + cb.dataset.pid + '"]').forEach(td => td.classList.toggle('med-hl', cb.checked));
    writeLunchMed([{ rid: p.rid, masterId: p.masterId, name: p.name }], cb.checked);
  };
  // 全解除＝チェック済み全員の lunchMed を false に（全端末へ反映＝破壊的操作のため確認を挟む・HIG）
  const clr = el('button', 'chk-clear', '全解除');
  clr.type = 'button';
  clr.onclick = () => {
    const checked = [...chk.querySelectorAll('input[type=checkbox]:checked')];
    if (!checked.length) { toast('チェックされている方はいません'); return; }
    if (!confirm(checked.length + '名の昼食薬チェックを解除します（全端末に反映されます）。よろしいですか？')) return;
    const items = checked.map(c => (MODEL || []).find(x => String(x.pid) === String(c.dataset.pid)))
      .filter(Boolean).map(p => ({ rid: p.rid, masterId: p.masterId, name: p.name }));
    writeLunchMed(items, false);
  };
  chk.appendChild(clr);
}

/* ============================================================================
   View 4 — 週間名簿（A4縦×6・一括6枚印刷）
   B列=その日デイ利用 / C列=その日デイ非利用（＝2階食堂で昼食）。排他分割。

function weeklyTable(ppl, d) {

  hr.appendChild(el('td', 'wk-day', DAYS_JA[d] + '曜日'));
  hr.appendChild(el('td', 'wk-h', 'デイ'));
  hr.appendChild(el('td', 'wk-h', '２階'));
  tb.appendChild(hr);
  const a = onDay(ppl, d), b = offDay(ppl, d);
  const n = Math.max(a.length, b.length, 1);
  // 氏名セル: 入院者は他タブと同じく（入院）を付けて表示に残す（名簿から消さない）
  const cell = p => {
    const td = el('td');
    if (p) {
      td.appendChild(document.createTextNode(p.name));
      if (p.hosp) td.appendChild(el('span', 'hosp-tag', '（入院）'));
    }
    return td;
  };
  for (let i = 0; i < n; i++) {

    tr.appendChild(el('td', 'wk-blank', ''));

/* ============================================================================
   印刷 — タブごとに用紙を切り替える（動的 @page 注入）
   ============================================================================ */
const PRINT_SPEC = {
  'sc-roster':  null,                                              // 静的@page(A4縦8mm)をそのまま使う＝注入しない
  'sc-daylist': { size: 'A3 portrait',  margin: '8mm' },   /* 上段+下段で行数が多くA4横1枚に入らないためA3縦。備考は表の下＝横幅は全幅使用 */
  /* ★2026-08-05: 一度 A3縦へ広げたが、運用指示により A4横へ戻した。
     文字の拡大は「氏名が2行に折り返さない上限」で頭打ちになるため、A3の縦の余りは活かせない。
     印字可能幅は A3縦・A4横とも 1062px で同じ＝列幅の設計（時刻列の拡幅）はそのまま活きる。 */
  'sc-allweek': { size: 'A4 landscape', margin: '8mm' },
  'sc-med':     { size: 'A4 landscape', margin: '8mm' },
  'sc-weekly':  { size: 'A4 portrait',  margin: '15mm 5mm 0 5mm' }
