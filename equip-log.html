<style>
/* 設備・修繕の記録（2026-11-03 本人の決定）。色は採用管理と同じ濃さ（コントラスト7:1目標）。ライト固定。
   文字は 17px・押せる所は 44px 以上・フォーカスは 3px の枠。印刷はしない（画面と CSV だけ） */
:root{
  --pri:#0b57d0; --pri-l:#ecf3fe; --pri-d:#0842a0;
  --ok:#1e6b23; --ok-l:#e8f5e9; --ng:#b3261e; --ng-l:#fdecea;
  --warn-bg:#fdf3e3; --warn-tx:#8a5200;
  --g0:#f7f8f9; --g1:#f1f3f4; --g2:#e5e7ea; --g3:#d2d5d9;
  --g5:#6b7075; --g6:#5f6368; --g7:#4b4f52; --g9:#1f2124;
  --r:12px; --sh:0 1px 4px rgba(0,0,0,.10);
  --focus:#0b57d0;
}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  background:var(--g0); color:var(--g9); font-size:1.0625rem; line-height:1.6; padding-bottom:64px; overflow-wrap:anywhere}
button,input,select,textarea{font-family:inherit; font-size:1.0625rem; color:inherit}
button{cursor:pointer}
a{color:var(--pri-d)}
[hidden]{display:none !important}

/* ── 見出し ── */
.hdr{position:sticky; top:0; z-index:50; background:var(--pri); color:#fff; padding:8px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; box-shadow:var(--sh)}
.hdr h1{font-size:1.0625rem; margin:0; font-weight:700; flex:1; white-space:nowrap}
.hdr-btn{display:inline-flex; align-items:center; min-height:44px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.5);
  color:#fff; border-radius:8px; padding:6px 12px; font-size:1rem; text-decoration:none; white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.28)}
.hdr-btn:focus-visible{outline:3px solid #fff; outline-offset:1px}
.hdr .sync{font-size:0.9375rem; background:rgba(0,0,0,.22); padding:2px 10px; border-radius:14px; white-space:nowrap}
.hdr .sync:empty{display:none}

#e-main{max-width:1600px; margin:0 auto; padding:12px}
.cd{background:#fff; border-radius:var(--r); box-shadow:var(--sh); padding:14px; margin-bottom:12px; min-width:0}
h2{font-size:1.125rem; margin:0 0 10px}
h3{font-size:1.0625rem; margin:14px 0 6px}
.hint{color:var(--g7); margin:6px 0}
.muted{color:var(--g6)}
.msg{margin:8px 0; padding:8px 12px; border-radius:8px}
.msg:empty{display:none}
.msg.ng{background:var(--ng-l); color:var(--ng); border:1px solid var(--ng); font-weight:600}
.msg.ok{background:var(--ok-l); color:var(--ok); border:1px solid var(--ok)}
.msg.warn{background:var(--warn-bg); color:var(--warn-tx); border:1px solid var(--warn-tx); font-weight:600}
.msg.busy{background:var(--g1); color:var(--g9); border:1px solid var(--g5)}
.gate{font-size:1.125rem}
.gate p{margin:6px 0}
/* 準備中の帯（共通のデータベースに仕組みが無い間・保存できない） */
.band{margin:0 0 12px; padding:10px 14px; border-radius:10px; background:var(--warn-bg); color:var(--warn-tx); border:2px solid var(--warn-tx); font-weight:700}

/* ── ボタン ── */
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px; padding:8px 16px;
  border-radius:10px; border:1px solid var(--g5); background:#fff; color:var(--g9); font-weight:600; text-decoration:none}
.btn:hover{background:var(--g1)}
.btn.pri{background:var(--pri); border-color:var(--pri); color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ng{color:var(--ng); border-color:var(--ng)}
.btn.sm{padding:6px 10px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.acts{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

/* ── タブ ── */
.tabs{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px}
.tab{min-height:44px; padding:8px 14px; border-radius:10px; border:1px solid var(--g5); background:#fff; font-weight:600}
.tab[aria-selected="true"]{background:var(--pri); border-color:var(--pri); color:#fff}
/* 押している切替（階・付け先・場所）。色だけにしない: 地を塗り、文字の前に ✓ を付ける */
.btn[aria-pressed="true"]{background:var(--pri); border-color:var(--pri); color:#fff}
.btn[aria-pressed="true"]::before{content:"✓ "}

/* ── 上部の道具（検索1つ・どのタブからも押せる主ボタン・U1/U2） ── */
.tools{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:flex-end; margin:0 0 12px}
.tools .q{flex:1 1 280px}
.tools .hint{flex:1 1 100%; margin:0}

/* ── 絞り込み・入力 ── */
.bar{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:flex-end; margin:0 0 10px}
.fi{display:flex; flex-direction:column; gap:3px; min-width:0}
.fi label,.fl{font-weight:700; font-size:1rem}
.fi input,.fi select,.fi textarea{width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--g5); border-radius:8px; background:#fff; min-width:0}
.fi textarea{line-height:1.6; resize:vertical; min-height:88px}
.fi input[aria-invalid="true"]{border:2px solid var(--ng)}
.fgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr)); gap:10px 12px; margin:0 0 8px}
.dt{display:flex; gap:6px}
.dt input{flex:1}
.chk{display:flex; align-items:center; gap:8px; min-height:44px; font-weight:600; cursor:pointer}
.chk input{width:24px; height:24px; flex:0 0 auto}

/* ── 表 ── */
.tbl{width:100%; border-collapse:collapse; background:#fff}
.tbl th,.tbl td{border:1px solid var(--g3); padding:6px 8px; text-align:left; vertical-align:top}
.tbl th{background:var(--g1)}
.tbl td.num,.tbl th.num{text-align:right; white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.tbl caption{text-align:left; font-weight:700; padding:4px 0}
.tbl tr.cxl td{color:var(--g6); background:var(--g0)}
.tbl tr.cxl td.amt{text-decoration:line-through}
.tbl tr.retired td{color:var(--g6)}
.tag{display:inline-block; border-radius:999px; padding:1px 10px; font-weight:700; font-size:0.9375rem; line-height:1.5; border:1px solid var(--g5); background:var(--g1); color:var(--g7)}
.tag.cxl{border-color:var(--g7)}
.tag.over{background:var(--ng-l); color:var(--ng); border-color:var(--ng)}
.tag.soon{background:var(--warn-bg); color:var(--warn-tx); border-color:var(--warn-tx)}
.tag.okk{background:var(--ok-l); color:var(--ok); border-color:var(--ok)}
tr.over td{background:var(--ng-l)}
tr.soon td{background:var(--warn-bg)}

/* ── 図面 ── */
.mapw{display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,420px); gap:12px; align-items:start}
.floors{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px}
.plan{display:grid; gap:4px; background:var(--g1); border:1px solid var(--g3); border-radius:10px; padding:6px; min-width:0}
.pl{min-height:44px; min-width:44px; border:2px solid var(--g5); border-radius:8px; background:#fff; color:var(--g9); font-weight:700; padding:4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; overflow-wrap:anywhere}
.pl.area{background:var(--g2)}
.pl[aria-pressed="true"]{border-color:var(--pri); background:var(--pri-l); color:var(--pri-d); box-shadow:inset 0 0 0 2px var(--pri)}
.pl .cnt{font-weight:600; font-size:0.875rem; color:var(--g7)}
/* 図面の印（U3）: 色だけにしない（記号と文字を必ず添える）。期限切れ＝赤系・修理中＝黄系 */
.mk{display:inline-block; border-radius:6px; padding:0 6px; font-size:0.9375rem; font-weight:700; line-height:1.5; border:1px solid}
.mk.over{background:var(--ng-l); color:var(--ng); border-color:var(--ng)}
.mk.rep{background:var(--warn-bg); color:var(--warn-tx); border-color:var(--warn-tx)}
.pl.has-over{border-color:var(--ng)}
.legend{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--g7)}
.legend .cnt{font-weight:700; color:var(--g7)}
.others{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
.side{position:sticky; top:72px}
.side .list,.dlg-in .list{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.side .list li,.dlg-in .list li{border:1px solid var(--g3); border-radius:10px; padding:8px 10px}
.side .list li.cxl,.dlg-in .list li.cxl{color:var(--g6); background:var(--g0)}

/* ── 窓（入力・確かめ） ── */
.dlg{border:0; border-radius:14px; padding:0; max-width:min(94vw,760px); width:100%; box-shadow:0 12px 40px rgba(0,0,0,.25); color:var(--g9)}
.dlg::backdrop{background:rgba(0,0,0,.4)}
.dlg-in{padding:18px 20px 16px; max-height:86vh; overflow-y:auto}
.dlg-in h2{margin:0 0 8px}
.dlg-in p{margin:0 0 6px}
.dlg-btns{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-top:12px}
.files{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.files li{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; border:1px solid var(--g3); border-radius:10px; padding:6px 10px}
.files .fn{flex:1 1 200px; min-width:0}
/* 設備のカルテ（U7）・業者のその場の追加（U4）・閉じる前の確かめ（U5） */
.kv{display:grid; grid-template-columns:max-content minmax(0,1fr); gap:4px 14px; margin:0 0 8px}
.kv dt{font-weight:700; color:var(--g7)}
.kv dd{margin:0; min-width:0}
.vq{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin:6px 0 0; padding:8px; border:1px solid var(--g5); border-radius:10px}
.vq .fi{flex:1 1 180px}
.ask{margin:12px 0 0; padding:10px 12px; border:2px solid var(--warn-tx); background:var(--warn-bg); color:var(--warn-tx); border-radius:10px; font-weight:700}
.ask p{margin:0 0 8px}
.ask .acts{justify-content:flex-end}
.guide{margin:6px 0; padding:12px 14px; border:1px dashed var(--g5); border-radius:10px}
.guide p{margin:0 0 8px}
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--g9); color:#fff;
  padding:10px 18px; border-radius:22px; font-size:1rem; z-index:200; opacity:0; transition:.25s; pointer-events:none; max-width:90%; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* ── iPad 縦・iPhone（899px 以下）: 図面の右の欄は下へ ── */
@media (max-width:899px){
  .mapw{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  /* 一覧の表は1件1枚の札にする（見出し：値 の行）。見出しは td の data-label から出す・横にはみ出さない */
  .tbl-wrap{overflow-x:visible}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block; width:100%}
  .tbl caption{display:block}
  .tbl thead{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}
  .tbl tr{border:1px solid var(--g3); border-radius:10px; margin:0 0 8px; overflow:hidden}
  .tbl th,.tbl td{border:0; border-top:1px solid var(--g2)}
  .tbl td:first-child{border-top:0}
  .tbl td{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,3fr); gap:4px 10px; padding:6px 10px}
  .tbl td::before{content:attr(data-label); font-weight:700; color:var(--g7)}
  .tbl td[colspan]{display:block}
  .tbl td.num,.tbl th.num{text-align:left; white-space:normal}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dd{margin:0 0 6px}
}
@media (max-width:700px){
  input,select,textarea{font-size:16px}
  .tab{padding:8px 10px}
}
@media print{
  .hdr{position:static}
  #toast,.dlg{display:none !important}
}
/* 初回の案内の帯（su-intro.js）は、現場端末などの止めの案内を出している間は出さない（個別機能訓練計画書と同じ・代表者の決定 2026-11-13・仮置き） */
body:has(#e-gate:not([hidden])) .sui-band{display:none}

<body>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   設備・修繕の記録（2026-11-03 本人の決定「1〜10 は推奨案のまま・11 を追加」）
   - 記録の正本は共通ログインのデータベース（care-backend の設備・修繕の移行・eq_*）。この画面は RPC（eq_*）で読み書きする。添付の台帳（eq_files）だけは採用管理（ats_files）と同じく表を読むだけで使う（RLS で事務所・管理者・自分の事業者に絞る・書くのは関数だけ）
     （読み書きできるのは事務所・管理者だけ。最終の判定はデータベースの RLS と RPC）
   - 事務所PCだけ。現場端末（su_device_role==='field'）では何も取りに行かず、案内だけを出す（ログインの部品も読まない）
   - 開く前にログインの役割を確かめる（su-app-gate.js の 'equip-log'）。開けない時は何も読まない
   - 端末に残すのは UI の状態だけ: localStorage の eql_tab（タブ）・eql_floor（図面の階）・eql_filter（対応の記録の絞り込み）。
     ほかに、メニューのタイルの札に出す件数だけを eql_menu_due に残す（期限切れ・30日以内・法定の期限切れの数と数えた日・設備名と場所は残さない・2026-11-13）。
     読む時は既知の値だけを戻す（EquipCalc.restoreUiState）。記録・業者・氏名は端末に置かない
   - 図面は施設情報の間取り（SUFacility.roomPlan）の部屋番号と名前の箱だけを使う。入居者の名簿は読まない（氏名を出さない）
   - 施設名・事業所名はコードに書かず、施設情報（SUFacility.officeName）から読む
   - 保存は版（rev）で弾く。他で直されていたら行を差し替えて「他で直されました。読み直してください」と出す（採用管理と同じ）
   - データベースに仕組みがまだ無い時（関数・表が無い）は「準備中」の帯を出し、保存・追加・取り消し・項目の設定を押せなくする
   - 描画はすべて esc() を通す（数字・日付も）
   ═══════════════════════════════════════════════════════════════ */
var DEVICE_KEY='su_device_role';
var FILE_BUCKET='eq-files';
var FILE_LINK_SEC=120;
var FILE_MAX=10485760;
var FILE_TYPES={'image/jpeg':'jpg','image/png':'png','application/pdf':'pdf'};
var RELOAD_AFTER_MS=60000;
var NODB_TEXT='準備中：共通のデータベースに「設備・修繕の記録」の仕組みがまだ入っていません。見ることはできますが、保存・追加・取り消し・項目の設定はできません。管理者に知らせてください。';
var CONFLICT_TEXT='他で直されました。読み直してください';

var gen=0;              // 世代。用途が現場に変わった・読み直した時に進め、出した時と違う応答は捨てる
var view='';            // 'field' | 'gate' | 'app'
var dbState='idle';     // 'loading' | 'ok' | 'nodb'（共通 DB に eq_* がまだ）| 'error'
var data={assets:[],events:[],vendors:[],places:[],fields:[],files:[]};   // メモリだけ
var plan=null;          // 間取り（SUFacility.roomPlan の写し）
var tab='map';
var floor='';
var filter={etype:'',kind:'',place:'',vendor:'',fy:''};
var selPlace='';        // 図面で選んでいる場所の鍵（メモリだけ）
var fieldTarget='event';// 項目の設定で見ている付け先（メモリだけ）
var costFy=null;        // 費用で見ている年度（メモリだけ）
var form=null;          // 開いている窓の状態 {kind, row, rev, dirty, busy}
var loadedAt=0;
var upBusy=false;
var filesFor='';        // 添付を読んでいる記録の id
var filesState='idle';  // 'loading' | 'ok' | 'nodb' | 'error'
var delAsk='';         // 「外す」を1回押して確認を待っている添付の id（置き場の中身は元に戻せないため2段で押す）

var lastEv={etype:'',vendor_id:null};   // 直前に保存した記録の種類・業者（次の新しい記録の初期値・メモリだけ）
var askFor=null;        // 保存していない入力を閉じる前の確かめ中なら、閉じた後にすること（''＝閉じるだけ・タブの名前＝そのタブへ）。確かめていない時は null
var vqOpen='';          // 業者をその場で足す欄を開いている選択の id（'v-vendor' | 'a-vendor'）
var cardFor='';         // カルテを開いている設備の id
var cardState='idle';   // カルテの添付の数: 'loading' | 'ok' | 'nodb' | 'error'
var cardFiles={};       // カルテの記録ごとの添付の数 {記録の id: 件数}（メモリだけ）
var VQ_LABEL={'v-vendor':'業者','a-vendor':'購入先の業者'};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},3200)}
function setSync(t){var e=$('e-sync');if(e)e.textContent=t||''}
function setMsg(t,kind){var e=$('e-msg');if(!e)return;e.className='msg'+(t?' '+(kind||'ng'):'');e.textContent=t||''}
/* 黙って捨てると後で原因が追えない失敗だけを記録に残す（画面には出さない・su-errors の note） */
/* 共通 DB が {ok:false,error} を返した時の言葉。直らない原因なので記録にも残す */
var NG_TEXT={notfound:'この行は見つかりませんでした。画面を読み直してください。',noasset:'選んだ設備が見つかりませんでした。読み直してから選び直してください。',cancelled:'取り消した記録は直せません。',in_use:'使っている所があるので、この操作はできません。',badkey:'入力の項目が今の設定と合いません。読み直してください。'};
function ngAnswer_(where,d){
  var code=d&&typeof d.error==='string'?d.error:'';
  eqNote_(where,{message:'ok:false '+(code||'no-error')});
  return NG_TEXT[code]||'保存できませんでした。もう一度試してください。';
}
function eqNote_(where,e){ try{ if(window.SUErrors&&typeof window.SUErrors.note==='function') window.SUErrors.note('設備・修繕の記録', e, 'equip:'+where); }catch(_){} }
function getDeviceRole(){try{return localStorage.getItem(DEVICE_KEY)||'office'}catch(e){return'office'}}
function isField(){return getDeviceRole()==='field'}
function today_(){return EquipCalc.todayJST()}
function canWrite_(){return dbState==='ok'}
function dis_(){return canWrite_()?'':' disabled'}
function noDb_(e){ var c=e&&e.code; return c==='42P01'||c==='PGRST205'||c==='PGRST202'; }
/* データベースの断りを職員に分かる言葉にする（コード・技術用語を出さない） */
function friendly_(e){
  var code=e&&e.code, m=String(e&&e.message||e||'');
  if(code==='42501'||/permission denied|row-level security/i.test(m)) return 'この操作をする権限がありません。事務所・管理者のアカウントでログインしているか確かめてください。';
  if(code==='23514') return '入れた文字が長すぎるか、値の形が違います。入れた値を確かめてください。';
  if(code==='22023') return '入れた値を受け付けられませんでした。項目の設定と入れた値を確かめてください。';
  if(noDb_(e)) return '共通のデータベースに設備・修繕の記録の仕組みがまだありません（データベースの更新が必要です）。管理者に知らせてください。';
  if(/failed to fetch|network|load failed|timeout|タイムアウト/i.test(m)) return '通信できませんでした。電波・Wi-Fi を確かめてから、もう一度試してください。';
  return 'うまくいきませんでした。少し待ってから、もう一度試してください。';
}
function officeName_(k){
  var ks=EquipCalc.OFFICE_KINDS;
  for(var i=0;i<ks.length;i++) if(ks[i].code===k){ try{ return window.SUFacility?window.SUFacility.officeName(ks[i].fac):ks[i].fac; }catch(e){ return ks[i].fac; } }
  return '（事業所なし）';
}
function yen_(n){ var v=Number(n); return (isFinite(v)?Math.floor(v):0).toLocaleString('ja-JP')+'円'; }

/* データベースの窓口。通信は rpc_ と保管庫（db_().storage）だけを通す */
function db_(){ return window.SUAuth.client(); }
function rpc_(name,args){
  return Promise.resolve().then(function(){ return db_().rpc(name,args||{}); }).then(function(r){
    if(r&&r.error) throw r.error;
    return r?r.data:null;
  });
}

/* ═══════════ 起動・端末の用途・ログインの役割 ═══════════ */
function showFieldOnly_(){
  view='field';
  $('e-app').hidden=true;
  var g=$('e-gate'); g.hidden=false;
  g.innerHTML='<h2>この画面は事務所のパソコンで使います</h2><p>この端末は「現場」として設定されているため、設備・修繕の記録は開きません。</p><p><a class="btn" href="index.html">メニューへ戻る</a></p>';
}
function boot_(){
  gen++;
  if(isField()){ showFieldOnly_(); return Promise.resolve('field'); }
  /* ログインの役割の確かめ（su-app-gate.js・代表者の決定 2026-10-29）。端末の用途の止めの後・記録を読む前に確かめる。
     開けない時（現場のアカウント・ログインなし・確かめられない）は何も読まず、覆いの画面だけを出す。部品が読めない時も開かない */
  if(!window.SUAppGate){
    document.body.textContent='';
    var gp=document.createElement('p'); gp.textContent='ログインを確かめる部品を読み込めませんでした。ページを読み込み直してください。';
    document.body.appendChild(gp);
    return Promise.resolve('nogate');
  }
  return window.SUAppGate.run('equip-log',{dirty:function(){ return isDirty_(); }}).then(function(ok){
    if(!ok){ view='gate'; return 'gate'; }
    return startApp_();
  });
}
function startApp_(){
  view='app';
  $('e-gate').hidden=true; $('e-app').hidden=false;
  readPlan_();
  restoreUi_();
  paintAll_();
  try{ if(window.SUPerf) window.SUPerf.ready(); }catch(e){ eqNote_('速さの記録', e); }
  return loadAll_().then(function(){ return 'app'; });
}
function readPlan_(){
  plan=null;
  try{ var p=window.SUFacility&&window.SUFacility.roomPlan(); if(p&&typeof p==='object') plan=p; }catch(e){ eqNote_('間取りの読込', e); }
}
function planFloors_(){ return plan?Object.keys(plan).filter(function(k){ return plan[k]&&Array.isArray(plan[k].cells); }):[]; }
/* 全部を読み直す（設備・記録・業者・場所・項目） */
function loadAll_(){
  var my=gen;
  dbState='loading';
  setSync('読み込んでいます…');
  return rpc_('eq_list',{p_kind:null}).then(function(d){
    if(my!==gen) return;
    if(!d||d.ok!==true) throw {message:'bad answer'};
    data=normList_(d);
    dbState='ok'; loadedAt=Date.now();
    setSync(''); setMsg('');
    paintBand_(); paintAll_();
  })['catch'](function(e){
    if(my!==gen) return;
    setSync('');
    if(noDb_(e)){ dbState='nodb'; data={assets:[],events:[],vendors:[],places:[],fields:[],files:[]}; paintBand_(); paintAll_(); return; }
    dbState='error';
    eqNote_('読み込み', e);
    paintBand_(); paintAll_();
    setMsg(friendly_(e)+'（「読み直す」で、もう一度読みます）','ng');
  });
}
/* 受け取った一覧を守りの形にする（配列でない・行でない物は捨てる） */
function normList_(d){
  function arr(v){ return Array.isArray(v)?v.filter(function(x){ return x&&typeof x==='object'&&x.id!=null; }):[]; }
  /* 添付の台帳は一覧に入らない（記録を開いた時に eq_files から読む） */
  return {assets:arr(d.assets),events:arr(d.events),vendors:arr(d.vendors),places:arr(d.places),fields:arr(d.fields),files:[]};
}
function paintBand_(){
  var b=$('e-band'); if(!b) return;
  if(dbState==='nodb'){ b.hidden=false; b.textContent=NODB_TEXT; }
  else{ b.hidden=true; b.textContent=''; }
}
/* 開いたまま別のタブで用途が現場用に変わった時：世代を進め、中身を消してから読み込み直す（起動時の守りに任せる） */
function onStorage_(e){
  if(!e||e.key!==DEVICE_KEY) return;
  if(e.newValue==='field'){
    gen++; data={assets:[],events:[],vendors:[],places:[],fields:[],files:[]}; form=null;
    try{ ['p-map','p-assets','p-events','p-sched','p-cost','p-vendors','p-fields'].forEach(function(id){ var x=$(id); if(x) x.innerHTML=''; }); }catch(_){}
    try{ location.reload(); }catch(err){ eqNote_('読み込み直し', err); }
  }
}
/* 画面に戻った時、窓を開いていなければ 1 分ごとまで読み直す（ほかの PC で直した分を取り込む・正本はデータベース） */
function onVisible_(){
  if(view!=='app'||document.hidden||form||dbState==='loading') return;
  if(Date.now()-loadedAt<RELOAD_AFTER_MS) return;
  loadAll_();
}
function isDirty_(){ return !!(form&&(form.dirty||form.busy))||upBusy; }

/* ═══════════ 端末に残す UI の状態（eql_ だけ・既知の値だけ戻す） ═══════════ */
function restoreUi_(){
  var raw={};
  try{ raw={tab:localStorage.getItem('eql_tab'),floor:localStorage.getItem('eql_floor'),filter:localStorage.getItem('eql_filter')}; }catch(e){ raw={}; }
  var r=EquipCalc.restoreUiState(raw,{floors:planFloors_()});
  tab=r.tab; floor=r.floor; filter=r.filter;
}
function saveTab_(){ try{ localStorage.setItem('eql_tab',tab); }catch(e){ eqNote_('タブの保存', e); } }
function saveFloor_(){ try{ localStorage.setItem('eql_floor',floor); }catch(e){ eqNote_('階の保存', e); } }
function saveFilter_(){ try{ localStorage.setItem('eql_filter',JSON.stringify({etype:filter.etype,kind:filter.kind,fy:filter.fy})); }catch(e){ eqNote_('絞り込みの保存', e); } }

/* ═══════════ 行を探す・差し替える ═══════════ */
function byId_(list,id){ for(var i=0;i<list.length;i++) if(list[i]&&String(list[i].id)===String(id)) return list[i]; return null; }
function upsert_(name,row){
  if(!row||row.id==null) return;
  var list=data[name];
  for(var i=0;i<list.length;i++) if(String(list[i].id)===String(row.id)){ list[i]=row; return; }
  list.push(row);
}
function placeName_(key){ return EquipCalc.placeLabel(key,data.places,plan); }
function assetName_(id){ var a=id==null?null:byId_(data.assets,id); return a?String(a.name||''):''; }
function vendorName_(id){ var v=id==null?null:byId_(data.vendors,id); return v?String(v.name||''):''; }
function catLabel_(c){ return EquipCalc.labelOf(EquipCalc.CATEGORIES,c); }
function typeLabel_(c){ return EquipCalc.labelOf(EquipCalc.EVENT_TYPES,c); }
function statusLabel_(c){ return EquipCalc.labelOf(EquipCalc.STATUSES,c); }
/* 全部の場所（図面の箱＋その他の場所）{key,label} */
function allPlaces_(){
  var out=[], seen={};
  planFloors_().forEach(function(k){ plan[k].cells.forEach(function(c){ var key=EquipCalc.placeKeyOf(c,k); if(key&&!seen[key]){ seen[key]=1; out.push({key:key,label:placeName_(key)}); } }); });
  data.places.slice().sort(function(a,b){ return (Number(a.sort)||0)-(Number(b.sort)||0); }).forEach(function(p){ var key=EquipCalc.placeKeyOf({id:p.id}); if(!seen[key]){ seen[key]=1; out.push({key:key,label:String(p.name||'')}); } });
  return out;
}

/* ═══════════ 描画 ═══════════ */
function paintAll_(){
  if(view!=='app') return;
  EquipCalc.TABS.forEach(function(t){
    var b=$('t-'+t), p=$('p-'+t);
    if(b) b.setAttribute('aria-selected',t===tab?'true':'false');
    if(p) p.hidden=(t!==tab);
  });
  paintTools_();
  var p=$('p-'+tab); if(!p) return;
  if(tab==='map') p.innerHTML=mapHtml_();
  else if(tab==='assets') p.innerHTML=assetsHtml_();
  else if(tab==='events') p.innerHTML=eventsHtml_();
  else if(tab==='sched') p.innerHTML=schedHtml_();
  else if(tab==='cost') p.innerHTML=costHtml_();
  else if(tab==='vendors') p.innerHTML=vendorsHtml_();
  else if(tab==='fields') p.innerHTML=fieldsHtml_();
  saveMenuDue_();
}
/* メニューのタイルの札に出す件数を端末に残す（2026-11-13 代表者の指示・個別機能訓練計画書の札と同じ作り）。
   ★残すのは件数と数えた日だけ（EquipCalc.menuDueSummary）。設備名・場所・業者は残さない。
   ★鍵は eql_menu_due（メニューの定義の due と同じ名前）。書くのはデータベースから読めている時（dbState==='ok'）だけ。準備中・読み込めない時は前の件数を0件で上書きしない。
     読めた時の0件は書く（直した後に札が消えるように）。保存・取り消し・廃棄の後も描き直しのたびに数え直し、変わった時だけ書く */
function saveMenuDue_(){
  try{
    if(view!=='app'||dbState!=='ok'||isField()) return;
    var sum=EquipCalc.menuDueSummary(data.assets,data.events,data.fields,EquipCalc.todayJST());
    if(!sum) return;
    var v=JSON.stringify(sum);
    if(localStorage.getItem('eql_menu_due')!==v) localStorage.setItem('eql_menu_due',v);
  }catch(e){ eqNote_('メニューの札の件数の保存', e); }
}
/* どのタブからも押せる主ボタン（U1）。準備中・読み込めていない時は押せない。図面で場所を選んでいれば名前に添える */
function paintTools_(){
  var ae=$('e-add-ev'), aa=$('e-add-as'), at=selPlace?'（'+placeName_(selPlace)+'）':'';
  if(ae){ ae.disabled=!canWrite_(); ae.textContent='＋ 記録を足す'+at; }
  if(aa){ aa.disabled=!canWrite_(); aa.textContent='＋ 設備を足す'+at; }
}
function ctx_(){ return {vendors:data.vendors,fields:data.fields,assets:data.assets,events:data.events}; }
function hasQuery_(){ return EquipCalc.queryTerms(query).length>0; }
/* 検索で絞っている時の知らせ（件数と「検索を消す」） */
function qHint_(n){
  if(!hasQuery_()) return '';
  return '<p class="hint" role="status">「'+esc(query)+'」で絞り込み中：'+esc(n)+'件 <button type="button" class="btn sm" data-act="q-clear">検索を消す</button></p>';
}
/* 表の1マス。札の表示（幅 900px 未満）の見出しを data-label に持たせる。inner は esc 済みの文字だけを渡す */
function td_(label,inner,cls){ return '<td data-label="'+esc(label)+'"'+(cls?' class="'+esc(cls)+'"':'')+'><div class="v">'+inner+'</div></td>'; }
/* 空の時の案内（U6）: 短い説明と次に押すボタン */
function guide_(text,btn){ return '<div class="guide"><p>'+esc(text)+'</p>'+(btn?'<p class="acts">'+btn+'</p>':'')+'</div>'; }
function stateHtml_(){
  if(dbState==='loading') return '<p class="muted">読み込んでいます…</p>';
  if(dbState==='error') return '<p class="acts"><button type="button" class="btn" data-act="reload">読み直す</button></p>';
  return '';
}
function extraCols_(target,rows){
  return EquipCalc.fieldsFor(data.fields,target).filter(function(f){
    if(!f.disabled) return true;
    return rows.some(function(r){ return r.extra&&Object.prototype.hasOwnProperty.call(r.extra,String(f.id)); });
  });
}
function extraVal_(row,f){ var x=row&&row.extra; var v=x&&typeof x==='object'?x[String(f.id)]:null; return v==null?'':v; }

/* ── 図面 ── */
function mapHtml_(){
  var fl=planFloors_(), h='<h2>図面</h2>'+stateHtml_();
  if(hasQuery_()) h+='<p class="hint" role="status">「'+esc(query)+'」の検索は、設備・対応の記録・予定の一覧で効きます。 <button type="button" class="btn sm" data-tab="assets">設備の一覧で見る</button> <button type="button" class="btn sm" data-tab="events">対応の記録で見る</button></p>';
  h+='<div class="mapw"><div>';
  if(!fl.length) h+='<p class="hint">施設情報に間取り図がありません。図面に無い場所は下の「その他の場所」に足せます。</p>';
  else{
    if(fl.indexOf(floor)<0) floor=fl[0];
    h+='<div class="floors" role="group" aria-label="階">'+fl.map(function(k){
      var t=EquipCalc.floorLabel(plan[k].title,k);
      return '<button type="button" class="btn sm" data-act="floor" data-floor="'+esc(k)+'" aria-pressed="'+(k===floor?'true':'false')+'">'+esc(t)+'</button>';
    }).join('')+'</div>';
    h+=planHtml_(plan[floor],floor);
    h+='<ul class="legend" aria-label="図面の印の意味"><li><span class="cnt">設備 N</span> その場所の設備の数（廃棄を除く）</li>'+
      '<li><span class="mk over">！期限切れ</span> 点検・清掃などの予定日を過ぎている</li><li><span class="mk rep">修理中</span> 状態が「修理中」の設備がある</li>'+
      '<li>太い枠と色の地 ＝ 選んでいる場所</li></ul>';
  }
  h+='<h3>その他の場所</h3>';
  var ps=data.places.slice().sort(function(a,b){ return (Number(a.sort)||0)-(Number(b.sort)||0); });
  h+='<div class="others">'+(ps.length?ps.map(function(p){
    var key=EquipCalc.placeKeyOf({id:p.id});
    return '<button type="button" class="btn sm" data-act="place" data-key="'+esc(key)+'" aria-pressed="'+(key===selPlace?'true':'false')+'">'+esc(p.name)+'（'+esc(officeName_(p.kind))+'）</button>';
  }).join(''):'<span class="muted">まだありません。</span>')+'</div>';
  h+='<p class="acts"><button type="button" class="btn" data-act="place-new"'+dis_()+'>場所を足す</button></p>';
  h+='</div><aside class="side cd" aria-live="polite">'+sideHtml_()+'</aside></div>';
  return h;
}
function n_(v,max){ var n=Math.floor(Number(v)); return isFinite(n)&&n>=0&&n<=max?n:0; }
function planHtml_(p,fk){
  if(!p||!Array.isArray(p.cells)) return '';
  var cols=Array.isArray(p.cols)&&p.cols.length?p.cols:[1], rows=Array.isArray(p.rows)&&p.rows.length?p.rows:[1];
  var gc=cols.map(function(w){ return 'minmax(0,'+Math.max(1,n_(w,9999))+'fr)'; }).join(' ');
  var gr=rows.map(function(){ return 'minmax(48px,auto)'; }).join(' ');
  var marks=EquipCalc.placeMarks(data.assets,data.events,today_());
  return '<div class="plan" style="grid-template-columns:'+esc(gc)+';grid-template-rows:'+esc(gr)+'">'+p.cells.map(function(c){
    var key=EquipCalc.placeKeyOf(c,fk); if(!key) return '';
    var area=key.indexOf('area:')===0;
    var st='grid-row:'+Math.max(1,n_(c.r,99))+' / span '+Math.max(1,n_(c.rs,99))+';grid-column:'+Math.max(1,n_(c.c,99))+' / span '+Math.max(1,n_(c.cs,99));
    var m=marks[key]||{count:0,overdue:false,repairing:false};
    return '<button type="button" class="pl'+(area?' area':'')+(m.overdue?' has-over':'')+'" style="'+esc(st)+'" data-act="place" data-key="'+esc(key)+'" aria-pressed="'+(key===selPlace?'true':'false')+'">'+
      '<span>'+esc(area?String(c.t).trim():EquipCalc.placeLabel(key))+'</span>'+(m.count?'<span class="cnt">設備 '+esc(m.count)+'</span>':'')+
      (m.overdue?'<span class="mk over">！期限切れ</span>':'')+(m.repairing?'<span class="mk rep">修理中</span>':'')+'</button>';
  }).join('')+'</div>';
}
function sideHtml_(){
  if(!selPlace) return '<h2>場所を選んでください</h2><p class="hint">図面の部屋・名前の箱、または「その他の場所」を押すと、その場所の設備と最近の記録が出ます。</p>';

/* ── 対応の記録（時系列・絞り込み） ── */
function filteredEvents_(){
  var cx=ctx_();
  return EquipCalc.sortEvents(data.events).filter(function(e){
    if(filter.etype&&e.etype!==filter.etype) return false;
    if(filter.kind&&EquipCalc.eventOffice(e,data.assets,data.places)!==filter.kind) return false;
    if(filter.place&&e.place_key!==filter.place) return false;
    if(filter.vendor&&String(e.vendor_id==null?'':e.vendor_id)!==filter.vendor) return false;
    if(filter.fy&&String(EquipCalc.fiscalYearOf(EquipCalc.effectiveDate(e)))!==filter.fy) return false;
    return EquipCalc.matchEvent(e,query,cx);
  });
}
function fyOptions_(){
  var ys={}; ys[EquipCalc.fiscalYearOf(today_())]=1;
  data.events.forEach(function(e){ var y=EquipCalc.fiscalYearOf(EquipCalc.effectiveDate(e)); if(y) ys[y]=1; });
  return Object.keys(ys).map(Number).sort(function(a,b){ return b-a; });
}
function opt_(v,label,cur){ return '<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+esc(label)+'</option>'; }

  h+=rows.map(function(e){
    var c=!!e.cancelled_at, d=EquipCalc.effectiveDate(e);

/* ── 費用（年度・事業所・種類・業者の合計・日付なし・CSV） ── */
function costHtml_(){
  var ys=fyOptions_();
  if(costFy==null||ys.indexOf(costFy)<0) costFy=EquipCalc.fiscalYearOf(today_());
  var s=EquipCalc.summarize(data.events,costFy,{assets:data.assets,places:data.places});
  var h='<h2>費用</h2>'+stateHtml_()+'<p class="hint">税込の金額を、基準日（対応日 → 完了日 → 故障日）の年度（4月1日〜翌年3月31日）で数えます。取り消した記録は数えません。</p>';
  h+='<div class="bar"><div class="fi"><label for="c-fy">年度</label><select id="c-fy" data-act-change="cost-fy">'+ys.map(function(y){ return opt_(String(y),y+'年度（'+y+'年4月〜'+(y+1)+'年3月）',String(costFy)); }).join('')+'</select></div>'+
    '<button type="button" class="btn" data-act="csv">CSV に書き出す</button></div>';
  h+='<p><b>合計 '+esc(yen_(s.total.amount))+'</b>（'+esc(s.total.count)+'件）</p>';
  function tbl(cap,map,label){
    var ks=Object.keys(map).sort(function(a,b){ return map[b].amount-map[a].amount; });
    return '<div class="tbl-wrap"><table class="tbl"><caption>'+esc(cap)+'</caption><thead><tr><th scope="col">'+esc(cap.replace('ごと',''))+'</th><th scope="col" class="num">件数</th><th scope="col" class="num">金額</th></tr></thead><tbody>'+
      (ks.length?ks.map(function(k){ return '<tr>'+td_(cap.replace('ごと',''),esc(label(k)))+td_('件数',esc(map[k].count),'num')+td_('金額',esc(yen_(map[k].amount)),'num')+'</tr>'; }).join(''):'<tr><td colspan="3" class="muted">この年度の記録はありません。</td></tr>')+'</tbody></table></div>';
  }
  h+=tbl('事業所ごと',s.by_office,function(k){ return officeName_(k); });
  h+=tbl('種類ごと',s.by_kind,function(k){ return typeLabel_(k)||'（種類なし）'; });
  h+=tbl('業者ごと',s.by_vendor,function(k){ return k?(vendorName_(k)||'（見つからない業者）'):'（業者なし）'; });
  h+='<h3>日付なし</h3><p>故障日・対応日・完了日のどれも入っていない記録は、年度の合計に入れず別に数えます：<b>'+esc(s.undated.count)+'件・'+esc(yen_(s.undated.amount))+'</b></p>';
  return h;
}
function csvRows_(){
  return EquipCalc.sortEvents(data.events).filter(function(e){ return EquipCalc.fiscalYearOf(EquipCalc.effectiveDate(e))===costFy; }).reverse();
}
function downloadCsv_(){
  var text=EquipCalc.buildCsv(csvRows_(),{assets:data.assets,vendors:data.vendors,places:data.places,plan:plan,fields:data.fields,officeName:officeName_});
  try{
    var blob=new Blob([text],{type:'text/csv;charset=utf-8'}), url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download='equip-log-'+costFy+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){ eqNote_('CSV の後片付け', e); } },1000);
    toast('CSV を書き出しました（'+costFy+'年度）');
  }catch(e){ eqNote_('CSV', e); setMsg('CSV を書き出せませんでした。','ng'); }
  return text;
}

/* 増やした項目の入力欄（使わない項目は値がある時だけ・読むだけで出す） */
function extraInputsHtml_(target,row){
  var ex=row&&row.extra&&typeof row.extra==='object'?row.extra:{};
  var defs=EquipCalc.fieldsFor(data.fields,target);
  return defs.map(function(f,i){
    var id='fx-'+i, v=ex[String(f.id)], has=Object.prototype.hasOwnProperty.call(ex,String(f.id));
    if(f.disabled) return has?fiHtml_(id,f.name+'（使わない項目・変えられません）','<input id="'+id+'" type="text" value="'+esc(v)+'" readonly>'):'';
    if(f.ftype==='date') return dateHtml_(id,f.name,v);
    if(f.ftype==='number') return inputHtml_(id,f.name,v,'number',' inputmode="decimal" step="any"');
    if(f.ftype==='select'){
      var fo=Array.isArray(f.options)?f.options:[];
      var so=[['','（選ばない）']].concat(fo.map(function(o){ return [o,o]; }));
      // 選択肢から外した値も候補に残す（知らせなしに消さない）
      if(has&&v!=null&&String(v)!==''&&fo.map(String).indexOf(String(v))<0) so.push([v,v+'（今は無い選択肢）']);
      return selectHtml_(id,f.name,so,v);
    }
    return inputHtml_(id,f.name,v,'text',' maxlength="500"');
  }).join('');
}
function readExtra_(target){
  var out={};
  EquipCalc.fieldsFor(data.fields,target).forEach(function(f,i){
    if(f.disabled) return;   // 使わない項目は送らない（今の値は EquipCalc.validateExtra が残す）
    var e=$('fx-'+i); if(!e) return;
    var v=String(e.value==null?'':e.value);
    if(v.trim()!=='') out[String(f.id)]=v;
  });
  return out;
}
function val_(id){ var e=$(id); return e?String(e.value==null?'':e.value):''; }
function dateVal_(id){ var v=val_(id).trim(); return v||null; }
function openDlg_(html){
  var d=$('e-dlg'); if(!d) return;
  askFor=null;
  d.innerHTML='<div class="dlg-in">'+html+'</div>';
  try{ if(typeof d.showModal==='function'&&!d.open) d.showModal(); else d.setAttribute('open',''); }catch(e){ d.setAttribute('open',''); }
}
function closeDlg_(){
  var d=$('e-dlg'); form=null; askFor=null; vqOpen=''; cardFor='';
  if(!d) return;
  try{ if(typeof d.close==='function') d.close(); else d.removeAttribute('open'); }catch(e){ d.removeAttribute('open'); }
  d.innerHTML='';
}
function formMsg_(t,kind){ var e=$('d-msg'); if(!e) return; e.className='msg'+(t?' '+(kind||'ng'):''); e.textContent=t||''; }
function dlgBtns_(saveLabel){
  return '<p class="msg" id="d-msg" role="alert"></p><div class="ask" id="d-ask" role="alert" hidden></div><div class="dlg-btns"><button type="button" class="btn" data-act="dlg-close">閉じる</button>'+
    (saveLabel?'<button type="button" class="btn pri" data-act="dlg-save"'+dis_()+'>'+esc(saveLabel)+'</button>':'')+'</div>';

function placeOptions_(cur){
  var ps=allPlaces_();
  if(cur&&!ps.some(function(p){ return p.key===cur; })) ps.push({key:cur,label:placeName_(cur)});
  return [['','（選んでください）']].concat(ps.map(function(p){ return [p.key,p.label]; }));
}
/* 業者の選択（前に使った業者から選ぶ）＋「＋ 新しい業者」をその場で足す欄（U4）。id は VQ_LABEL の2つだけ */
function vendorField_(id,cur){ return '<div class="fi" id="'+esc(id)+'-w">'+vendorInner_(id,cur)+'</div>'; }
function vendorInner_(id,cur){
  var c=cur==null?'':String(cur);
  var h='<label for="'+esc(id)+'">'+esc(VQ_LABEL[id]||'業者')+'</label><select id="'+esc(id)+'">'+vendorOptions_(c).map(function(o){ return opt_(o[0],o[1],c); }).join('')+'</select>';
  if(vqOpen!==id) return h+'<button type="button" class="btn sm" data-act="vq-open" data-for="'+esc(id)+'"'+dis_()+'>＋ 新しい業者</button>';
  return h+'<div class="vq"><div class="fi"><label for="d-vq-name">新しい業者の名前</label><input id="d-vq-name" type="text" maxlength="80"></div>'+
    '<button type="button" class="btn sm pri" data-act="vq-save" data-for="'+esc(id)+'"'+dis_()+'>業者を足して選ぶ</button><button type="button" class="btn sm" data-act="vq-cancel" data-for="'+esc(id)+'">やめる</button>'+

/* 業者の欄だけを描き直す（ほかの入力欄はそのまま残す・選んでいる値も残す） */
function paintVendor_(id,cur){
  var w=$(id+'-w'); if(!w||!VQ_LABEL[id]) return;
  w.innerHTML=vendorInner_(id,cur);
  var sel=$(id); if(sel) sel.value=cur==null?'':String(cur);
}
function vqOpen_(id){

  var cur=val_(id); vqOpen=id; paintVendor_(id,cur);
  var n=$('d-vq-name'); if(n&&n.focus) n.focus();
  return true;
}
function vqCancel_(id){
  if(!VQ_LABEL[id]) return false;
  var cur=val_(id); vqOpen=''; paintVendor_(id,cur);

}
/* 名前だけで業者を保存し、選んだ状態に戻す。記録の入力は閉じない・消さない */
function vqSave_(id){
  if(!VQ_LABEL[id]||vqOpen!==id||!form||form.busy) return Promise.resolve(false);
  var m=$('d-vq-msg'), name=val_('d-vq-name').trim();
  function say(t,k){ if(m){ m.className='msg '+k; m.textContent=t; } }
  if(!canWrite_()){ say(dbState==='nodb'?NODB_TEXT:'読み込めていないため保存できません。','ng'); return Promise.resolve(false); }
  if(!name){ say('業者の名前を入れてください','ng'); return Promise.resolve(false); }
  var my=gen, f=form;
  say('業者を保存しています…','busy');
  return rpc_('eq_save_vendor',{p_row:{name:name,field:'',phone:'',contact:'',note:'',disabled:false},p_rev:null}).then(function(d){
    if(my!==gen||form!==f) return false;
    if(!d||d.ok!==true||!d.row){ say(ngAnswer_('eq_save_vendor',d),'ng'); return false; }
    upsert_('vendors',d.row);
    vqOpen=''; paintVendor_(id,String(d.row.id));
    f.dirty=true;
    formMsg_('業者「'+name+'」を足して選びました（記録はまだ保存していません）。','ok');
    return true;
  },function(e){
    if(my!==gen||form!==f) return false;
    eqNote_('業者のその場の追加', e);
    say(friendly_(e),'ng'); return false;
  });
}
function vendorOptions_(cur){
  return [['','（業者なし）']].concat(data.vendors.filter(function(v){ return !v.disabled||String(v.id)===String(cur); }).map(function(v){ return [String(v.id),String(v.name||'')]; }));
}

/* ── 設備のカルテ（読む画面・U7）: 基本情報・状態・次回予定日・保証の残り・累計費用・対応の時系列・添付の数 ── */
function warrantyHtml_(d){
  var n=EquipCalc.daysUntil(d,today_());
  if(n==null) return '（保証の終わりの日が入っていません）';
  if(n<0) return esc(d)+'まで <span class="tag over">保証切れ</span>（'+esc(-n)+'日前に終わりました）';
  if(n===0) return esc(d)+'まで <span class="tag soon">今日まで</span>';
  return esc(d)+'まで（あと'+esc(n)+'日）'+(n<=EquipCalc.SOON_DAYS?' <span class="tag soon">30日以内</span>':'');
}
function openCard_(id){
  var a=id!=null?byId_(data.assets,id):null;

function cardEventsHtml_(a){
  var list=EquipCalc.assetHistory(a,data.events).events;
  if(!list.length) return '<p class="muted">この設備の記録はまだありません。上の「＋ 記録を足す」で残せます。</p>';
  return '<ul class="list">'+list.map(function(e){
    var c=!!e.cancelled_at, n=cardFiles[String(e.id)]||0;
    var fl=cardState==='ok'?(n?'添付 '+n+'件':'添付なし'):cardState==='loading'?'添付を数えています…':cardState==='nodb'?'添付の置き場は準備中':'添付の数を読めませんでした';
    return '<li'+(c?' class="cxl"':'')+'>'+(c?'<span class="tag cxl">取り消し</span> ':'')+'<b>'+esc(EquipCalc.effectiveDate(e)||'日付なし')+'</b> '+esc(typeLabel_(e.etype))+'・'+esc(yen_(e.amount))+
      (e.vendor_id!=null?'・'+esc(vendorName_(e.vendor_id)):'')+'・'+esc(fl)+(e.body?'<br>'+esc(String(e.body).slice(0,120)):'')+
      '<div class="acts"><button type="button" class="btn sm" data-act="event-edit" data-id="'+esc(e.id)+'">開く</button></div></li>';
  }).join('')+'</ul>';
}
/* カルテの記録の添付の数を1回で読む（台帳 eq_files の id と記録の id だけ・表へは書かない） */
function loadCardFiles_(a){
  var my=gen, id=String(a.id), ids=EquipCalc.assetHistory(a,data.events).events.map(function(e){ return e.id; });
  if(!ids.length){ cardState='ok'; cardFiles={}; paintCard_(); return Promise.resolve(true); }
  return Promise.resolve().then(function(){ return db_().from('eq_files').select('id,event_id').in('event_id',ids); }).then(function(r){
    if(r&&r.error) throw r.error;
    if(my!==gen||cardFor!==id) return false;
    var c={};
    (Array.isArray(r&&r.data)?r.data:[]).forEach(function(x){ if(x&&x.event_id!=null){ var k=String(x.event_id); c[k]=(c[k]||0)+1; } });
    cardFiles=c; cardState='ok'; paintCard_();
    return true;
  })['catch'](function(e){
    if(my!==gen||cardFor!==id) return false;
    cardState=noDb_(e)?'nodb':'error';
    if(cardState==='error') eqNote_('添付の数', e);
    paintCard_();
    return false;
  });
}
function paintCard_(){ var c=$('d-card-ev'); if(c&&form&&form.kind==='card'&&String(form.row.id)===cardFor) c.innerHTML=cardEventsHtml_(form.row); }

function calcNext_(){
  var base=val_('a-purchased'), ev=null;
  if(form&&form.row&&form.row.id!=null){
    EquipCalc.sortEvents(data.events.filter(function(e){ return e.asset_id===form.row.id&&!e.cancelled_at; })).some(function(e){ if(EquipCalc.effectiveDate(e)){ ev=e; return true; } return false; });
    if(ev) base=EquipCalc.effectiveDate(ev);
  }
  var d=EquipCalc.nextDueDate(base,val_('a-interval'));
  if(!d){ formMsg_('周期（1〜120 の月数）と、購入日か記録の日付を入れてください。','warn'); return ''; }
  var e=$('a-next'); if(e) e.value=d;
  if(form) form.dirty=true;
  formMsg_('次回予定日を '+d+' にしました（まだ保存していません）。','ok');
  return d;
}
function collectAsset_(){
  var r=form.row, pr=EquipCalc.parseAmount(val_('a-price'));
  var row={kind:val_('a-kind'),place_key:val_('a-place'),place_name:placeName_(val_('a-place')),category:val_('a-category'),name:val_('a-name').trim(),
    maker:val_('a-maker').trim(),model:val_('a-model').trim(),serial:val_('a-serial').trim(),bought_on:dateVal_('a-purchased'),
    price:pr.ok?pr.value:null,vendor_id:val_('a-vendor')||null,warranty_until:dateVal_('a-warranty'),
    cycle_months:val_('a-interval')?Number(val_('a-interval')):null,next_due:dateVal_('a-next'),status:val_('a-status')||'active',note:val_('a-memo')};
  if(r.id!=null) row.id=r.id;
  var errs=[];
  if(!row.name) errs.push('名前を入れてください');
  if(!row.place_key) errs.push('場所を選んでください');
  if(!pr.ok) errs.push('購入金額は 0 以上の整数（円）で入れてください');
  if(row.cycle_months!=null&&!(Math.floor(row.cycle_months)===row.cycle_months&&row.cycle_months>=1&&row.cycle_months<=120)) errs.push('周期は 1〜120 の月数で入れてください');
  var v=EquipCalc.validateExtra(readExtra_('asset'),data.fields,'asset',r.extra||{});
  v.errors.forEach(function(x){ errs.push(x.msg); });
  row.extra=v.value;
  return {row:row,errs:errs};
}

/* ═══════════ 保存（版で弾く・他で直されたら差し替える） ═══════════ */
var SAVE_RPC={asset:['eq_save_asset','assets'],event:['eq_save_event','events'],vendor:['eq_save_vendor','vendors'],place:['eq_save_place','places'],field:['eq_save_field','fields']};
function saveForm_(){
  if(!form||form.busy) return Promise.resolve(false);
  if(!canWrite_()){ formMsg_(dbState==='nodb'?NODB_TEXT:'読み込めていないため保存できません。','ng'); return Promise.resolve(false); }
  var c;
  if(form.kind==='asset') c=collectAsset_();
  else if(form.kind==='event') c=collectEvent_();
  else if(form.kind==='vendor') c=collectVendor_();
  else if(form.kind==='place') c=collectPlace_();
  else c=collectField_();
  if(c.errs.length){ formMsg_(c.errs.join('／'),'ng'); return Promise.resolve(false); }
  var warns=form.kind==='event'?paintWarn_():[];
  return saveRow_(form.kind,c.row,form.rev,warns);
}
function saveRow_(kind,row,rev,warns){
  var my=gen, f=form, spec=SAVE_RPC[kind];
  if(f) f.busy=true;
  formMsg_('保存しています…','busy');
  return rpc_(spec[0],{p_row:row,p_rev:rev==null?null:rev}).then(function(d){
    if(f) f.busy=false;
    if(my!==gen) return false;
    if(d&&d.conflict){ if(d.row) upsert_(spec[1],d.row); paintAll_(); formMsg_(CONFLICT_TEXT,'warn'); return false; }
    if(!d||d.ok!==true||!d.row){ formMsg_(ngAnswer_(spec[0],d),'ng'); return false; }
    upsert_(spec[1],d.row);
    if(kind==='event'&&!d.row.cancelled_at) lastEv={etype:EquipCalc.EVENT_TYPES.some(function(t){ return t.code===d.row.etype; })?d.row.etype:'',vendor_id:d.row.vendor_id==null?null:d.row.vendor_id};
    if(kind==='place'&&!selPlace) selPlace=EquipCalc.placeKeyOf({id:d.row.id});
    if(form===f) closeDlg_();
    paintAll_();
    toast('保存しました'+(warns&&warns.length?'（日付の順を確かめてください）':''));
    return true;
  },function(e){
    if(f) f.busy=false;
    if(my!==gen) return false;
    eqNote_('保存', e);
    if(noDb_(e)){ dbState='nodb'; paintBand_(); paintAll_(); }
    formMsg_(friendly_(e)+(e&&e.code==='22023'&&e.message?'（'+String(e.message).slice(0,120)+'）':''),'ng');
    return false;
  });
}
function collectVendor_(){

function fieldRow_(f){ return {id:f.id,target:f.target,name:f.name,ftype:f.ftype,options:Array.isArray(f.options)?f.options.slice():[],sort:Number(f.sort)||0,disabled:!!f.disabled}; }
function moveField_(id,dir){
  var list=EquipCalc.fieldsFor(data.fields,fieldTarget), i=-1;
  for(var k=0;k<list.length;k++) if(String(list[k].id)===String(id)) i=k;
  var j=i+dir;
  if(i<0||j<0||j>=list.length||!canWrite_()) return Promise.resolve(false);
  /* 並びを 10 刻みに付け直し、入れ替えた2つだけ保存する（同じ値の並びでも順が決まるように） */
  var a=list[i], b=list[j];
  var ra=fieldRow_(a), rb=fieldRow_(b);
  ra.sort=(j+1)*10; rb.sort=(i+1)*10;
  return saveRowQuiet_('field',ra,a.rev,'').then(function(ok){ return ok?saveRowQuiet_('field',rb,b.rev,'並びを変えました'):false; });
}
function saveRowQuiet_(kind,row,rev,done){

    if(my!==gen) return false;
    if(d&&d.conflict){ if(d.row) upsert_(spec[1],d.row); paintAll_(); setMsg(CONFLICT_TEXT,'warn'); return false; }
    if(!d||d.ok!==true||!d.row){ setMsg(ngAnswer_(spec[0],d),'ng'); return false; }

/* ═══════════ 添付（領収書・見積書・写真・JPEG/PNG/PDF・10MB まで） ═══════════ */
function filesOf_(ev){ return data.files.filter(function(f){ return String(f.event_id)===String(ev.id); }); }
/* 添付の台帳を読む（表 eq_files は事務所・管理者の自分の事業者の分だけ読める・書くのは関数だけ） */
function loadFiles_(id){
  var my=gen;
  filesFor=String(id); filesState='loading'; delAsk='';
  return Promise.resolve().then(function(){ return db_().from('eq_files').select('*').eq('event_id',id).order('created_at',{ascending:true}); }).then(function(r){
    if(r&&r.error) throw r.error;
    if(my!==gen||filesFor!==String(id)) return;
    var rows=Array.isArray(r&&r.data)?r.data.filter(function(x){ return x&&x.id!=null&&x.object_key; }):[];
    data.files=data.files.filter(function(f){ return String(f.event_id)!==String(id); }).concat(rows);
    filesState='ok'; paintFiles_();
  })['catch'](function(e){
    if(my!==gen||filesFor!==String(id)) return;
    filesState=noDb_(e)?'nodb':'error';
    if(filesState==='error') eqNote_('添付の読み込み', e);
    paintFiles_();
  });
}
function filesHtml_(ev){
  if(filesFor!==String(ev.id)||filesState==='loading'||filesState==='idle') return '<p class="muted">読み込んでいます…</p>';
  if(filesState==='nodb') return '<p class="msg warn">添付の置き場がまだ準備中です。</p>';
  if(filesState==='error') return '<p class="msg ng">添付の一覧を読めませんでした。閉じてから、もう一度開いてください。</p>';
  var fs=filesOf_(ev), ro=!!ev.cancelled_at;
  return '<p class="msg" id="d-fmsg" role="status"></p>'+
    (fs.length?'<ul class="files">'+fs.map(function(f){
      return '<li><span class="fn">'+esc(f.name)+'</span><span class="muted">'+esc(Math.ceil((Number(f.size)||0)/1024))+'KB</span>'+
        '<button type="button" class="btn sm" data-act="file-open" data-fid="'+esc(f.id)+'">開く</button>'+
        (ro?'':(delAsk===String(f.id)
          ?'<span class="msg warn" role="alert">元に戻せません。外しますか？</span><button type="button" class="btn sm" data-act="file-del-no">やめる</button><button type="button" class="btn sm ng" data-act="file-del-ok" data-fid="'+esc(f.id)+'"'+(upBusy||!canWrite_()?' disabled':'')+'>外す</button>'
          :'<button type="button" class="btn sm ng" data-act="file-del" data-fid="'+esc(f.id)+'"'+(upBusy||!canWrite_()?' disabled':'')+'>外す</button>'))+'</li>';
    }).join('')+'</ul>':'<p class="muted">まだありません。</p>')+
    (ro?'':'<p class="acts"><button type="button" class="btn" data-act="file-pick"'+(upBusy||!canWrite_()?' disabled':'')+'>ファイルを選ぶ</button>'+
      '<input id="d-file" type="file" accept="image/jpeg,image/png,application/pdf,.jpg,.jpeg,.png,.pdf" multiple hidden aria-label="添付するファイルを選ぶ"></p>');
}
function paintFiles_(){ var c=$('d-files'); if(c&&form&&form.kind==='event'&&form.row) c.innerHTML=filesHtml_(form.row); }
function fileMsg_(t,kind){ var e=$('d-fmsg'); if(!e) return; e.className='msg'+(t?' '+(kind||'ng'):''); e.textContent=t||''; }
function uploadFiles_(list){
  var ev=form&&form.kind==='event'?form.row:null, arr=Array.prototype.slice.call(list||[]);
  if(!ev||ev.id==null||upBusy||!arr.length||!canWrite_()||filesState!=='ok'||filesFor!==String(ev.id)) return Promise.resolve(0);
  var my=gen, done=0, ng=[], st=db_().storage.from(FILE_BUCKET);
  upBusy=true; paintFiles_(); fileMsg_('付けています…（'+arr.length+'件）','busy');
  var chain=Promise.resolve();
  arr.forEach(function(file){
    chain=chain.then(function(){
      if(my!==gen) return;
      var name=String(file&&file.name||'').slice(0,200)||'名前なし', mime=String(file&&file.type||'');
      if(!FILE_TYPES[mime]){ ng.push(name+': JPEG・PNG・PDF だけ付けられます'); return; }
      if(!(file.size>0)||file.size>FILE_MAX){ ng.push(name+': 10MB までです'); return; }
      /* 先に台帳に入れて鍵（事業者/記録/ファイルの id.拡張子）を受け取り、その鍵で置く。置けなければ台帳から外す */
      return rpc_('eq_register_file',{p_event_id:ev.id,p_name:name,p_mime:mime,p_size:file.size}).then(function(d){
        var row=d&&d.ok===true&&d.row;
        if(!row||!row.object_key){ ng.push(name+': 台帳に入れられませんでした'); return; }
        return Promise.resolve().then(function(){ return st.upload(row.object_key,file,{contentType:mime,upsert:false,cacheControl:'0'}); }).then(function(r){
          if(r&&r.error) throw r.error;
          done++; data.files.push(row);
        })['catch'](function(e){
          eqNote_('添付を置く', e);
          return rpc_('eq_remove_file',{p_file_id:row.id})['catch'](function(x){ eqNote_('添付の後片付け', x); }).then(function(){ ng.push(name+': 置けませんでした'); });
        });
      },function(e){ eqNote_('添付の台帳', e); ng.push(name+': '+friendly_(e)); });
    });
  });
  return chain.then(function(){
    upBusy=false;
    if(my!==gen) return done;
    paintFiles_();
    fileMsg_((done?done+'件を付けました。':'')+(ng.length?'付けられなかったもの: '+ng.join('／'):''),ng.length?(done?'warn':'ng'):'ok');
    return done;
  });
}
function openFile_(fid){
  var f=byId_(data.files,fid); if(!f) return Promise.resolve(false);
  var w=null;
  try{ w=window.open('about:blank','_blank'); }catch(e){ w=null; eqNote_('新しいタブ', e); }
  if(w){ try{ w.opener=null; }catch(e){ eqNote_('新しいタブの元', e); } }
  return Promise.resolve().then(function(){ return db_().storage.from(FILE_BUCKET).createSignedUrl(f.object_key,FILE_LINK_SEC); }).then(function(r){
    if(r&&r.error) throw r.error;
    var url=r&&r.data&&r.data.signedUrl;
    if(!url||!/^https?:\/\//.test(String(url))) throw new Error('nolink');
    if(w&&!w.closed){ w.location.replace(url); return true; }
    fileMsg_('新しいタブを開けませんでした。ブラウザでこの画面のポップアップを許可してから、もう一度「開く」を押してください。','warn'); return false;
  })['catch'](function(e){
    try{ if(w&&!w.closed) w.close(); }catch(x){ eqNote_('新しいタブを閉じる', x); }
    eqNote_('添付を開く', e); fileMsg_('開けませんでした。','ng'); return false;
  });
}
/* 外す（置き場 → 台帳の順）。置き場から消せなければ台帳は残す */
function delFile_(fid){
  var f=byId_(data.files,fid); if(!f||upBusy||!canWrite_()) return Promise.resolve(false);
  var my=gen;
  upBusy=true; paintFiles_(); fileMsg_('外しています…','busy');
  return Promise.resolve().then(function(){ return db_().storage.from(FILE_BUCKET).remove([f.object_key]); }).then(function(r){
    if(r&&r.error) throw r.error;
    return rpc_('eq_remove_file',{p_file_id:f.id});
  }).then(function(d){
    upBusy=false;
    if(my!==gen) return false;
    if(d&&d.ok===true){ data.files=data.files.filter(function(x){ return x.id!==f.id; }); paintFiles_(); fileMsg_('外しました。','ok'); return true; }
    paintFiles_(); fileMsg_('外せませんでした。','ng'); return false;
  },function(e){
    upBusy=false; eqNote_('添付を外す', e);
    if(my!==gen) return false;
    paintFiles_(); fileMsg_(friendly_(e),'ng'); return false;
  });
}

  act_(b.getAttribute('data-act'),b);
}
function attr_(b,n){ var v=b&&b.getAttribute?b.getAttribute(n):null; return v==null?null:v; }
function act_(a,b){
  if(a==='reload') return loadAll_();
  if(a==='floor'){ floor=attr_(b,'data-floor')||floor; saveFloor_(); paintAll_(); return; }
  if(a==='place'){ selPlace=attr_(b,'data-key')||''; paintAll_(); return; }
  if(a==='place-new') return openPlace_();
  if(a==='asset-new') return openAsset_(null,attr_(b,'data-key')||selPlace||'');
  if(a==='asset-edit') return openCard_(attr_(b,'data-id'));
  if(a==='asset-fix') return openAsset_(attr_(b,'data-id'));
  if(a==='asset-retire') return retireAsset_(attr_(b,'data-id'));
  if(a==='event-new') return openEvent_(null,attr_(b,'data-key')||selPlace||'',attr_(b,'data-asset'));
  if(a==='event-edit') return openEvent_(attr_(b,'data-id'));
  if(a==='event-cancel') return cancelEvent_(attr_(b,'data-id'));
  if(a==='vendor-new') return openVendor_(null);
  if(a==='vendor-edit') return openVendor_(attr_(b,'data-id'));
  if(a==='ftarget'){ fieldTarget=attr_(b,'data-target')==='asset'?'asset':'event'; paintAll_(); return; }
  if(a==='field-new') return openField_(null);
  if(a==='field-legal') return openField_(null,{target:'asset',ftype:'select',name:'法定点検',options:[EquipCalc.LEGAL_VALUE]});
  if(a==='field-edit') return openField_(attr_(b,'data-id'));
  if(a==='field-up') return moveField_(attr_(b,'data-id'),-1);
  if(a==='field-down') return moveField_(attr_(b,'data-id'),1);
  if(a==='field-toggle') return toggleField_(attr_(b,'data-id'));
  if(a==='csv') return downloadCsv_();
  if(a==='today'){ var t=$(attr_(b,'data-for')); if(t){ t.value=today_(); if(form) form.dirty=true; paintWarn_(); } return; }
  if(a==='calc-next') return calcNext_();
  if(a==='dlg-save') return saveForm_();
  if(a==='dlg-close') return closeAsk_('');
  if(a==='ask-no'){ askFor=null; paintAsk_(); return; }
  if(a==='ask-ok'){ var af=askFor; askFor=null; closeDlg_(); runAfter_(af); return; }
  if(a==='q-clear'){ query=''; var qi=$('e-q'); if(qi) qi.value=''; paintAll_(); return; }
  if(a==='vq-open') return vqOpen_(attr_(b,'data-for'));
  if(a==='vq-cancel') return vqCancel_(attr_(b,'data-for'));
  if(a==='vq-save') return vqSave_(attr_(b,'data-for'));
  if(a==='confirm-ok'){ if(confirmDone_) confirmDone_(true); return; }
  if(a==='confirm-no'){ if(confirmDone_) confirmDone_(false); return; }
  if(a==='file-pick'){ var fi=$('d-file'); if(fi&&fi.click) fi.click(); return; }
  if(a==='file-open') return openFile_(attr_(b,'data-fid'));
  if(a==='file-del'){ delAsk=String(attr_(b,'data-fid')||''); paintFiles_(); return; }
  if(a==='file-del-no'){ delAsk=''; paintFiles_(); return; }
  if(a==='file-del-ok'){ delAsk=''; return delFile_(attr_(b,'data-fid')); }
}
/* 保存していない入力がある時は、閉じる・タブを移る前に窓の中で確かめる（黙って捨てない・U5）。
   after: 閉じた後にすること（''＝閉じるだけ・タブの名前＝そのタブへ移る）。確かめを出した時は false を返す */
function closeAsk_(after){
  if(form&&form.kind==='confirm'&&confirmDone_){ confirmDone_(false); runAfter_(after); return true; }
  if(form&&form.busy) return false;
  if(form&&form.dirty){ askFor=after||''; paintAsk_(); return false; }
  closeDlg_();
  runAfter_(after);
  return true;
}
function paintAsk_(){
  var a=$('d-ask'); if(!a) return;
  if(askFor==null){ a.hidden=true; a.textContent=''; return; }
  a.hidden=false;
  a.innerHTML='<p>保存していない入力があります。保存せずに閉じますか？</p><div class="acts"><button type="button" class="btn" data-act="ask-no">入力に戻る</button><button type="button" class="btn ng" data-act="ask-ok">保存せずに閉じる</button></div>';
}
function runAfter_(after){
  if(after&&EquipCalc.TABS.indexOf(after)>=0){ tab=after; saveTab_(); paintAll_(); }
}
function setTab_(t){
  if(EquipCalc.TABS.indexOf(t)<0) return false;
  if(form) return closeAsk_(t);
  tab=t; saveTab_(); paintAll_();
  return true;
}
function onChange_(ev){
  var e=ev&&ev.target; if(!e||!e.getAttribute) return;
  var k=e.getAttribute('data-filter');
  if(k){
    var r=EquipCalc.restoreUiState({tab:tab,floor:floor,filter:JSON.stringify(Object.assign({},filter,(function(){ var o={}; o[k]=String(e.value||''); return o; })()))},{floors:planFloors_()});
    filter=r.filter; saveFilter_(); paintAll_(); return;
  }
  if(e.getAttribute('data-act-change')==='cost-fy'){ var y=Number(e.value); if(isFinite(y)) costFy=y; paintAll_(); return; }
  if(e.id==='d-file'){ uploadFiles_(e.files).then(function(){ try{ e.value=''; }catch(x){ eqNote_('ファイルの欄', x); } }); return; }
}
/* 上部の検索（打つたびに今のタブの一覧を絞る・検索語はメモリだけ） */
function onAppInput_(ev){
  var e=ev&&ev.target; if(!e||e.id!=='e-q') return false;
  query=String(e.value==null?'':e.value).slice(0,100);
  paintAll_();
  return true;
}
function onDlgInput_(ev){
  var id=ev&&ev.target&&ev.target.id;
  if(form&&form.kind!=='confirm'&&form.kind!=='card'&&id!=='d-file'&&id!=='d-vq-name') form.dirty=true;
  if(id==='v-found'||id==='v-requested'||id==='v-handled'||id==='v-done') paintWarn_();
}
function onBeforeUnload_(e){ if(isDirty_()){ e.preventDefault(); e.returnValue=''; return ''; } }
function bindEvents_(){
  $('e-app').addEventListener('click',onClick_);
  $('e-app').addEventListener('change',onChange_);
  $('e-app').addEventListener('input',onAppInput_);
  var d=$('e-dlg');
  d.addEventListener('click',onClick_);
  d.addEventListener('change',onChange_);
  d.addEventListener('input',onDlgInput_);
  d.addEventListener('change',onDlgInput_);
  d.addEventListener('cancel',function(e){ e.preventDefault(); closeAsk_(); });
  window.addEventListener('beforeunload',onBeforeUnload_);
  document.addEventListener('visibilitychange',function(){ try{ onVisible_(); }catch(err){ eqNote_('画面に戻った時', err); } });
}
function init_(){
  window.addEventListener('storage',function(e){ try{ onStorage_(e); }catch(err){ eqNote_('別のタブでの切り替え', err); } });
  /* 同じタブで別の画面へ移り、そこで用途が変わってから「戻る」で戻った時も同じ判定を通す */
  window.addEventListener('pageshow',function(e){ try{ if(e&&e.persisted&&isField()) location.reload(); }catch(err){ eqNote_('戻るで復元した時の切り替え', err); } });
  if(isField()){ boot_(); return; }
  bindEvents_();
  var go=function(){ boot_()['catch'](function(e){ eqNote_('起動', e); }); };
  if(window.SUFacility&&typeof window.SUFacility.onReady==='function') window.SUFacility.onReady(go); else go();
}
init_();
</script>
