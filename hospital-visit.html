<title>受診連絡</title>
<!-- 画面が黙って壊れないようにする共通部品（いちばん先に読む）→ 速さの記録 → ログインの役割の確かめ → 施設情報 → 入居者マスタの読み取り → 印刷 → 窓 → 受診連絡の計算 -->

<style>
/* 受診連絡（2026-11-27 本人指示）。色は勤怠管理・給与の画面と同じ「グレージュ＋ピンク」（2026-11-28 本人指示「勤怠管理・給与アプリの色に合わせよ」・
   値は勤怠管理・給与の見た目の部品（明るい表示）の値と同じ・その部品は読まずに値だけを写す）。ライト固定。
   面はグレージュ。濃いピンクに白い字は「次に押す塗り（保存する）・選んだタブ・押した病院」だけ。淡いピンクの面は使わない。
   ほかのボタンは白地に枠（手紙を印刷はピンクの字と枠）。字と地の差はどれも 7:1 以上。
   文字は 17px・押せる所は 44px 以上・フォーカスは 3px の枠。印刷は手紙の紙（A4 縦・SUPrint の 'letter'）だけ */
:root{
  --bg:#f4f0eb; --bg2:#ece6df; --surf:#ffffff; --surf2:#f3efea; --line:#c9beb2; --line2:#e6dfd7;
  --ink:#2a221f; --ink2:#493f3a; --ink3:#544a44;
  --fill:#72264a; --fill-tx:#ffffff; --fill-hover:#5c1d3b; --warn:#6b4100;
  --ng:#8a1020; --ng-l:#fde8eb; --hdr:#ece6df; --hdr-ink:#2a221f; --hdr-hover:#e8e2dc;
  --r:10px; --focus:#72264a;
}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); font-size:1.0625rem; line-height:1.6; overflow-wrap:anywhere; min-height:100dvh}
button,input,select,textarea{font-family:inherit; font-size:1.0625rem; color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
[hidden]{display:none !important}
h1,h2,h3{text-wrap:pretty}

/* ── 見出し ── */
.hdr{position:sticky; top:0; z-index:50; background:var(--hdr); color:var(--hdr-ink); padding:8px 16px; border-bottom:1px solid var(--line2);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.hdr h1{font-size:1.375rem; margin:0; font-weight:700; letter-spacing:.04em; flex:1; white-space:nowrap}
.hdr-btn{display:inline-flex; align-items:center; min-height:44px; background:var(--surf); border:1px solid var(--line);
  color:var(--hdr-ink); border-radius:8px; padding:6px 12px; font-size:1rem; text-decoration:none; white-space:nowrap}
.hdr-btn:hover{background:var(--hdr-hover)}
.hdr-btn:focus-visible{outline:3px solid var(--focus); outline-offset:1px}
.hdr .sync{font-size:.9375rem; color:var(--hdr-ink); opacity:.92; white-space:nowrap}
.hdr .sync:empty{display:none}

main{max-width:1680px; margin:0 auto; padding:14px 16px 72px}

/* ── ボタン（勤怠管理・給与と同じ: 次に押す物だけ濃いピンクの塗り・ほかは白地に枠） ── */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:8px 16px; border-radius:8px;
  border:1px solid var(--line); background:var(--surf); color:var(--ink); font-weight:700; white-space:nowrap; text-decoration:none}
.btn:hover{background:var(--surf2)}
.btn:disabled,.btn.go:disabled,.btn.pink:disabled,.btn.orange:disabled{background:var(--surf2); border-color:var(--line2); color:var(--ink3); cursor:not-allowed}
.btn.go{background:var(--fill); border-color:var(--fill); color:var(--fill-tx)}          /* 保存する＝次に押す塗り */
.btn.go:hover{background:var(--fill-hover); border-color:var(--fill-hover)}
.btn.pink{background:var(--surf); border-color:var(--fill); color:var(--fill)}           /* 手紙を印刷＝ピンクの字と枠 */
.btn.pink:hover{background:var(--surf2)}
.btn.orange{background:var(--surf); border-color:var(--line); color:var(--ink)}          /* 差し込む・書き始める＝白地に枠 */
.btn.orange:hover{background:var(--surf2)}
.btn.sm{min-height:44px; padding:6px 12px; font-size:.9375rem}
.btn.quiet{border-color:transparent; background:transparent; text-decoration:underline; font-weight:600}
.btn.quiet:hover{background:var(--surf2)}

/* ── 入居者を選ぶ帯 ── */
.pick{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:0 0 12px}
.pick .who{display:flex; align-items:baseline; gap:10px; min-width:0}
.pick .who b{font-size:1.5rem; letter-spacing:.04em}
.pick .who span{color:var(--ink2)}
.pick .grow{flex:1}
.fi{display:flex; flex-direction:column; gap:4px; min-width:0}
.fi label,.fi .lb{font-size:.9375rem; font-weight:700; color:var(--ink2)}
input[type=text],input[type=search],input[type=date],select,textarea{min-height:44px; border:1.5px solid var(--line); border-radius:8px;
  background:#fff; padding:8px 10px; width:100%}
textarea{line-height:1.7; resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
.search{width:min(420px,100%)}

/* 入居者の一覧（選ぶ所）。札は使わず、居室の番号を薄い字で */
.res-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:6px; margin:8px 0 0; padding:0; list-style:none}
.res-list button{width:100%; height:100%; min-height:56px; align-items:center; text-align:left; border:1px solid var(--line2); background:var(--surf); border-radius:8px; padding:6px 10px;
  display:flex; gap:8px; align-items:baseline}
.res-list button:hover{border-color:var(--ink)}
.res-list .rm{color:var(--ink2); font-size:.9375rem; min-width:2.6em}
.res-list .nm{font-weight:700}

/* ── 最近の受診（入居者を選ぶ前の主役） ── */
.home{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:20px; align-items:start}
.home h2{font-size:1.25rem; margin:0 0 8px}
.home .sub{color:var(--ink2); font-size:.9375rem; margin:0 0 10px}
.panel{background:var(--surf); border-radius:var(--r); padding:16px}
.recent{list-style:none; margin:0; padding:0}
.recent li + li{border-top:1px solid var(--line2)}
.recent button{width:100%; min-height:52px; display:grid; grid-template-columns:6.2em minmax(0,1fr) auto; gap:4px 12px; align-items:center;
  text-align:left; background:none; border:0; padding:8px 6px; border-radius:6px}
.recent button:hover{background:var(--surf2)}
.recent .dt{color:var(--ink2); font-variant-numeric:tabular-nums}
.recent .nm{font-weight:700}
.recent .hp{display:block; color:var(--ink2); font-size:.9375rem; font-weight:400}
.wait{display:inline-block; border:2px solid var(--warn); color:var(--ink); border-radius:999px; padding:0 10px; font-size:.9375rem; font-weight:700; white-space:nowrap}
.count{font-size:2rem; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums}

/* ── 2列の作業（左＝見るだけ・右＝書く） ── */
.work{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:18px; align-items:start}
.side{background:var(--surf2); border-radius:var(--r); padding:14px; position:sticky; top:72px; max-height:calc(100dvh - 88px); overflow:auto}
.desk{background:var(--surf); border-radius:var(--r); padding:16px; min-width:0}
.tabs{display:flex; gap:4px; border-bottom:2px solid var(--line); margin:0 0 12px; flex-wrap:wrap}
.tab{min-height:44px; padding:6px 14px; border:0; background:transparent; border-radius:8px 8px 0 0; font-weight:700; color:var(--ink2)}
.tab[aria-selected=true]{background:var(--fill); color:var(--fill-tx)}
.side h3,.desk h3{font-size:1rem; margin:14px 0 6px; color:var(--ink2)}
.ro{white-space:pre-wrap; background:#fff; border:1px solid var(--line2); border-radius:8px; padding:10px 12px; min-height:2.5em; font-size:1rem}
.ro.empty{color:var(--ink3)}
.kv{display:grid; grid-template-columns:7em minmax(0,1fr); gap:4px 10px; margin:0; font-size:1rem}
.kv dt{color:var(--ink2); font-weight:700}
.kv dd{margin:0}
.meds{list-style:none; margin:0; padding:0; background:#fff; border:1px solid var(--line2); border-radius:8px}
.meds li{padding:8px 12px; font-size:1rem}
.meds li + li{border-top:1px dashed var(--line2)}
.side .acts,.desk .acts{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0}
.prevpick{display:flex; gap:8px; align-items:end; flex-wrap:wrap}
.prevpick .fi{flex:1}

.visitbar{display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin:0 0 10px}
.visitbar .fi{flex:1; min-width:220px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 14px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0}
.chip{min-height:44px; padding:6px 12px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font-size:.9375rem}
.chip[aria-pressed=true]{border-color:var(--fill); background:var(--fill); color:var(--fill-tx)}
.chip .src{color:var(--ink3); font-size:.8125rem; margin-left:4px}
.chip[aria-pressed=true] .src{color:var(--surf2)}
.radios{display:flex; gap:8px; flex-wrap:wrap}
.radios label{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:4px 14px; border:1.5px solid var(--line); border-radius:999px; background:#fff; font-weight:700}
.radios input{width:20px; height:20px}
.diff{border-left:6px solid var(--fill); background:#fff; padding:8px 12px; margin:8px 0 0; border-radius:0 8px 8px 0; font-size:1rem}
.diff b{display:block}
.foot{position:sticky; bottom:0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-end;
  background:var(--surf); border-top:1px solid var(--line2); margin:16px -16px -16px; padding:12px 16px; border-radius:0 0 var(--r) var(--r)}
.foot .state{margin-right:auto; color:var(--ink2); font-size:.9375rem}
/* 右下の「不具合を報告」（su-report の浮いたボタン）に保存のボタンが隠れないよう、右を空ける */
body.sur-has-fab .foot{padding-right:150px}
@media (max-width:700px){ body.sur-has-fab .foot{padding-right:16px; padding-bottom:64px} }
.foot .state.dirty{color:var(--ink); font-weight:700}
.msg{margin:8px 0; padding:0; color:var(--ng); font-weight:700}
.msg:empty{display:none}
.msg.ok{color:var(--ink)}
.gate{background:var(--surf); border-radius:var(--r); padding:20px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* 紙の見本（画面で手紙の形を見る）。紙と同じ組みを縮めて見せる */
.paperwrap{background:var(--bg2); border-radius:8px; padding:16px; overflow:auto}
.paperwrap .hl-sheet{background:#fff; width:min(100%,720px); margin:0 auto; padding:40px 44px; box-shadow:0 1px 3px rgba(0,0,0,.18); font-size:14px}

/* 手紙の紙（画面の見本と印刷で同じ組み）。値は hospital-visit-calc.js の letterHtml が作る */
.hl-sheet{color:#000; line-height:1.65}
.hl-sheet p{margin:0}
.hl-date{text-align:right; margin-bottom:1.6em !important}
.hl-to{display:flex; gap:2.2em; flex-wrap:wrap; font-size:1.12em; padding-left:1.5em; margin-bottom:1.8em !important}
.hl-title{font-size:1.22em; font-weight:400; text-align:center; letter-spacing:.06em; margin:0 0 1.8em}
.hl-open{display:flex; justify-content:space-between; gap:1em; flex-wrap:wrap; margin-bottom:.6em !important}
.hl-box{border:1px solid #000; padding:1.4em 1.6em; min-height:30em; white-space:pre-wrap; tab-size:8}
.hl-close{margin-top:1em !important; padding-left:1.5em}
.hl-sign{margin:2.2em 0 0 auto; width:fit-content; min-width:40%}
.hl-sign p + p{margin-top:1.2em}

/* ── 窓（病院の台帳・設定） ── */
.dlg{position:fixed; inset:0; background:rgba(30,27,23,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:4vh 12px; overflow:auto}
.dlg .box{background:var(--surf); border-radius:var(--r); padding:18px; width:min(760px,100%)}
.dlg h2{margin:0 0 10px; font-size:1.25rem}
.dlg .btns{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin:14px 0 0}
.htbl{width:100%; border-collapse:collapse; font-size:1rem}
.htbl th,.htbl td{border-bottom:1px solid var(--line2); padding:6px; text-align:left; vertical-align:middle}
.htbl th{color:var(--ink2); font-size:.9375rem}
.htbl tr.off td{color:var(--ink3)}

#toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:200; max-width:92vw}
#toast.on{opacity:1}

/* ── 狭い幅（iPad 縦・iPhone）: 左の枠は「見る」タブに切り替えて出す ── */
.narrowtabs{display:none}
@media (max-width:999px){
  .home{grid-template-columns:1fr}
  .work{grid-template-columns:1fr}
  .side{position:static; max-height:none}
  .narrowtabs{display:flex}
  .foot{position:static}   /* 狭い幅では帯を貼り付けない（入力欄に重ならない） */
  .work[data-pane=desk] .side{display:none}
  .work[data-pane=side] .desk{display:none}
}
@media (max-width:700px){
  main{padding:10px 10px 72px}
  .grid2,.grid3{grid-template-columns:1fr}
  .hdr h1{font-size:1.125rem}
  .pick .who b{font-size:1.25rem}
  input,select,textarea{font-size:16px}
  .recent button{grid-template-columns:1fr auto}
  .recent .dt{grid-column:1 / -1}
  .paperwrap .hl-sheet{padding:20px 16px; font-size:12px}
}

/* ── 印刷（手紙の紙だけ・A4 縦・SUPrint の 'letter'）。文字の大きさは su-print が --hl-fs で収める（zoom・transform は使わない） ── */
#h-print{display:none}
@media print{
  .hdr{position:static}
  #toast,.dlg{display:none !important}
  body.su-print-letter{background:#fff !important}
  body.su-print-letter #h-print{display:block; font-size:var(--hl-fs,15px)}
  #h-print .hl-box{min-height:44em}   /* 見本の手紙と同じく、枠が紙の約3分の2を占める（2026-11-28 見本との突き合わせ） */
  #h-print .hl-sheet{padding:0 2px}   /* 枠の右の罫線が紙の端の丸めで欠けないよう、わずかに内へ */
}
</style>
<link rel="stylesheet" href="su-print.css?v=2026-11-13">
<link rel="stylesheet" href="su-shell.css?v=2026-11-13">
</head>
<body>

<header class="hdr su-shell-hdr">
  <a class="hdr-btn" href="index.html">← メニュー</a>
  <h1>受診連絡</h1>
  <span class="sync" id="h-sync" role="status" aria-live="polite"></span>
  <span class="su-shell-role" hidden></span>
</header>

<main id="h-main">
  <div class="gate" id="h-gate" hidden></div>

  <section id="h-app" hidden>
    <div class="pick">
      <div class="who" id="h-who"><b>入居者を選んでください</b></div>
      <div class="grow"></div>
      <button type="button" class="btn sm" data-act="home" id="h-home-btn" hidden>受診の一覧へ</button>
      <button type="button" class="btn sm" data-act="hosp-open">病院の台帳</button>
      <button type="button" class="btn sm" data-act="set-open">設定</button>
    </div>
    <p class="msg" id="h-msg" role="alert"></p>

    <!-- 入居者を選ぶ前：選ぶ所（主役）と最近の受診 -->
    <div class="home" id="h-home">
      <section class="panel" aria-labelledby="h-pick-h">
        <h2 id="h-pick-h">入居者を選ぶ</h2>
        <p class="sub">名前・ふりがな・居室の番号で探せます。</p>
        <input type="search" class="search" id="h-q" maxlength="40" autocomplete="off" placeholder="例：はなこ・203" aria-label="入居者を探す（名前・ふりがな・居室の番号）">
        <ul class="res-list" id="h-res"></ul>
      </section>
      <section class="panel" aria-labelledby="h-recent-h">
        <h2 id="h-recent-h">最近の受診</h2>
        <div id="h-recent-sum"></div>
        <ul class="recent" id="h-recent"></ul>
      </section>
    </div>

    <!-- 入居者を選んだ後：左＝前回の受診・服薬中の薬（見るだけ）／右＝今回の手紙と結果（書く） -->
    <div class="work" id="h-work" data-pane="desk" hidden>
      <nav class="tabs narrowtabs" aria-label="見る所と書く所の切り替え">
        <button type="button" class="tab" data-pane="side" aria-selected="false">前回・薬を見る</button>
        <button type="button" class="tab" data-pane="desk" aria-selected="true">今回を書く</button>
      </nav>
      <aside class="side" aria-label="前回の受診と服薬中の薬">
        <div class="tabs" role="tablist" aria-label="左の枠">
          <button type="button" class="tab" role="tab" data-ltab="prev" id="lt-prev" aria-controls="lp-prev">前回の受診</button>
          <button type="button" class="tab" role="tab" data-ltab="meds" id="lt-meds" aria-controls="lp-meds">服薬中の薬</button>
        </div>
        <div id="lp-prev" role="tabpanel" aria-labelledby="lt-prev"></div>
        <div id="lp-meds" role="tabpanel" aria-labelledby="lt-meds" hidden></div>
      </aside>
      <section class="desk" aria-label="今回の受診">
        <div class="visitbar">
          <div class="fi"><label for="h-visit">書いている受診</label><select id="h-visit"></select></div>
          <button type="button" class="btn" data-act="new">＋ 新しい受診</button>
        </div>
        <div class="tabs" role="tablist" aria-label="今回の受診">
          <button type="button" class="tab" role="tab" data-rtab="letter" id="rt-letter" aria-controls="rp-letter">手紙</button>
          <button type="button" class="tab" role="tab" data-rtab="result" id="rt-result" aria-controls="rp-result">受診の結果</button>
          <button type="button" class="tab" role="tab" data-rtab="paper" id="rt-paper" aria-controls="rp-paper">紙の見本</button>
        </div>
        <div id="rp-letter" role="tabpanel" aria-labelledby="rt-letter"></div>
        <div id="rp-result" role="tabpanel" aria-labelledby="rt-result" hidden></div>
        <div id="rp-paper" role="tabpanel" aria-labelledby="rt-paper" hidden></div>
        <p class="msg" id="h-dmsg" role="alert"></p>
        <div class="foot">
          <span class="state" id="h-state" role="status" aria-live="polite"></span>
          <button type="button" class="btn quiet" data-act="cancel-visit" id="h-cancel">この受診を取り消す</button>
          <button type="button" class="btn pink" data-act="print">手紙を印刷</button>
          <button type="button" class="btn go" data-act="save" id="h-save">保存する</button>
        </div>
      </section>
    </div>
  </section>
</main>

<div class="dlg" id="h-dlg" role="dialog" aria-modal="true" aria-labelledby="h-dlg-h" hidden><div class="box" id="h-dlg-box"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<!-- 手紙の紙（印刷の時だけ中身を作る・画面には出さない） -->
<div id="h-print"></div>

<script>
'use strict';
/* 受診連絡（2026-11-27 本人指示）。
   ・保存先は共通 DB だけ（統合 0137 の hv_*）。Google（GAS）は使わない。入居者の名簿と医療の欄（病院・主治医・定期薬）は
     入居者マスタから SUResRead で読む（新しい保存先へ切り替えた後・事務所・管理者のログイン）。読んだ中身は端末に残さない
   ・端末に残すのは開いていたタブ（左・右・hv_ltab・hv_rtab・決まった値だけ）と、メニューの札の件数（hv_menu_due・結果がまだの受診の件数と数えた日だけ・
     氏名・利用者No・病院名は入れない・一覧を読めた時だけ書く・2026-11-28 本人「推奨」）
   ・入居者を切り替えた瞬間に世代（gen）を上げ、遅れて届いた応答は捨てる（取り違えの守り・CLAUDE.md §2-5）
   ・外部の AI へは何も送らない。手紙の文に自動の文言を足さない（定型文は設定が正） */
var C=window.HospitalVisitCalc;
var DEVICE_KEY='su_device_role', LS_L='hv_ltab', LS_R='hv_rtab';
var gen=0, view='boot', dbState='loading';
var roster=[], recent=[], hospitals=[], settings=C.normSettings(null), settingsRev=null;
var cur=null;          // 選んでいる方 {id,name,kana,room}（メモリだけ）
var medical=null;      // その方の医療の欄（要る鍵だけ・メモリだけ）
var visits=[];         // その方の受診（全項目）
var draft=null, base=null; // 書いている受診と、読み込んだ時（保存した時）の形
var prevId='';         // 左に出している前回の受診（空＝自動）
var ltab='prev', rtab='letter', printOn=false, saving=false;

function $(id){return document.getElementById(id)}
var esc=C.esc;
function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},3200)}
function setSync(t){var e=$('h-sync');if(e)e.textContent=t||''}
function setMsg(id,t,ok){var e=$(id);if(!e)return;e.className='msg'+(ok?' ok':'');e.textContent=t||''}
function note_(where,e){ try{ if(window.SUErrors&&typeof window.SUErrors.note==='function') window.SUErrors.note('受診連絡', e, 'hv:'+where); }catch(_){} }
function getDeviceRole(){try{return localStorage.getItem(DEVICE_KEY)||'office'}catch(e){return'office'}}
function isField(){return getDeviceRole()==='field'}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){/* 私用モードなど */}}
function confirm_(m){ return (window.SUDialog&&typeof window.SUDialog.confirm==='function')?window.SUDialog.confirm(m):Promise.resolve(window.confirm(m)); }
function facName_(){ try{ return window.SUFacility?window.SUFacility.officeName('施設'):''; }catch(e){ return ''; } }

/* データベースの窓口。通信は rpc_ だけを通す */
function db_(){ return window.SUAuth.client(); }
function rpc_(name,args){
  return Promise.resolve().then(function(){ return db_().rpc(name,args||{}); }).then(function(r){
    if(r&&r.error) throw r.error;
    return r?r.data:null;
  });
}
function noDb_(e){ var c=e&&e.code; return c==='42P01'||c==='PGRST205'||c==='PGRST202'; }
/* データベースの断りを職員に分かる言葉にする（コード・技術用語を出さない） */
function friendly_(e){
  var code=e&&e.code, m=String(e&&e.message||e||'');
  if(e&&e.hvText) return e.hvText;
  if(code==='42501'||/permission denied|row-level security/i.test(m)) return 'この操作をする権限がありません。事務所・管理者のアカウントでログインしているか確かめてください。';
  if(code==='23514') return '入れた文字が長すぎるか、値の形が違います。入れた値を確かめてください。';
  if(code==='22007'||code==='22008') return '日付の形が違います。日付を選び直してください。';
  if(noDb_(e)) return '共通のデータベースに受診連絡の仕組みがまだありません（データベースの更新が必要です）。管理者に知らせてください。';
  if(/failed to fetch|network|load failed|timeout|タイムアウト/i.test(m)) return '通信できませんでした。電波・Wi-Fi を確かめてから、もう一度試してください。';
  return 'うまくいきませんでした。少し待ってから、もう一度試してください。';
}
var NG_TEXT={notfound:'この受診は見つかりませんでした。読み直してください。',cancelled:'取り消した受診は直せません。',badkey:'保存の形が今の仕組みと合いません。ページを読み込み直してください。',
  noresident:'入居者を選んでください。',nohospital:'選んだ病院が台帳に見つかりませんでした。病院を選び直してください。',resident_change:'受診した方は後から変えられません。'};
function ngText_(where,d){ var c=d&&typeof d.error==='string'?d.error:''; note_(where,{message:'ok:false '+(c||'no-error')}); return NG_TEXT[c]||'保存できませんでした。もう一度試してください。'; }

/* 入居者マスタの読み取り（SUResRead）。新しい保存先へ切り替えた後に、ログインした事務所・管理者が読む。
   Google の読み取りの道は使わない（この画面は Google の接続先を持たない）ので、Google へ回る時は断りの文にする */
function resRead_(body){
  var noGas=function(){ var e=new Error('nogas'); e.hvText='入居者マスタを読めませんでした。事務所・管理者のアカウントでログインしているか確かめてください（入居者マスタを新しい保存先へ切り替えた後に使えます）。'; return Promise.reject(e); };
  if(!window.SUResRead) return noGas();
  return Promise.resolve().then(function(){ return window.SUResRead.call(body,noGas,{screen:'hospital-visit'}); });
}

/* ═══════════ 起動・端末の用途・ログインの役割 ═══════════ */
function showFieldOnly_(){
  view='field';
  $('h-app').hidden=true;
  var g=$('h-gate'); g.hidden=false;
  g.innerHTML='<h2>この画面は事務所のパソコンで使います</h2><p>この端末は「現場」として設定されているため、受診連絡は開きません。</p><p><a class="btn" href="index.html">メニューへ戻る</a></p>';
}
function boot_(){
  gen++;
  if(isField()){ showFieldOnly_(); return Promise.resolve('field'); }
  /* ログインの役割の確かめ（su-app-gate.js）。端末の用途の止めの後・記録を読む前に確かめる。開けない時は何も読まない */
  if(!window.SUAppGate){
    document.body.textContent='';
    var gp=document.createElement('p'); gp.textContent='ログインを確かめる部品を読み込めませんでした。ページを読み込み直してください。';
    document.body.appendChild(gp);
    return Promise.resolve('nogate');
  }
  return window.SUAppGate.run('hospital-visit',{dirty:function(){ return isDirty_(); }}).then(function(ok){
    if(!ok){ view='gate'; return 'gate'; }
    return startApp_();
  });
}
function startApp_(){
  view='app';
  definePrint_();
  $('h-gate').hidden=true; $('h-app').hidden=false;
  ltab=C.pickTab(lsGet(LS_L),C.LEFT_TABS,'prev'); rtab=C.pickTab(lsGet(LS_R),C.RIGHT_TABS,'letter');
  showHome_();
  try{ if(window.SUPerf) window.SUPerf.ready(); }catch(e){ note_('速さの記録', e); }
  return loadHome_().then(function(){ openFromUrl_(); return 'app'; });
}
/* 入居者マスタの「受診連絡を開く」（?resident=<利用者No>）。番号は形を確かめ、名簿にいる方だけを開く。名前は URL から受けない */
function openFromUrl_(){
  var id='';
  try{ id=new URLSearchParams(location.search).get('resident')||''; }catch(e){ id=''; }
  if(!/^[0-9A-Za-z_-]{1,32}$/.test(id)) return;
  var hit=false; roster.forEach(function(r){ if(r.id===id) hit=true; });
  if(!hit){ setMsg('h-msg','入居者マスタから渡された方が名簿に見つかりませんでした。下の一覧から選んでください。'); return; }
  pickResident_(id);
}
/* 名簿と最近の受診（病院の台帳・設定も）を読む */
function loadHome_(){
  var my=gen;
  dbState='loading'; setSync('読み込んでいます…'); setMsg('h-msg','');
  var pList=rpc_('hv_list',{p_resident:null}).then(function(d){
    if(my!==gen) return;
    if(!d||d.ok!==true) throw {hvText:'受診の一覧を読めませんでした。読み直してください。'};
    recent=Array.isArray(d.visits)?d.visits:[]; takeShared_(d); dbState='ok'; writeMenuDue_();
  });
  var pRos=resRead_({action:'getRoster'}).then(function(d){
    if(my!==gen) return;
    roster=(d&&Array.isArray(d.roster)?d.roster:[]).filter(function(r){ return r&&r.active!==false; })
      .map(function(r){ return {id:String(r.id),name:String(r.name||''),kana:String(r.kana||''),room:String(r.room||''),active:true}; });
  });
  return Promise.all([pList.catch(function(e){ if(my===gen){ dbState='ng'; note_('一覧',e); throw e; } }),
                      pRos.catch(function(e){ if(my===gen){ note_('名簿',e); throw e; } })].map(function(p){ return p.then(function(){ return null; },function(e){ return e; }); }))
    .then(function(errs){
      if(my!==gen) return;
      var e=errs.filter(Boolean)[0];
      setSync(e?'':'');
      if(e) setMsg('h-msg',friendly_(e));
      paintHome_();
      if(view==='app'&&cur) paintAll_();
    });
}
function takeShared_(d){
  hospitals=Array.isArray(d.hospitals)?d.hospitals:[];
  if(d.settings&&typeof d.settings==='object'){ settings=C.normSettings(d.settings.data); settingsRev=d.settings.rev==null?null:Number(d.settings.rev); }
  else { settings=C.normSettings(null); settingsRev=null; }
}

/* ═══════════ 入居者を選ぶ前（主役＝選ぶ所・脇＝最近の受診） ═══════════ */
function showHome_(){
  clearConflict_(); setLoading_(false);
  cur=null; medical=null; visits=[]; draft=null; base=null; prevId='';
  $('h-home').hidden=false; $('h-work').hidden=true; $('h-home-btn').hidden=true;
  $('h-who').innerHTML='<b>入居者を選んでください</b>';
  paintHome_();
}
function paintHome_(){
  var list=C.searchResidents(roster,$('h-q').value);
  $('h-res').innerHTML=list.length?list.map(function(r){
    return '<li><button type="button" data-act="pick" data-id="'+esc(r.id)+'"><span class="rm">'+esc(r.room)+'</span><span class="nm">'+esc(r.name)+'</span></button></li>';
  }).join(''):'<li class="ro empty">'+(roster.length?'見つかりません。名前・ふりがな・居室の番号で探してください。':'入居者の名簿を読めていません。')+'</li>';
  var waits=recent.filter(function(v){ return !C.hasResult(v); });
  $('h-recent-sum').innerHTML='<p class="sub"><span class="count">'+waits.length+'</span> 件 の受診で、結果がまだ書かれていません。</p>';
  /* 結果まだを先に、その中は新しい順。札は「結果まだ」だけ（普段の状態には付けない） */
  var rows=waits.concat(recent.filter(function(v){ return C.hasResult(v); })).slice(0,30);
  $('h-recent').innerHTML=rows.length?rows.map(function(v){
    var dt=C.mdw(v.visit_date)||C.mdw(v.letter_date);
    return '<li><button type="button" data-act="open-recent" data-rid="'+esc(v.resident_id)+'" data-vid="'+esc(v.id)+'">'+
      '<span class="dt">'+esc(dt||'日付なし')+'</span><span class="nm">'+esc(v.resident_name||'（名前なし）')+
      '<span class="hp">'+esc([v.hospital_name,v.dept,v.visit_kind].filter(Boolean).join('・')||'病院の記載なし')+'</span></span>'+
      (C.hasResult(v)?'<span></span>':'<span class="wait">結果まだ</span>')+'</button></li>';
  }).join(''):'<li class="ro empty">まだ受診の記録はありません。左で入居者を選ぶと、手紙を書き始められます。</li>';
}

/* ═══════════ 入居者を選ぶ ═══════════ */
function pickResident_(id,openVid){
  var go=function(){
    var r=null; roster.forEach(function(x){ if(x.id===String(id)) r=x; });
    if(!r){ recent.forEach(function(v){ if(!r&&String(v.resident_id)===String(id)) r={id:String(v.resident_id),name:String(v.resident_name||''),room:''}; }); }
    if(!r) return;
    gen++; var my=gen;
    cur=r; medical=null; visits=[]; draft=null; base=null; prevId='';
    $('h-home').hidden=true; $('h-work').hidden=false; $('h-home-btn').hidden=false;
    paintWho_(); setMsg('h-msg',''); setMsg('h-dmsg','');
    $('lp-prev').innerHTML='<p class="ro empty">読み込んでいます…</p>'; $('lp-meds').innerHTML='<p class="ro empty">読み込んでいます…</p>';
    $('rp-letter').innerHTML='<p class="ro empty">読み込んでいます…</p>'; $('rp-result').innerHTML=''; $('rp-paper').innerHTML='';
    clearConflict_(); lockDesk_(true); setLoading_(true);
    setSync('読み込んでいます…');
    var pV=rpc_('hv_list',{p_resident:r.id}).then(function(d){
      if(my!==gen) return;
      if(!d||d.ok!==true) throw {hvText:'この方の受診を読めませんでした。読み直してください。'};
      visits=C.sortVisits(d.visits); takeShared_(d);
    });
    var pM=resRead_({action:'getSection',id:r.id,section:'medical'}).then(function(d){
      if(my!==gen) return;
      var s=d&&d.section;
      /* 取り違えの守り: 返ってきた方の番号が選んだ方と違えば捨てる */
      if(!s||String(s.id)!==r.id){ medical={missing:true}; return; }
      medical={hospital:str_(s.hospital),doctor:str_(s.doctor),emergencyHospital:str_(s.emergencyHospital),allergy:str_(s.allergy),
               currentDiseases:str_(s.currentDiseases),medsRegular:str_(s.medsRegular),medsNotes:str_(s.medsNotes)};
    });
    return Promise.all([pV.then(function(){return null},function(e){return {w:'v',e:e}}),pM.then(function(){return null},function(e){return {w:'m',e:e}})]).then(function(rs){
      if(my!==gen) return;
      setSync('');
      var eV=rs[0], eM=rs[1];
      if(eM){ note_('医療の欄',eM.e); medical={missing:true,text:friendly_(eM.e)}; }
      if(eV){ note_('受診',eV.e); setMsg('h-msg',friendly_(eV.e)); dbState='ng'; }
      else dbState='ok';
      var target=null;
      if(openVid) visits.forEach(function(v){ if(String(v.id)===String(openVid)) target=v; });
      /* 既定: 結果がまだのいちばん新しい受診を開く。無ければ新しい受診を始める */
      if(!target&&visits.length&&!C.hasResult(visits[0])) target=visits[0];
      if(target){ openVisit_(target); if(openVid&&!C.hasResult(target)&&C.trim(target.letter_body)) rtab='result'; }
      else newVisit_();
      lockDesk_(dbState!=='ok'); setLoading_(false);
      paintAll_();
    });
  };
  if(isDirty_()) return confirm_('保存していない書きかけがあります。保存せずに別の方へ移りますか？').then(function(ok){ if(ok) go(); });
  go();
}
function str_(v){ return v==null?'':(typeof v==='object'?'':String(v)); }
function paintWho_(){
  if(!cur){ $('h-who').innerHTML='<b>入居者を選んでください</b>'; return; }
  $('h-who').innerHTML='<b>'+esc(cur.name)+' 様</b>'+(cur.room?'<span>居室 '+esc(cur.room)+'</span>':'');
}
function lockDesk_(on){ var b=$('h-save'); if(b) b.disabled=!!on; }
/* 読み込み中は書く所（右）と見る所（左）を丸ごと止める（押せる・書ける瞬間を作らない・反証レビュー 4） */
var loading=false;
function setLoading_(on){ loading=!!on; var w=$('h-work'); if(w){ w.inert=loading; w.setAttribute('aria-busy',String(loading)); } }
/* 定期薬を読めているか（読めない・読み込み中は「記載なし」と書き込まない・反証レビュー 2） */
function medsOk_(){ return !!(medical&&!medical.missing); }
var NO_MEDS='入居者マスタの定期薬を読めていないため、薬を差し込めません。画面を読み込み直してください。';

/* ═══════════ 受診を開く・新しく始める ═══════════ */
function openVisit_(v){ clearConflict_(); draft=C.fromRow(v); base=C.fromRow(v); prevId=''; }
function newVisit_(){
  clearConflict_();
  draft=C.blankVisit(cur,C.todayJST()); prevId='';
  /* 病院は前回の受診のものを初めから入れる（選び直せる） */
  var p=C.prevVisitFor(visits,draft);
  if(p){ draft.hospital_id=p.hospital_id||''; draft.hospital_name=p.hospital_name||''; draft.dept=p.dept||''; draft.doctor=p.doctor||''; draft.visit_kind=p.visit_kind||''; }
  base=C.fromRow(draft); base.id=null;
  rtab='letter';
}
function isDirty_(){ return !!(draft&&base&&!C.sameDraft(draft,base)); }
function readForm_(){
  if(!draft) return;
  var f=function(id){ var e=$(id); return e?e.value:null; };
  var map={'f-letter_date':'letter_date','f-visit_date':'visit_date','f-hospital_name':'hospital_name','f-dept':'dept','f-doctor':'doctor',
    'f-letter_title':'letter_title','f-letter_body':'letter_body','f-visit_kind':'visit_kind','f-result1':'result1','f-result2':'result2',
    'f-result_body':'result_body','f-added_med_note':'added_med_note','f-result_note':'result_note','f-next_date':'next_date'};
  Object.keys(map).forEach(function(id){ var v=f(id); if(v!==null) draft[map[id]]=v; });
  var am=document.querySelector('input[name=f-added_med]:checked'); if(document.querySelector('input[name=f-added_med]')) draft.added_med=am?am.value:'';
}
function paintState_(){
  var s=$('h-state'); if(!s||!draft) return;
  var d=isDirty_();
  s.className='state'+(d?' dirty':'');
  s.textContent=d?'保存していない変更があります':(draft.id?('保存済み（'+(C.hasResult(draft)?'結果あり':'結果まだ')+'）'):'まだ保存していません');
  $('h-cancel').hidden=!draft.id;
}

/* ═══════════ 描く ═══════════ */
function paintAll_(){
  if(!cur||!draft) return;
  paintVisitSel_(); paintLeft_(); paintRight_(); paintState_();
}
function paintVisitSel_(){
  var sel=$('h-visit'), h='';
  if(!draft.id) h+='<option value="">新しい受診（'+esc(C.mdw(draft.letter_date)||'日付なし')+'）</option>';
  visits.forEach(function(v){
    var d=C.mdw(v.visit_date)||C.mdw(v.letter_date)||'日付なし';
    h+='<option value="'+esc(v.id)+'"'+(String(v.id)===String(draft.id)?' selected':'')+'>'+esc(d+'　'+(v.hospital_name||'病院の記載なし')+(C.hasResult(v)?'':'（結果まだ）'))+'</option>';
  });
  sel.innerHTML=h;
}
function prevVisit_(){
  if(prevId){ var x=null; visits.forEach(function(v){ if(String(v.id)===prevId) x=v; }); if(x&&String(x.id)!==String(draft.id)) return x; }
  return C.prevVisitFor(visits,draft);
}
function paintLeft_(){
  $('lt-prev').setAttribute('aria-selected',String(ltab==='prev')); $('lt-meds').setAttribute('aria-selected',String(ltab==='meds'));
  $('lp-prev').hidden=ltab!=='prev'; $('lp-meds').hidden=ltab!=='meds';
  /* 前回の受診 */
  var p=prevVisit_(), others=visits.filter(function(v){ return String(v.id)!==String(draft.id); });
  var h='';
  if(!others.length) h='<p class="ro empty">この方の前の受診はまだありません。</p>';
  else{
    h+='<div class="prevpick"><div class="fi"><label for="h-prev">見る受診</label><select id="h-prev">'+others.map(function(v){
      var d=C.mdw(v.visit_date)||C.mdw(v.letter_date)||'日付なし';
      return '<option value="'+esc(v.id)+'"'+(p&&String(v.id)===String(p.id)?' selected':'')+'>'+esc(d+'　'+(v.hospital_name||'病院の記載なし'))+'</option>';
    }).join('')+'</select></div></div>';
    if(p){
      h+='<dl class="kv" style="margin-top:10px"><dt>病院</dt><dd>'+esc([p.hospital_name,p.dept].filter(Boolean).join('　')||'—')+'</dd>'+
        '<dt>医師</dt><dd>'+esc(p.doctor||'—')+'</dd><dt>受診日</dt><dd>'+esc(C.jpDate(p.visit_date)||'—')+'</dd>'+
        '<dt>受診種別</dt><dd>'+esc(p.visit_kind||'—')+'</dd><dt>結果</dt><dd>'+esc([p.result1,p.result2].filter(Boolean).join('・')||'—')+'</dd>'+
        '<dt>追加薬</dt><dd>'+esc((p.added_med||'—')+(p.added_med_note?'　'+p.added_med_note:''))+'</dd>'+
        (p.next_date?'<dt>次回の受診</dt><dd>'+esc(C.jpDate(p.next_date))+'</dd>':'')+'</dl>';
      h+='<h3>診察内容</h3>'+roBox_(p.result_body,'診察内容はまだ書かれていません。');
      h+=diffHtml_(p.result_body);
      if(p.result_note) h+='<h3>備考</h3>'+roBox_(p.result_note,'');

function diffHtml_(text){
  var sp=C.splitBeforeAfter(text); if(!C.trim(sp.before)||!C.trim(sp.after)) return '';
  var d=C.medDiff(sp.before,sp.after); if(!d.added.length&&!d.removed.length) return '';
  return '<div class="diff">'+(d.added.length?'<b>受診後に増えた薬</b>'+d.added.map(esc).join('<br>'):'')+
    (d.removed.length?'<b'+(d.added.length?' style="margin-top:6px"':'')+'>受診後に無くなった薬</b>'+d.removed.map(esc).join('<br>'):'')+'</div>';

}

function insertAt_(id,text){
  var ta=$(id); if(!ta) return;
  var s=ta.selectionStart!=null?ta.selectionStart:ta.value.length, e=ta.selectionEnd!=null?ta.selectionEnd:s;
  var before=ta.value.slice(0,s), after=ta.value.slice(e);
  var pre=before&&!/\n\n$/.test(before)?(/\n$/.test(before)?'\n':'\n\n'):'';
  ta.value=before+pre+text+(after?'\n\n':'')+after;
  ta.dispatchEvent(new Event('input',{bubbles:true}));
  try{ ta.focus(); }catch(_){}
}

/* ═══════════ 保存・取り消し ═══════════ */
function save_(){
  if(saving||!draft||!cur) return Promise.resolve(false);
  readForm_();
  var errs=C.checkVisit(draft);
  if(errs.length){ setMsg('h-dmsg',errs.join(' ')); return Promise.resolve(false); }
  if(String(draft.resident_id)!==String(cur.id)){ setMsg('h-dmsg','書いている受診と選んでいる方が合いません。読み直してください。'); return Promise.resolve(false); }
  saving=true; lockDesk_(true); setMsg('h-dmsg',''); setSync('保存しています…');
  var my=gen, sent=draft, body=C.toSave(draft), rev=draft.id?draft.rev:null;
  if(!body.hospital_id) body.hospital_id='';
  return rpc_('hv_save_visit',{p_row:body,p_rev:rev}).then(function(d){
    if(my!==gen) return false;
    if(d&&d.ok===true&&d.row){
      var row=d.row, i=-1;
      visits.forEach(function(v,k){ if(String(v.id)===String(row.id)) i=k; });
      if(i>=0) visits[i]=row; else visits.push(row);
      visits=C.sortVisits(visits);
      /* 保存の間に別の受診を開いた・新しく始めた時は、今の下書きに触らない。同じ受診なら、保存の間に打った分を残す（入力欄から読み直す） */
      if(draft===sent){ readForm_(); var keep=draft; base=C.fromRow(row); keep.id=base.id; keep.rev=base.rev; draft=keep; }
      toast('保存しました'); setSync(''); if(draft===sent) clearConflict_();
      refreshRecent_();
      paintAll_();
      return true;
    }
    if(d&&d.conflict){
      setSync('');
      if(draft!==sent) return false;
      setMsg('h-dmsg','ほかの人（または別の画面）がこの受診を先に直しました。書いた内容は残っています。控えてから「読み直す」を押すと、今の内容を開きます。');
      showConflict_(d.row);
      return false;
    }
    setSync(''); setMsg('h-dmsg',ngText_('保存',d)); return false;
  }).catch(function(e){
    if(my!==gen) return false;
    note_('保存',e); setSync(''); setMsg('h-dmsg',friendly_(e)); return false;
  }).then(function(r){ saving=false; if(my===gen) lockDesk_(dbState!=='ok'); return r; });
}
function showConflict_(row){
  showConflict_.row=row||null;
  var acts=document.querySelector('.foot');
  if(!acts||$('h-reload')) return;
  var b=document.createElement('button'); b.type='button'; b.className='btn sm'; b.id='h-reload'; b.textContent='読み直す'; b.setAttribute('data-act','reload-visit');
  acts.insertBefore(b,acts.firstChild.nextSibling);
}
/* 競合の読み直しを外す（方・受診を替えた時・保存できた時）。別の方の行を開けるボタンを残さない（反証レビュー 1） */
function clearConflict_(){ showConflict_.row=null; var rb=$('h-reload'); if(rb) rb.remove(); }
function refreshRecent_(){
  var my=gen;
  rpc_('hv_list',{p_resident:null}).then(function(d){ if(!d||d.ok!==true) return; recent=Array.isArray(d.visits)?d.visits:[]; writeMenuDue_(); }).catch(function(e){ note_('一覧の読み直し',e); });
}
/* メニューのタイルの札（結果まだn）の件数を端末に残す。一覧を読めた時だけ（読めない時は前の件数を0件で上書きしない）・現場の端末では書かない */
function writeMenuDue_(){
  if(isField()) return;
  var v=C.menuDue(recent,C.todayJST()); if(!v) return;
  try{ if(localStorage.getItem(C.MENU_DUE_KEY)!==v) localStorage.setItem(C.MENU_DUE_KEY,v); }catch(e){ /* 私用モードなど・札が出ないだけ */ }
}
function cancelVisit_(){
  if(!draft||!draft.id) return;
  confirm_('この受診（手紙と結果）を取り消します。取り消した受診は一覧から消え、直せなくなります（記録としては残ります）。よろしいですか？').then(function(ok){
    if(!ok) return;
    var my=gen, id=draft.id;
    setSync('取り消しています…');
    rpc_('hv_cancel_visit',{p_id:id,p_rev:draft.rev}).then(function(d){
      if(my!==gen) return;
      setSync('');
      if(d&&d.ok===true){ visits=visits.filter(function(v){ return String(v.id)!==String(id); }); toast('取り消しました'); refreshRecent_(); newVisit_(); paintAll_(); return; }
      if(d&&d.conflict){ setMsg('h-dmsg','ほかの人が先に直しました。読み直してから取り消してください。'); showConflict_(d.row); return; }
      setMsg('h-dmsg',ngText_('取り消し',d));
    }).catch(function(e){ if(my!==gen) return; note_('取り消し',e); setSync(''); setMsg('h-dmsg',friendly_(e)); });
  });
}

/* ═══════════ 印刷（手紙の紙・A4 縦） ═══════════ */
function definePrint_(){
  if(!window.SUPrint||definePrint_.done) return;
  definePrint_.done=true;
  /* 1枚に収まる時は 12px まで縮めて1枚にし、収まらない時は 15px のまま次のページへ続ける（読める大きさを優先・仮置き） */
  window.SUPrint.define('letter',{label:'受診の手紙',paper:'A4 portrait',margin:14,root:'#h-print',
    fit:{mode:'height',cssVar:'--hl-fs',base:15,min:12,step:0.25,minFallback:'base'},
    when:function(){ return printOn&&view==='app'; },
    before:function(){ var p=$('h-print'); if(p) p.innerHTML=C.letterHtml(draft,settings,facName_()); },
    after:function(){ var p=$('h-print'); if(p) p.innerHTML=''; printOn=false; }});
}
function print_(){
  if(view!=='app'||!draft) return;
  readForm_();
  if(!C.trim(draft.resident_name)){ setMsg('h-dmsg','入居者を選んでください。'); return; }
  if(!window.SUPrint){ toast('印刷の部品を読み込めていません。ページを読み込み直してください'); return; }
  var go=function(){
    if(view!=='app') return;
    printOn=true;
    try{ window.SUPrint.print('letter'); }catch(e){ note_('手紙の印刷', e); }
    if(!document.body.classList.contains('su-printing')) printOn=false;
  };
  /* 署名に施設名を刷るので、施設情報を最大3秒待ち、読めなければ刷らない（su-print.js の facGate） */
  if(!window.SUPrint.facGate){ go(); return; }
  window.SUPrint.facGate(go,function(msg){ toast(msg); });
}

    '<div class="fi" style="margin-top:8px"><label for="s-openingTail">書き出しの続き（「〇〇 様」の後ろ）</label><input type="text" id="s-openingTail" maxlength="200" value="'+esc(s.openingTail)+'"></div>'+
    '<div class="fi" style="margin-top:8px"><label for="s-titleTail">題（「〇〇 様」の後ろ）</label><input type="text" id="s-titleTail" maxlength="200" value="'+esc(s.titleTail)+'"></div>'+
    '<div class="fi" style="margin-top:8px"><label for="s-closing">結び</label><input type="text" id="s-closing" maxlength="200" value="'+esc(s.closing)+'"></div>'+
    '<div class="fi" style="margin-top:8px"><label for="s-honorific">宛名の脇付け</label><input type="text" id="s-honorific" maxlength="200" value="'+esc(s.honorific)+'"></div>'+
    '<div class="grid2" style="margin-top:8px"><div class="fi"><label for="s-signOrg">署名の1行目（空なら施設情報の施設の呼び名）</label><input type="text" id="s-signOrg" maxlength="200" value="'+esc(s.signOrg)+'" placeholder="'+esc(facName_())+'"></div>'+
    '<div class="fi"><label for="s-signName">署名の2行目（肩書と氏名）</label><input type="text" id="s-signName" maxlength="200" value="'+esc(s.signName)+'"></div></div>'+
    '<div class="grid3" style="margin-top:8px"><div class="fi"><label for="s-kinds">受診種別（1行に1つ）</label><textarea id="s-kinds" rows="6">'+esc(s.kinds.join('\n'))+'</textarea></div>'+
    '<div class="fi"><label for="s-results1">結果（1行に1つ）</label><textarea id="s-results1" rows="6">'+esc(s.results1.join('\n'))+'</textarea></div>'+
    '<div class="fi"><label for="s-results2">結果・もう1つ（1行に1つ）</label><textarea id="s-results2" rows="6">'+esc(s.results2.join('\n'))+'</textarea></div></div>'+
    '<p class="msg" id="d-msg" role="alert"></p>'+
    '<div class="btns"><button type="button" class="btn" data-act="dlg-close">閉じる</button><button type="button" class="btn go" data-act="set-save">保存する</button></div>');
}
function setSave_(){
  var d={};
  ['opening','openingTail','titleTail','closing','honorific','signOrg','signName'].forEach(function(k){ d[k]=$('s-'+k).value; });
  ['kinds','results1','results2'].forEach(function(k){ d[k]=C.linesToList($('s-'+k).value); });
  var my=gen;
  rpc_('hv_save_settings',{p_data:d,p_rev:settingsRev}).then(function(r){
    if(r&&r.ok===true){ settings=C.normSettings(r.data); settingsRev=Number(r.rev); toast('設定を保存しました'); closeDlg_(); if(my===gen&&cur&&draft){ readForm_(); paintRight_(); } return; }
    if(r&&r.conflict){ settings=C.normSettings(r.data); settingsRev=Number(r.rev); setDlg_(); setMsg('d-msg','ほかの人が先に設定を直しました。今の設定を読み込んだので、もう一度直して保存してください。'); return; }
    setMsg('d-msg',ngText_('設定の保存',r));
  }).catch(function(e){ note_('設定の保存',e); setMsg('d-msg',friendly_(e)); });
}

/* ═══════════ 押した時・入れた時 ═══════════ */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act],[data-ltab],[data-rtab],[data-pane]'); if(!t||view!=='app') return;
  if(t.hasAttribute('data-ltab')) return setLtab_(t.getAttribute('data-ltab'));
  if(t.hasAttribute('data-rtab')) return setRtab_(t.getAttribute('data-rtab'));
  if(t.hasAttribute('data-pane')&&!t.hasAttribute('data-act')){
    var w=$('h-work'); w.setAttribute('data-pane',t.getAttribute('data-pane'));
    Array.prototype.forEach.call(document.querySelectorAll('.narrowtabs .tab'),function(b){ b.setAttribute('aria-selected',String(b===t)); });
    return;
  }
  var a=t.getAttribute('data-act');
  if(a==='pick') return pickResident_(t.getAttribute('data-id'));
  if(a==='open-recent') return pickResident_(t.getAttribute('data-rid'),t.getAttribute('data-vid'));
  if(a==='home'){ var back=function(){ gen++; showHome_(); setMsg('h-msg',''); loadHome_(); }; if(isDirty_()) return confirm_('保存していない書きかけがあります。保存せずに一覧へ戻りますか？').then(function(ok){ if(ok) back(); }); return back(); }
  if(a==='new'){
    readForm_();
    var mk=function(){ newVisit_(); paintAll_(); };
    if(isDirty_()) return confirm_('保存していない書きかけがあります。保存せずに新しい受診を始めますか？').then(function(ok){ if(ok) mk(); });
    return mk();
  }
  if(a==='save') return save_();
  if(a==='print') return print_();
  if(a==='cancel-visit') return cancelVisit_();
  if(a==='reload-visit'){
    var row=showConflict_.row;
    if(!row||!cur||!draft||String(row.resident_id)!==String(cur.id)||String(row.id)!==String(draft.id)){ clearConflict_(); return; }
    var i=-1; visits.forEach(function(v,k){ if(String(v.id)===String(row.id)) i=k; }); if(i>=0) visits[i]=row;
    openVisit_(row); setMsg('h-dmsg',''); paintAll_();
    return;
  }
  if(a==='hosp-pick'){
    readForm_();
    var key=t.getAttribute('data-key'), hc=C.hospitalChoices(hospitals,medical&&!medical.missing?medical:null,visits), c=null;
    hc.forEach(function(x){ if(x.key===key) c=x; });
    if(c){ draft.hospital_id=c.hospital_id||''; draft.hospital_name=c.name; draft.dept=c.dept||''; draft.doctor=c.doctor||''; paintRight_(); paintLeft_(); paintState_(); }
    return;
  }
  if(a==='letter-start'){ readForm_(); if(C.trim(draft.letter_body)) return; var p=C.prevVisitFor(visits,draft);
    if(!(p&&/【[^】]*受診[前後]】/.test(String(p.result_body||'')))&&!medsOk_()){ setMsg('h-dmsg',NO_MEDS); return; }
    draft.letter_body=C.letterStarter(p,medical.medsRegular!=null?medical.medsRegular:''); paintRight_(); paintState_(); return; }
  if(a==='result-start'){ readForm_(); if(C.trim(draft.result_body)) return; if(!medsOk_()){ setMsg('h-dmsg',NO_MEDS); return; } draft.result_body=C.resultStarter(medical.medsRegular,draft.visit_date); paintRight_(); paintState_(); return; }
  if(a==='ins-prev'){ var pv=prevVisit_(); if(!pv) return; readForm_(); setRtab_('letter'); insertAt_('f-letter_body',C.letterIndent(String(pv.result_body||'').replace(/【受診前】/g,'【前回受診前】'))); return; }
  if(a==='ins-meds-letter'){ if(!medsOk_()){ setMsg('h-dmsg',NO_MEDS); return; } readForm_(); setRtab_('letter'); insertAt_('f-letter_body',C.letterIndent(C.medsBlock('現在の処方',medical&&medical.medsRegular))); return; }
  if(a==='ins-meds-result'){
    if(!medsOk_()){ setMsg('h-dmsg',NO_MEDS); return; }
    readForm_(); setRtab_('result');
    if(C.trim(draft.result_body)) insertAt_('f-result_body',C.resultStarter(medical&&medical.medsRegular,draft.visit_date));
    else { draft.result_body=C.resultStarter(medical&&medical.medsRegular,draft.visit_date); paintRight_(); paintState_(); }
    return;
  }
  if(a==='am-clear'){ Array.prototype.forEach.call(document.querySelectorAll('input[name=f-added_med]'),function(r){ r.checked=false; }); readForm_(); paintState_(); return; }
  if(a==='hosp-open'){ hEdit=null; return hospDlg_(); }
  if(a==='hosp-edit'){ var id=t.getAttribute('data-id'); hEdit=null; hospitals.forEach(function(h){ if(String(h.id)===id) hEdit=h; }); return hospDlg_(); }
  if(a==='hosp-new'){ hEdit=null; return hospDlg_(); }
  if(a==='hosp-save') return hospSave_();
  if(a==='set-open') return setDlg_();
  if(a==='set-save') return setSave_();
  if(a==='dlg-close') return askCloseDlg_();
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='h-q'){ paintHome_(); return; }
  if(!draft||!t.id) return;
  if(/^f-/.test(t.id)||t.name==='f-added_med'){
    if(t.id==='f-visit_date2'){ var o=$('f-visit_date'); draft.visit_date=t.value; if(o) o.value=t.value; }
    readForm_(); paintState_();
    if(t.id==='f-result_body'){ var dv=document.querySelector('#rp-result .diff'), nh=diffHtml_(t.value); if(dv) dv.outerHTML=nh||''; else if(nh) t.parentNode.insertAdjacentHTML('afterend',nh); }
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='h-visit'){
    var id=t.value;
    var go=function(){ var x=null; visits.forEach(function(v){ if(String(v.id)===id) x=v; }); if(x) openVisit_(x); paintAll_(); };
    readForm_();
    if(isDirty_()) return confirm_('保存していない書きかけがあります。保存せずに別の受診を開きますか？').then(function(ok){ if(ok) go(); else paintVisitSel_(); });
    return go();
  }
  if(t.id==='h-prev'){ prevId=t.value; paintLeft_(); return; }
  if(t.name==='f-added_med'||/^f-/.test(t.id)){ readForm_(); paintState_(); }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&dlgOpen){ askCloseDlg_(); return; }
  /* Cmd/Ctrl+S もボタンと同じ止めを通す（読み込み中・読めなかった時は保存しない・反証レビュー 7） */
  if((ev.metaKey||ev.ctrlKey)&&(ev.key==='s'||ev.key==='S')&&view==='app'&&draft){ ev.preventDefault(); var sb=$('h-save'); if(!loading&&!dlgOpen&&sb&&!sb.disabled) save_(); }
});
$('h-dlg').addEventListener('click',function(ev){ if(ev.target===$('h-dlg')) askCloseDlg_(); });
$('h-dlg').addEventListener('input',function(){ dlgDirty=true; });
/* 別のタブで端末の用途が「現場」に変わったら、読み込み直して起動の止めに任せる（CLAUDE.md §2-5・反証レビュー 6） */
window.addEventListener('storage',function(ev){ if(ev.key===DEVICE_KEY&&isField()&&view!=='field'){ try{ location.reload(); }catch(e){ note_('用途の切り替え',e); } } });
window.addEventListener('beforeunload',function(ev){ if(isDirty_()){ ev.preventDefault(); ev.returnValue=''; } });

function init_(){
  var go=function(){ boot_().catch(function(e){ note_('起動',e); var g=$('h-gate'); g.hidden=false; g.textContent='受診連絡を開けませんでした。ページを読み込み直してください。'; }); };
  if(window.SUFacility&&typeof window.SUFacility.onReady==='function') window.SUFacility.onReady(go); else go();
}
init_();
</script>
