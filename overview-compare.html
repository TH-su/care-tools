<style>
/* 訪問 週間俯瞰 と 全支援 週間俯瞰 を同一オリジンの iframe で左右に並べ、時刻・曜日・表示倍率を連動させる比較シェル。
   ★このシェル自身は氏名を一切描画せず、共有データ・GAS へ書き込まない（iframe のスクロール/倍率の読み書きのみ）。
     端末に残すのは連動の入／切（ocmp_sync・'1'／'0'・2026-10-22 代表者の決定 B）と、幅700px以下で選んだタブ（ocmp_tab・'visit'／'support'・2026-11-13）だけ（再読み込みで現在地を失わない決まり）。
   既存2ツールのコードには非干渉（連動は各 iframe が公開する window.OVLINK を呼ぶだけ）。 */
:root {
  --pri: #0b57d0; --pri-d: #0842a0; --orange: #b45309; --orange-l: #ffe0b2;
  --g1: #f1f3f4; --g3: #dadce0; --g6: #80868b; --g7: #5f6368; --g9: #202124;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  color: var(--g9); background: var(--g3); display: flex; flex-direction: column; overflow: hidden;
}
.hdr {
  flex-shrink: 0; min-height: 50px; display: flex; align-items: center; gap: 10px;
  padding: 6px 12px; flex-wrap: wrap; color: #fff;
  background: linear-gradient(90deg, var(--pri) 0 50%, var(--orange-l) 50% 100%);   /* 左=青(訪問)・右=薄橙(全支援) */
  box-shadow: 0 2px 6px rgba(0,0,0,.25); z-index: 100;
}
.hdr-title { font-size: 0.9375rem; font-weight: 700; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.hdr-sp { flex: 1; }
/* 連動トグルは左半分（青地）＝白文字。 */
.sync-toggle {
  display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 12px;
  background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.6); border-radius: 6px;
  font-size: 0.8125rem; font-weight: 700; color: #fff; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.4);
}
.sync-toggle:focus-within { outline: 2px solid #fff; outline-offset: 1px; }
.sync-toggle input { width: 20px; height: 20px; cursor: pointer; }
/* 単独ビューへのリンクは右半分（薄オレンジ地）＝どちらの半分でも読める白チップ＋濃色文字。 */
.link-single {
  min-height: 44px; display: inline-flex; align-items: center; background: #fff;
  border: 1px solid rgba(0,0,0,.18); color: #3c4043; border-radius: 6px; padding: 6px 14px;
  font-size: 0.8125rem; font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.link-single:hover { background: #f1f3f4; }
.link-single:focus-visible { outline: 2px solid #5f3300; outline-offset: 1px; }
.hdr-note { font-size: 0.6875rem; color: #5f3300; font-weight: 600; white-space: nowrap; text-shadow: 0 1px 1px rgba(255,255,255,.55); }

/* 目的の1行と連動の凡例（2026-10-11・監査10月版 v2）。見出しの下の細い帯。盤面・印刷には触れない */
.purpose {
  flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px;
  padding: 4px 12px; background: #fff; border-bottom: 1px solid var(--g3);
  font-size: 0.75rem; line-height: 1.5; color: var(--g9);
}
.purpose b { font-weight: 700; }
.purpose .pv { color: var(--pri-d); }
.purpose .ps { color: var(--orange); }
.purpose-legend { color: var(--g7); }
/* 連動の準備ができずにあきらめた時だけ凡例の後ろに出す知らせ（2026-11-08 商用化の点検）。画面だけ・印刷に出さない */
.sync-warn { margin-left: 8px; color: #8f0c0c; font-weight: 700; }
@media print { .sync-warn { display: none; } }

.panes { flex: 1; display: flex; min-height: 0; }
.pane { flex: 1 1 50%; min-width: 0; position: relative; }
.pane.left { border-right: 2px solid var(--g7); }
.pane iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.pane-tag {
  position: absolute; top: 8px; left: 8px; z-index: 5; font-size: 0.6875rem; font-weight: 700; color: #fff;
  padding: 2px 9px; border-radius: 10px; pointer-events: none; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.pane.left  .pane-tag { background: var(--pri-d); }
.pane.right .pane-tag { background: var(--orange); }
/* 札を中の画面の見出しの上に重ねると、見出しの文字（「訪問 週間俯瞰」など）にかぶっていた。
   画面では重ねずに、それぞれの画面のすぐ上の細い帯に置く（印刷は変えない＝@media screen の中だけ・2026-11-02 推奨どおり） */
@media screen {
  .pane { display: flex; flex-direction: column; }
  .pane-tag { position: static; align-self: flex-start; flex-shrink: 0; margin: 4px 8px; box-shadow: none; }
  .pane iframe { flex: 1 1 auto; height: auto; min-height: 0; }
}

/* 狭い画面（タブレット縦・スマホ）は上下2段に */
@media (max-width: 860px) {
  .panes { flex-direction: column; }
  .pane.left { border-right: none; border-bottom: 2px solid var(--g7); }
}
/* 上下2段の時、各段が札＋iframe の既定の高さ（約180px）より縮まず、iPhone の横向きなど低い画面で全支援が下へ押し出されていた。
   段の最低の高さを外し、入れ物の高さを2つで分け合う（画面だけ・印刷は変えない・代表者の決定 2026-11-13） */
@media screen and (max-width: 860px) { .pane { min-height: 0; } }
/* 高さ500px以下の横向き（iPhone の横など）は、見出し・案内だけで画面がほぼ埋まり盤面が残らない。
   この時だけページ全体を縦に送れるようにし、盤面に画面の高さの8割を持たせる（送れば見出しは上へ隠れる）。
   タブの形（700px以下）でも同じ。文言・表示の中身は変えない（画面だけ・印刷は変えない・代表者の決定 2026-11-13） */
@media screen and (max-height: 500px) and (orientation: landscape) {
  html, body { height: auto; }
  body { overflow: visible; }
  .panes { flex: 0 0 auto; height: 80vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* 字と地の差を 7:1 以上にそろえる（画面だけ・色合いはそのまま濃くする・印刷の紙は元の色のまま・代表者「推奨どおり色も7:1にそろえて」2026-11-03） */
@media screen { :root[data-su-theme] { --orange: #904207; } }   /* 全支援の橙（白地・白い字とも 7.1:1） */
/* 見出しの「← メニュー」（ホーム画面から開いた iPhone でもメニューへ戻れるように・画面だけ・印刷しない・2026-11-12） */
.su-menu-back{display:inline-flex;align-items:center;flex:0 0 auto;white-space:nowrap;text-decoration:none}
/* 見出しがすでに折り返す画面は、899px 以下で「← メニュー」を1段目に単独で置く（既存の部品の並び・段を変えない・代表者の決定 2026-11-12） */
.su-menu-row{display:contents}
@media screen and (max-width:899px){.su-menu-back{min-height:44px} .su-menu-row{display:block;flex:0 0 100%}}
@media print{.su-menu-back{display:none !important}}

/* 見出しの使い方の1行（全幅・画面だけ・印刷しない・代表者の指示 2026-11-13）。見出しは左が青・右が薄橙なので、白い地を持たせて読めるようにする */
.hdr-usage { display: none; }
@media screen {
  .hdr-usage {
    display: block; flex: 0 0 100%; margin: 0; padding: 3px 10px; border-radius: 6px;
    background: #fff; color: var(--g9); font-size: 0.75rem; font-weight: 600; line-height: 1.5; text-shadow: none;
  }
}
/* 幅700px以下は「訪問／全支援」のタブで片方ずつ全幅に見せる（代表者の指示 2026-11-13・画面だけ）。
   隠す方は読み込み直さず、同じ場所に重ねて見えなくするだけ（display:none にすると中の幅が 0 になり、連動の倍率そろえが進まない） */
.cmp-tabs { display: none; }
@media screen and (max-width: 700px) {
  .cmp-tabs { flex-shrink: 0; display: flex; gap: 6px; padding: 6px 8px; background: #fff; border-bottom: 1px solid var(--g3); }
  .cmp-tab {
    flex: 1 1 50%; min-height: 44px; border-radius: 6px; font: inherit; font-size: 0.9375rem; font-weight: 700; cursor: pointer;
    background: #fff; color: var(--pri-d); box-shadow: inset 0 0 0 2px var(--pri-d); border: 0;
  }
  .cmp-tab[data-tab="support"] { color: var(--orange); box-shadow: inset 0 0 0 2px var(--orange); }
  .cmp-tab[aria-selected="true"] { background: var(--pri-d); color: #fff; }
  .cmp-tab[data-tab="support"][aria-selected="true"] { background: var(--orange); color: #fff; }
  .cmp-tab:focus-visible { outline: 3px solid var(--g9); outline-offset: 2px; }
  .panes { position: relative; }
  .pane { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .pane.left { border-bottom: none; }
  .pane-tag { display: none; }   /* どちらを見ているかはタブで分かる */
  .panes[data-tab="visit"] .pane.right,
  .panes[data-tab="support"] .pane.left { visibility: hidden; }
}
</style>

<!-- 画面が黙って壊れないようにする共通モジュール。このツールのスクリプトより前に置く
     （起動時の例外も拾うため）。記録と通知だけを行い、既存の動作は変えない。 -->
<script src="su-errors.js?v=2026-11-12"></script>
<script src="su-perf.js?v=2026-10-27"></script>
<script>
'use strict';
/* 左右iframeの表示連動。各iframeが公開する
   window.OVLINK（centerTime/scrollToTime/centerDay/scrollToDay/setZoom/getZoom/onZoom）を使い
   ①縦スクロール＝中央時刻を合わせる ②横スクロール＝中央の曜日位置を合わせる
   ③ズーム＝倍率を揃える（同じ倍率＝1時間の高さが同じ＝同じ時間帯が同じ高さで並ぶ）。
   縦横とも生pxではなく「時刻」「曜日位置」という意味単位でやり取りするため、倍率や盤面幅が違っても一致する。
   同一オリジン前提（GitHub Pages 同ディレクトリ）。
   ★このシェルは iframe の scrollTop/zoom 設定と DOM 読取のみ。共有データ・localStorage へ書き込まない。
   ★エコー抑止に setTimeout/requestAnimationFrame を使わない：背景タブでは rAF が止まりフラグが解除されず
     連動が永久に効かなくなるため。代わりに「自分が設定した値と一致する通知は無視」する値ベース判定を使う。 */
(function () {
  var A = document.getElementById('fVisit');    // 訪問
  var B = document.getElementById('fSupport');  // 全支援
  var syncOn = document.getElementById('syncOn');

  function kit(ifr)   { try { return ifr.contentWindow && ifr.contentWindow.OVLINK; } catch (e) { return null; } }
  function wrapOf(ifr){ try { return ifr.contentDocument && ifr.contentDocument.getElementById('boardWrap'); } catch (e) { return null; } }
  function boardOf(ifr){ try { return ifr.contentDocument && ifr.contentDocument.getElementById('board'); } catch (e) { return null; } }

  // 比較ビューでは各ペインの印刷ボタン・入れ子の切替スイッチ/比較リンクを隠す
  // （iframe内印刷はA3縦1枚を保証できないため入口を閉じる。単独画面の印刷機能は不変）。
  function tidyPane(ifr) {
    try {
      var d = ifr.contentDocument; if (!d) return;
      var pb = d.getElementById('btnPrint'); if (pb) pb.style.display = 'none';
      var hide = d.querySelectorAll('.ovsw, .ovcmp');
      for (var i = 0; i < hide.length; i++) hide[i].style.display = 'none';
      // 枠の中では「← メニュー」も出さない（この画面の見出しに同じ道がある・2026-11-12）
      var back = d.querySelectorAll('.su-menu-row, .su-menu-back');
      for (var j = 0; j < back.length; j++) back[j].style.display = 'none';
    } catch (e) {}
  }

  // ── スクロール連動（縦=時刻・横=曜日の両方。エコー判定は「直前に自分が設定した位置と一致するか」） ──
  var expect = { v: null, s: null };            // プログラム的に設定した直近の {top,left}
  // 相手ペインを「同じ時刻・同じ曜日」に合わせる
  function applyView(ifr, key, t, d) {
    var k = kit(ifr), w = wrapOf(ifr);
    if (!k || !w) return;
    var bt = w.scrollTop, bl = w.scrollLeft;
    k.scrollToTime(t);
    if (d !== null && typeof k.scrollToDay === 'function') k.scrollToDay(d);
    if (w.scrollTop !== bt || w.scrollLeft !== bl) {
      expect[key] = { top: w.scrollTop, left: w.scrollLeft };   // clamp 後の実値を記録
    } else if (!isEcho(key, w)) {
      // 位置が動かなければ scroll イベントは出ないので記録は残さない。ただし「未配送のエコー記録」と
      // 一致する場合は消さない（消すと後から届いた本物のエコーを実操作と誤認して1回押し戻してしまう）。
      expect[key] = null;
    }
  }
  function isEcho(key, w) {
    var e = expect[key];
    return !!e && Math.abs(w.scrollTop - e.top) <= 1 && Math.abs(w.scrollLeft - e.left) <= 1;
  }
  function onScroll(srcIfr, srcKey, dstIfr, dstKey) {
    var w = wrapOf(srcIfr); if (!w) return;
    if (isEcho(srcKey, w)) {
      expect[srcKey] = null; return;            // 自分が設定した分の反響＝無視（連続スクロールは妨げない）
    }
    expect[srcKey] = null;
    if (!syncOn.checked) return;
    var ks = kit(srcIfr); if (!ks) return;
    applyView(dstIfr, dstKey, ks.centerTime(), (typeof ks.centerDay === 'function') ? ks.centerDay() : null);
  }

  // ── ズーム連動（±ボタン・2本指ピンチ・ctrl+wheel はすべて setZoom を通るのでこの1経路で捕捉） ──
  // setZoom → onZoom は同期呼び出しのため、再入フラグだけで反響を止められる（タイマー不要）。
  var inZoom = false;
  function onZoomFrom(srcIfr, dstIfr, dstKey, z) {
    if (!syncOn.checked || inZoom) return;
    inZoom = true;
    try {
      var ks = kit(srcIfr), kd = kit(dstIfr);
      if (ks && kd) {
        if (Math.abs(kd.getZoom() - z) > 0.001) kd.setZoom(z);   // 倍率を揃える
        // 倍率変更後に時刻と曜日を合わせ直す（拡大すると横にもはみ出すため横も必要）
        applyView(dstIfr, dstKey, ks.centerTime(), (typeof ks.centerDay === 'function') ? ks.centerDay() : null);
      }
    } finally { inZoom = false; }
  }

  // ── 起動時：両ペインの倍率を「狭い方に合わせて」揃える（最初から同じ時間スケールで並ぶ） ──
  // ★全支援は N週集計の取得後に描画されるため iframe の load 時点では盤面が空。
  //   空のまま測ると最小幅(50+96×7=722px)で確定してしまい、描画後にはみ出したまま直らない。
  //   そこで #bCanvas に子要素が入る＝描画完了を待ってから測る。
  function rendered(ifr) {
    try {
      var c = ifr.contentDocument && ifr.contentDocument.getElementById('bCanvas');
      return !!(c && c.children.length);
    } catch (e) { return false; }
  }
  function fitZoom(ifr) {
    var bd = boardOf(ifr), w = wrapOf(ifr), k = kit(ifr);
    if (!bd || !w || !k || !w.clientWidth) return null;           // レイアウト未確定
    var z = k.getZoom() || 1;
    // getBoundingClientRect は zoom が必ず反映される。scrollWidth は zoom の扱いにブラウザ差があるため使わない。
    var rect = bd.getBoundingClientRect();
    var natural = (rect.width || bd.scrollWidth) / z;             // 等倍換算した盤面幅
    if (!natural) return null;
    return (natural > w.clientWidth + 4) ? Math.max(0.5, w.clientWidth / natural) : 1;
  }
  var equalized = false;
  function equalize() {
    if (equalized || !syncOn.checked) return;
    var ka = kit(A), kb = kit(B);
    if (!ka || !kb) return;
    if (!rendered(A) || !rendered(B)) return;                     // 両盤面の描画完了まで待つ
    var fa = fitZoom(A), fb = fitZoom(B);
    if (fa === null || fb === null) return;                       // 両ペインのレイアウト確定まで待つ
    var z = Math.min(fa, fb);                                     // 狭い方に合わせる＝両方が収まる
    inZoom = true;                                                // 揃える間の相互通知を止める
    try { ka.setZoom(z); kb.setZoom(z); } finally { inZoom = false; }
    applyView(B, 's', ka.centerTime(), (typeof ka.centerDay === 'function') ? ka.centerDay() : null);
    equalized = true;                                             // 成功後に確定（例外時は次回 tick で再試行）
  }

  // ── 配線（多重登録を防ぐためペインごとに1回だけ） ──
  var bound = { v: false, s: false };
  function bindOnce(ifr, key, other, otherKey) {
    if (bound[key]) return true;
    var w = wrapOf(ifr), k = kit(ifr);
    if (!w || !k) return false;
    w.addEventListener('scroll', function () { onScroll(ifr, key, other, otherKey); }, { passive: true });
    k.onZoom = function (z) { onZoomFrom(ifr, other, otherKey, z); };
    bound[key] = true;
    return true;
  }

  // OVLINK・レイアウト・盤面描画が整うまでポーリング（全支援は N週集計の取得→描画を待つ）。
  // 例外で鎖が死なないよう try で包み、タイマーは常に1本に正規化する（複数鎖が tries を食い合うのを防ぐ）。
  var tries = 0, timer = 0;
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(tick, 200);
  }
  function tick() {
    timer = 0;
    try {
      bindOnce(A, 'v', B, 's');
      bindOnce(B, 's', A, 'v');
      equalize();
    } catch (e) {}                               // 一度の失敗でポーリングを止めない
    if (bound.v && bound.s && equalized) { if (warn) showLegend(); return; }   // 後から整ったら知らせを消す
    if (tries++ > 150) { showGiveUp(); return; } // 約30秒（12週取得＋描画の待ちを含む上限）。あきらめた時は画面で知らせる
    schedule();
  }

  function onLoad(ifr, key) {
    bound[key] = false;                          // iframe 再読込時は配線をやり直す
    expect[key] = null;
    equalized = false;                           // 再読込側は倍率1に戻るため揃え直す（片側だけズレたまま固定になるのを防ぐ）
    tidyPane(ifr);
    tries = 0;
    tick();
  }
  A.addEventListener('load', function () { onLoad(A, 'v'); });
  B.addEventListener('load', function () { onLoad(B, 's'); });

  // 連動の入／切を端末に覚え、読み込み直しても戻す（2026-10-22 代表者の決定 B）。残すのはこの1つだけ・決まった値だけを受け付ける
  var SYNC_KEY = 'ocmp_sync';
  try { if (localStorage.getItem(SYNC_KEY) === '0') syncOn.checked = false; } catch (eS) { /* 読めなければ既定（入） */ }
  syncOn.addEventListener('change', function () {
    try { localStorage.setItem(SYNC_KEY, syncOn.checked ? '1' : '0'); } catch (eW) { /* 残せなくても画面は動く */ }
  });
  // 凡例は連動スイッチの状態に合わせて言い換える
  var legend = document.getElementById('cmpLegend');
  var LEGEND_ON = '連動中：縦に動かすと同じ時刻、横に動かすと同じ曜日、拡大・縮小すると同じ倍率に、もう片方がそろいます。';
  var LEGEND_OFF = '連動を切っています：左右は別々に動きます。「時刻・曜日・倍率を連動」を入れると、次に動かした時からまたそろいます。';
  function showLegend() { warn = null; if (legend) legend.textContent = syncOn.checked ? LEGEND_ON : LEGEND_OFF; }   // 言い換えると、あきらめた知らせも消える
  // 連動の準備ができずにあきらめた時の知らせ（連動が入の時だけ）。凡例の中に textContent で足す
  var warn = null;
  var GIVEUP = '連動の準備ができませんでした。ページを読み込み直してください';
  function showGiveUp() {
    if (!legend || !syncOn.checked || warn) return;
    showLegend();
    var el = document.createElement('span');
    el.className = 'sync-warn';
    el.textContent = GIVEUP;
    legend.appendChild(el);
    warn = el;
  }
  syncOn.addEventListener('change', showLegend);
  showLegend();
  tick();
})();
</script>
<script>
'use strict';
/* 幅700px以下のタブ（訪問／全支援）。選んだ方だけを見せ、もう片方は隠すだけで読み込み直さない（2026-11-13 代表者の指示）。
   ★端末に残すのは選んだタブ（ocmp_tab・'visit'／'support'）だけ。それ以外の値は既定の「訪問」。氏名・業務データは残さない。
   ★幅は JS で見ない。.panes の data-tab を書き換えるだけで、効くのは CSS の 700px 以下の中だけ（701px 以上・印刷は変わらない）。 */
(function () {
  var TAB_KEY = 'ocmp_tab';
  var KNOWN = { visit: 'paneVisit', support: 'paneSupport' };
  var panes = document.getElementById('cmpPanes');
  var tabs = [document.getElementById('tabVisit'), document.getElementById('tabSupport')];
  if (!panes || !tabs[0] || !tabs[1]) return;
  function note(where, e) { try { if (window.SUErrors && typeof window.SUErrors.note === 'function') window.SUErrors.note('左右比較のタブ', e, 'ovcmp:' + where); } catch (_) {} }
  function known(v) { return Object.prototype.hasOwnProperty.call(KNOWN, v); }

  // タブを読み上げで「タブ」と分かるのは、タブが出ている 700px 以下の時だけにする（701px 以上は2画面とも見えている）
  var mq = null;
  try { mq = window.matchMedia ? window.matchMedia('screen and (max-width: 700px)') : null; } catch (eM) { note('mq', eM); }
  function applyRoles() {
    var narrow = !!(mq && mq.matches);
    for (var id in KNOWN) {
      if (!known(id)) continue;
      var p = document.getElementById(KNOWN[id]); if (!p) continue;
      if (narrow) { p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', id === 'visit' ? 'tabVisit' : 'tabSupport'); }
      else { p.removeAttribute('role'); p.removeAttribute('aria-labelledby'); }
    }
  }

  function select(v, focus) {
    if (!known(v)) v = 'visit';
    panes.setAttribute('data-tab', v);
    for (var i = 0; i < tabs.length; i++) {
      var on = tabs[i].getAttribute('data-tab') === v;
      tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
      tabs[i].tabIndex = on ? 0 : -1;
      if (on && focus) tabs[i].focus();
    }
    return v;
  }
  function save(v) { try { localStorage.setItem(TAB_KEY, v); } catch (eW) { note('save', eW); } }

  var saved = null;
  try { saved = localStorage.getItem(TAB_KEY); } catch (eR) { note('load', eR); }
  select(known(saved) ? saved : 'visit', false);

  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function () { save(select(this.getAttribute('data-tab'), false)); });
    tabs[i].addEventListener('keydown', function (ev) {
      var k = ev.key, idx = tabs.indexOf(this), next = -1;
      if (k === 'ArrowRight' || k === 'Right') next = (idx + 1) % tabs.length;
      else if (k === 'ArrowLeft' || k === 'Left') next = (idx + tabs.length - 1) % tabs.length;
      else if (k === 'Home') next = 0;
      else if (k === 'End') next = tabs.length - 1;
      if (next < 0) return;
      ev.preventDefault();
      save(select(tabs[next].getAttribute('data-tab'), true));
    });
  }
  applyRoles();
  if (mq) {
    if (typeof mq.addEventListener === 'function') mq.addEventListener('change', applyRoles);
    else if (typeof mq.addListener === 'function') mq.addListener(applyRoles);
  }
})();
</script>
