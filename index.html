<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- 検索エンジンにこのページと配下ツールを辿らせない。
     一覧ページは「ツール名を知らない第三者が全ツールへ1クリックで到達できる」入口になるため、
     noindex に加えて nofollow を必ず付ける（各ツールは埋め込みトークンでGASを叩く構成）。 -->
<meta name="robots" content="noindex,nofollow">
<title>介護ツール メニュー</title>
<!-- 端末の用途（事務所/現場）だけを見て、現場端末では事務所専用タイルを出さない。
     ★このページに fetch・トークン・氏名・記録を持ち込まない（読む・書く・送るのいずれも禁止）。
       必要になったら、このページに足さず別ページを作ること。読んでよいのは su_device_role だけ。
     ★<body> より前に class を付けるのは、タイルが一瞬見えてから消える「ちらつき」を防ぐため
       （描画後に JS で消すと現場端末で一度は見えてしまう）。
     ★localStorage が使えない環境（Safari プライベート等）は判定不能なので【出す】側に倒す。
       ここは誤タップを減らすための入口整理であって保護ではない（display:none でも href はソースに残る）。
       実質の防御は「現場端末に接続URL・合言葉を配らない」という運用側にある。
       同じ環境では各アプリのブロック画面も localStorage 前提のため同様に外れる＝ここが砦ではない。
       iOS の storage 消去（ITP 等）で su_device_role 自体が消えると、タイル復活とガード解除が同時に起きる。 -->
<!-- 画面が黙って壊れないようにする共通モジュール。このツールのスクリプトより前に置く
     （起動時の例外も拾うため）。記録と通知だけを行い、既存の動作は変えない。 -->
<script src="su-errors.js?v=2026-10-04"></script>
<script src="su-cfg-hint.js?v=2026-10-01.2"></script>
<script src="su-perf.js?v=2026-09-24"></script>
<script>
(function(){
  function apply(){try{
    document.documentElement.classList.toggle('is-field',localStorage.getItem('su_device_role')==='field');
  }catch(e){}}
  apply();
  /* 「戻る」での bfcache 復元は再パースされずここが走らないため、その時だけ測り直す */
  window.addEventListener('pageshow',function(e){if(e.persisted)apply()});
})();
</script>
<style>
/* care-tools 共通の CSS 変数体系（各アプリと同じ見た目に揃える）。
   このページは氏名・記録を持たない。localStorage は端末用途（su_device_role）の読み取りのみ。 */
/* 現場端末では事務所専用のタイルを出さない（押してもブロック画面になるだけの行き止まりを作らない）。
   ★data-office-only を付ける条件＝リンク先が su_device_role==='field' で起動をブロックするタイル。
   ★現在この属性が付いているのは誕生日一覧・入居調整・接続設定の3つ
     （入居調整は入居前の相談者の連絡先を扱う事務所業務で、現場に出す用途がない＝誕生日一覧と同じ扱い）。
     同じくブロックされる
     入居者マスタ・申送ビューア・週間計画・体重管理は**意図的に残す**
     （2026-08-05 代表裁定：最終的に体重管理以外は現場端末でも閲覧のみ可にする方針のため、
      これらは行き止まりでなくなる。誕生日一覧だけは生年月日の一覧表＝現場に出す用途がないので隠す）。
     ★体重管理は 2026-09-24 の代表裁定で上の方針を更新：現場端末でも記録（追加・修正・削除）ができ、
       設定（入居者の管理・入出力・全削除・連携）だけを事務所PCに残す＝ブロックしない側になった。
     閲覧のみ可の実装が入ったら、その時点でブロック側を緩める（この属性は増やさない）。
   ★!important は「将来 .tile 側に !important が入っても隠す側を勝たせる」ための保険。
     詳細度だけなら無くても勝つ。 */
.is-field [data-office-only]{display:none !important}
:root {
  --pri: #0b57d0; --pri-l: #ecf3fe; --pri-d: #0842a0;
  --g0: #f8f9fa; --g1: #f1f3f4; --g2: #e8eaed; --g3: #dadce0;
  --g5: #9aa0a6; --g6: #80868b; --g7: #5f6368; --g9: #202124;
  --r: 12px;
  --sh: 0 1px 6px rgba(0,0,0,.12);
  --tile-min: 96px;          /* HIG: タップ領域は最小44px。実測96pxで誤タップを避ける */
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  background: var(--g0); color: var(--g9);
  line-height: 1.5;
  padding-bottom: 32px;
  -webkit-text-size-adjust: 100%;
}

/* ── ヘッダー（他ツールと同じスティッキー方式） ── */
.hdr {
  position: sticky; top: 0; z-index: 10;
  background: var(--pri); color: #fff;
  padding: 14px 16px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  box-shadow: var(--sh);
}
.hdr h1 { margin: 0; font-size: 1.1875rem; font-weight: 700; letter-spacing: .02em; }
/* opacity を掛けると白が --pri と合成され 4.06:1 まで落ちて AA を割るため、白のまま使う（4.50:1） */
.hdr .sub { margin: 2px 0 0; font-size: 0.75rem; }

main {
  /* 2列を保つため幅を抑える（広げて3列にすると指定のペアが分断される。M-2 参照） */
  max-width: 620px; margin: 0 auto;
  padding: 16px max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right));
}

/* ── 区分（職員／入居者／厨房） ── */
.sec { margin: 0 0 26px; }
.sec > h2 {
  margin: 0 0 10px; padding: 0 2px 6px;
  font-size: 0.9375rem; font-weight: 700; color: var(--g7);
  border-bottom: 2px solid var(--g2);
  display: flex; align-items: center; gap: 7px;
}
.sec > h2 .mk { font-size: 1.0625rem; }

/* ── タイル配置 ──
   指定の並び順どおりに左上から流し込む。★列数は常に2で固定する。
   3列にすると「シフトの下が過去シフト分析」「週間計画とデイ利用表が横並び」等の
   指定されたペアが分断されるため、広い画面では列を増やさず main の幅で抑える。 */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
/* 指定の行割りを保つための改行指定。付けたタイルは必ず左列から始まる＝
   直前のタイル（週間計画俯瞰）がその行に単独で残る。 */
.tile.newrow { grid-column-start: 1; }

.tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; min-height: var(--tile-min); padding: 12px 10px;
  background: #fff; border: 1px solid var(--g3); border-radius: var(--r);
  box-shadow: var(--sh); text-decoration: none; color: var(--g9);
  text-align: center; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.tile:hover { border-color: var(--pri); box-shadow: 0 2px 10px rgba(11,87,208,.18); }
.tile:active { transform: scale(.97); }
/* HIG: フォーカスリングを消さない（キーボード操作の到達性） */
.tile:focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; }
.tile .ic { font-size: 1.75rem; line-height: 1; }
.tile .nm { font-size: 0.84375rem; font-weight: 700; }
/* --g6(#80868b) は白地で 3.68:1 と AA(4.5:1) を下回るため --g7(#5f6368)=5.96:1 を使う */
.tile .note { font-size: 0.6875rem; color: var(--g7); font-weight: 400; }
/* 定義の一部が壊れていた時の帯（2026-10-10）。#7a4200 on #fff4e5 で約 7.6:1 */
.menu-broken { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: #fff4e5; color: #7a4200; font-size: 0.9375rem; line-height: 1.5; }

/* 別サイトへ移動するタイルの目印。色だけに意味を持たせず「↗」と注記を併用する（HIG） */
.tile.ext .nm::after { content: " ↗"; color: var(--g7); font-weight: 400; }

.foot {
  max-width: 620px; margin: 6px auto 0;   /* main と同じ幅に揃える */
  padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
  font-size: 0.71875rem; color: var(--g7);
}
/* 小さい文字の中のリンクでも指で押せるよう、押せる高さは44pxを確保する（HIG） */
.foot a { display: inline-flex; align-items: center; min-height: 44px; color: var(--pri); font-size: 0.8125rem; font-weight: 700; }
.foot a:focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  /* 動きは止めるが、押した手応えは残す。既定のタップハイライトを切っているため、
     ここで色の変化を与えないと「押せたか分からない」状態になる（HIG: 即座の視覚フィードバック）。 */
  .tile { transition: none; }
  .tile:active { transform: none; background: var(--pri-l); border-color: var(--pri); }
}
</style>
</head>

<script>
/* 定義からタイルを組み立てる（2026-10-09・監査10月版 #15）。組み立てる部品は以前の手書きの HTML と同じ形
   （section.sec ＞ h2 ＞ span.mk ／ div.grid ＞ a.tile ＞ span.ic・span.nm・span.note）。CSS・行割り・現場端末の出し分けは変えない。
   ★このページに fetch・トークン・氏名・記録を持ち込まない（定義もページの中に置く）。
   ★文字はすべて textContent で入れる（定義に HTML を書いても実行されない）。 */
(function () {
  var main = document.getElementById('menu');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function note(t) {
    var span = el('span', 'note');
    var m = String(t || '').match(/^\{\{(施設|訪問|通所)\}\}(.*)$/);
    if (m) {
      var fac = el('span', null, { '施設': '施設', '訪問': '訪問介護', '通所': '通所介護' }[m[1]]);
      fac.setAttribute('data-fac-name', m[1]);
      span.appendChild(fac);
      span.appendChild(document.createTextNode(m[2]));
    } else span.textContent = String(t || '');
    return span;
  }
  /* ★壊れた1件だけを飛ばす（2026-10-10・監査10月版 第2版 15）。区分ごと・タイルごとに try で囲み、出せた分は出す。
     定義そのものを読めない・1枚も出せない時だけ案内に切り替え、その時も「使い方・困った時」へのリンクは出す。 */
  var def = null, broken = 0, firstErr = null;
  function fail(e) { broken++; if (!firstErr) firstErr = e; }
  try { def = JSON.parse(document.getElementById('menuDef').textContent); } catch (e) { firstErr = e; }
  if (def && typeof def === 'object') (Array.isArray(def.sections) ? def.sections : []).forEach(function (s) {
    try {
      var sec = el('section', 'sec');
      sec.setAttribute('aria-labelledby', s.id);
      if (s.officeOnly) sec.setAttribute('data-office-only', '');
      var h2 = el('h2'); h2.id = s.id;
      var mk = el('span', 'mk', s.mk); mk.setAttribute('aria-hidden', 'true');
      h2.appendChild(mk); h2.appendChild(document.createTextNode(s.title));
      var grid = el('div', 'grid');
      (Array.isArray(s.tiles) ? s.tiles : []).forEach(function (t) {
        try {
        var a = el('a', 'tile' + (t.ext ? ' ext' : '') + (t.newrow ? ' newrow' : ''));
        if (t.officeOnly) a.setAttribute('data-office-only', '');
        a.setAttribute('href', t.href);
        var ic = el('span', 'ic', t.ic); ic.setAttribute('aria-hidden', 'true');
        a.appendChild(ic); a.appendChild(el('span', 'nm', t.nm)); a.appendChild(note(t.note));
        grid.appendChild(a);
        } catch (e) { fail(e); }
      });
      sec.appendChild(h2); sec.appendChild(grid);
      main.appendChild(sec);
    } catch (e) { fail(e); }
  });
  var none = !main.querySelector('a.tile');
  if (none) {
    main.textContent = 'メニューを組み立てられませんでした。再読み込みしてください。直らない時は右下の「不具合を報告」から知らせてください。';
    var hp = el('p'), ha = el('a', null, '使い方・困った時');
    ha.setAttribute('href', 'help.html'); hp.appendChild(ha); main.appendChild(hp);
  } else if (broken) {
    main.insertBefore(el('p', 'menu-broken', '一部の項目（' + broken + '件）を表示できませんでした。右下の「不具合を報告」から知らせてください。'), main.firstChild);
  }
  if (firstErr || broken || none) {
    try { if (window.SUErrors) SUErrors.report('メニュー', firstErr || new Error(none ? 'タイルが0枚' : '壊れた項目 ' + broken + '件'), 'index.html'); } catch (e2) {}
  }
})();
</script>
