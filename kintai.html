<style>
:root{--ink:#14213d;--sub:#3d4a5c;--line:#c9d2de;--bg:#f4f6f9;--card:#fff;--ok:#0b5d2a;--ok-bg:#e3f4e8;--warn:#6b4100;--warn-bg:#fff4d6;--ng:#8a1020;--ng-bg:#fde8eb;--focus:#1f4fbf;--muted:#414b5a;
  --field:#fff;--th:#eef2f7;--tag:#eef2f7;--wk:#0b3d91;--wk-bg:#e3ecfb;--skel:#e3e8ef;--toast:#14213d;--toast-tx:#fff;--pri-tx:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.hdr h1{font-size:19px;margin:0}
.hdr-btn,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;background:var(--card);font:inherit;cursor:pointer}
.btn.pri{background:var(--focus);color:var(--pri-tx);border-color:var(--focus)}
.btn[aria-pressed="true"]{background:var(--wk-bg);border-color:var(--focus);font-weight:700}
.btn.ng{color:var(--ng);border-color:#e6a9b2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sync{font-size:14px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.bar label{display:flex;align-items:center;gap:6px}
input,select,textarea{font:inherit;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--field);color:var(--ink)}
.tabs{display:flex;gap:6px;padding:0 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
.tabs button{min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;color:var(--sub);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--focus);font-weight:700}
main{padding:12px 16px 40px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.gate{max-width:640px}
.band{border-radius:10px;padding:10px 14px;margin:0 0 10px}
.band.warn{background:var(--warn-bg);color:var(--warn)}
.band.ng{background:var(--ng-bg);color:var(--ng)}
.band.ok{background:var(--ok-bg);color:var(--ok)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--th);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td{padding:4px 5px;text-align:center;font-size:13px;min-width:46px}
.grid td.nm,.grid th.nm{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
/* 右端の合計（出勤・総労働・要確認）は横に送っても見えるよう固定する（列の並びは変えない＝固定するのは右から3つ） */
.grid .sr{position:sticky;background:var(--card);z-index:1;box-sizing:border-box}
.grid th.sr{background:var(--th)}
.grid .sr1{right:0;min-width:56px;width:56px}.grid .sr2{right:56px;min-width:64px;width:64px}.grid .sr3{right:120px;min-width:52px;width:52px;box-shadow:-2px 0 0 var(--line)}
.grid td.wk{background:var(--wk-bg)}
.grid td.rv{background:var(--warn-bg)}
.grid td.np{background:var(--ng-bg)}
.raw{color:var(--muted);font-size:13px}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;margin:1px 2px;font-size:12px;background:var(--tag);color:var(--sub)}
.tag.wk{background:var(--wk-bg);color:var(--wk);font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.done{text-decoration:line-through}
.tag.rv{background:var(--warn-bg);color:var(--warn)}
.tag.ng{background:var(--ng-bg);color:var(--ng)}
.void{text-decoration:line-through;color:#6b7686}
.empty{color:var(--muted);padding:12px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:680px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(20,33,61,.35)}
.dlg-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.dlg-b{padding:14px 16px;max-height:65vh;overflow:auto}
.dlg-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row > label{display:flex;gap:6px;align-items:center}
.row > label[hidden]{display:none}
fieldset{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:8px 12px}
legend{font-weight:600;padding:0 6px}
.help{color:var(--muted);font-size:13px;margin:4px 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;align-items:center}
/* 日ごとのまとめの札（押すとその人だけに絞る） */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip b{font-size:18px;font-variant-numeric:tabular-nums}
.chip.wk{border-color:var(--wk);color:var(--wk)}.chip.rv{border-color:var(--warn);color:var(--warn)}.chip.ng{border-color:var(--ng);color:var(--ng)}
.chip[aria-pressed="true"]{outline:3px solid var(--focus);outline-offset:1px;font-weight:700}
.tabs .tab-n{display:inline-block;min-width:1.6em;margin-left:4px;padding:0 6px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:700}
.tabs .tab-n:empty{display:none}
/* 直す窓の打刻の一覧: その日に数えた打刻は太字・前後の日の打刻は薄く */
.plist td{white-space:normal;vertical-align:middle}.plist label{white-space:nowrap}
.p-cnt td{font-weight:700}.p-oth td{color:var(--muted)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.hist{font-size:13px}.hist td{white-space:normal}
/* v5 段2: ホームの箱（押すとその一覧のタブへ・画面だけ）。色だけに頼らず「注意」「要対応」の語も出す */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.hbox{display:block;width:100%;min-height:44px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.hbox.wait{cursor:default}
.hbox.ok{border-left-color:var(--ok)}.hbox.warn{border-left-color:var(--warn)}.hbox.alert{border-left-color:var(--ng)}
.hbox .ht{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:16px}
.hbox .hn{font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}.hbox .hn small{font-size:14px}
.hbox .hv{display:inline-block;margin-top:2px;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;background:var(--tag);color:var(--sub)}
.hbox.warn .hv{background:var(--warn-bg);color:var(--warn)}.hbox.alert .hv{background:var(--ng-bg);color:var(--ng)}.hbox.ok .hv{background:var(--ok-bg);color:var(--ok)}
.hbox .hl{display:block;margin-top:6px;font-size:14px;color:var(--sub);overflow-wrap:anywhere}.hbox .hl b{color:var(--ink)}
.hbox .hnote{display:block;margin-top:6px;font-size:13px;color:var(--warn);overflow-wrap:anywhere}
/* v6: ホームの箱の下の「本人のスマホに知らせる」の並び（画面だけ・状態は文字でも出す＝色だけで伝えない） */
.hcell{display:grid;gap:6px;align-content:start}
.hnt{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px}
.hnt .hnt-h{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--sub)}
.hnt .hnt-s{margin:4px 0 0;font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.hnt ul{list-style:none;margin:0;padding:0}
.hnt li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 0;border-top:1px solid var(--line)}
.hnt li:first-child{border-top:0}
.hnt .ntn{flex:1 1 12em;font-size:14px;overflow-wrap:anywhere}.hnt .ntn b{color:var(--ink)}
.hnt .nts{font-size:13px;font-weight:700;color:var(--sub)}
/* v5 段5: 申請のタブとスマホの登録の窓（画面だけ・印刷しない）。QR は白地に黒（暗い表示でも読める）。iPhone の幅（699px 以下）では新しい部品の押す所を 44px・入力の文字を 16px にする */
.rq-t td{white-space:normal;min-width:4.5em}
.rq-t td.rq-btns{white-space:nowrap}
.kq-img{display:flex;justify-content:center;margin:8px 0}
.kq-img svg{max-width:100%;height:auto}
.kq-short{font-size:28px;font-weight:700;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0;overflow-wrap:anywhere}
.kq-exp{text-align:center;font-weight:600;margin:6px 0}
.kq-url{overflow-wrap:anywhere}
@media (max-width:699px){.btn.k5,select.k5,input.k5{min-height:44px}select.k5,input.k5{font-size:16px}
  /* 申請の一覧は行ごとに縦に積み、「承認」「差し戻し」を職員の欄のすぐ下に出す（横に送らなくても押せる・PC の表は変えない・反証レビュー 2026-11-21） */
  table.rq-t,table.rq-t tbody{display:block}table.rq-t thead{display:none}
  table.rq-t tr{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding:6px 0}
  table.rq-t td{display:block;order:2;border:0;padding:2px 6px;min-width:0;white-space:normal}
  table.rq-t td.rq-nm{order:0;font-weight:700}table.rq-t td.rq-btns{order:1;display:flex;gap:8px;flex-wrap:wrap}table.rq-t td.rq-btns:empty{display:none}
  table.rq-t td[data-l]::before{content:attr(data-l) "：";color:var(--muted);font-size:13px}}
/* 読み込み中の骨組み（灰色の帯） */
.skel{display:block;height:18px;margin:10px 0;border-radius:6px;background:var(--skel);animation:skel 1.2s ease-in-out infinite}
.skel.w6{width:60%}.skel.w8{width:80%}.skel.w4{width:40%}
@keyframes skel{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
/* 保存の後の短い知らせ（画面の下・自動で消える） */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:12px;background:var(--toast);color:var(--toast-tx);box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:50;font-size:15px}
.toast[hidden]{display:none}
.ph{display:none}
@media (max-width:640px){th,td{padding:5px 6px}.kv{grid-template-columns:1fr}
  /* iPhone の幅では右端の合計を固定すると日の列が1つしか見えないため、固定しない（仮置き） */
  .grid .sr{position:static;min-width:0;width:auto;box-shadow:none}
  /* iPhone の幅: 窓の中の欄（見出し＋入力）は折り返して、見出しを1字ずつの縦にしない・選ぶ欄を窓の外へはみ出させない。
     窓の中の表は枠（fieldset）ごと広がらず、表だけを横に送る。職員マスタの突き合わせの表は折り返してボタンを見える所に置く */
  .row > label:not(:has(> input[type=radio])):not(:has(> input[type=checkbox])){flex-wrap:wrap;max-width:100%}
  .row > label > input,.row > label > select{max-width:100%;min-width:0!important}
  fieldset{min-width:0}
  table.mt,table.mt thead,table.mt tbody,table.mt tr{display:block}
  table.mt th,table.mt td{display:inline-block;white-space:normal;border:0}
  table.mt thead th:not(:first-child){display:none}
  table.mt thead th{display:block;border-bottom:1px solid var(--line)}
  table.mt tbody tr{border-bottom:1px solid var(--line);padding:4px 0}
  table.mt td:last-child{display:flex;gap:6px;flex-wrap:wrap}
  table.mt td[data-l]::before{content:attr(data-l) "：";color:var(--muted);font-size:13px}
  table.mt td.empty{display:block}}
/* 暗い表示（端末の設定に合わせる）。su-theme.css が --ng・--focus・--warn-bg と見出しを上書きするので、同じ強さの指定で後から置く。紙は白地のまま（screen だけ） */
@media screen and (prefers-color-scheme: dark){
  :root,:root[data-su-theme]:not([data-ds="ops"]){--ink:#e8ecf3;--sub:#b8c2d0;--muted:#aab4c3;--line:#3a4556;--bg:#10151d;--card:#1a212c;--field:#141a23;--th:#222b38;--tag:#26303e;
    --ok:#7fd69a;--ok-bg:#123222;--warn:#ffd27a;--warn-bg:#33270c;--ng:#ff9aa8;--ng-bg:#3a141a;--focus:#8fb0ff;--wk:#a9c4ff;--wk-bg:#16284a;--skel:#2a3442;--toast:#e8ecf3;--toast-tx:#10151d;--pri-tx:#10151d}
  :root[data-su-theme]:not([data-su-theme~="keep-hdr"]) .hdr{background:var(--card);color:var(--ink);border-bottom-color:var(--line);box-shadow:inset 0 -2px 0 var(--line)}
  :root[data-su-theme]:not([data-su-theme~="keep-hdr"]) .hdr-btn{background:var(--card);color:var(--ink);border-color:var(--line)}
  :root[data-su-theme]:not([data-su-theme~="keep-hdr"]) .hdr .sync{background:var(--tag);color:var(--ink);border-color:var(--line)}
  .btn.ng{border-color:#7a3a44}
  .void{color:#8a94a4}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  /* 共通の「不具合を報告」の窓は白地のままなので、入力欄とボタンも明るい表示で描かせる */
  .sur-dlg{color-scheme:light}
}
/* 止めの案内（現場端末・ログインの覆い）を出している間は初回案内の帯を出さない */
body:has(#g-gate:not([hidden])) .sui-band{display:none}
/* 印刷（画面の切り替えのボタンは出さない・表を横に切らない・A4 横） */
.print-only{display:none}
@page{size:A4 landscape;margin:8mm}
@media print{.hdr,.bar,.tabs,.no-print,.su-shell-role,.band{display:none!important}body{background:#fff;font-size:11px}.cd{border:0;padding:0}th{position:static}
  .tw{overflow:visible}th,td{white-space:normal;padding:2px 3px}.grid td,.grid th{min-width:0;font-size:9px;padding:1px}.grid td.nm,.grid th.nm{position:static}
  .grid td button{min-height:0!important;padding:0!important;font-size:9px}.print-only{display:block}.print-only table{width:auto}.print-only td{font-size:14px;padding:6px 12px}
  /* 印刷の時だけの見出し（事業者・月・氏名または日付・印刷した日時）。全員分の印刷は1人1ページ */
  .ph{display:block;font-size:12px;margin:0 0 4mm;border-bottom:1px solid #000;padding-bottom:1mm}.ph b{font-size:14px}
  .grid .sr{position:static;min-width:0;width:auto;box-shadow:none}.chips,.toast,.skel{display:none!important}
  .pg{break-after:page;page-break-after:always}.pg:last-child{break-after:auto;page-break-after:auto}
  body.pr-edits #g-main > :not(.pr-edits-cd){display:none!important}body.pr-edits .pr-edits-cd .no-print{display:none!important}}
/* v5 段4: 年次有給休暇管理簿の紙（#k-ledger）。「管理簿を印刷」を押した時だけ中身を作り、印刷の後に空にする。文字の大きさは su-print が --lg-fs で収める（zoom・transform は使わない） */
#k-ledger{display:none}
@media print{html:has(> body.su-print-ledger),body.su-print-ledger{background:#fff!important}body.su-print-ledger #k-ledger{display:block;font-size:var(--lg-fs,11px);color:#000}}
#k-ledger .lg{line-height:1.35}
#k-ledger .lg-h{margin:0 0 .3em;min-height:1.6em;border-bottom:1px solid #000;padding-bottom:.2em}
#k-ledger .lg-title{font-size:1.5em;font-weight:700;letter-spacing:.06em}
#k-ledger .lg-c{margin:.2em 0 .6em}
#k-ledger .lg-p{break-inside:avoid;page-break-inside:avoid;margin:0 0 .9em}
#k-ledger .lg-n{font-size:1.15em;margin:0 0 .1em}
#k-ledger .lg-m{margin:0 0 .2em}
#k-ledger .lg-t{width:100%;border-collapse:collapse;table-layout:fixed}
#k-ledger .lg-t th,#k-ledger .lg-t td{border:1px solid #000;padding:.15em .3em;font-size:1em;white-space:normal;vertical-align:top;position:static;background:none;color:#000}
#k-ledger .lg-t th{font-weight:700}
#k-ledger .lg-t .num{text-align:right}
#k-ledger .lg-t th:nth-child(1){width:11%}#k-ledger .lg-t th:nth-child(2){width:8%}#k-ledger .lg-t th:nth-child(3){width:19%}#k-ledger .lg-t th:nth-child(5){width:8%}#k-ledger .lg-t th:nth-child(6){width:8%}#k-ledger .lg-t th:nth-child(7){width:12%}
</style>

<body>
<header class="hdr su-shell-hdr">
  <a class="hdr-btn" href="index.html">← メニュー</a>
  <h1>勤怠管理</h1>
  <span class="sync" id="g-sync" role="status" aria-live="polite"></span>
  <span class="su-shell-role" hidden></span>
</header>
<div class="cd gate" id="g-gate" hidden></div>
<div id="g-app" hidden>
  <div class="bar no-print">
    <label>月分 <input type="month" id="g-ym" aria-label="表示する月分（締め日で切った期間）"></label> <span id="g-period" class="raw"></span>
    <button type="button" class="btn sm" id="g-prev" aria-label="前の月">◀ 前の月</button>
    <button type="button" class="btn sm" id="g-next" aria-label="次の月">次の月 ▶</button>
    <button type="button" class="btn sm" id="g-import">シフトを取り込み直す</button>
    <button type="button" class="btn sm" id="g-reload">読み直す</button>
  </div>
  <nav class="tabs no-print" role="tablist" aria-label="画面の切り替え">
    <button type="button" role="tab" data-tab="home">ホーム</button>
    <button type="button" role="tab" data-tab="day">日ごと</button>
    <button type="button" role="tab" data-tab="review">要確認<span class="tab-n" id="g-rv-n" aria-hidden="true"></span></button>
    <button type="button" role="tab" data-tab="requests">申請<span class="tab-n" id="g-rq-n" aria-hidden="true"></span></button>
    <button type="button" role="tab" data-tab="grid">月の一覧</button>
    <button type="button" role="tab" data-tab="person">個人の月</button>
    <button type="button" role="tab" data-tab="staff">職員と番号</button>
    <button type="button" role="tab" data-tab="leave">有給</button>
    <button type="button" role="tab" data-tab="close">締めと出力</button>
    <button type="button" role="tab" data-tab="settings">設定</button>
    <button type="button" role="tab" data-tab="shaho" hidden>社保<span class="tab-n" id="g-sh-n" aria-hidden="true"></span></button>
  </nav>
  <main id="g-main" role="tabpanel"></main>
</div>
<div class="toast no-print" id="g-toast" role="status" aria-live="polite" hidden></div>
<div id="k-ledger" aria-hidden="true"></div>
<dialog id="g-dlg" aria-labelledby="g-dlg-h"><div class="dlg-h" id="g-dlg-h"></div><div class="dlg-b" id="g-dlg-b"></div><div class="dlg-f" id="g-dlg-f"></div></dialog>
<script src="su-dialog.js?v=2026-11-14.2"></script>
<script src="su-qr.js?v=2026-11-08"></script>
<script src="kintai.js?v=2026-11-25.7"></script>
<script src="kintai-board-calc.js?v=2026-11-25"></script>
<script src="kintai-board.js?v=2026-11-25"></script>
<script src="su-shell.js?v=2026-11-19"></script>
<script src="su-net.js?v=2026-11-12.2"></script>
<script src="su-intro.js?v=2026-11-18"></script>
<script src="su-report.js?v=2026-11-23.2" data-tool="勤怠管理"></script>
</body>
</html>
